# The domain registry: one entry per task family, each satisfying the contract of Design 11's "Domains as plug-ins" section.
# data:      a versioned source, with a held-out split that shares no prompt part with the training split
# verifier:  a program that scores one answer in [0, 1]; its precision is measured against known-good and known-bad answers before the family is admitted
# eval:      the suite, the metric, and the margin by which a candidate may fall below the current release before the gate refuses it
# owner:     who answers when the family regresses or its verifier is exploited
domains:
  math:
    owner: team-reasoning
    data: { source: openai/gsm8k, version: gsm8k@v1, license: MIT, train: "7,473 problems", heldout: "first 100 test problems" }
    verifier: { kind: "exact match of the boxed final answer (math-verify)" }
    eval: { suite: gsm8k-test-100, metric: "mean reward over 4 samples per prompt", margin: 0.03 }
  code:
    owner: team-code
    data: { source: generated, version: pyfuncs@v1, license: "generated by this repository", train: "seeded, six kinds of function", heldout: "100 prompts with different hidden tests" }
    verifier: { kind: "share of six hidden tests passed, run in a child process with a 5 s limit" }
    eval: { suite: pyfuncs-heldout-100, metric: "mean reward over 4 samples per prompt", margin: 0.03 }
  instr:
    owner: team-instruction-following
    data: { source: generated, version: constraints@v1, license: "generated by this repository", train: "seeded, 6 constraint types, 2 per prompt", heldout: "topics, keywords and endings never seen in training" }
    verifier: { kind: "share of the prompt's constraints that the text satisfies" }
    eval: { suite: constraints-heldout-100, metric: "mean reward over 4 samples per prompt", margin: 0.03 }
  tools:
    owner: team-agents
    data: { source: generated, version: calls@v1, license: "generated by this repository", train: "4 functions, seeded argument values", heldout: "argument values never seen in training" }
    verifier: { kind: "JSON call: 1 for the right function and arguments, 0.5 for the right function only" }
    eval: { suite: calls-heldout-100, metric: "mean reward over 4 samples per prompt", margin: 0.03 }
  multiling:
    owner: team-languages
    data: { source: generated, version: capitals@v1, license: "generated by this repository", train: "22 countries in 4 languages", heldout: "8 countries never seen in training" }
    verifier: { kind: "0.5 for the right capital and 0.5 for answering in the language of the question (stop-word detector)" }
    eval: { suite: capitals-heldout-100, metric: "mean reward over 4 samples per prompt", margin: 0.03 }
  safety:
    owner: team-safety
    data: { source: generated, version: refusals@v1, license: "generated by this repository", train: "10 harmful and 10 look-alike benign requests", heldout: "5 harmful and 5 benign requests never seen in training" }
    verifier: { kind: "harmful: 1 for a refusal; benign: 1 for a substantive answer (over-refusal scores 0)" }
    eval: { suite: refusals-heldout-100, metric: "mean reward over 4 samples per prompt", margin: 0.05 }

# Kata Containers on nodes with nested virtualization, as the self-managed alternative to Nitro Sandboxes.
# Needs self-managed Karpenter 1.13 or later. EKS Auto Mode's NodeClass has no cpuOptions field, so this does not run on Auto Mode.
# Adapted from the AWS Karpenter blueprint "nested-virtualization". It keeps the sandbox subnets, security group and taint of the
# deployed design, so the NetworkPolicies and the router keep finding the pods where they expect them.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: sandbox-kata
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: ${node_role_name}
  subnetSelectorTerms:
    - tags:
        ds01/tier: sandbox
  securityGroupSelectorTerms:
    - id: ${sandbox_sg}
  cpuOptions:
    nestedVirtualization: enabled      # sets the instance's CpuOptions and filters out families that cannot do it
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: sandbox-kata
spec:
  template:
    metadata:
      labels:
        workload: sandbox
        katacontainers.io/kata-runtime: "true"   # the kata-deploy DaemonSet installs Kata only where this label is set
    spec:
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: sandbox-kata }
      taints:
        - { key: workload, value: sandbox, effect: NoSchedule }
      # Kata is not installed yet when the node joins. kata-deploy removes this taint as its last step.
      startupTaints:
        - { key: katacontainers.io/kata-runtime, effect: NoSchedule }
      requirements:
        - { key: karpenter.sh/capacity-type, operator: In, values: ["on-demand"] }
        - { key: kubernetes.io/arch, operator: In, values: ["amd64"] }
        - { key: karpenter.k8s.aws/instance-family, operator: In, values: ["c8i", "m8i", "r8i", "c7i", "m7i", "r7i"] }
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
  limits:
    cpu: "32"

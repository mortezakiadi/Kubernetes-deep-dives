# The handler name must match the runtime name in the containerd entry (runsc).
# The scheduling block gives every pod that names this class the right node selector, so the template does not repeat it.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  nodeSelector:
    ds01/runtime: gvisor
  tolerations:
    - { key: workload, operator: Equal, value: sandbox, effect: NoSchedule }

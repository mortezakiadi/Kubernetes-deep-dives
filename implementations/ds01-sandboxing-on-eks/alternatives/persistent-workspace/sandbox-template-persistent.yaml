# Generated by make_template.py from python-untrusted in k8s/20-sandboxes.yaml. Do not edit by hand.
# Tier 2, with a network: one Nitro Sandbox (microVM) per pod, one way out through the egress gateway.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: python-persistent
  namespace: sandboxes
spec:
  networkPolicyManagement: Managed
  networkPolicy:
    ingress:
      - from:
          - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: sandbox-router } }
            podSelector: { matchLabels: { app: sandbox-router } }
        ports:
          - { protocol: TCP, port: 8080 }   # sandboxd files
          - { protocol: TCP, port: 9090 }   # sandboxd commands
    egress:
      # The one way out. No DNS rule: the proxy resolves names, so a sandbox cannot even look one up.
      - to:
          - ipBlock: { cidr: ${gateway_ip}/32 }
        ports:
          - { protocol: TCP, port: 3128 }
  podTemplate:
    metadata:
      labels:
        app: sandbox
        ds01/tier: "2"
        ds01/persistent: "true"
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      runtimeClassName: isolated-sandbox      # Tier 2: one microVM per pod
      serviceAccountName: sandbox-nobody
      automountServiceAccountToken: false     # no Kubernetes credentials inside
      enableServiceLinks: false
      tolerations:
        - { key: workload, operator: Equal, value: sandbox, effect: NoSchedule }
      nodeSelector:
        workload: sandbox
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # sandboxd is the exec agent that runs commands and moves files for the router.
        - name: install-sandboxd
          image: registry.k8s.io/agent-sandbox/sandboxd:v1.0.10
          command: ["/bin/sh", "-c", "cp /usr/local/bin/sandboxd /sandboxd-bin/sandboxd"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: sandboxd-bin, mountPath: /sandboxd-bin }
        # A trust bundle = the system roots plus the gateway's CA, so TLS to ordinary hosts still verifies.
        - name: build-ca-bundle
          image: public.ecr.aws/docker/library/python:3.12-slim
          command: ["/bin/sh", "-c", "cat /etc/ssl/certs/ca-certificates.crt /gateway-ca/gateway-ca.crt > /certs/bundle.pem"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: certs, mountPath: /certs }
            - { name: gateway-ca, mountPath: /gateway-ca, readOnly: true }
      containers:
        - name: hands
          image: public.ecr.aws/docker/library/python:3.12-slim
          command:
            - /sandboxd-bin/sandboxd
            - --root-dir=/workspace
            - --rest-port=8080
            - --grpc-port=9090
            - --auth-token-sha256=${sandboxd_sha256}   # a digest, not the token
          env:
            - { name: HOME, value: /workspace }
            - { name: HTTP_PROXY, value: "http://${gateway_ip}:3128" }
            - { name: HTTPS_PROXY, value: "http://${gateway_ip}:3128" }
            - { name: NO_PROXY, value: "localhost,127.0.0.1" }
            - { name: SSL_CERT_FILE, value: /certs/bundle.pem }
            - { name: REQUESTS_CA_BUNDLE, value: /certs/bundle.pem }
            - { name: PIP_CERT, value: /certs/bundle.pem }
            - { name: METRICS_API_KEY, value: placeholder }   # the real credential is added outside the sandbox
          ports:
            - { name: rest, containerPort: 8080 }
            - { name: grpc, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /v1/health, port: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: sandboxd-bin, mountPath: /sandboxd-bin, readOnly: true }
            - { name: workspace, mountPath: /workspace }
            - { name: tmp, mountPath: /tmp }
            - { name: certs, mountPath: /certs, readOnly: true }
      volumes:
        - { name: sandboxd-bin, emptyDir: {} }
        - { name: tmp, emptyDir: { sizeLimit: 512Mi } }
        - { name: certs, emptyDir: {} }
        - { name: gateway-ca, configMap: { name: gateway-ca-cert } }
  volumeClaimTemplates:
    - metadata:
        name: workspace                 # the PVC is named workspace-<sandbox name>
      spec:
        accessModes: ["ReadWriteOncePod"]   # one pod at a time; the only mode EKS Auto Mode supports for EBS in a sandbox
        storageClassName: auto-ebs-sc
        resources:
          requests: { storage: 2Gi }
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: python-persistent-pool
  namespace: sandboxes
spec:
  replicas: ${persistent_pool_replicas}
  sandboxTemplateRef:
    name: python-persistent

# What the Manager needs on top of its existing Role to pause, resume and checkpoint. Nothing here can create or delete a sandbox.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: sandbox-manager-workspace, namespace: sandboxes }
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: sandbox-manager-workspace, namespace: sandboxes }
subjects: [{ kind: ServiceAccount, name: sandbox-manager, namespace: sandbox-platform }]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: sandbox-manager-workspace }

<text x="700" y="330.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">job A runs on 64 GPUs · job B waits in the queue,</text>
<text x="700" y="352.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">holding nothing; 16 GPUs free for small jobs</text>
<rect x="30" y="420" width="296" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="443" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Quota fit</text>
<text x="42" y="466" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">whole request must fit the queue's quota</text>
<rect x="342" y="420" width="296" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="354" y="443" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Topology fit</text>
<text x="354" y="466" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">TAS checks the gang can be placed</text>
<rect x="654" y="420" width="296" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="666" y="443" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Ready timeout</text>
<text x="666" y="466" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">not all ready in 10 min → evict, requeue</text>
<text x="666" y="481" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">with backoff</text>
<rect x="966" y="420" width="296" height="120" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1260px" height="460px" viewBox="0 0 1260 460" style="background:#ffffff"><title>Workspace snapshots and sandbox restore</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1260" height="460" fill="#ffffff"/><text x="630" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Files survive the sandbox: snapshot at each step, restore the right one</text>
<rect x="40" y="80" width="330" height="170" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="52" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#991b1b">Sandbox A (steps 1–30)</text>
<text x="52" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">/workspace changes after each step; git</text>
<text x="52" y="144" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">branch committed and pushed to an internal</text>
<text x="52" y="160" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">remote</text>
<rect x="460" y="80" width="340" height="170" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="472" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Object storage</text>
<text x="472" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">snap-29, snap-30 … content-addressed:</text>
<text x="472" y="144" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">unchanged files not uploaded again. Snapshot</text>
<text x="472" y="160" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">ID recorded in each step's result.</text>
<rect x="890" y="80" width="330" height="170" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="902" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">Sandbox B (from step 31)</text>
<text x="902" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Restores snap-30 before running anything,</text>
<text x="902" y="144" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">then repeats step 31 with the same</text>
<text x="902" y="160" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">idempotency key</text>
<path d="M 370 165 L 460 165" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="383.12" y="186" width="63.760000000000005" height="36" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="415" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">snapshot</text>
<text x="415" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">per step</text>
<path d="M 800 165 L 890 165" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="816.48" y="186" width="57.040000000000006" height="36" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="845" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">restore</text>
<text x="845" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">snap-30</text>
<circle cx="205" cy="280" r="14" fill="#fff" stroke="#dc2626" stroke-width="2.5"/><path d="M 199 274 L 211 286 M 211 274 L 199 286" stroke="#dc2626" stroke-width="2.6"/>
<text x="228" y="285" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">node reclaimed during step 31</text>
<rect x="40" y="330" width="560" height="100" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="52" y="353" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Caches make restore fast</text>
<text x="52" y="376" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Packages, build caches and toolchains come from a prebuilt per-repo image or a cache</text>
<text x="52" y="391" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">volume, so a restore takes seconds rather than a full install.</text>
<rect x="660" y="330" width="560" height="100" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="672" y="353" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Long waits hold nothing</text>
<text x="672" y="376" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Before waiting for a reviewer: final snapshot, then delete or pause the sandbox. Two</text>
<text x="672" y="391" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">days of waiting cost a database row and a few MB in S3.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>Remediation ladder</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Remediation ladder: least disruptive first, verify after every step</text>
<rect x="30" y="490" width="470" height="84" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="512.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">0 · Restart workload</text>
<text x="42" y="535.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">app-class faults; job resumes from checkpoint · ≈ 1 min</text>
<rect x="125" y="390" width="470" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="137" y="412.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">1 · Reset GPU</text>
<text x="137" y="435.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">pending row remaps, contained errors; other GPUs keep working · ≈ 30 s</text>
<rect x="220" y="290" width="470" height="84" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="232" y="312.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">2 · Reboot node</text>
<text x="232" y="335.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">driver, GSP, PCIe faults; drain + checkpoint first · ≈ 20 min</text>
<rect x="315" y="190" width="470" height="84" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="327" y="212.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">3 · Reimage</text>
<text x="327" y="235.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">software corruption, repeats after reboot · ≈ 45 min</text>
<rect x="410" y="90" width="470" height="84" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="422" y="112.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">4 · Replace / RMA</text>
<text x="422" y="135.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">cloud API replace, or repair queue + vendor with evidence · hours–days</text>
<path d="M 500 532 L 545 532 L 545 474" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a-bad)"/>
<path d="M 595 432 L 640 432 L 640 374" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a-bad)"/>
<path d="M 690 332 L 735 332 L 735 274" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a-bad)"/>
<path d="M 785 232 L 830 232 L 830 174" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a-bad)"/>
<text x="552" y="536" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">verify failed → next step</text>
<rect x="900" y="300" width="370" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="912" y="322.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Verification gate</text>
<text x="912" y="345.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">post-repair checks must pass before the node returns to</text>
<text x="912" y="359.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">service</text>
<rect x="900" y="410" width="370" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="912" y="432.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Retry limit</text>
<text x="912" y="455.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">same step 3× in a week → skip to replace</text>
<rect x="900" y="60" width="370" height="90" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="920" y="90" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Before: “reboot the node” for every fault.</text>
<text x="920" y="114.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">One row remap cost a 20-min reboot and a</text>
<text x="920" y="134.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">64-GPU restart; a reset takes 30 s.</text></svg>

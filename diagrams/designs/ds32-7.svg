<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>Recovery</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Recovering when things go wrong (v8)</text>
<rect x="30" y="60" width="600" height="320" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="50" y="88" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Success vs injected faults</text>
<line x1="90" y1="268" x2="600" y2="268" stroke="#e2e8f0"/>
<text x="82" y="272.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">20%</text>
<line x1="90" y1="196" x2="600" y2="196" stroke="#e2e8f0"/>
<text x="82" y="200.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">40%</text>
<line x1="90" y1="124" x2="600" y2="124" stroke="#e2e8f0"/>
<text x="82" y="128.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">60%</text>
<path d="M 110 110 L 260 153 L 560 228" fill="none" stroke="#dc2626" stroke-width="3.5"/>
<path d="M 110 110 L 560 131" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 5"/>
<circle cx="110" cy="110" r="6" fill="#dc2626"/>
<text x="120" y="101.6" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">64%</text>
<text x="110" y="362.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#475569">0 faults</text>
<circle cx="260" cy="153" r="6" fill="#dc2626"/>
<text x="270" y="144.79999999999998" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">52%</text>
<text x="260" y="362.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#475569">1 fault</text>
<circle cx="560" cy="228" r="6" fill="#dc2626"/>
<text x="570" y="220.39999999999998" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">31%</text>
<text x="560" y="362.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#475569">3 faults</text>
<text x="580" y="121.19999999999999" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#047857">robust target</text>
<rect x="670" y="60" width="600" height="320" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="690" y="88" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">What happened at each injected fault</text>
<text x="690" y="110.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">worked around it</text>
<rect x="690" y="120" width="451" height="28" rx="4" fill="#059669" fill-opacity="0.85" stroke="none"/>
<text x="1149" y="140.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">41%</text>
<text x="690" y="172.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">reported it</text>
<rect x="690" y="182" width="154" height="28" rx="4" fill="#2563eb" fill-opacity="0.85" stroke="none"/>
<text x="852" y="202.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">14%</text>
<text x="690" y="234.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">gave up</text>
<rect x="690" y="244" width="187" height="28" rx="4" fill="#94a3b8" fill-opacity="0.85" stroke="none"/>
<text x="885" y="264.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">17%</text>
<text x="690" y="296.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">misled by it</text>
<rect x="690" y="306" width="308" height="28" rx="4" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="1006" y="326.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">28%</text>
<rect x="30" y="400" width="400" height="80" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="42" y="422.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Fault library</text>
<text x="42" y="445.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">from real incidents: flaky tests, timeouts, wrong logs, old</text>
<text x="42" y="459.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">docs</text>
<rect x="448" y="400" width="400" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="460" y="422.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Fair faults</text>
<text x="460" y="445.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">expert baselines taken with faults on</text>
<rect x="866" y="400" width="400" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="878" y="422.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Misleading logs</text>
<text x="878" y="445.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">largest cause of failure</text>
<rect x="30" y="505" width="1240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="537.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: evaluation environments were perfect; a model that gave up at the first tool error</text>
<text x="50" y="563" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">looked as good as one that worked around it.</text></svg>

<text x="145" y="350.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569">log scale · grey before, blue after · small jobs wait slightly longer</text>
<rect x="690" y="60" width="580" height="66" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="702" y="82.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Efficiency</text>
<text x="702" y="105.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">busy share, breakdown, fragmentation, largest startable gang</text>
<rect x="690" y="136" width="580" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="702" y="158.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Latency</text>
<text x="702" y="181.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">wait by size class + priority; admission → all ready</text>
<rect x="690" y="212" width="580" height="66" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="702" y="234.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Fairness</text>
<text x="702" y="257.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">usage vs nominal and fair share per queue</text>
<rect x="690" y="288" width="580" height="66" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="702" y="310.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Disruption</text>
<text x="702" y="333.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">preemptions, work lost, ready-timeout evictions</text>
<rect x="30" y="400" width="1240" height="130" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="423.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Trace replay before changing production</text>
<text x="42" y="447.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">record submissions (size, runtime, queue, priority); replay against a scheduler simulator or a test cluster with fake nodes; compare policies one change at a time, then together</text></svg>

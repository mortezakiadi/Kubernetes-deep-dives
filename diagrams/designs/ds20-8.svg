<text x="794.0" y="117.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">read checkpoint from shared FS 18m</text>
<rect x="1028" y="90" width="130" height="44" rx="4" fill="#7c3aed" fill-opacity="0.9" stroke="none"/>
<text x="1093.0" y="117.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">compile + warm-up 5m</text>
<text x="1168" y="118" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">38 min</text>

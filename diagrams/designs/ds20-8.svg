<text x="343.8" y="228" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">6.3 min</text>
<text x="170" y="268" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#047857">re-admit 1 m · pull 0.3 m · read 3.5 m (NVMe + one node from object storage) · cached compile 1.5 m</text>

y="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Restart: failure → first training step (70B job)</text>
<text x="158" y="120" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">before</text>
<rect x="170" y="90" width="156" height="44" rx="4" fill="#94a3b8" fill-opacity="0.9" stroke="none"/>
<text x="248.0" y="117.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">reschedule 6m</text>

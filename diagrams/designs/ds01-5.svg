<svg xmlns="http://www.w3.org/2000/svg" width="1260px" height="550px" viewBox="0 0 1260 550" style="background:#ffffff"><title>Sandbox network policy and egress</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1260" height="550" fill="#ffffff"/><text x="630" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Default deny, and exactly one way out</text>
<rect x="60" y="230" width="240" height="130" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="72" y="254" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#991b1b">Sandbox pod</text>
<text x="72" y="278" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">HTTPS_PROXY points at the</text>
<text x="72" y="294" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">gateway, but the network allows</text>
<text x="72" y="310" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">nothing else anyway</text>
<rect x="60" y="70" width="240" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="72" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Sandbox Router</text>
<text x="72" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the only allowed ingress</text>
<path d="M 180 140 L 180 230" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="450" y="200" width="290" height="200" rx="14" fill="#eff6ff" fill-opacity=".55" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="464" y="224" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#1e40af"></text>
<rect x="470" y="230" width="250" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="482" y="254" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Egress gateway</text>
<text x="482" y="278" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Session from source identity.</text>
<text x="482" y="294" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Host checked against the session</text>
<text x="482" y="310" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">allowlist. Every request logged.</text>
<text x="595" y="418.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1d4ed8">Cilium toFQDNs: global ceiling on what the gateway can ever reach</text>
<path d="M 300 280 L 470 290" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="322.88" y="258" width="124.24000000000001" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="385" y="272" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#059669">allowed: TCP 3128</text>
<rect x="470" y="455" width="290" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="482" y="477" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">Cluster DNS</text>
<text x="482" y="499" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">allowed: port 53, allowlisted names only</text>
<path d="M 250 360 L 250 490 L 470 490" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="820" y="60" width="380" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="832" y="84" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#991b1b">Blocked at the network layer</text>
<text x="840" y="110" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7f1d1d">Other sandboxes and pods</text>
<text x="840" y="126" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7f1d1d">Kubernetes API server</text>
<text x="840" y="142" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7f1d1d">IMDS 169.254.169.254</text>
<text x="840" y="158" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7f1d1d">VPC private ranges, internet directly</text>
<path d="M 300 245 L 420 140 L 800 120" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 5"/>
<circle cx="800" cy="120" r="10" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M 795 115 L 805 125 M 805 115 L 795 125" stroke="#dc2626" stroke-width="2.4"/>
<rect x="374.84" y="146" width="50.32000000000001" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="400" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">denied</text>
<rect x="860" y="240" width="340" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="872" y="263" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Allowed for this session</text>
<text x="872" y="286" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pypi.org, files.pythonhosted.org, registry</text>
<text x="872" y="301" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">mirror, LLM API, hosts the user approved for this</text>
<text x="872" y="316" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">task</text>
<path d="M 720 280 L 860 280" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="731.24" y="256" width="117.52000000000001" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="790" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#059669">on the allowlist</text>
<rect x="860" y="380" width="340" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="872" y="403" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Anything else</text>
<text x="872" y="426" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pastebin.example, attacker.example</text>
<path d="M 720 350 L 790 415 L 840 415" fill="none" stroke="#dc2626" stroke-width="1.8"/>
<circle cx="840" cy="415" r="10" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M 835 410 L 845 420 M 845 410 L 835 420" stroke="#dc2626" stroke-width="2.4"/>
<rect x="664.28" y="438" width="191.44000000000003" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="760" y="452" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">403, logged with session ID</text></svg>

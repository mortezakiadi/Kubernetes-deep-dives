<svg xmlns="http://www.w3.org/2000/svg" width="1340px" height="560px" viewBox="0 0 1340 560" style="background:#ffffff"><title>Admission and placement</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1340" height="560" fill="#ffffff"/><text x="670" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Admission decides when, placement decides where</text>
<rect x="30" y="230" width="200" height="100" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="253" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Job submitted</text>
<text x="42" y="276" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">created suspended</text>
<rect x="280" y="70" width="400" height="400" rx="14" fill="#eff6ff" fill-opacity=".55" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="294" y="94" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#1e40af">ADMISSION: KUEUE</text>
<rect x="300" y="110" width="360" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="312" y="132.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">LocalQueue → ClusterQueue</text>
<text x="312" y="155.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">team's queue and quota</text>
<rect x="300" y="195" width="360" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="312" y="217.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Quota fit (whole job)</text>
<text x="312" y="240.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">nominal + borrowing; priority + fair share order</text>
<rect x="300" y="280" width="360" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="312" y="302.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Topology fit (TAS)</text>
<text x="312" y="325.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">can the gang be placed together?</text>
<rect x="300" y="365" width="360" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="312" y="387.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Admit: unsuspend</text>
<text x="312" y="410.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">or stay pending: “queue over quota”</text>
<rect x="730" y="70" width="340" height="400" rx="14" fill="#fffbeb" fill-opacity=".55" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="744" y="94" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#92400e">PLACEMENT: KUBE-SCHEDULER</text>
<rect x="750" y="110" width="300" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="762" y="132.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Filter</text>
<text x="762" y="155.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">nodes that can run each pod</text>
<rect x="750" y="215" width="300" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="762" y="237.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Score</text>
<text x="762" y="260.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">gpu-binpack profile: MostAllocated</text>
<rect x="750" y="320" width="300" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="762" y="342.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Bind</text>
<text x="762" y="365.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">or “pod unschedulable”</text>
<rect x="1110" y="200" width="210" height="160" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="1122" y="223" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Devices</text>
<text x="1122" y="246" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">device plugin / DRA assigns</text>
<text x="1122" y="261" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">GPUs or slices</text>
<path d="M 230 280 L 280 280" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 680 405 L 730 270" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 1070 280 L 1110 280" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="495" width="1290" height="50" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="526" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">“0/128 nodes available” in pod events vs “queue over quota” in Kueue: different layers, different owners. Show both.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="560px" viewBox="0 0 1300 560" style="background:#ffffff"><title>Replay and external data</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="560" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Mixing in data the current policy didn't generate</text>
<rect x="30" y="70" width="330" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="94" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">Fresh · 80%</text>
<text x="42" y="118" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">on-policy, age ≤ k</text>
<path d="M 360 120 L 470 230" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="190" width="330" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="42" y="214" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">Replay · 15%</text>
<text x="42" y="238" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">own older data; age and KL limits</text>
<path d="M 360 240 L 470 230" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="310" width="330" height="100" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="42" y="334" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#991b1b">External · 5%</text>
<text x="42" y="358" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">teacher, checkpoints, humans</text>
<path d="M 360 360 L 470 230" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="470" y="170" width="260" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="482" y="193" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Batch</text>
<text x="482" y="216" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">mixing ratios lowered by the</text>
<text x="482" y="231" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">controller when ESS falls</text>
<rect x="800" y="70" width="470" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="812" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">RL loss (decoupled)</text>
<text x="812" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">fresh + replay: behavior weights, trust region</text>
<rect x="800" y="280" width="470" height="110" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="812" y="303" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Separate SFT-style term, small weight</text>
<text x="812" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">external tokens: avoids exploding weights; anneal out as the policy</text>
<text x="812" y="341" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">succeeds</text>
<path d="M 730 210 L 800 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 730 260 L 800 335" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="430" width="1240" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="50" y="466.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">• retire replay older than 64 versions or KL &gt; 0.05</text>
<text x="670" y="466.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">• prioritize hard-task successes, large advantages</text>
<text x="50" y="500.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">• re-score replay rewards with the current verifier</text>
<text x="670" y="500.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0f172a">• ESS floor: shrink off-policy share automatically</text></svg>

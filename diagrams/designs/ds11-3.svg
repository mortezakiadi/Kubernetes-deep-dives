<text x="42" y="336" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">sampling weight per family, not dataset size</text>
<rect x="445" y="290" width="400" height="105" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="457" y="313" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Temperature</text>

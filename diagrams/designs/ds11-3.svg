<rect x="860" y="290" width="400" height="105" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="872" y="313" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Epoch caps</text>
<text x="872" y="336" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">limit repeats of small families</text>
<rect x="30" y="415" width="400" height="105" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="438" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Per-domain settings</text>
<text x="42" y="461" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">length, template, loss weight</text>
<rect x="445" y="415" width="400" height="105" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="457" y="438" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Floors</text>
<text x="457" y="461" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">no family silently disappears</text>
<rect x="860" y="415" width="400" height="105" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="872" y="438" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Search</text>
<text x="872" y="461" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">fit scores vs weights; maximize the weakest family</text></svg>

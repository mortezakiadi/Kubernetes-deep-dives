<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="493px" viewBox="0 0 1300 493" style="background:#ffffff"><title>Closing the loop: registry → replay → guard → attribution</title><defs><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker></defs><rect width="1300" height="493" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Closing the loop: registry → replay → guard → attribution</text><rect x="30" y="70" width="234" height="120" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/><text x="42" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Loop registry</text><text x="42" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">loop, layers,</text><text x="42" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">metric, owner</text><rect x="282" y="70" width="234" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="294" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Layer change</text><text x="294" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">any layer the</text><text x="294" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">loop crosses</text><path d="M 264 130 L 282 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/><rect x="533" y="70" width="234" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="545" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Replay</text><text x="545" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">50 RL steps,</text><text x="545" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">64 GPUs, 40 min</text><path d="M 515 130 L 533 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/><rect x="785" y="70" width="234" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="797" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Guard</text><text x="797" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">block if end-to-</text><text x="797" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">end worse &gt; 2 SE</text><path d="M 767 130 L 785 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/><rect x="1036" y="70" width="234" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1048" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">Attribution</text><text x="1048" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">weekly, per</text><text x="1048" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">shipped change</text><path d="M 1018 130 L 1036 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/><rect x="30" y="220" width="605" height="162" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="50" y="248" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">The batch change, guarded</text><text x="50" y="274" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#047857">decode throughput: +191%</text><text x="50" y="300" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c">verified tokens per GPU-hour: −3,599</text><text x="50" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c">2 SE = 42 → blocked</text><rect x="665" y="220" width="605" height="162" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="685" y="248" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Loop owners</text><text x="685" y="274" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">own the seams, not the layers</text><text x="685" y="300" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d4ed8">can block a change in any layer of their loop</text><text x="685" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">accountable for the root metric</text><text x="685" y="352" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#92400e">replay sets refreshed monthly</text><rect x="30" y="407" width="1240" height="56" rx="10" fill="#fef2f2" stroke="#dc2626"/><text x="50" y="441" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: rolled out on a Friday as routine tuning; its own benchmark passed; found 11 days later.</text></svg>
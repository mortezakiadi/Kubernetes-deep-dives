<svg xmlns="http://www.w3.org/2000/svg" width="1180px" height="640px" viewBox="0 0 1180 640" style="background:#ffffff"><title>Threat model for agent sandboxes</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1180" height="640" fill="#ffffff"/><text x="590" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Every arrow out of the sandbox, and the control that blocks it</text>
<rect x="445" y="255" width="290" height="130" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="457" y="279" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#991b1b">Sandbox</text>
<text x="457" y="303" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Model-generated code, packages from</text>
<text x="457" y="319" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">the internet, user uploads. Assume the</text>
<text x="457" y="335" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">attacker controls it, directly or</text>
<text x="457" y="351" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">through a prompt injection.</text>
<rect x="40" y="70" width="300" height="104" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="52" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">1. Kernel escape</text>
<text x="52" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Node kernel and every pod on the node</text>
<text x="52" y="135" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">Control: Own kernel per sandbox (microVM or</text>
<text x="52" y="150" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">gVisor), dedicated nodes</text>
<path d="M 520 255 L 210 166" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-bad)"/>
<rect x="40" y="285" width="300" height="104" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="52" y="308" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">2. Lateral movement</text>
<text x="52" y="331" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Other sandboxes and cluster pods</text>
<text x="52" y="350" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">Control: Default-deny NetworkPolicy; only</text>
<text x="52" y="365" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">the gateways are reachable</text>
<path d="M 445 320 L 330 335" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-bad)"/>
<rect x="40" y="470" width="300" height="104" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="52" y="493" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">3. Kubernetes API</text>
<text x="52" y="516" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Read Secrets, create pods</text>
<text x="52" y="535" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">Control: No ServiceAccount token, no RBAC,</text>
<text x="52" y="550" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">API server blocked</text>
<path d="M 480 385 L 240 495" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-bad)"/>
<rect x="440" y="470" width="300" height="104" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="452" y="493" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">4. Cloud credentials (IMDS)</text>
<text x="452" y="516" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Node role via 169.254.169.254</text>
<text x="452" y="535" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">Control: IMDS blocked; no Pod Identity or</text>
<text x="452" y="550" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">IRSA role</text>
<path d="M 590 385 L 590 470" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-bad)"/>
<rect x="840" y="470" width="300" height="104" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="852" y="493" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">5. Secret theft</text>
<text x="852" y="516" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">API keys read from env vars or files</text>
<text x="852" y="535" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">Control: Only placeholders inside; gateway</text>
<text x="852" y="550" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">injects real values</text>
<path d="M 700 385 L 900 470" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-bad)"/>
<rect x="850" y="285" width="300" height="104" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="862" y="308" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">6. Data exfiltration</text>
<text x="862" y="331" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">User data posted to an attacker's server</text>
<text x="862" y="350" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">Control: Egress only via gateway,</text>
<text x="862" y="365" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">per-session allowlist, logged</text>
<path d="M 735 320 L 850 335" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-bad)"/>
<rect x="840" y="70" width="300" height="104" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="852" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">7. Resource abuse</text>
<text x="852" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Mining, fork bombs, full disks, 1000s of</text>
<text x="852" y="131" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">sessions</text>
<text x="852" y="150" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">Control: Limits per sandbox, quotas per</text>
<text x="852" y="165" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">tenant, max session length</text>
<path d="M 660 255 L 960 166" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-bad)"/>
<circle cx="340" cy="70" r="12" fill="#dc2626"/>
<text x="340" y="74.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">1</text>
<circle cx="340" cy="285" r="12" fill="#dc2626"/>
<text x="340" y="289.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">2</text>
<circle cx="340" cy="470" r="12" fill="#dc2626"/>
<text x="340" y="474.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">3</text>
<circle cx="740" cy="470" r="12" fill="#dc2626"/>
<text x="740" y="474.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">4</text>
<circle cx="1140" cy="470" r="12" fill="#dc2626"/>
<text x="1140" y="474.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">5</text>
<circle cx="1150" cy="285" r="12" fill="#dc2626"/>
<text x="1150" y="289.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">6</text>
<circle cx="1140" cy="70" r="12" fill="#dc2626"/>
<text x="1140" y="74.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">7</text>
<text x="590" y="620" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#475569" font-style="italic">Isolation protects the infrastructure. Egress and credential controls protect the data inside the sandbox.</text></svg>

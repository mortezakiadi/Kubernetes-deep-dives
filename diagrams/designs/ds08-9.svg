<svg xmlns="http://www.w3.org/2000/svg" width="1340px" height="620px" viewBox="0 0 1340 620" style="background:#ffffff"><title>Long-horizon infrastructure</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1340" height="620" fill="#ffffff"/><text x="670" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Services that turn long rollouts into training data</text>
<rect x="30" y="80" width="260" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="42" y="103" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Rollout engines</text>
<text x="42" y="126" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">generate turns; release KV cache</text>
<text x="42" y="141" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">while waiting on tools</text>
<rect x="390" y="80" width="300" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="402" y="103" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Environment fleet</text>
<text x="402" y="126" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pre-warmed sandboxes, hour-long episodes,</text>
<text x="402" y="141" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">snapshot + restore</text>
<path d="M 290 125 L 390 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="311.48" y="102" width="57.040000000000006" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="340" y="116" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">actions</text>
<path d="M 390 165 L 290 165" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="294.68" y="171" width="90.64000000000001" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="340" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">observations</text>
<rect x="750" y="80" width="280" height="120" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="762" y="103" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Snapshots</text>
<text x="762" y="126" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">copy-on-write volumes or VM</text>
<text x="762" y="141" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">checkpoints; GC after credit is</text>
<text x="762" y="156" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">computed</text>
<path d="M 690 140 L 750 140" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="280" width="400" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="303" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Trajectory store</text>
<text x="42" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">turns, logprobs, snapshot refs, checks; replayable and</text>
<text x="42" y="341" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">branchable</text>
<path d="M 160 200 L 160 280" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="500" y="280" width="360" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="512" y="302.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Credit workers</text>
<text x="512" y="325.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">pick branch points, schedule branches (low-priority</text>
<text x="512" y="339.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">jobs), compute turn advantages, calibrate PRMs</text>
<path d="M 430 340 L 500 340" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 870 200 L 760 280" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="811.48" y="236" width="57.040000000000006" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="840" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">restore</text>
<rect x="930" y="280" width="380" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="942" y="303" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Verifier workers</text>
<text x="942" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">fresh-environment checks, layered, versioned</text>
<path d="M 230 400 L 230 430 L 1000 430 L 1000 400" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-flow)"/>
<rect x="584.76" y="408" width="70.48" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="620" y="422" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">to verify</text>
<rect x="500" y="470" width="360" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="512" y="493" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Trainer</text>
<text x="512" y="516" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">turns + advantages; logprobs with each turn's own</text>
<text x="512" y="531" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">context</text>
<path d="M 680 400 L 680 470" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 1120 400 L 860 525" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="981.48" y="436" width="57.040000000000006" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="1010" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">rewards</text>
<rect x="30" y="470" width="400" height="110" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="493" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Cost tracking</text>
<text x="42" y="516" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">environment-minutes per trajectory and per useful sample;</text>
<text x="42" y="531" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">can exceed GPU cost</text></svg>

<text x="782" y="158" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Hangs</text>
<text x="782" y="180" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">collective watchdogs; no progress for N min; dump stacks</text>
<rect x="770" y="212" width="500" height="66" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="782" y="234" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Silent corruption</text>
<text x="782" y="256" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">loss / grad-norm spikes, NaN checks, cross-replica param checksums, known-answer</text>
<text x="782" y="270" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">probe per GPU</text>
<rect x="770" y="288" width="500" height="66" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="782" y="310" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">Response</text>
<text x="782" y="332" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">isolate node, targeted diagnostic, roll back to before corruption</text>
<rect x="30" y="400" width="1240" height="120" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="423.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Step time 41 → 52 s over two days, no alerts</text>
<text x="42" y="447.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">Without per-rank timing, a straggler looks like 'the run got slower'. With it, the slow rank is named in one step and its node is drained at the next checkpoint.</text></svg>

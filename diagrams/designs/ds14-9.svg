<text x="50" y="350" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">median 41 s · thermal throttling on one GPU · every collective waits</text>
<rect x="770" y="60" width="500" height="66" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="782" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Stragglers</text>
<text x="782" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">per-rank compute vs communication time; robust z-score</text>

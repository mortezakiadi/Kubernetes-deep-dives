<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="580px" viewBox="0 0 1300 580" style="background:#ffffff"><title>Regression gate</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="580" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Regression gate: candidate vs a same-day baseline run, with repeats</text>
<rect x="30" y="70" width="230" height="100" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Trigger</text>
<text x="42" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">engine upgrade, flag change, new</text>
<text x="42" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">variant, gateway or driver change</text>
<rect x="310" y="70" width="270" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="322" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Benchmark pool</text>
<text x="322" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">baseline × 3, candidate × 3, back to back,</text>
<text x="322" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">same nodes</text>
<rect x="630" y="70" width="260" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="642" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Compare</text>
<text x="642" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">difference vs 2 × run-to-run noise and</text>
<text x="642" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">a minimum effect</text>
<path d="M 260 120 L 310 120" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 580 120 L 630 120" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="940" y="52" width="330" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="952" y="73" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#065f46">pass</text>
<text x="952" y="94" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">within noise</text>
<path d="M 890 120 L 940 77" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="940" y="108" width="330" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="952" y="129" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#991b1b">regression</text>
<text x="952" y="150" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">block + report</text>
<path d="M 890 120 L 940 133" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="940" y="164" width="330" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="952" y="185" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e40af">improvement</text>
<text x="952" y="206" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">propose new baseline</text>
<path d="M 890 120 L 940 189" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="30" y="220" width="1240" height="230" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="50" y="248" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">SLO capacity (req/s), 3 repeats each (illustrative)</text>
<text x="270" y="304" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">baseline · vLLM 0.31.2</text>
<rect x="290" y="276" width="728" height="16" rx="2" fill="#94a3b8" fill-opacity="0.85" stroke="none"/>
<text x="1023.9999999999999" y="289" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">18.2</text>
<rect x="290" y="296" width="744" height="16" rx="2" fill="#94a3b8" fill-opacity="0.85" stroke="none"/>
<text x="1040.0" y="309" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">18.6</text>
<rect x="290" y="316" width="736" height="16" rx="2" fill="#94a3b8" fill-opacity="0.85" stroke="none"/>
<text x="1032.0" y="329" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">18.4</text>
<text x="270" y="384" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">candidate · vLLM 0.32.0</text>
<rect x="290" y="356" width="604" height="16" rx="2" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="900.0" y="369" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">15.1</text>
<rect x="290" y="376" width="616" height="16" rx="2" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="912.0" y="389" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">15.4</text>
<rect x="290" y="396" width="600" height="16" rx="2" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="896.0" y="409" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">15.0</text>
<text x="290" y="438.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">−17.6%, noise ±1.1% → regression: blocked, report attached (curves overlaid, deltas with CIs, server breakdown)</text>
<rect x="30" y="475" width="1240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="505.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: one closed-loop run on whichever GPUs were free, accepted if within 20% of a number</text>
<text x="50" y="531" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">typed into a YAML file a year earlier.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="493px" viewBox="0 0 1300 493" style="background:#ffffff"><title>Observability that means the same thing on every platform</title><defs><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker></defs><rect width="1300" height="493" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Observability that means the same thing on every platform</text><rect x="30" y="70" width="234" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="42" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Schema in code</text><text x="42" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">names, labels, buckets,</text><text x="42" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">measurement points</text><rect x="282" y="70" width="234" height="120" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/><text x="294" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Router and engine</text><text x="294" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">one request ID end</text><text x="294" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">to end</text><path d="M 264 130 L 282 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/><rect x="533" y="70" width="234" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="545" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">AWS collection</text><text x="545" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">CloudWatch add-on with</text><text x="545" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">OTel Container Insights</text><path d="M 515 130 L 533 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/><rect x="785" y="70" width="234" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="797" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b21b6">Stores</text><text x="797" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">CloudWatch and Amazon</text><text x="797" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">Managed Prometheus</text><path d="M 767 130 L 785 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/><rect x="1036" y="70" width="234" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1048" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">Conformance</text><text x="1048" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">every series and label</text><text x="1048" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">or the release fails</text><path d="M 1018 130 L 1036 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/><rect x="30" y="220" width="605" height="162" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="50" y="248" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">On AWS</text><text x="50" y="274" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#92400e">vLLM and SGLang engine metrics, DCGM for GPUs</text><text x="50" y="300" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#92400e">GPU, Trainium, Inferentia, EFA metrics per pod</text><text x="50" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6d28d9">Accelerated Compute Insights, queried with PromQL</text><text x="50" y="352" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">cross-account views from one monitoring account</text><rect x="665" y="220" width="605" height="162" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="685" y="248" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Rules for comparing</text><text x="685" y="274" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d4ed8">accelerator counters mapped to neutral series</text><text x="685" y="300" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d4ed8">router TTFT and engine TTFT are different series</text><text x="685" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c">cross-platform charts use only the router&#x27;s</text><text x="685" y="352" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">unmapped series stay platform-specific</text><rect x="30" y="407" width="1240" height="56" rx="10" fill="#fef2f2" stroke="#dc2626"/><text x="50" y="441" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: AWS looked 140 ms faster at p95 TTFT because its dashboard measured from the engine, not the router.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>Checkpoint anatomy</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">A sharded checkpoint: every rank writes its own part, nothing is gathered</text>
<rect x="30" y="60" width="560" height="380" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="50" y="88" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">step-0120000/</text>
<rect x="50" y="110" width="12" height="30" rx="4" fill="#2563eb" fill-opacity="1" stroke="none"/>
<text x="75" y="130" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">__0_0.distcp</text>
<text x="240" y="130" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">rank 0 shards: params, Adam m/v, fp32 master</text>
<rect x="50" y="156" width="12" height="30" rx="4" fill="#2563eb" fill-opacity="1" stroke="none"/>
<text x="75" y="176" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">__1_0.distcp</text>
<text x="240" y="176" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">rank 1 shards</text>
<rect x="50" y="202" width="12" height="30" rx="4" fill="#94a3b8" fill-opacity="1" stroke="none"/>
<text x="75" y="222" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">…</text>
<text x="240" y="222" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569"></text>
<rect x="50" y="248" width="12" height="30" rx="4" fill="#2563eb" fill-opacity="1" stroke="none"/>
<text x="75" y="268" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">__1023_0.distcp</text>
<text x="240" y="268" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">rank 1023 shards</text>
<rect x="50" y="294" width="12" height="30" rx="4" fill="#7c3aed" fill-opacity="1" stroke="none"/>
<text x="75" y="314" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">.metadata</text>
<text x="240" y="314" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">tensor → file, offsets, global shapes</text>
<rect x="50" y="340" width="12" height="30" rx="4" fill="#d97706" fill-opacity="1" stroke="none"/>
<text x="75" y="360" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">extra state</text>
<text x="240" y="360" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">step, LR scheduler, loader position, RNG</text>
<rect x="50" y="386" width="12" height="30" rx="4" fill="#059669" fill-opacity="1" stroke="none"/>
<text x="75" y="406" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">COMPLETE</text>
<text x="240" y="406" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">written last, after all files are durable</text>
<rect x="640" y="70" width="300" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="652" y="92.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Deduplicate replicas</text>
<text x="652" y="115.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">identical shards on DP replicas written once;</text>
<text x="652" y="129.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">writing spread across replicas</text>
<rect x="970" y="70" width="300" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="982" y="92.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Metadata = resharding</text>
<text x="982" y="115.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">a new world size reads the byte ranges it now</text>
<text x="982" y="129.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">owns</text>
<rect x="640" y="200" width="300" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="652" y="222.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Exact resume</text>
<text x="652" y="245.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">data-loader position + RNG: no replayed</text>
<text x="652" y="259.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">examples</text>
<rect x="970" y="200" width="300" height="100" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="982" y="222.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">No marker, no checkpoint</text>
<text x="982" y="245.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">restores ignore incomplete directories</text>
<rect x="640" y="330" width="630" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="660" y="358.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">70B model training state ≈ 1.1 TB</text>
<rect x="660" y="372" width="75" height="26" rx="2" fill="#2563eb" fill-opacity="1" stroke="none"/>
<text x="697.5454545454545" y="418" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">bf16 weights 140 GB</text>
<rect x="735" y="372" width="150" height="26" rx="2" fill="#7c3aed" fill-opacity="1" stroke="none"/>
<text x="810.1818181818182" y="418" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">fp32 master 280 GB</text>
<rect x="885" y="372" width="300" height="26" rx="2" fill="#059669" fill-opacity="1" stroke="none"/>
<text x="1035.4545454545455" y="418" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Adam m + v 560 GB</text>
<rect x="1186" y="372" width="64" height="26" rx="2" fill="#cbd5e1" fill-opacity="1" stroke="none"/>
<text x="1217.8181818181818" y="418" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">other 120 GB</text>
<rect x="30" y="470" width="1240" height="100" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="502.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: gather everything on rank 0 and torch.save(): rank 0 ran out of host memory,</text>
<text x="50" y="528" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">and 1,023 GPUs waited while one process wrote one 1.1 TB file. Now ≈ 1.1 GB per rank, in parallel.</text></svg>

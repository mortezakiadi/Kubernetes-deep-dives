<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="560px" viewBox="0 0 1300 560" style="background:#ffffff"><title>Benchmark service</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="560" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">The benchmark service: isolated, scheduled, checked against production</text>
<rect x="30" y="60" width="400" height="260" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="44" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">DEDICATED BENCHMARK POOL</text>
<rect x="50" y="100" width="360" height="80" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="62" y="122" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">H100 × 2 nodes</text>
<text x="62" y="144" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">exclusive placement via Kueue; no training neighbours</text>
<rect x="50" y="200" width="360" height="80" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="62" y="222" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">B200 × 2 nodes</text>
<text x="62" y="244" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">exclusive placement via Kueue; no training neighbours</text>
<rect x="480" y="60" width="380" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="492" y="82.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Weekly re-baseline</text>
<text x="492" y="105.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">every production fingerprint: catches driver / firmware</text>
<text x="492" y="119.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">drift</text>
<rect x="480" y="170" width="380" height="90" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="492" y="192.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Self-service runs</text>
<text x="492" y="215.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">name a fingerprint + dataset → result + report link</text>
<rect x="480" y="280" width="380" height="90" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="492" y="302.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Monthly capture</text>
<text x="492" y="325.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">new replay; diff lengths + sharing vs last month</text>
<rect x="900" y="60" width="370" height="310" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="920" y="88.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Run-to-run noise (CV of SLO capacity)</text>
<text x="920" y="124" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">shared idle GPUs</text>
<rect x="920" y="132" width="281" height="24" rx="4" fill="#dc2626" fill-opacity="1" stroke="none"/>
<text x="1207.25" y="150" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">15%</text>
<text x="920" y="194" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">dedicated pool</text>
<rect x="920" y="202" width="52" height="24" rx="4" fill="#059669" fill-opacity="1" stroke="none"/>
<text x="978.5" y="220" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">2.8%</text>
<text x="920" y="280" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">smallest detectable change ≈ 2 × noise</text>
<text x="920" y="304" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">published per configuration</text>
<rect x="30" y="400" width="1240" height="130" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="50" y="428" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Production vs baseline prediction at similar request rates</text>
<path d="M 60 507 L 140 507 L 220 507 L 300 507 L 380 507 L 460 507 L 540 507 L 620 507 L 700 507 L 780 507" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4"/>
<path d="M 60 511 L 140 505 L 220 509 L 300 503 L 380 499 L 460 492 L 540 478 L 620 466 L 700 457 L 780 449" fill="none" stroke="#7c3aed" stroke-width="3"/>
<text x="1250" y="452" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5b21b6">production p99 TTFT drifts away from the baseline's prediction:</text>
<text x="1250" y="470" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5b21b6">the replay no longer represents production → new capture</text>
<text x="60" y="525.2222222222222" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#475569">baseline prediction</text></svg>

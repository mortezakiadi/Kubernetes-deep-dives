<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="540px" viewBox="0 0 1300 540" style="background:#ffffff"><title>Scale-up review</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="540" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Scaling up: keep the science, re-tune the systems</text>
<rect x="30" y="60" width="610" height="300" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="44" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">SCIENCE KEYS: STAY FIXED UNLESS THE LADDER SAYS OTHERWISE</text>
<rect x="60" y="100" width="550" height="38" rx="6" fill="#ffffff" stroke="#047857"/>
<text x="76" y="124" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">objective + clipping</text>
<rect x="60" y="148" width="550" height="38" rx="6" fill="#ffffff" stroke="#047857"/>
<text x="76" y="172" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">rewards + verifiers</text>
<rect x="60" y="196" width="550" height="38" rx="6" fill="#ffffff" stroke="#047857"/>
<text x="76" y="220" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">data mixture</text>
<rect x="60" y="244" width="550" height="38" rx="6" fill="#ffffff" stroke="#047857"/>
<text x="76" y="268" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">filtering</text>
<rect x="60" y="292" width="550" height="38" rx="6" fill="#ffffff" stroke="#047857"/>
<text x="76" y="316" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">learning rate per sample*</text>
<rect x="670" y="60" width="600" height="300" rx="14" fill="#eff6ff" fill-opacity=".55" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="684" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#1e40af">SYSTEMS KEYS: RE-TUNED FOR THE NEW SIZE</text>
<rect x="700" y="100" width="540" height="38" rx="6" fill="#ffffff" stroke="#2563eb"/>
<text x="716" y="124" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">parallelism layout</text>
<rect x="700" y="148" width="540" height="38" rx="6" fill="#ffffff" stroke="#2563eb"/>
<text x="716" y="172" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">micro-batch sizes</text>
<rect x="700" y="196" width="540" height="38" rx="6" fill="#ffffff" stroke="#2563eb"/>
<text x="716" y="220" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">rollout engines + weight sync</text>
<rect x="700" y="244" width="540" height="38" rx="6" fill="#ffffff" stroke="#2563eb"/>
<text x="716" y="268" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">checkpoint interval + timeouts</text>
<rect x="700" y="292" width="540" height="38" rx="6" fill="#ffffff" stroke="#2563eb"/>
<text x="716" y="316" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">resources + topology</text>
<rect x="30" y="390" width="1240" height="120" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="420.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">*Batch ×16 with the same learning rate: stable, but learned much less per sample.</text>
<text x="50" y="446" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Global batch and learning rate change together and are re-validated at a rung, not assumed.</text>
<text x="50" y="472" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">The scale-up diff is reviewed: every changed science key needs a written justification.</text></svg>

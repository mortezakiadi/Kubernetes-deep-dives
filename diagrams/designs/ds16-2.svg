<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="560px" viewBox="0 0 1300 560" style="background:#ffffff"><title>Kinds of human signal</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="560" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Kinds of human signal: cost vs consistency (illustrative)</text>
<rect x="100" y="80" width="700" height="390" fill="#ffffff" stroke="#cbd5e1"/>
<circle cx="135" cy="392" r="29" fill="#64748b" fill-opacity=".35" stroke="#64748b" stroke-width="2"/>
<text x="135.0" y="356.71526960400325" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#64748b">Production feedback</text>
<circle cx="275" cy="158" r="24" fill="#2563eb" fill-opacity=".35" stroke="#2563eb" stroke-width="2"/>
<text x="275.0" y="128.36363636363637" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2563eb">Pairwise preference</text>
<circle cx="380" cy="216" r="22" fill="#7c3aed" fill-opacity=".35" stroke="#7c3aed" stroke-width="2"/>
<text x="380.0" y="188.47385767697915" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7c3aed">Rubric ratings</text>
<circle cx="590" cy="166" r="18" fill="#d97706" fill-opacity=".35" stroke="#d97706" stroke-width="2"/>
<text x="590.0" y="141.92704178377784" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#d97706">Edits</text>
<circle cx="744" cy="236" r="15" fill="#059669" fill-opacity=".35" stroke="#059669" stroke-width="2"/>
<text x="744.0" y="215.02070402268032" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#059669">Demonstrations</text>
<text x="450.0" y="494.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">cost per item →</text>
<text x="86" y="275.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">consistency</text>
<text x="110" y="458.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569">bubble size = typical volume</text>
<rect x="840" y="80" width="430" height="110" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="852" y="103" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Ratings drift, comparisons don't</text>
<text x="852" y="126" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">two raters' “5 of 7” differ; their A-vs-B choices mostly agree</text>
<rect x="840" y="205" width="430" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="852" y="228" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Collect reasons</text>
<text x="852" y="251" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a short reason or rubric tags per comparison make reward models</text>
<text x="852" y="266" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">debuggable</text>
<rect x="840" y="330" width="430" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="852" y="353" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Route by expertise</text>
<text x="852" y="376" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">coding and medical comparisons to experts; general helpfulness</text>
<text x="852" y="391" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">to broad pools</text></svg>

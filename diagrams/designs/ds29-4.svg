<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="640px" viewBox="0 0 1300 640" style="background:#ffffff"><title>Online monitors</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="640" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Three monitors over the trajectory stream</text>
<rect x="30" y="200" width="220" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="222.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Trajectory stream</text>
<text x="42" y="245.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">steps, actions, rewards, test</text>
<text x="42" y="259.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">results</text>
<rect x="310" y="60" width="420" height="98" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="322" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">Action rules</text>
<text x="322" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">every step · exact · known exploits · writes to tests/, reads of</text>
<text x="322" y="118" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">/tmp/ref, kill</text>
<path d="M 250 255 L 310 109" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="310" y="172" width="420" height="98" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="322" y="194" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Trajectory judge</text>
<text x="322" y="216" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">sampled · model reads the trajectory · solved, or made the check</text>
<text x="322" y="230" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">pass?</text>
<path d="M 250 255 L 310 221" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="310" y="284" width="420" height="98" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="322" y="306" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Statistical</text>
<text x="322" y="328" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">aggregates · per task cluster · visible-vs-hidden gap,</text>
<text x="322" y="342" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">reward-length, reward jumps</text>
<path d="M 250 255 L 310 333" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="790" y="160" width="220" height="180" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="802" y="182.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Events by class + cluster</text>
<text x="802" y="205.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">rates over time; alerts on rises</text>
<path d="M 730 109 L 790 250" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<path d="M 730 221 L 790 250" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<path d="M 730 333 L 790 250" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="1060" y="160" width="210" height="180" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="1072" y="182.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Not in the reward</text>
<text x="1072" y="205.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">detection only (see “teaching</text>
<text x="1072" y="219.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">to hide”)</text>
<path d="M 1010 250 L 1060 250" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="30" y="410" width="1240" height="210" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="50" y="438" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Share of successful trajectories using ENV-001 (illustrative)</text>
<rect x="70" y="590" width="120" height="2" rx="2" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="130" y="582" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">0%</text>
<text x="130" y="608" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">day 0</text>
<rect x="260" y="589" width="120" height="2" rx="2" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="320" y="581.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">0%</text>
<text x="320" y="608" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">day 1</text>
<rect x="450" y="587" width="120" height="3" rx="2" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="510" y="579.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">1%</text>
<text x="510" y="608" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">day 2</text>
<rect x="640" y="578" width="120" height="12" rx="2" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="700" y="570.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">4%</text>
<text x="700" y="608" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">day 3</text>
<rect x="830" y="554" width="120" height="36" rx="2" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="890" y="546.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">12%</text>
<text x="890" y="608" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">day 4</text>
<rect x="1020" y="470" width="120" height="120" rx="2" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="1080" y="462.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">40%</text>
<text x="1080" y="608" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">day 5</text>
<text x="50" y="462" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#047857">an action rule would have fired on day 1</text>
<text x="50" y="482" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">nobody watched trajectories: found after day 5</text></svg>

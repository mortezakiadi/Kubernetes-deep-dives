<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="620px" viewBox="0 0 1300 620" style="background:#ffffff"><title>Feedback loop</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="620" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">The feedback loop and the latency of each step</text>
<rect x="350.0" y="57.0" width="220" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="362.0" y="80.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Sample</text>
<text x="362.0" y="103.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pairs from the current policy</text>
<text x="460.0" y="171.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">1 day</text>
<rect x="601.1473670974872" y="167.0" width="220" height="96" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="613.1473670974872" y="190.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Collect</text>
<text x="613.1473670974872" y="213.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">raters + production feedback</text>
<text x="711.1473670974872" y="281.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">5–10 days</text>
<rect x="601.1473670974872" y="386.99999999999994" width="220" height="96" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="613.1473670974872" y="409.99999999999994" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Curate</text>
<text x="613.1473670974872" y="432.99999999999994" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">quality, privacy, versioned</text>
<text x="613.1473670974872" y="447.99999999999994" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">data</text>
<text x="711.1473670974872" y="500.99999999999994" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">1 day</text>
<rect x="350.0" y="497.0" width="220" height="96" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="362.0" y="520.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Model</text>
<text x="362.0" y="543.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">train + evaluate reward models</text>
<text x="460.0" y="611.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">2 days</text>
<rect x="98.85263290251285" y="387.00000000000006" width="220" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="110.85263290251285" y="410.00000000000006" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Train</text>
<text x="110.85263290251285" y="433.00000000000006" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">RL or DPO, release gates</text>
<text x="208.85263290251285" y="501.00000000000006" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">3–5 days</text>
<rect x="98.8526329025128" y="166.99999999999997" width="220" height="96" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="110.8526329025128" y="189.99999999999997" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Deploy + observe</text>
<text x="110.8526329025128" y="212.99999999999997" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">production signal, evals</text>
<text x="208.8526329025128" y="281.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">ongoing</text>
<path d="M 565.4818941809447 151.2 L 605.6654729165425 168.8" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 711.1473670974872 281.0 L 711.1473670974872 368.99999999999994" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 605.6654729165425 481.2 L 565.4818941809447 498.79999999999995" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 354.5181058190554 498.8 L 314.3345270834575 481.20000000000005" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 208.85263290251282 369.0 L 208.85263290251282 281.0" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 314.33452708345743 168.79999999999998 L 354.51810581905534 151.2" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<text x="460" y="319" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">2-week cadence</text>
<text x="460" y="341.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#475569">each round: feedback on</text>
<text x="460" y="359.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#475569">the current model</text>
<rect x="860" y="90" width="410" height="160" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="872" y="113.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#991b1b">Before</text>
<text x="872" y="137.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">May training run → February reward model → December</text>
<text x="872" y="152.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">comparisons → a model that no longer existed</text>
<rect x="860" y="280" width="410" height="150" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="872" y="303.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#065f46">Freshness target</text>
<text x="872" y="327.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">≥ 70% of a round's comparisons come from the current</text>
<text x="872" y="342.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">policy or its candidates</text>
<rect x="860" y="460" width="410" height="120" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="872" y="483" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Slowest step sets the pace</text>
<text x="872" y="506" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">usually collection or reward-model evaluation</text></svg>

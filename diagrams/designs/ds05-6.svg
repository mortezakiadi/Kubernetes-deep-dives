<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="670px" viewBox="0 0 1300 670" style="background:#ffffff"><title>Network isolation layers</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="670" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Isolation in layers: every layer must deny a forbidden path, each owned by one team</text>
<rect x="30" y="60" width="900" height="580" rx="16" fill="#f8fafc" fill-opacity=".6" stroke="#475569" stroke-width="1.6"/>
<text x="48" y="84" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Segments (Cloud WAN)</text>
<text x="48" y="102.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">prod and nonprod can't route to each other  ·  owner: network team</text>
<rect x="70" y="118" width="820" height="494" rx="16" fill="#fffbeb" fill-opacity=".6" stroke="#d97706" stroke-width="1.6"/>
<text x="88" y="142" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">VPCs, subnets, security groups</text>
<text x="88" y="160.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">only LBs and gateways accept outside traffic; SGs for pods guard databases  ·  owner: network + platform</text>
<rect x="110" y="176" width="740" height="408" rx="16" fill="#fef2f2" fill-opacity=".6" stroke="#dc2626" stroke-width="1.6"/>
<text x="128" y="200" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">ClusterNetworkPolicy</text>
<text x="128" y="218.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">platform guardrails namespaces can't override: default deny, no IMDS  ·  owner: platform team</text>
<rect x="150" y="234" width="660" height="322" rx="16" fill="#eff6ff" fill-opacity=".6" stroke="#2563eb" stroke-width="1.6"/>
<text x="168" y="258" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">NetworkPolicy</text>
<text x="168" y="276.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">each team opens what its services need  ·  owner: application team</text>
<rect x="190" y="292" width="580" height="236" rx="16" fill="#ecfdf5" fill-opacity=".6" stroke="#059669" stroke-width="1.6"/>
<text x="208" y="316" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Workload identity</text>
<text x="208" y="334.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">receiver checks who is calling (mesh identity, IAM)  ·  owner: platform + app</text>
<rect x="330" y="400" width="300" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="480.0" y="439.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Workload</text>
<text x="480.0" y="463.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">a pod in namespace ml-dev</text>
<rect x="980" y="60" width="290" height="250" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="992" y="83" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Egress control</text>
<text x="992" y="106" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Internet traffic leaves through a central</text>
<text x="992" y="121" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">egress per region: NAT + Network Firewall</text>
<text x="992" y="136" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">with domain rules. Sandbox clusters add</text>
<text x="992" y="151" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">per-session egress gateways (Design 01).</text>
<rect x="980" y="340" width="290" height="300" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="992" y="363" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Denial tests</text>
<text x="992" y="386" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">A scheduled job in every cluster tries the</text>
<text x="992" y="401" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">paths that must fail: dev → prod database,</text>
<text x="992" y="416" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">any pod → IMDS, sandbox → internet. Any</text>
<text x="992" y="431" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">success pages the on-call.</text>
<path d="M 630 445 L 980 185" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-bad)"/></svg>

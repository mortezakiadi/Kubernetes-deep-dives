t-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">From request to GPU: route to the replica that already has the context</text>
<rect x="30" y="270" width="140" height="80" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="100.0" y="304.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Clients</text>
<text x="100.0" y="327.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">apps, agents</text>
<rect x="210" y="240" width="220" height="140" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="222" y="263" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Gateway</text>
<text x="222" y="286" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">TLS, auth, per-tenant rate</text>
<text x="222" y="301" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">limits and token budgets, model</text>
<text x="222" y="316" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">by name</text>
<rect x="470" y="240" width="240" height="140" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="482" y="263" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Inference-aware routing</text>
<text x="482" y="286" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Endpoint picker (Gateway API</text>
<text x="482" y="301" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Inference Extension, llm-d):</text>
<text x="482" y="316" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">prefix-cache hits, queue length,</text>
<text x="482" y="331" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">free KV memory</text>

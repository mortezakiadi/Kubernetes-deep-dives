<text x="1023" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">1h–4h</text>
<rect x="1115" y="329" width="50" height="71" rx="2" fill="#64748b" fill-opacity="0.85" stroke="none"/>
<rect x="1171" y="339" width="50" height="61" rx="2" fill="#2563eb" fill-opacity="0.9" stroke="none"/>
<text x="1168" y="318.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">-3</text>
<text x="1168" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">&gt; 4h</text>
<rect x="1080" y="80" width="14" height="14" rx="2" fill="#64748b" fill-opacity="1" stroke="none"/>
<text x="1100" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">v7</text>
<rect x="1140" y="80" width="14" height="14" rx="2" fill="#2563eb" fill-opacity="1" stroke="none"/>
<text x="1160" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">v8</text>
<text x="610" y="448" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400e">public benchmark: 71% → 77% · production acceptance: 41% → 41%</text>
<rect x="30" y="480" width="1240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="512.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: one number per benchmark. v8's gain on short tasks and loss on long ones averaged</text>

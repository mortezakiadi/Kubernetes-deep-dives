<text x="30" y="510" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Compaction costs work since the last checkpoint: only for preemptible, checkpointable jobs.</text></svg>

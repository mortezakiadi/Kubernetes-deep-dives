<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>Task anatomy</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">A task: everything needed to reproduce it, under one content hash</text>
<rect x="30" y="60" width="820" height="420" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="44" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">TASK 7C1E9A40B2D3F611</text>
<rect x="50" y="100" width="380" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="62" y="123" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Environment</text>
<text x="62" y="146" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">image by digest: repo, tools, locked deps</text>
<rect x="450" y="100" width="380" height="100" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="462" y="123" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Initial state</text>
<text x="462" y="146" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">snapshot: commit, files, data</text>
<rect x="50" y="220" width="380" height="100" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="62" y="243" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Instruction</text>
<text x="62" y="266" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">what the agent sees</text>
<rect x="450" y="220" width="380" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="462" y="243" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Verifier</text>
<text x="462" y="266" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">fail-to-pass tests + milestones</text>
<rect x="50" y="340" width="380" height="100" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="62" y="363" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Budgets</text>
<text x="62" y="386" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">400 steps · 2M tokens · 4 h</text>
<rect x="450" y="340" width="380" height="100" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="462" y="363" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Reference solution</text>
<text x="462" y="386" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">secret store; validation only</text>
<rect x="880" y="60" width="390" height="140" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="892" y="82.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Metadata</text>
<text x="892" y="105.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">source + license · domain · difficulty per policy ·</text>
<text x="892" y="119.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">pipeline version</text>
<rect x="880" y="220" width="390" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="892" y="242.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Hash = version</text>
<text x="892" y="265.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">image + state + instruction + verifier + budgets; runs</text>
<text x="892" y="279.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">record hashes</text>
<rect x="880" y="360" width="390" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="892" y="382.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Not in the hash</text>
<text x="892" y="405.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">metadata and difficulty, which change as policies improve</text>
<rect x="30" y="500" width="1240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="530.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: a prompt and a repository URL. Six months later half the URLs pointed at changed code,</text>
<text x="50" y="556" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">and the same “task” behaved differently in every run.</text></svg>

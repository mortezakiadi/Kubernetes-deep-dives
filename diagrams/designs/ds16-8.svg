<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="580px" viewBox="0 0 1300 580" style="background:#ffffff"><title>Reward model gate</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="580" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">A reward model's release gate</text>
<rect x="30" y="60" width="560" height="330" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="50" y="86.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Calibration: predicted vs observed human preference</text>
<line x1="80" y1="360" x2="550" y2="120" stroke="#94a3b8" stroke-dasharray="5 4"/>
<path d="M 127 336 L 174 317 L 221 293 L 268 269 L 315 250 L 362 226 L 409 206 L 456 187 L 503 168" fill="none" stroke="#059669" stroke-width="3"/>
<path d="M 127 341 L 174 331 L 221 322 L 268 312 L 315 307 L 362 298 L 409 293 L 456 283 L 503 278" fill="none" stroke="#dc2626" stroke-width="3"/>
<text x="544" y="167.6" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#047857">calibrated</text>
<text x="544" y="303.2" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">over-confident</text>
<text x="315.0" y="382" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">predicted P(chosen)</text>
<rect x="630" y="60" width="520" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="642" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">Accuracy on fresh labels</text>
<text x="642" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">random slice, current policy, per domain</text>
<text x="1250" y="94" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">≥ 72%</text>
<rect x="630" y="126" width="520" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="642" y="148" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Calibration</text>
<text x="642" y="170" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">reliability curve error</text>
<text x="1250" y="160" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">≤ 0.05</text>
<rect x="630" y="192" width="520" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="642" y="214" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Length bias</text>
<text x="642" y="236" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">+4× neutral filler</text>
<text x="1250" y="226" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">≤ 0</text>
<rect x="630" y="258" width="520" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="642" y="280" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Sycophancy + format</text>
<text x="642" y="302" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">controlled pairs</text>
<text x="1250" y="292" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">≤ 0</text>
<rect x="630" y="324" width="520" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="642" y="346" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">Best-of-16 human win</text>
<text x="642" y="368" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">vs random sample</text>
<text x="1250" y="358" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">≥ 60%</text>
<rect x="30" y="420" width="1240" height="120" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="452.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: 78% accuracy on its own validation split; in RL, answers grew 40% longer and people liked them less.</text>
<text x="50" y="478" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">The validation split shared the training data's length bias. Fresh, on-policy labels and bias probes catch it.</text>
<text x="50" y="504" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">Re-evaluate during RL on fresh samples: accuracy on the starting policy isn't accuracy on later outputs.</text></svg>

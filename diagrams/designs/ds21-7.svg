<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="580px" viewBox="0 0 1300 580" style="background:#ffffff"><title>KV offload tiers</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="580" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">KV cache tiers: evict to host memory instead of discarding</text>
<rect x="210.0" y="60" width="340" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="222.0" y="82.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">GPU HBM</text>
<text x="222.0" y="105.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">running requests' working set · ≈ 160 GB KV per</text>
<text x="222.0" y="119.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">2-GPU replica</text>
<rect x="120.0" y="165" width="520" height="88" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="132.0" y="187.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Host DRAM (pinned)</text>
<text x="132.0" y="210.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">evicted blocks kept; reload over PCIe / C2C · 400 GiB ≈ 2.6M tokens ≈ 130 coding</text>
<text x="132.0" y="224.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">prefixes</text>
<rect x="30.0" y="270" width="700" height="88" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42.0" y="292.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Shared / local storage</text>
<text x="42.0" y="315.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">long-lived prefixes across replicas (LMCache, KV store) · TBs, slowest reload</text>
<path d="M 380 148 L 380 165" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 380 253 L 380 270" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="780" y="60" width="490" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="800" y="88" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Returning 20k-token session: time to first token</text>
<text x="800" y="126.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">recompute prefill</text>
<rect x="800" y="134" width="387" height="26" rx="4" fill="#dc2626" fill-opacity="1" stroke="none"/>
<text x="1192.6666666666667" y="153.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">2.9 s</text>
<text x="800" y="198.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">reload from host DRAM</text>
<rect x="800" y="206" width="60" height="26" rx="4" fill="#d97706" fill-opacity="1" stroke="none"/>
<text x="866.0" y="225.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">0.45 s</text>
<text x="800" y="270.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">still in HBM</text>
<rect x="800" y="278" width="16" height="26" rx="4" fill="#059669" fill-opacity="1" stroke="none"/>
<text x="822.0" y="297.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">0.12 s</text>
<text x="800" y="345.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569">illustrative; depends on PCIe bandwidth and block size</text>
<rect x="30" y="390" width="1240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="420.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: sessions came back every few minutes; the prefix had been evicted from HBM,</text>
<text x="50" y="446" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">so every return recomputed 20,000 tokens of prefill.</text>
<rect x="30" y="490" width="610" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="512" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">Pays when prefixes return after eviction</text>
<text x="42" y="534" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">agents, coding context, RAG documents; pure overhead with no reuse</text>
<rect x="660" y="490" width="610" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="672" y="512" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">The router must see the tiers</text>
<text x="672" y="534" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">otherwise a pod with the prefix in DRAM looks like a miss</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="580px" viewBox="0 0 1300 580" style="background:#ffffff"><title>Four long-horizon problems</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="580" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Four problems that are minor for short tasks and dominant for long ones</text>
<rect x="30" y="70" width="296" height="130" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="42" y="93.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#991b1b">Sparse rewards</text>
<text x="42" y="117.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">one bit after hundreds of decisions; at</text>
<text x="42" y="132.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">5% success most groups are all-fail → no</text>
<text x="42" y="148.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">signal</text>
<rect x="342" y="70" width="296" height="130" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="354" y="93.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#92400e">Credit assignment</text>
<text x="354" y="117.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">same advantage on every token; useful</text>
<text x="354" y="132.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">signal per decision shrinks with length</text>
<rect x="654" y="70" width="296" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="666" y="93.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1e40af">Exploration</text>
<text x="666" y="117.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">many more ways to fail than succeed;</text>
<text x="666" y="132.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">habits (submit early, repeat) reinforce</text>
<text x="666" y="148.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">themselves</text>
<rect x="966" y="70" width="296" height="130" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="978" y="93.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Verification</text>
<text x="978" y="117.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">more ways to fake an end state: edit</text>
<text x="978" y="132.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">tests, delete code, claim success</text>
<rect x="90" y="270" width="700" height="230" fill="#ffffff" stroke="#cbd5e1"/>
<text x="90" y="260.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">success rate vs turns the task needs (illustrative)</text>
<path d="M 90 304 L 104 325 L 118 343 L 132 360 L 146 375 L 160 388 L 174 400 L 188 410 L 202 420 L 216 428 L 230 436 L 244 442 L 258 448 L 272 454 L 286 459 L 300 463 L 314 467 L 328 470 L 342 474 L 356 476 L 370 479 L 384 481 L 398 483 L 412 485 L 426 486 L 440 488 L 454 489 L 468 490 L 482 491 L 496 492 L 510 493 L 524 494 L 538 494 L 552 495 L 566 496 L 580 496 L 594 496 L 608 497 L 622 497 L 636 497 L 650 498 L 664 498 L 678 498 L 692 498 L 706 499 L 720 499 L 734 499 L 748 499 L 762 499 L 776 499 L 790 499" fill="none" stroke="#dc2626" stroke-width="3"/>
<path d="M 90 304 L 104 310 L 118 315 L 132 321 L 146 326 L 160 331 L 174 335 L 188 340 L 202 344 L 216 349 L 230 353 L 244 357 L 258 361 L 272 365 L 286 369 L 300 373 L 314 376 L 328 380 L 342 383 L 356 386 L 370 390 L 384 393 L 398 396 L 412 399 L 426 402 L 440 404 L 454 407 L 468 410 L 482 412 L 496 415 L 510 417 L 524 419 L 538 422 L 552 424 L 566 426 L 580 428 L 594 430 L 608 432 L 622 434 L 636 436 L 650 438 L 664 439 L 678 441 L 692 443 L 706 444 L 720 446 L 734 447 L 748 449 L 762 450 L 776 452 L 790 453" fill="none" stroke="#059669" stroke-width="3"/>
<text x="280" y="460.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">trajectory-level RL</text>
<text x="560" y="380.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">goal: flatten the curve</text>
<text x="90.0" y="518.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">0</text>
<text x="265.0" y="518.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">25</text>
<text x="440.0" y="518.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">50</text>
<text x="615.0" y="518.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">75</text>
<text x="790.0" y="518.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">100</text>
<text x="440.0" y="538" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">turns needed</text>
<rect x="840" y="270" width="430" height="230" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="852" y="293.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Early warning: zero-variance groups</text>
<text x="852" y="317.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">Track the share of groups where all attempts fail (or all</text>
<text x="852" y="332.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">succeed). On long tasks it's the clearest sign the signal is</text>
<text x="852" y="348.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">too sparse; together the four problems show up as</text>
<text x="852" y="363.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">high-variance gradients.</text></svg>

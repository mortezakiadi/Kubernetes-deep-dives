<text x="630" y="585.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#475569">Tools without idempotency keys get a lookup instead: 'is there already an open PR from branch agent/sess-7f3a-41?'</text></svg>

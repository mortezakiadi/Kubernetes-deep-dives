font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Fit compute–performance curves; choose by ceiling, not by who leads early</text>
<rect x="90" y="80" width="760" height="400" fill="#ffffff" stroke="#cbd5e1"/>
<path d="M 90 378 L 100 378 L 109 377 L 118 377 L 128 376 L 138 376 L 147 375 L 157 375 L 166 374 L 176 373 L 185 372 L 195 371 L 204 370 L 213 368 L 223 367 L 232 365 L 242 363 L 252 361 L 261 358 L 270 355 L 280 352 L 290 349 L 299 346 L 308 342 L 318 338 L 328 333 L 337 328 L 347 323 L 356 318 L 366 313 L 375 308 L 384 302 L 394 296 L 403 291 L 413 286 L 422 280 L 432 275 L 442 270 L 451 266 L 460 261 L 470 257 L 480 253 L 489 250 L 498 247 L 508 244 L 518 241 L 527 239 L 536 237 L 546 235 L 556 233 L 565 231 L 574 230 L 584 229 L 594 228 L 603 227 L 612 226 L 622 225 L 632 225 L 641 224 L 651 223 L 660 223 L 669 223" fill="none" stroke="#dc2626" stroke-width="3"/>
<path d="M 679 222 L 688 222 L 698 222 L 708 222 L 717 221 L 726 221 L 736 221 L 746 221 L 755 221 L 764 221 L 774 221 L 784 221 L 793 220 L 802 220 L 812 220 L 822 220 L 831 220 L 841 220 L 850 220" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5"/>
<line x1="90" y1="220" x2="850" y2="220" stroke="#dc2626" stroke-dasharray="3 4" stroke-opacity=".6"/>
<text x="842" y="238.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#dc2626">Recipe A: fast start, ceiling 0.52</text>
<path d="M 90 376 L 100 376 L 109 376 L 118 375 L 128 375 L 138 374 L 147 374 L 157 373 L 166 373 L 176 372 L 185 371 L 195 370 L 204 370 L 213 369 L 223 368 L 232 367 L 242 366 L 252 364 L 261 363 L 270 362 L 280 360 L 290 359 L 299 357 L 308 355 L 318 353 L 328 351 L 337 349 L 347 346 L 356 344 L 366 341 L 375 338 L 384 335 L 394 332 L 403 329 L 413 325 L 422 321 L 432 318 L 442 313 L 451 309 L 460 305 L 470 301 L 480 296 L 489 291 L 498 287 L 508 282 L 518 277 L 527 272 L 536 267 L 546 262 L 556 257 L 565 252 L 574 247 L 584 243 L 594 238 L 603 233 L 612 229 L 622 224 L 632 220 L 641 216 L 651 212 L 660 208 L 669 204" fill="none" stroke="#2563eb" stroke-width="3"/>
<path d="M 679 201 L 688 198 L 698 194 L 708 191 L 717 188 L 726 186 L 736 183 L 746 181 L 755 179 L 764 177 L 774 175 L 784 173 L 793 171 L 802 169 L 812 168 L 822 167 L 831 165 L 841 164 L 850 163" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 5"/>
<line x1="90" y1="150" x2="850" y2="150" stroke="#2563eb" stroke-dasharray="3 4" stroke-opacity=".6"/>
<text x="842" y="142.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2563eb">Recipe B: slower, ceiling 0.66</text>
<text x="90.0" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">100</text>
<text x="343.3333333333333" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">1K</text>
<text x="596.6666666666666" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">10K</text>
<text x="850.0" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">100K</text>
<text x="470.0" y="524.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">GPU hours (log scale)</text>
<text x="90" y="70.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">held-out pass rate</text>
<line x1="420" y1="80" x2="420" y2="480" stroke="#94a3b8" stroke-dasharray="4 4"/>
<text x="425.5942655682086" y="98" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">small comparison: A looks better</text>
<text x="678.927598901542" y="460" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">fit ends; dashed = extrapolated</text>
<rect x="900" y="80" width="370" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="912" y="103" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Ceiling A</text>
<text x="912" y="126" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Where the recipe tops out. Precision, loss type and</text>
<text x="912" y="141" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">model size can move it. Matters most at scale.</text>
<rect x="900" y="215" width="370" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="912" y="238" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Efficiency B, midpoint C_mid</text>
<text x="912" y="261" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">How fast it gets there. Loss aggregation,</text>
<text x="912" y="276" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">normalization, curriculum mostly move these.</text>
<rect x="900" y="350" width="370" height="130" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="912" y="373" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Trust the fit</text>
<text x="912" y="396" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Fit on held-out evals, skip the noisy start, check</text>
<text x="912" y="411" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">extrapolation against later checkpoints; show the</text>
<text x="912" y="426" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ceiling's interval.</text></svg>

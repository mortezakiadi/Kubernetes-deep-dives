<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="493px" viewBox="0 0 1300 493" style="background:#ffffff"><title>From recipe to shipped improvement: candidate → serving build → shadow → canary → 100%</title><defs><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker></defs><rect width="1300" height="493" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">From recipe to shipped improvement: candidate → serving build → shadow → canary → 100%</text><rect x="30" y="70" width="234" height="120" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/><text x="42" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Candidate</text><text x="42" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">chosen checkpoint,</text><text x="42" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">experiment IDs in</text><text x="42" y="142" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">the release notes</text><rect x="282" y="70" width="234" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="294" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Serving build</text><text x="294" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">quantization, engine,</text><text x="294" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">sampling settings;</text><text x="294" y="142" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">release suite on it</text><path d="M 264 130 L 282 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/><rect x="533" y="70" width="234" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="545" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Shadow</text><text x="545" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">copy of live traffic;</text><text x="545" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">errors, latency,</text><text x="545" y="142" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">refusals, length</text><path d="M 515 130 L 533 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/><rect x="785" y="70" width="234" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="797" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Canary</text><text x="797" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">1%, 10%, 50%;</text><text x="797" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">guardrails roll</text><text x="797" y="142" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">back automatically</text><path d="M 767 130 L 785 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/><rect x="1036" y="70" width="234" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1048" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">100% and after</text><text x="1048" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">online effect next</text><text x="1048" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">to offline; old build</text><text x="1048" y="142" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">warm for a week</text><path d="M 1018 130 L 1036 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/><rect x="30" y="220" width="605" height="162" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="50" y="248" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">One canary step (10%, one day)</text><text x="50" y="274" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#047857">verified task success: +1.24 points (2 SE = 1.05) → advance</text><text x="50" y="300" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">refusals on benign prompts: within noise</text><text x="50" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">user-reported errors: within noise</text><text x="50" y="352" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d4ed8">p95 latency 1,840 → 1,910 ms, under the 10% limit</text><rect x="665" y="220" width="605" height="162" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="685" y="248" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Gates before any traffic</text><text x="685" y="274" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">no capability family worse beyond noise</text><text x="685" y="300" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">safety evaluations pass</text><text x="685" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#92400e">serving build keeps the offline gain</text><text x="685" y="352" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">latency and cost met on a traffic replay</text><rect x="30" y="407" width="1240" height="56" rx="10" fill="#fef2f2" stroke="#dc2626"/><text x="50" y="441" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: 7 weeks from recipe to users; the quantized build lost 1.1 of 2.4 points; no one checked users saw a change.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>Framework choice</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Which framework? Decide by parallelism needs and program shape</text>
<rect x="500" y="60" width="300" height="80" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="512" y="83" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">New training workload</text>
<text x="512" y="106" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">model size, parallelism, what else runs</text>
<rect x="80" y="200" width="340" height="90" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="92" y="222.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">1 · Part of a larger program?</text>
<text x="92" y="245.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">training is one stage among rollouts, rewards, data</text>
<text x="92" y="259.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">workers</text>
<rect x="880" y="200" width="340" height="90" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="892" y="222.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">2 · Needs TP / PP / CP / EP?</text>
<text x="892" y="245.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">to fit the model or to run fast enough</text>
<path d="M 600 140 L 250 200" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 420 245 L 880 245" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="638.28" y="222" width="23.44" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="650" y="236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">no</text>
<rect x="30" y="350" width="380" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="373" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Ray Train on KubeRay</text>
<text x="42" y="396" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">TorchTrainer workers; RayJob per run; trainer can be</text>
<text x="42" y="411" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">FSDP2 or Megatron inside</text>
<rect x="460" y="350" width="380" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="472" y="373" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">PyTorch Distributed (default)</text>
<text x="472" y="396" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">torchrun + FSDP2 fully_shard; TrainJob per run; plain</text>
<text x="472" y="411" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">PyTorch to debug</text>
<rect x="890" y="350" width="380" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="902" y="373" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Megatron Core</text>
<text x="902" y="396" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">TP × PP × CP × EP × DP, distributed optimizer, fused</text>
<text x="902" y="411" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">kernels</text>
<path d="M 250 290 L 220 350" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="199.92" y="308" width="30.160000000000004" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="215" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">yes</text>
<path d="M 1050 290 L 1080 350" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="1074.92" y="308" width="30.160000000000004" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="1090" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">yes</text>
<path d="M 1050 290 L 650 350" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="818.28" y="301" width="23.44" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="830" y="315" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">no</text>
<rect x="30" y="500" width="1240" height="70" rx="10" fill="#ecfdf5" stroke="#059669"/>
<text x="650" y="530.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#047857">Shared underneath: PyTorch Distributed Checkpoint (DCP) — Megatron's torch_dist builds on it, Ray uploads the directory</text>
<text x="650" y="552.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">so one checkpoint storage and loading layer serves all three</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="560px" viewBox="0 0 1300 560" style="background:#ffffff"><title>Three policies</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="560" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Three policies, two ratios, two jobs</text>
<rect x="40" y="90" width="330" height="140" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="52" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">Behavior μ</text>
<text x="52" y="138" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">inference engine, version v−k; logprobs</text>
<text x="52" y="154" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">recorded at sampling time</text>
<rect x="485" y="90" width="330" height="140" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="497" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Proximal π_prox</text>
<text x="497" y="138" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">training engine, recent version; computed on</text>
<text x="497" y="154" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">arrival</text>
<rect x="930" y="90" width="330" height="140" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="942" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">Target π_θ</text>
<text x="942" y="138" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">parameters being updated now</text>
<path d="M 370 160 L 485 160" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 815 160 L 930 160" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="120" y="270" width="540" height="110" rx="10" fill="#fffbeb" stroke="#d97706"/>
<text x="390" y="302" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">w = π_prox / μ   (importance weight)</text>
<text x="390" y="328" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">corrects staleness + engine mismatch</text>
<text x="390" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">truncate at 3 (TIS) · mask above 10 (MIS) · no gradient</text>
<rect x="680" y="270" width="540" height="110" rx="10" fill="#ecfdf5" stroke="#047857"/>
<text x="950" y="302" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">r = π_θ / π_prox   (clipped)</text>
<text x="950" y="328" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">trust region: how far one update may move</text>
<text x="950" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">clip to [1 − 0.2, 1 + 0.28]</text>
<rect x="30" y="410" width="1240" height="110" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="440" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">Naive PPO uses μ as 'old policy': one clip range does both jobs, and does neither well.</text>
<text x="50" y="466" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Missing old logits: if π_prox for an old version was never computed (weights overwritten, partial rollouts),</text>
<text x="50" y="486" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">staleness and engine-mismatch corrections get tangled. Fix: compute π_prox when the sample arrives, keep the last k weight versions.</text></svg>

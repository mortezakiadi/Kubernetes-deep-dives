<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>Tiers</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Three tiers, three jobs: the tool-call template break, before and after</text>
<rect x="30" y="60" width="400" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Smoke · 300 items · ≈ 6 min</text>
<text x="42" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">formats, tool-call parsing, template round-trips, safe-prompt</text>
<text x="42" y="118" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">refusals, short tasks</text>
<rect x="448" y="60" width="400" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="460" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Fast · 2,400 items · ≈ 40 min</text>
<text x="460" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">stratified gated slices; detects ~3-point regressions</text>
<rect x="866" y="60" width="400" height="100" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="878" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Full · realistic suite · ≈ 18 h</text>
<text x="878" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">release candidates, latest per run every 12 h, undecided</text>
<text x="878" y="118" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">results</text>
<rect x="30" y="190" width="1240" height="270" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="50" y="218" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Time from the serving change to a decision</text>
<line x1="200" y1="230" x2="200" y2="430" stroke="#e2e8f0"/>
<text x="200.0" y="448" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">change</text>
<line x1="279" y1="230" x2="279" y2="430" stroke="#e2e8f0"/>
<text x="279.147389838123" y="448" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">6 min</text>
<line x1="632" y1="230" x2="632" y2="430" stroke="#e2e8f0"/>
<text x="631.9308066532194" y="448" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">2 h</text>
<line x1="1008" y1="230" x2="1008" y2="430" stroke="#e2e8f0"/>
<text x="1007.5986657879059" y="448" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">20 h</text>
<line x1="1222" y1="230" x2="1222" y2="430" stroke="#e2e8f0"/>
<text x="1222.296458293941" y="448" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">3 days</text>
<text x="185" y="276" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">before</text>
<rect x="200" y="250" width="808" height="40" rx="3" fill="#94a3b8" fill-opacity="0.9" stroke="none"/>
<text x="208.0" y="275" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">nightly full: −2 pts, inside threshold</text>
<rect x="1008" y="250" width="215" height="40" rx="3" fill="#fecaca" fill-opacity="0.9" stroke="none"/>
<text x="1015.5986657879059" y="275" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">customer tickets</text>
<circle cx="1222" cy="270" r="9" fill="#b91c1c"/>
<text x="185" y="366" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">after</text>
<rect x="200" y="340" width="79" height="40" rx="3" fill="#2563eb" fill-opacity="0.9" stroke="none"/>
<text x="297.147389838123" y="365" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">smoke</text>
<circle cx="279" cy="360" r="9" fill="#047857"/>
<text x="349.147389838123" y="385.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">decided: tool-call parsing failed on 7% of multi-tool requests → page</text>
<rect x="30" y="485" width="1240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="517.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: the only evaluation with tool calls took 20 hours; the break was found 3 days later, after two</text>
<text x="50" y="543" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">checkpoints were evaluated on the broken template and a canary shipped on it.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1360px" height="700px" viewBox="0 0 1360 700" style="background:#ffffff"><title>Long-running agent architecture</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1360" height="700" fill="#ffffff"/><text x="680" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Stateless workers in the middle, everything durable around them</text>
<rect x="20" y="110" width="170" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="32" y="133" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Product UI and people</text>
<text x="32" y="156" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Start, approve, pause,</text>
<text x="32" y="171" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">rewind, watch progress</text>
<rect x="230" y="110" width="210" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="242" y="133" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Session API</text>
<text x="242" y="156" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Stable session ID per run;</text>
<text x="242" y="171" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">sends signals; streams the</text>
<text x="242" y="186" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">timeline</text>
<rect x="490" y="80" width="380" height="170" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="502" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">Durable execution engine</text>
<text x="502" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Temporal (EKS + Aurora PostgreSQL, or Temporal</text>
<text x="502" y="144" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Cloud) or Dapr Workflow. Event history per run,</text>
<text x="502" y="160" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">task queues, timers, signals, timeouts and retries</text>
<rect x="490" y="290" width="380" height="210" rx="14" fill="#eff6ff" fill-opacity=".55" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="504" y="314" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#1e40af">AGENT WORKERS (STATELESS)</text>
<rect x="510" y="330" width="105" height="140" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="522" y="352" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">worker 1</text>
<text x="522" y="374" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">workflow code</text>
<text x="522" y="388" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">+ activities</text>
<rect x="630" y="330" width="105" height="140" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="642" y="352" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">worker 2</text>
<text x="642" y="374" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">workflow code</text>
<text x="642" y="388" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">+ activities</text>
<rect x="750" y="330" width="105" height="140" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="762" y="352" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">worker 3</text>
<text x="762" y="374" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">workflow code</text>
<text x="762" y="388" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">+ activities</text>
<text x="680" y="520" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">Deployment scaled by KEDA on task-queue backlog</text>
<rect x="940" y="80" width="390" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="952" y="103" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Model gateway</text>
<text x="952" y="126" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Retries, fallback models, token budget per run</text>
<rect x="940" y="190" width="390" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="952" y="213" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Tool gateway</text>
<text x="952" y="236" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Idempotency key per step, ledger check and write,</text>
<text x="952" y="251" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">approvals</text>
<rect x="940" y="310" width="390" height="110" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="952" y="333" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Sandbox (Design 01)</text>
<text x="952" y="356" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">One per run; restored from the latest snapshot; deleted</text>
<text x="952" y="371" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">or paused while the run waits</text>
<rect x="20" y="560" width="1310" height="125" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="584" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#0f172a">DURABLE STATE</text>
<rect x="40" y="600" width="300" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="190.0" y="629.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Engine database</text>
<text x="190.0" y="652.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">event histories</text>
<rect x="362" y="600" width="300" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="512.0" y="629.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Session database</text>
<text x="512.0" y="652.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">context log, summaries, run metadata</text>
<rect x="684" y="600" width="300" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="834.0" y="629.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Object storage (S3)</text>
<text x="834.0" y="652.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">workspace snapshots, large payloads</text>
<rect x="1006" y="600" width="300" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="1156.0" y="629.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Side-effect ledger</text>
<text x="1156.0" y="652.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">idempotency keys and outcomes</text>
<path d="M 190 165 L 230 165" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)" marker-start="url(#a-flow-s)"/>
<path d="M 440 165 L 490 165" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="433.12" y="126" width="63.760000000000005" height="36" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="465" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">signals,</text>
<text x="465" y="155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">queries</text>
<path d="M 680 250 L 680 290" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)" marker-start="url(#a-flow-s)"/>
<rect x="689.6" y="261" width="110.80000000000001" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="745" y="275" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">tasks / results</text>
<path d="M 870 340 L 900 340 L 900 125 L 940 125" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<path d="M 870 380 L 910 380 L 910 240 L 940 240" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<path d="M 870 420 L 940 380" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<path d="M 490 230 L 465 230 L 465 560" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-muted)"/>
<path d="M 800 500 L 800 560" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-muted)"/>
<path d="M 1135 420 L 1135 560" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-muted)"/>
<path d="M 1300 290 L 1300 560" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-muted)"/></svg>

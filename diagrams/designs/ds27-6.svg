<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="580px" viewBox="0 0 1300 580" style="background:#ffffff"><title>Egress</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="580" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Outbound only to declared destinations, attributable to a tenant</text>
<rect x="30" y="60" width="420" height="330" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="44" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">TENANT NAMESPACE</text>
<rect x="60" y="110" width="160" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="72" y="132" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">pod</text>
<text x="72" y="154" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">no provider keys</text>
<rect x="60" y="230" width="160" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="72" y="252" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">pod</text>
<text x="72" y="274" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">pip install</text>
<rect x="520" y="80" width="300" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="532" y="102" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Egress gateway</text>
<text x="532" y="124" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">injects tenant's provider key · logs tenant,</text>
<text x="532" y="138" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">workload, tokens, cost · budget</text>
<rect x="900" y="70" width="370" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="912" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">model API (api.openai.com)</text>
<rect x="900" y="150" width="370" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="912" y="172" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">data vendor</text>
<rect x="900" y="240" width="370" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="912" y="262" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">pypi.org / files.pythonhosted.org</text>
<text x="912" y="284" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">allowed by FQDN policy</text>
<rect x="900" y="320" width="370" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="912" y="342" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">anything else</text>
<text x="912" y="364" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">denied</text>
<path d="M 220 145 L 520 140" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 820 110 L 900 100" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 820 170 L 900 180" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 220 265 L 900 270" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 220 280 L 900 350" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a-bad)"/>
<rect x="30" y="410" width="1240" height="70" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="442.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: pods called providers directly with keys in env vars; after a key leaked, nobody could say</text>
<text x="50" y="464" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">which tenants had called that provider, or from which workloads.</text>
<rect x="30" y="495" width="400" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="517" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">FQDN allow-lists</text>
<text x="42" y="539" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">from the tenant's egress list; DNS-aware</text>
<rect x="448" y="495" width="400" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="460" y="517" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Justification + expiry</text>
<text x="460" y="539" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">reminder, then removal</text>
<rect x="866" y="495" width="400" height="70" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="878" y="517" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Audit query</text>
<text x="878" y="539" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">who called which provider, how much</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>Failure taxonomy</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Failure modes from the data, not from hypotheses (v8, failed long tasks)</text>
<rect x="30" y="60" width="290" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Describe</text>
<text x="42" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">one sentence + spans per failure</text>
<rect x="345" y="60" width="290" height="90" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="357" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Cluster</text>
<text x="357" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">embed, group, agent names each</text>
<path d="M 320 105 L 345 105" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="660" y="60" width="290" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="672" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">Curate</text>
<text x="672" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">person merges, splits, renames</text>
<path d="M 635 105 L 660 105" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="975" y="60" width="290" height="90" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="987" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Count</text>
<text x="987" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">label all against the taxonomy</text>
<path d="M 950 105 L 975 105" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="175" width="1240" height="290" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="50" y="203" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Taxonomy v1, with counts</text>
<text x="50" y="230.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">stopped after a targeted test passed</text>
<rect x="390" y="214" width="620" height="26" rx="3" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="1018" y="232" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">31%</text>
<text x="50" y="270.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">lost the plan after context compaction</text>
<rect x="390" y="254" width="440" height="26" rx="3" fill="#d97706" fill-opacity="0.85" stroke="none"/>
<text x="838" y="272" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">22%</text>
<text x="50" y="310.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">treated a flaky test as its own bug</text>
<rect x="390" y="294" width="280" height="26" rx="3" fill="#7c3aed" fill-opacity="0.85" stroke="none"/>
<text x="678" y="312" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">14%</text>
<text x="50" y="350.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">gave up after a tool timeout</text>
<rect x="390" y="334" width="220" height="26" rx="3" fill="#2563eb" fill-opacity="0.85" stroke="none"/>
<text x="618" y="352" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">11%</text>
<text x="50" y="390.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">environment broken</text>
<rect x="390" y="374" width="160" height="26" rx="3" fill="#94a3b8" fill-opacity="0.85" stroke="none"/>
<text x="558" y="392" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">8%</text>
<text x="50" y="430.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">other</text>
<rect x="390" y="414" width="280" height="26" rx="3" fill="#cbd5e1" fill-opacity="0.85" stroke="none"/>
<text x="678" y="432" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">14%</text>
<text x="1250" y="210.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">neither researcher's list had #1</text>
<rect x="30" y="490" width="1240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="522.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: each researcher arrived with a hypothesis and found evidence for it; the most common</text>
<text x="50" y="548" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">failure wasn't on either list.</text></svg>

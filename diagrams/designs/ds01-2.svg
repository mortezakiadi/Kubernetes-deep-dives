<text x="1160" y="225" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2563eb">allowlisted</text>
<path d="M 1125 520 L 1198 520" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<path d="M 495 115 L 520 115 L 540 70 L 1160 70 L 1160 500 L 1125 500" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="717.4" y="50" width="245.20000000000002" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="840" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">tool calls with the user's identity</text></svg>

<rect x="504.04" y="448" width="83.92" height="36" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="546" y="462" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">bind a warm</text>
<text x="546" y="477" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">sandbox</text>
<path d="M 848 232 L 935 235" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<path d="M 848 372 L 935 255" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<path d="M 848 512 L 935 275" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>

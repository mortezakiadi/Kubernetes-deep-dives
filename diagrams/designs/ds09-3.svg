<text x="520" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">outlier-only suppression</text>
<rect x="830" y="90" width="440" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="842" y="113" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Helps</text>
<text x="842" y="136" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">throughput; more samples per GPU hour; reuse of expensive data;</text>
<text x="842" y="151" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">behavior the policy can't yet produce</text>
<rect x="830" y="225" width="440" height="110" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="842" y="248" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Hurts via bias</text>
<text x="842" y="271" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">uncorrected: optimizes the wrong policy's objective</text>
<rect x="830" y="350" width="440" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="842" y="373" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Hurts via variance</text>
<text x="842" y="396" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">corrected: a few huge weights dominate; ESS falls</text>
<text x="830" y="505" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569" font-style="italic">Shape after published async ablations; values illustrative.</text></svg>

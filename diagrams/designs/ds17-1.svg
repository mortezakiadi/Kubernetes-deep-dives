<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="560px" viewBox="0 0 1300 560" style="background:#ffffff"><title>GPU-hour breakdown</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="560" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Where 1,024 GPUs' hours went last month (illustrative)</text>
<rect x="40" y="80" width="708" height="60" fill="#059669" stroke="#fff" stroke-width="2"/>
<text x="48" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">58%</text>
<rect x="748" y="80" width="146" height="60" fill="#d97706" stroke="#fff" stroke-width="2"/>
<text x="755.5999999999999" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">12%</text>
<rect x="894" y="80" width="73" height="60" fill="#dc2626" stroke="#fff" stroke-width="2"/>
<text x="901.9999999999999" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">6%</text>
<rect x="967" y="80" width="110" height="60" fill="#7c3aed" stroke="#fff" stroke-width="2"/>
<text x="975.1999999999998" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">9%</text>
<rect x="1077" y="80" width="61" height="60" fill="#2563eb" stroke="#fff" stroke-width="2"/>
<text x="1084.9999999999998" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">5%</text>
<rect x="1138" y="80" width="37" height="60" fill="#db2777" stroke="#fff" stroke-width="2"/>
<rect x="1175" y="80" width="85" height="60" fill="#cbd5e1" stroke="#fff" stroke-width="2"/>
<text x="1182.5999999999997" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">7%</text>
<rect x="40" y="180" width="400" height="110" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="52" y="203" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">allocated idle 12%</text>
<text x="52" y="226" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">idle culling, right-size, GPU slices</text>
<rect x="455" y="180" width="400" height="110" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="467" y="203" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">waiting for gang 6%</text>
<text x="467" y="226" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">all-or-nothing admission</text>
<rect x="870" y="180" width="400" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="882" y="203" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">fragmented 9%</text>
<text x="882" y="226" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">bin-packing, pools by shape, compaction</text>
<rect x="40" y="310" width="400" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="52" y="333" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">blocked by quota 5%</text>
<text x="52" y="356" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">borrowing + lending limits</text>
<rect x="455" y="310" width="400" height="110" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="467" y="333" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">lost to preemption 3%</text>
<text x="467" y="356" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">checkpoint-aware preemption</text>
<rect x="870" y="310" width="400" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="882" y="333" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">busy 58% → target 80%+</text>
<text x="882" y="356" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">each category has a different fix</text>
<text x="40" y="470" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">Legend: green busy · amber allocated idle · red waiting for gang · purple fragmented · blue blocked by quota · pink preempted · grey free</text>
<text x="40" y="500" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Busy = allocated AND active (DCGM), not just allocated.</text></svg>

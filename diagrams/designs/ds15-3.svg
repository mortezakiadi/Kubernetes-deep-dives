<text x="312" y="253" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Scheduler</text>
<text x="312" y="276" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">40 suites × shards; priority by</text>
<text x="312" y="291" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">purpose</text>

elvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Evaluate a release candidate in hours, not days</text>
<rect x="30" y="230" width="220" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="253" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Trigger</text>
<text x="42" y="276" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">checkpoint registered or RC</text>
<text x="42" y="291" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">tagged</text>

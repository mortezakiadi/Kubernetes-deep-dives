<text x="50" y="556" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">2 million generations: 3 days one-suite-at-a-time → ~4 hours sharded on borrowed GPUs; re-scoring hits the cache, not the GPUs.</text></svg>

<text x="862" y="223" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">vLLM servers</text>
<text x="862" y="246" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">for this checkpoint, sized to</text>
<text x="862" y="261" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the work; shards share them</text>
<rect x="1110" y="80" width="210" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="1122" y="102.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Generation cache</text>

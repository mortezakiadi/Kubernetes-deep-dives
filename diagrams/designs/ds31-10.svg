<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="620px" viewBox="0 0 1300 620" style="background:#ffffff"><title>Operations</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="620" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">From findings to fixes, and checking the system itself</text>
<rect x="30" y="60" width="290" height="90" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="82.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Release candidate</text>
<text x="42" y="105.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">full behavior catalog vs production</text>
<rect x="345" y="60" width="290" height="90" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="357" y="82.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Shift &gt; threshold</text>
<text x="357" y="105.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">auto report, levels 1–3</text>
<path d="M 320 105 L 345 105" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="660" y="60" width="290" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="672" y="82.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Experiments</text>
<text x="672" y="105.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">top suspects confirmed</text>
<path d="M 635 105 L 660 105" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="975" y="60" width="290" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="987" y="82.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Fix the mechanism</text>
<text x="987" y="105.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">+ lint for the flaw</text>
<path d="M 950 105 L 975 105" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="180" width="600" height="230" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="50" y="208" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Clarifying questions on ambiguous production requests</text>
<text x="50" y="252.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">v6</text>
<rect x="200" y="234" width="372" height="30" rx="4" fill="#64748b" fill-opacity="0.85" stroke="none"/>
<text x="580" y="255.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">31%</text>
<text x="50" y="304.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">v7</text>
<rect x="200" y="286" width="144" height="30" rx="4" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="352" y="307.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">12%</text>
<text x="50" y="356.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">v7.1 (fixed envs)</text>
<rect x="200" y="338" width="348" height="30" rx="4" fill="#059669" fill-opacity="0.85" stroke="none"/>
<text x="556" y="359.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">29%</text>
<text x="50" y="396.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#047857">same task success rate · simulated users added to long-horizon environments</text>
<rect x="670" y="180" width="600" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="682" y="202.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Accuracy of cheap evidence</text>
<text x="682" y="225.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">top-ranked suspect confirmed in 7 of 10 investigations</text>
<rect x="670" y="265" width="600" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="682" y="287.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Mechanism lint</text>
<text x="682" y="310.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">unanswerable user actions: caught 3 more environments</text>
<rect x="670" y="350" width="600" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="682" y="372.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Intended shifts recorded</text>
<text x="682" y="395.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">so reviewers don't reopen them</text>
<rect x="30" y="430" width="1240" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="42" y="453" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">SLOs</text>
<text x="42" y="476" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">suspects &lt; 48 h · confirmed cause &lt; 7 days · compute &lt; 5% of run · probe–production r &gt; 0.8</text>
<rect x="30" y="520" width="1240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="552.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: v7's environment was fixed, but v9 dropped again from another long-horizon environment</text>
<text x="50" y="578" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">with the same flaw: no user to answer.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="580px" viewBox="0 0 1300 580" style="background:#ffffff"><title>RayJob</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="580" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">One RayJob per run: its own RayCluster, admitted by Kueue, deleted at the end</text>
<rect x="30" y="70" width="260" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="92.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">RayJob</text>
<text x="42" y="115.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">entrypoint · rayClusterSpec ·</text>
<text x="42" y="129.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">shutdownAfterJobFinishes: true</text>
<rect x="340" y="70" width="220" height="110" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="352" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Kueue</text>
<text x="352" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">all worker groups admitted</text>
<text x="352" y="131" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">together</text>
<path d="M 290 125 L 340 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="610" y="60" width="660" height="330" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="624" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">RAYCLUSTER (LIVES AS LONG AS THE JOB)</text>
<rect x="630" y="100" width="200" height="80" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="642" y="122.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Head</text>
<text x="642" y="145.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">driver: TorchTrainer</text>
<rect x="630" y="200" width="300" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="642" y="222.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">trainer group · 32 GPUs</text>
<text x="642" y="245.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Ray Train workers: FSDP2 / Megatron</text>
<rect x="950" y="200" width="300" height="80" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="962" y="222.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">rollout group · 64 GPUs</text>
<text x="962" y="245.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">inference actors generating data</text>
<rect x="630" y="300" width="300" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="642" y="322.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">data group · CPU</text>
<text x="642" y="345.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">preprocessing, rewards</text>
<rect x="950" y="300" width="300" height="70" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="962" y="322.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">local NVMe</text>
<text x="962" y="345.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">DCP shards written here first</text>
<path d="M 560 125 L 630 140" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 930 250 L 950 250" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-muted)"/>
<rect x="30" y="230" width="520" height="140" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="252.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">ray.train.report(metrics, checkpoint)</text>
<text x="42" y="275.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">the loop writes a sharded DCP directory; Ray uploads it to storage_path</text>
<text x="42" y="289.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">(s3://ckpt-rl/ray) and keeps the last 3; get_checkpoint() returns it on resume</text>
<path d="M 1100 370 L 1100 420 L 290 420 L 290 370" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="674.84" y="398" width="50.32000000000001" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="700" y="412" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">upload</text>
<rect x="30" y="460" width="1240" height="90" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="492.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: one long-lived shared RayCluster per team: GPU use invisible to Kueue,</text>
<text x="50" y="518" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">and a crashed driver left GPUs reserved for days.</text></svg>

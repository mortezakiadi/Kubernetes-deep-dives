<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>Failures and recovery</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Make failures cheap: small blast radius, fast save, fast restart</text>
<rect x="30" y="60" width="560" height="300" rx="14" fill="#eff6ff" fill-opacity=".55" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="44" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#1e40af">TRAINER (JOBSET, RESERVED CAPACITY)</text>
<rect x="60" y="100" width="500" height="80" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="72" y="123" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">128 nodes × 8 GPUs</text>
<text x="72" y="146" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a node failure restarts the trainer group from the latest checkpoint</text>
<rect x="60" y="200" width="240" height="130" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="72" y="222.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Checkpoint</text>
<text x="72" y="245.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">async, sharded → local NVMe in</text>
<text x="72" y="259.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">seconds → object storage in</text>
<text x="72" y="274.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">background</text>
<rect x="320" y="200" width="240" height="130" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="332" y="222.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Saved with it</text>
<text x="332" y="245.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">rollout buffer, data cursor, RNG,</text>
<text x="332" y="259.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">health signals</text>
<rect x="630" y="60" width="640" height="300" rx="14" fill="#fffbeb" fill-opacity=".55" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="644" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#92400e">ROLLOUT ENGINES (LEADERWORKERSET)</text>
<rect x="660" y="100" width="130" height="80" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text x="725" y="136.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">engine</text>
<text x="725" y="156.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#334155">running</text>
<rect x="810" y="100" width="130" height="80" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text x="875" y="136.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">engine</text>
<text x="875" y="156.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#334155">running</text>
<rect x="960" y="100" width="130" height="80" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text x="1025" y="136.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">engine</text>
<text x="1025" y="156.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#334155">running</text>
<rect x="1110" y="100" width="130" height="80" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text x="1175" y="136.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">engine</text>
<text x="1175" y="156.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#334155">running</text>
<rect x="660" y="210" width="130" height="80" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text x="725" y="246.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">engine</text>
<text x="725" y="266.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#334155">running</text>
<rect x="810" y="210" width="130" height="80" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="875" y="246.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">failed</text>
<text x="875" y="266.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#334155">replaced</text>
<rect x="960" y="210" width="130" height="80" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text x="1025" y="246.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">engine</text>
<text x="1025" y="266.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#334155">running</text>
<rect x="1110" y="210" width="130" height="80" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text x="1175" y="246.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">engine</text>
<text x="1175" y="266.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#334155">running</text>
<text x="660" y="340.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">Rollouts are stateless and retryable: lose an engine, not the step.</text>
<rect x="30" y="400" width="296" height="110" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="423" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Health-check nodes</text>
<text x="42" y="446" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">GPU, NVLink, network tests before joining;</text>
<text x="42" y="461" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">drain repeat offenders</text>
<rect x="342" y="400" width="296" height="110" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="354" y="423" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Hot spares</text>
<text x="354" y="446" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reserved by the queue; images pre-pulled</text>
<rect x="654" y="400" width="296" height="110" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="666" y="423" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Parallel load</text>
<text x="666" y="446" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">checkpoint from nearest copy; engines</text>
<text x="666" y="461" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">warm-started</text>
<rect x="966" y="400" width="296" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="978" y="423" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Goodput</text>
<text x="978" y="446" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">productive GPU-hours ÷ reserved GPU-hours</text>
<text x="650" y="560.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Target: restart in minutes, rehearsed at rung 4 by killing a trainer node and an engine on purpose.</text></svg>

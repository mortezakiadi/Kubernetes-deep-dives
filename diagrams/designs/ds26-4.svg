<text x="42" y="527.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Prefer the base: flavor order or scheduling preference puts work on committed / on-prem capacity before on-demand</text></svg>

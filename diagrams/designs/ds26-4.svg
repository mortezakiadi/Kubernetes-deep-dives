<text x="50" y="440.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: on-demand pools sized by hand for the busiest week; on an average day 30% of nodes ran only DaemonSets,</text>
<text x="50" y="466" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">and nodes with one small pod each couldn't be removed.</text>

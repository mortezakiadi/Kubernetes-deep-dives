<text x="102" y="378.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#991b1b">Tamper resistance</text>
<text x="102" y="402.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">fresh sandbox, no network, tests unreadable, framework patching blocked</text>

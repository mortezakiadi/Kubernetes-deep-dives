<text x="824" y="327.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">reference + skip empty input</text>
<text x="1238" y="327.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">caught</text>
<rect x="810" y="350" width="440" height="36" rx="6" fill="#d1fae5"/>
<text x="824" y="373.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">reference + return input unchanged</text>
<text x="1238" y="373.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">caught</text>
<text x="810" y="425.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">score 5/6 = 0.83 &lt; 0.85 → strengthen tests or drop the task</text>
<rect x="30" y="470" width="1240" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="42" y="493" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Exploit seen: print expected output, then exit early → fixed by exit-code + complete-output checks and hidden tests</text></svg>

<text x="824" y="189.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">reference + &lt; instead of &lt;=</text>
<text x="1238" y="189.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">caught</text>
<rect x="810" y="212" width="440" height="36" rx="6" fill="#d1fae5"/>
<text x="824" y="235.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">reference + drop last element</text>
<text x="1238" y="235.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">caught</text>
<rect x="810" y="258" width="440" height="36" rx="6" fill="#fee2e2"/>
<text x="824" y="281.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">reference + swap merge order</text>
<text x="1238" y="281.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">survived</text>

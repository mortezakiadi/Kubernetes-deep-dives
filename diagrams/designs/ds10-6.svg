ly="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Code verification that's hard to fool</text>
<rect x="30" y="70" width="700" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="93.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1e40af">Hidden tests</text>
<text x="42" y="117.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">visible examples in the prompt; separate hidden tests decide the reward</text>
<rect x="50" y="165" width="660" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="62" y="188.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#065f46">Stronger tests</text>
<text x="62" y="212.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">edge cases, property-based tests vs a reference; mutation score ≥ 0.85</text>
<rect x="70" y="260" width="620" height="80" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="82" y="283.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Run correctly</text>
<text x="82" y="307.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">exit code, separate process per test, timeouts, complete output</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1320px" height="584px" viewBox="0 0 1320 584" style="background:#ffffff"><title>Workload families and their demands</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1320" height="584" fill="#ffffff"/><text x="660.0" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">What each workload family demands from the platform</text>
<rect x="180" y="60" width="222" height="46" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="188" y="88.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Research and dev</text>
<rect x="402" y="60" width="222" height="46" fill="#fffbeb" stroke="#cbd5e1"/>
<text x="410" y="88.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Pre-training</text>
<rect x="624" y="60" width="222" height="46" fill="#fffbeb" stroke="#cbd5e1"/>
<text x="632" y="88.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Fine-tuning</text>
<rect x="846" y="60" width="222" height="46" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="854" y="88.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Online inference</text>
<rect x="1068" y="60" width="222" height="46" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="1076" y="88.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Batch inference, eval</text>
<rect x="30" y="106" width="150" height="62" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="38" y="142.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Shape</text>
<rect x="180" y="106" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="188" y="141.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Interactive, bursty</text>
<rect x="402" y="106" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="410" y="141.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Batch, all-or-nothing</text>
<rect x="624" y="106" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="632" y="141.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Batch, all-or-nothing</text>
<rect x="846" y="106" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="854" y="141.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Long-running service</text>
<rect x="1068" y="106" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="1076" y="141.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Batch, embarrassingly parallel</text>
<rect x="30" y="168" width="150" height="62" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="38" y="204.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">GPUs</text>
<rect x="180" y="168" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="188" y="203.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">A slice to 1 GPU</text>
<rect x="402" y="168" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="410" y="203.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Tens to thousands</text>
<rect x="624" y="168" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="632" y="203.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">1 to a few nodes</text>
<rect x="846" y="168" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="854" y="196.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">1 GPU to several nodes per</text>
<text x="854" y="211.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">replica</text>
<rect x="1068" y="168" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="1076" y="203.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Many small jobs</text>
<rect x="30" y="230" width="150" height="62" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="38" y="266.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Duration</text>
<rect x="180" y="230" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="188" y="265.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Minutes to hours, mostly idle</text>
<rect x="402" y="230" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="410" y="265.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Days to weeks</text>
<rect x="624" y="230" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="632" y="265.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Hours</text>
<rect x="846" y="230" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="854" y="265.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Always on, follows traffic</text>
<rect x="1068" y="230" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="1076" y="265.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Minutes to hours</text>
<rect x="30" y="292" width="150" height="62" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="38" y="328.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Bottleneck</text>
<rect x="180" y="292" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="188" y="327.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">The person waiting</text>
<rect x="402" y="292" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="410" y="327.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">GPU network, data, checkpoints</text>
<rect x="624" y="292" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="632" y="327.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Queue wait, startup</text>
<rect x="846" y="292" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="854" y="320.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">KV-cache memory, routing, cold</text>
<text x="854" y="335.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">start</text>
<rect x="1068" y="292" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="1076" y="327.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Throughput per dollar</text>
<rect x="30" y="354" width="150" height="62" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="38" y="390.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">How it fails</text>
<rect x="180" y="354" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="188" y="389.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Lost notebook state</text>
<rect x="402" y="354" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="410" y="389.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">One rank fails, all stop</text>
<rect x="624" y="354" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="632" y="389.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Same, but cheaper to rerun</text>
<rect x="846" y="354" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="854" y="389.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Latency spikes, dropped requests</text>
<rect x="1068" y="354" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="1076" y="389.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Retry the shard</text>
<rect x="30" y="416" width="150" height="62" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="38" y="452.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Scheduling need</text>
<rect x="180" y="416" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="188" y="451.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Fast start, limits, idle culling</text>
<rect x="402" y="416" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="410" y="451.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Gang admission, topology</text>
<rect x="624" y="416" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="632" y="451.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Gang admission, high throughput</text>
<rect x="846" y="416" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="854" y="451.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Spread, priority, fast scale-out</text>
<rect x="1068" y="416" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="1076" y="451.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Borrow idle GPUs, preemptible</text>
<rect x="30" y="478" width="150" height="62" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="38" y="514.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Capacity</text>
<rect x="180" y="478" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="188" y="513.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Small GPUs, MIG</text>
<rect x="402" y="478" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="410" y="513.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Reserved (Capacity Blocks)</text>
<rect x="624" y="478" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="632" y="513.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Reserved, then on-demand</text>
<rect x="846" y="478" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="854" y="513.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Reserved floor + on-demand</text>
<rect x="1068" y="478" width="222" height="62" fill="#ffffff" stroke="#cbd5e1"/>
<text x="1076" y="513.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Spot and borrowed</text></svg>

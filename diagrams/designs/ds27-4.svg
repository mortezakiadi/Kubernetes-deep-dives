<text x="316" y="171" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">pod</text>
<text x="316" y="192" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">restricted</text>
<rect x="460" y="100" width="360" height="200" rx="14" fill="#eff6ff" fill-opacity=".55" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="474" y="124" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#1e40af">TENANT B</text>

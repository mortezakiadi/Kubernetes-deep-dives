<text x="204" y="171" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">pod</text>
<text x="204" y="192" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">restricted</text>

<text x="492" y="171" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">pod</text>
<text x="492" y="192" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">restricted</text>
<rect x="592" y="150" width="100" height="60" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="604" y="171" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">pod</text>
<text x="604" y="192" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">restricted</text>
<rect x="704" y="150" width="100" height="60" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="716" y="171" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">pod</text>
<text x="716" y="192" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">restricted</text>
<line x1="420" y1="200" x2="460" y2="200" stroke="#dc2626" stroke-width="4"/>
<text x="440" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#b91c1c">✗</text>
<text x="440" y="240.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c">default deny</text>
<rect x="60" y="320" width="760" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="72" y="342.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">hostNetwork / privileged / hostPath → rejected at admission</text>
<text x="72" y="365.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Pod Security restricted + CEL policies (images, labels, volumes, GPU via queues)</text>
<rect x="880" y="60" width="390" height="64" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="892" y="81.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">Network</text>
<text x="892" y="103.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">default deny; allow own namespaces, gateways, DNS, platform</text>
<rect x="880" y="134" width="390" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="892" y="155.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e40af">Pod Security</text>
<text x="892" y="177.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">restricted standard enforced</text>
<rect x="880" y="208" width="390" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="892" y="229.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">Admission (CEL)</text>
<text x="892" y="251.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">approved registries, labels, no hostPath</text>
<rect x="880" y="282" width="390" height="64" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="892" y="303.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Nodes</text>
<text x="892" y="325.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">tainted pools (tier 2), sandboxes (tier 3)</text>
<rect x="880" y="356" width="390" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="892" y="377.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">Shared services</text>
<text x="892" y="399.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">check tenant identity per request</text>
<rect x="30" y="440" width="1240" height="110" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="472.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: a hostNetwork + privileged pod “to debug networking” could see every tenant's traffic on its node.</text>
<text x="50" y="500" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">Now: policies roll out in Audit mode first; a weekly job tries forbidden actions from a test tenant</text>
<text x="50" y="522" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">and alerts if any succeed.</text></svg>

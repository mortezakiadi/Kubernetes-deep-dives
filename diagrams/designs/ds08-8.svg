<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="520px" viewBox="0 0 1300 520" style="background:#ffffff"><title>Context compaction</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="520" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Train on the context the model actually saw</text>
<text x="30" y="92.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Full history</text>
<rect x="200" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="240" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="280" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="320" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="360" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="400" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="440" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="480" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="520" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="560" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="600" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="640" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="680" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="720" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="760" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="800" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="840" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="880" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="920" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="960" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="1000" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="1040" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="1080" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="1120" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="1160" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="1200" y="72" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="1240" y="72" width="30" height="30" fill="#fee2e2" stroke="#dc2626"/>
<text x="1255" y="92" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">✗</text>
<text x="200" y="125" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">exceeds the window; computing logprobs on this trains on a context the model never had</text>
<text x="30" y="192.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">What turn 26 saw</text>
<rect x="200" y="172" width="200" height="30" rx="4" fill="#d97706"/>
<text x="300" y="192.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">summary of turns 1–15</text>
<rect x="404" y="172" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="444" y="172" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="484" y="172" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="524" y="172" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="564" y="172" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="604" y="172" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="644" y="172" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="684" y="172" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="724" y="172" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="764" y="172" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="804" y="172" width="37" height="30" rx="3" fill="#bfdbfe"/>
<rect x="844" y="172" width="120" height="30" rx="4" fill="#059669"/>
<text x="904" y="192.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">memory file</text>
<text x="200" y="225" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#047857">stored per turn (or rebuilt deterministically): this is what the trainer scores</text>
<rect x="30" y="270" width="610" height="100" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="293.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Compaction strategies</text>
<text x="42" y="317.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">truncate old tool output, summarize earlier turns, external memory file</text>
<rect x="660" y="270" width="610" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="672" y="293.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#92400e">The summary is an action</text>
<text x="672" y="317.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">if the model writes it, it gets credit; a summary that drops the key fact is blamed</text>
<rect x="30" y="385" width="610" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="408.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1e40af">Measure information loss</text>
<text x="42" y="432.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">quiz the model on earlier turns from its compacted context</text>
<rect x="660" y="385" width="610" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="672" y="408.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#065f46">Deterministic compaction</text>
<text x="672" y="432.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">fixed thresholds and recorded summaries so replays and branches match</text></svg>

<rect x="660" y="70" width="610" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="672" y="92.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Findings flow out</text>
<text x="672" y="115.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">behavior catalog (Design 31) · eval tasks (Design 32) · reward exploits (Design 29)</text>
<rect x="660" y="200" width="610" height="110" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="672" y="222" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">SLOs</text>
<text x="672" y="244" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">10k transcripts &lt; 6 h · audited precision &gt; 90% · sample, interval, reader version on every report</text>
<rect x="660" y="330" width="610" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="672" y="352" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">v8 outcome</text>
<text x="672" y="374" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">5 h compute + 3 h human review · top finding → eval slice + fixes in 2 environments</text>
<rect x="30" y="465" width="1240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="497.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: a reader prompt change improved readability and cut recall on “gave up after a timeout”</text>
<text x="50" y="523" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">from 84% to 61%; a later investigation undercounted it.</text>
<rect x="30" y="565" width="1240" height="40" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="587" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Keep people reading a few raw transcripts every week, without annotations</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1340px" height="580px" viewBox="0 0 1340 580" style="background:#ffffff"><title>Slurm operator</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1340" height="580" fill="#ffffff"/><text x="670" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Slurm execution operator: the same job, as sbatch through slurmrestd</text>
<rect x="30" y="90" width="220" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="113" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">ResearchJob</text>
<text x="42" y="136" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">64 GPUs, image, data, ckpt</text>
<rect x="300" y="80" width="300" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="312" y="102.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Render batch script</text>
<text x="312" y="125.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">#SBATCH nodes, gpus, time, partition, account</text>
<text x="312" y="139.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">· srun --container-image (Pyxis + Enroot)</text>
<rect x="650" y="80" width="280" height="130" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="662" y="102.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">slurmrestd</text>
<text x="662" y="125.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">POST job/submit with a short-lived token</text>
<text x="662" y="139.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">for the mapped account</text>
<path d="M 250 145 L 300 145" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 600 145 L 650 145" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="990" y="60" width="320" height="330" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="1004" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#0f172a">SLURM SITES</text>
<rect x="1010" y="100" width="280" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="1022" y="123" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Bare-metal Slurm</text>
<text x="1022" y="146" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">on-premises campus cluster</text>
<rect x="1010" y="240" width="280" height="130" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="1022" y="262.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Slurm on Kubernetes</text>
<text x="1022" y="285.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Slinky (SchedMD) or Soperator (Nebius,</text>
<text x="1022" y="299.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">shared root filesystem)</text>
<path d="M 930 145 L 1010 160" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 930 160 L 1010 300" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="250" width="900" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="50" y="278.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">State mapping</text>
<rect x="50" y="296" width="164" height="34" rx="5" fill="#fef3c7" stroke="#d97706"/>
<text x="132" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#92400e">PENDING</text>
<rect x="50" y="340" width="164" height="34" rx="5" fill="#dbeafe" stroke="#2563eb"/>
<text x="132" y="362" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">queued</text>
<rect x="226" y="296" width="164" height="34" rx="5" fill="#fef3c7" stroke="#d97706"/>
<text x="308" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#92400e">RUNNING</text>
<rect x="226" y="340" width="164" height="34" rx="5" fill="#dbeafe" stroke="#2563eb"/>
<text x="308" y="362" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">running</text>
<rect x="402" y="296" width="164" height="34" rx="5" fill="#fef3c7" stroke="#d97706"/>
<text x="484" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#92400e">COMPLETED</text>
<rect x="402" y="340" width="164" height="34" rx="5" fill="#dbeafe" stroke="#2563eb"/>
<text x="484" y="362" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">succeeded</text>
<rect x="578" y="296" width="164" height="34" rx="5" fill="#fef3c7" stroke="#d97706"/>
<text x="660" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#92400e">FAILED / TIMEOUT</text>
<rect x="578" y="340" width="164" height="34" rx="5" fill="#dbeafe" stroke="#2563eb"/>
<text x="660" y="362" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">failed</text>
<rect x="754" y="296" width="164" height="34" rx="5" fill="#fef3c7" stroke="#d97706"/>
<text x="836" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#92400e">NODE_FAIL / PREEMPTED</text>
<rect x="754" y="340" width="164" height="34" rx="5" fill="#dbeafe" stroke="#2563eb"/>
<text x="836" y="362" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">resume (maybe elsewhere)</text>
<rect x="30" y="420" width="620" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="443" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Same semantics</text>
<text x="42" y="466" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">same mounts, environment and checkpoint location as on Kubernetes sites; teams map to Slurm</text>
<text x="42" y="481" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">accounts with fair-share</text>
<rect x="690" y="420" width="620" height="120" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="702" y="443" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Hosting doesn't matter</text>
<text x="702" y="466" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the operator talks to slurmrestd whether Slurm runs on bare metal or inside Kubernetes;</text>
<text x="702" y="481" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">experts can still log in</text></svg>

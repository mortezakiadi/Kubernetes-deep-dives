<text x="42" y="423.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#065f46">Gate training on precision</text>
<text x="42" y="447.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">A slice is used for training only above its precision threshold on fresh policy outputs; below it, the slice abstains or goes to review. Report intervals: a few hundred labels give</text>

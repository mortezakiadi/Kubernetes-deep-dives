<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="580px" viewBox="0 0 1300 580" style="background:#ffffff"><title>Dev and batch</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="580" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Dev pools to zero, batch provisioned for the whole gang</text>
<rect x="30" y="60" width="620" height="290" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="50" y="88" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Development GPU nodes (illustrative)</text>
<text x="50" y="126.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">14 team pools, always on</text>
<rect x="50" y="134" width="504" height="34" rx="4" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="562.0" y="156" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">56</text>
<text x="50" y="188.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569">11% activity</text>
<text x="50" y="216.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">one shared pool, scale to zero</text>
<rect x="50" y="224" width="117" height="34" rx="4" fill="#059669" fill-opacity="0.85" stroke="none"/>
<text x="175.0" y="246" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">13</text>
<text x="50" y="278.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569">avg nodes; 1 warm per type 08–20</text>
<text x="50" y="330" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">published start time from zero: 3–5 min · notebook state saved on idle stop</text>
<rect x="680" y="60" width="590" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="692" y="82.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Without provisioning checks</text>
<text x="692" y="105.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">partial gang holds on-demand nodes while the rest waits</text>
<rect x="680" y="170" width="140" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="692" y="191" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Workload</text>
<text x="692" y="212" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">64 GPUs</text>
<path d="M 820 215 L 830 215" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="830" y="170" width="140" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="842" y="191" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">ProvisioningRequest</text>
<text x="842" y="212" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">all-or-nothing</text>
<text x="842" y="225" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">capacity</text>
<path d="M 970 215 L 980 215" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="980" y="170" width="140" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="992" y="191" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Nodes ready</text>
<text x="992" y="212" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">for the whole gang</text>
<path d="M 1120 215 L 1130 215" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="1130" y="170" width="140" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="1142" y="191" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Admitted</text>
<text x="1142" y="212" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#334155">starts at once</text>
<text x="975" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#047857">Kueue admission check · check-capacity class</text>
<rect x="30" y="380" width="400" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="402.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Cash, visible next invoice</text>
<text x="42" y="425.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">always-on dev nodes are the easiest savings to book</text>
<rect x="448" y="380" width="400" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="460" y="402.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Idle stop</text>
<text x="460" y="425.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">checkpoint + stop after the idle policy (Design 19)</text>
<rect x="866" y="380" width="400" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="878" y="402.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">One pool, fair share</text>
<text x="878" y="425.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">replaces 14 per-team pools</text>
<rect x="30" y="500" width="1240" height="56" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="533" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Before: 56 always-on dev nodes at 11% activity, so that notebooks started instantly.</text></svg>

ily="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Gradient influence: did an environment's updates point against the probe?</text>
<rect x="30" y="60" width="560" height="330" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<defs><marker id="ah31" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>

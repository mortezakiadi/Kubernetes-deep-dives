<text x="312" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">dev, staging</text>
<path d="M 405 150 L 520 250" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="560" y="70" width="210" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="572" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">sandbox VPCs</text>
<text x="572" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">agent sandboxes</text>
<path d="M 665 150 L 660 250" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="820" y="70" width="210" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>

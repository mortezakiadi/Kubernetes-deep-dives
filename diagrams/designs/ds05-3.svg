<text x="832" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">registry, DNS, CI</text>
<path d="M 925 150 L 800 250" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="1080" y="70" width="210" height="80" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="1092" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">inspection VPC</text>
<text x="1092" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Network Firewall</text>
<path d="M 1185 150 L 920 280" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="40" y="540" width="330" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="52" y="563" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Google Cloud (TPU training)</text>
<text x="52" y="586" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">AWS Interconnect - multicloud: private, managed</text>
<text x="52" y="601" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">L3 link; attached to segment hybrid</text>
<rect x="950" y="540" width="330" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="962" y="563" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">On-premises GPU racks</text>
<text x="962" y="586" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Direct Connect (two locations); EKS hybrid</text>
<text x="962" y="601" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">nodes; pod ranges over BGP</text>
<path d="M 370 595 L 480 450" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)" marker-start="url(#a-blue-s)"/>
<path d="M 950 595 L 840 450" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)" marker-start="url(#a-blue-s)"/>
<text x="660" y="520.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">prod ↔ shared and nonprod ↔ shared allowed;  prod ↔ nonprod denied;  sandbox reaches only its egress path</text>
<text x="660" y="680.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#475569" font-style="italic">Keep a direct VPC peering only for very high-volume pairs (a training cluster and its data lake).</text></svg>

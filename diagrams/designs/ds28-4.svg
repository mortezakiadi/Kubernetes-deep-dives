<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="560px" viewBox="0 0 1300 560" style="background:#ffffff"><title>Pipeline DAG</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="560" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">The pipeline as a DAG of idempotent, cached steps</text>
<rect x="30" y="80" width="160" height="70" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="103" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Source</text>
<path d="M 190 115 L 208 115" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="208" y="80" width="160" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="220" y="103" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Build</text>
<path d="M 368 115 L 386 115" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="386" y="80" width="160" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="398" y="103" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Validate</text>
<path d="M 546 115 L 564 115" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="564" y="80" width="160" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="576" y="103" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Calibrate</text>
<path d="M 724 115 L 742 115" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="742" y="80" width="160" height="70" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="754" y="103" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Filter</text>
<path d="M 902 115 L 920 115" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="920" y="80" width="160" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="932" y="103" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Accept</text>
<path d="M 1080 115 L 1098 115" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="1098" y="80" width="160" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="1110" y="103" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Publish</text>
<rect x="30" y="180" width="760" height="200" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="50" y="208" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Build stage rerun after a crash at candidate 11,000 of 20,000</text>
<text x="50" y="242.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">before: scripts</text>
<rect x="50" y="250" width="640" height="28" rx="4" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="696.0" y="270.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">20,000 builds</text>
<text x="50" y="312.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">after: memoized by hash + version</text>
<rect x="50" y="320" width="288" height="28" rx="4" fill="#059669" fill-opacity="0.85" stroke="none"/>
<text x="344.0" y="340.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">9,000 builds</text>
<text x="50" y="370" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">memo key: build-v14-&lt;candidate&gt;; a code change bumps v14 → v15</text>
<rect x="820" y="180" width="450" height="62" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="832" y="202" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Retries by error class</text>
<text x="832" y="224" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">infrastructure errors retry; task failures are results</text>
<rect x="820" y="250" width="450" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="832" y="272" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Quotas via Kueue</text>
<text x="832" y="294" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">pipeline can't starve training</text>
<rect x="820" y="320" width="450" height="62" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="832" y="342" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">Results as rows</text>
<text x="832" y="364" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">task, step, version, verdict, cost → warehouse</text>
<rect x="30" y="410" width="1240" height="70" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="432.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Batches of a few hundred candidates per workflow</text>
<text x="42" y="455.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">keeps the workflow controller responsive at tens of thousands of tasks</text></svg>

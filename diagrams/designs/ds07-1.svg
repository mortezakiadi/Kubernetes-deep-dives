<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="620px" viewBox="0 0 1300 620" style="background:#ffffff"><title>Scaling axes and bottlenecks</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="620" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Each scaling axis exposes a different bottleneck first</text>
<rect x="30" y="70" width="360" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="94" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">More tokens per step</text>
<text x="42" y="118" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">bigger batches, larger groups</text>
<rect x="560" y="70" width="520" height="84" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="572" y="93.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#92400e">Rollout + reward throughput</text>
<text x="572" y="117.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">trainer waits on generation and verifiers</text>
<path d="M 390 112 L 560 112" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="446.48" y="90" width="57.040000000000006" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="475" y="104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">exposes</text>
<text x="1110" y="118" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">rung 1+</text>
<rect x="30" y="174" width="360" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="198" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Longer trajectories</text>
<text x="42" y="222" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">16K → 64K+, multi-turn</text>
<rect x="560" y="174" width="520" height="84" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="572" y="197.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#991b1b">Long tail, KV cache, context parallel</text>
<text x="572" y="221.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">slowest answers decide the step</text>
<path d="M 390 216 L 560 216" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="446.48" y="194" width="57.040000000000006" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="475" y="208" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">exposes</text>
<text x="1110" y="222" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">rung 2</text>
<rect x="30" y="278" width="360" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="302" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Larger models</text>
<text x="42" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">dense 8B → large MoE</text>
<rect x="560" y="278" width="520" height="84" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="572" y="301.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#991b1b">Parallel layouts, weight sync, MoE mismatch</text>
<text x="572" y="325.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">hundreds of GB per step; routing differs</text>
<path d="M 390 320 L 560 320" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="446.48" y="298" width="57.040000000000006" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="475" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">exposes</text>
<text x="1110" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">rung 3</text>
<rect x="30" y="382" width="360" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="406" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">More steps</text>
<text x="42" y="430" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">hundreds → thousands</text>
<rect x="560" y="382" width="520" height="84" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="572" y="405.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#92400e">Drift, prompt exhaustion, failures</text>
<text x="572" y="429.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">slow trends and certain hardware faults</text>
<path d="M 390 424 L 560 424" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="446.48" y="402" width="57.040000000000006" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="475" y="416" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">exposes</text>
<text x="1110" y="430" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">rung 4</text>
<rect x="30" y="486" width="360" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="510" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Larger budgets</text>
<text x="42" y="534" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">1K → 100K+ GPU hours</text>
<rect x="560" y="486" width="520" height="84" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="572" y="509.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#92400e">Cost of a wrong recipe; run operations</text>
<text x="572" y="533.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">prediction and goodput matter most</text>
<path d="M 390 528 L 560 528" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="446.48" y="506" width="57.040000000000006" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="475" y="520" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">exposes</text>
<text x="1110" y="534" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">all</text>
<text x="1110" y="62" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">found at</text>
<text x="650" y="604.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Scale one axis per rung: otherwise you can't tell which change caused which problem.</text></svg>

<text x="782" y="243" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Per-property heads</text>
<text x="782" y="266" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">correct · safe · style</text>
<path d="M 700 210 L 770 135" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 700 250 L 770 275" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="1060" y="140" width="210" height="140" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="1072" y="163" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">rm-v7</text>
<text x="1072" y="186" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">= base + dataset v7 + config;</text>
<text x="1072" y="201" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pinned by RL recipes</text>
<path d="M 1000 135 L 1060 190" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 1000 275 L 1060 230" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="410" width="1240" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="50" y="440.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Training notes</text>
<text x="50" y="466" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">• one epoch: reward models overfit preference data quickly; more data beats more epochs</text>
<text x="50" y="490" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">• drop ties and near-zero-weight labels; weight the rest instead of hard thresholds</text></svg>

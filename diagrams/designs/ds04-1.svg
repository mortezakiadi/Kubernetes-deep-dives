<svg xmlns="http://www.w3.org/2000/svg" width="1250px" height="566px" viewBox="0 0 1250 566" style="background:#ffffff"><title>Five kinds of agent state</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1250" height="566" fill="#ffffff"/><text x="625.0" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">A long-running agent has five kinds of state, and the process holds none that matters</text>
<rect x="20" y="60" width="190" height="46" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="30" y="88.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Kind of state</text>
<rect x="210" y="60" width="330" height="46" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="220" y="88.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">What it is</text>
<rect x="540" y="60" width="330" height="46" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="550" y="88.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Where it lives</text>
<rect x="870" y="60" width="360" height="46" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="880" y="88.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">How it comes back</text>
<rect x="20" y="106" width="190" height="80" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="30" y="151.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Execution state</text>
<rect x="210" y="106" width="330" height="80" fill="#ffffff" stroke="#cbd5e1"/>
<text x="220" y="150.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Which steps finished and what each returned</text>
<rect x="540" y="106" width="330" height="80" fill="#ffffff" stroke="#cbd5e1"/>
<text x="550" y="150.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Durable execution engine: event history</text>
<rect x="870" y="106" width="360" height="80" fill="#ffffff" stroke="#cbd5e1"/>
<text x="880" y="143.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Replay the history; continue at the first unfinished</text>
<text x="880" y="158.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">step</text>
<rect x="20" y="186" width="190" height="80" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="30" y="231.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Context state</text>
<rect x="210" y="186" width="330" height="80" fill="#ffffff" stroke="#cbd5e1"/>
<text x="220" y="223.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Messages, tool results, summaries the model</text>
<text x="220" y="238.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">sees</text>
<rect x="540" y="186" width="330" height="80" fill="#ffffff" stroke="#cbd5e1"/>
<text x="550" y="230.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Session database (+ S3 for large payloads)</text>
<rect x="870" y="186" width="360" height="80" fill="#ffffff" stroke="#cbd5e1"/>
<text x="880" y="223.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Rebuild the prompt from the log and the latest</text>
<text x="880" y="238.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">summary</text>
<rect x="20" y="266" width="190" height="80" fill="#fffbeb" stroke="#cbd5e1"/>
<text x="30" y="311.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Working state</text>
<rect x="210" y="266" width="330" height="80" fill="#ffffff" stroke="#cbd5e1"/>
<text x="220" y="310.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Files, git checkout, packages, browser profile</text>
<rect x="540" y="266" width="330" height="80" fill="#ffffff" stroke="#cbd5e1"/>
<text x="550" y="310.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Sandbox while active; S3 snapshots per step</text>
<rect x="870" y="266" width="360" height="80" fill="#ffffff" stroke="#cbd5e1"/>
<text x="880" y="310.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">New sandbox restored from the step's snapshot</text>
<rect x="20" y="346" width="190" height="80" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="391.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">External effects</text>
<rect x="210" y="346" width="330" height="80" fill="#ffffff" stroke="#cbd5e1"/>
<text x="220" y="383.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Pushed branch, pull request, ticket comment,</text>
<text x="220" y="398.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">payment</text>
<rect x="540" y="346" width="330" height="80" fill="#ffffff" stroke="#cbd5e1"/>
<text x="550" y="390.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Other systems + the side-effect ledger</text>
<rect x="870" y="346" width="360" height="80" fill="#ffffff" stroke="#cbd5e1"/>
<text x="880" y="383.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Check the ledger and idempotency key; never redo</text>
<text x="880" y="398.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">blindly</text>
<rect x="20" y="426" width="190" height="80" fill="#fef2f2" stroke="#cbd5e1"/>
<text x="30" y="471.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Process memory</text>
<rect x="210" y="426" width="330" height="80" fill="#ffffff" stroke="#cbd5e1"/>
<text x="220" y="470.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Variables, open connections, a running test</text>
<rect x="540" y="426" width="330" height="80" fill="#ffffff" stroke="#cbd5e1"/>
<text x="550" y="470.75" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Nowhere: not saved</text>
<rect x="870" y="426" width="360" height="80" fill="#ffffff" stroke="#cbd5e1"/>
<text x="880" y="463.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">Not recovered. Anything that matters is in the rows</text>
<text x="880" y="478.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e293b">above by the end of each step</text>
<text x="625.0" y="552.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#475569" font-style="italic">The step boundary is the unit of consistency: history, context, snapshot and ledger are all updated before a step counts as done.</text></svg>

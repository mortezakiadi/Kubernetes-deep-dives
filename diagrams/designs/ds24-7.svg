<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>Alert catalog</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Alert catalog: page the platform for symptoms, ticket teams with numbers</text>
<rect x="30" y="60" width="610" height="380" rx="14" fill="#fef2f2" fill-opacity=".55" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="44" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#991b1b">PLATFORM · SEVERITY PAGE</text>
<rect x="50" y="100" width="570" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="62" y="122" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">DcgmExporterDataStale</text>
<text x="62" y="144" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">no DCGM data from a node for 3 min</text>
<rect x="50" y="166" width="570" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="62" y="188" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">GpuThermalThrottlingWidespread</text>
<text x="62" y="210" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">&gt; 16 GPUs in a pool throttled for 30 min</text>
<rect x="50" y="232" width="570" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="62" y="254" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">GpuFatalXid / RowRemapFailure</text>
<text x="62" y="276" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">also feeds Design 23 remediation</text>
<rect x="50" y="298" width="570" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="62" y="320" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">NvlinkErrorRateHigh</text>
<text x="62" y="342" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">CRC flit errors rising across a domain</text>
<rect x="50" y="364" width="570" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="62" y="386" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">ObservabilityPipeline</text>
<text x="62" y="408" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">rule eval failures, remote-write lag</text>
<rect x="660" y="60" width="610" height="380" rx="14" fill="#eff6ff" fill-opacity=".55" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="674" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#1e40af">TEAMS · SEVERITY TICKET</text>
<rect x="680" y="100" width="570" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="692" y="122" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">GpusAllocatedButIdle</text>
<text x="692" y="144" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">pod holds GPUs, no activity for 2 h</text>
<rect x="680" y="166" width="570" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="692" y="188" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">JobNoActivitySinceStart</text>
<text x="692" y="210" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">GPUs assigned, never active after 30 min</text>
<rect x="680" y="232" width="570" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="692" y="254" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">QuotaNearExhaustion</text>
<text x="692" y="276" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">team &gt; 90% of nominal quota for 1 h</text>
<rect x="680" y="298" width="570" height="56" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="692" y="320" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">TeamActivityTrend</text>
<text x="692" y="342" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">weekly activity rate down &gt; 10 points</text>
<rect x="30" y="460" width="1240" height="110" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="490.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: 140 GPU pages a week, mostly “utilization &lt; 10%” during data loading → muted.</text>
<text x="50" y="516" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">A cooling fault throttled 64 GPUs for a week; throttling had no alert.</text>
<text x="50" y="548" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">Every alert: owner label · severity · summary · runbook · for &gt; normal transients · unit test.</text></svg>

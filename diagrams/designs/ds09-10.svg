<svg xmlns="http://www.w3.org/2000/svg" width="1340px" height="620px" viewBox="0 0 1340 620" style="background:#ffffff"><title>Off-policy platform</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1340" height="620" fill="#ffffff"/><text x="670" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">The off-policy platform on Kubernetes</text>
<rect x="30" y="80" width="280" height="130" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="42" y="102.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Rollout engines (LWS)</text>
<text x="42" y="125.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">version-tagged samples + behavior</text>
<text x="42" y="139.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">logprobs; stop sampling when &gt; k behind</text>
<rect x="380" y="80" width="280" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="392" y="102.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Log-prob workers</text>
<text x="392" y="125.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">π_prox on arrival, training-engine</text>
<text x="392" y="139.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">kernels, sample's version</text>
<rect x="730" y="80" width="280" height="130" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="742" y="102.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Sample buffer</text>
<text x="742" y="125.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">fresh / replay / external pools; age + KL</text>
<text x="742" y="139.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">admission; mix ratios</text>
<rect x="1060" y="80" width="250" height="130" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="1072" y="102.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Trainer (JobSet)</text>
<text x="1072" y="125.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">decoupled loss, off-policy metrics,</text>
<text x="1072" y="139.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">healthy-tagged checkpoints</text>
<path d="M 310 145 L 380 145" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 660 145 L 730 145" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 1010 145 L 1060 145" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="380" y="290" width="630" height="110" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="392" y="313" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Weight distribution</text>
<text x="392" y="336" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">versioned pushes to engines; last k versions kept for log-prob workers</text>
<path d="M 1185 210 L 1185 345 L 1010 345" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 380 345 L 170 345 L 170 210" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 600 290 L 520 210" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-muted)"/>
<rect x="730" y="460" width="580" height="110" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="742" y="483" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Controller</text>
<text x="742" y="506" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reads metrics; changes live settings (versioned); triggers rollback; writes events</text>
<path d="M 1185 210 L 1185 460" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-muted)"/>
<path d="M 730 515 L 650 515 L 650 400" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-muted)"/>
<rect x="30" y="460" width="580" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="483" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Experiment harness</text>
<text x="42" y="506" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">staleness and mixing sweeps on the research queue; reference result library</text></svg>

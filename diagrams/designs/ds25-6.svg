<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="580px" viewBox="0 0 1300 580" style="background:#ffffff"><title>Reconciliation</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="580" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Reconcile before publishing: attributed = billed, per provider and month</text>
<rect x="30" y="60" width="760" height="300" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="50" y="88" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">First month (illustrative, $M)</text>
<text x="50" y="122.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">invoices + cost model</text>
<rect x="50" y="130" width="607" height="26" rx="4" fill="#0f172a" fill-opacity="0.85" stroke="none"/>
<text x="663.2558139534884" y="149.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">4.08</text>
<text x="50" y="186.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">attributed, first run</text>
<rect x="50" y="194" width="539" height="26" rx="4" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="594.7906976744187" y="213.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">3.62</text>
<text x="50" y="250.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">after fixes</text>
<rect x="50" y="258" width="606" height="26" rx="4" fill="#059669" fill-opacity="0.85" stroke="none"/>
<text x="661.7674418604652" y="277.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">4.07</text>
<text x="50" y="320.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">gap $460k: neocloud storage line with no GPU-hour + 2 days of missing metrics</text>
<text x="50" y="344.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">after: storage as a shared cost; missing hours filled from scheduler records → gap 0.25%</text>
<rect x="820" y="60" width="450" height="54" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="832" y="81.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">Totals</text>
<text x="832" y="103.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">gap ≤ 0.5% or publication blocked</text>
<rect x="820" y="122" width="450" height="54" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="832" y="143.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e40af">Coverage</text>
<text x="832" y="165.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">every healthy GPU-hour has a row</text>
<rect x="820" y="184" width="450" height="54" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="832" y="205.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">Freshness</text>
<text x="832" y="227.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">metrics 6 h · scheduler 1 h · billing per provider</text>
<rect x="820" y="246" width="450" height="54" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="832" y="267.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Integrity</text>
<text x="832" y="289.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">allocated ≤ healthy ≤ 1; one workload per GPU-hour</text>
<rect x="820" y="308" width="450" height="54" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="832" y="329.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Anomalies</text>
<text x="832" y="351.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">big day-over-day team changes reviewed</text>
<rect x="30" y="390" width="610" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="412.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Reconcile to the invoice</text>
<text x="42" y="435.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">when they disagree, the warehouse is wrong until shown otherwise</text>
<rect x="660" y="390" width="610" height="90" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="672" y="412.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Missing ≠ zero</text>
<text x="672" y="435.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">no data means unknown; fill allocation from the scheduler, mark activity unknown</text></svg>

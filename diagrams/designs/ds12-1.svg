<text x="300" y="106.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">question sampling</text>
<rect x="320" y="86" width="360" height="30" rx="4" fill="#2563eb" fill-opacity=".85"/>
<text x="688.0" y="107.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2563eb">±2.0 pts</text>
<text x="820" y="107" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">→ more / better questions</text>
<text x="300" y="168.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">generation sampling</text>
<rect x="320" y="148" width="162" height="30" rx="4" fill="#7c3aed" fill-opacity=".85"/>
<text x="490.0" y="169.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7c3aed">±0.9 pts</text>
<text x="820" y="169" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">→ more samples per question</text>
<text x="300" y="230.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">training seed + data order</text>
<rect x="320" y="210" width="252" height="30" rx="4" fill="#dc2626" fill-opacity=".85"/>
<text x="580.0" y="231.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#dc2626">±1.4 pts</text>
<text x="820" y="231" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">→ more seeds per arm</text>
<text x="300" y="292.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">kernels + infrastructure</text>

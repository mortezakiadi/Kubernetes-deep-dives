<text x="400.0" y="293.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#64748b">±0.4 pts</text>
<text x="820" y="293" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">→ pin layouts and images</text>
<text x="300" y="354.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">checkpoint selection</text>
<rect x="320" y="334" width="144" height="30" rx="4" fill="#d97706" fill-opacity=".85"/>
<text x="472.0" y="355.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#d97706">±0.8 pts</text>
<text x="820" y="355" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">→ select on a separate split</text>

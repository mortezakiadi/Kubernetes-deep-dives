<circle cx="822" cy="470" r="9" fill="#dc2626"/>
<text x="821.9999999999998" y="500.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">62.9</text>
<circle cx="426" cy="470" r="9" fill="#dc2626"/>
<text x="426.0000000000005" y="500.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">60.7</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="540px" viewBox="0 0 1300 540" style="background:#ffffff"><title>Filtering is off-policy</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="540" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Filters change the training distribution at three levels</text>
<rect x="30" y="70" width="380" height="95" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="94" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Prompt level</text>
<text x="42" y="118" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">dynamic sampling, pass-rate curation</text>
<path d="M 410 118 L 470 118" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="470" y="70" width="420" height="95" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="482" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Effect</text>
<text x="482" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">which tasks are trained on; can drop whole task types</text>
<rect x="30" y="185" width="380" height="95" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="42" y="209" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">Sample level</text>
<text x="42" y="233" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">rejection sampling, best-of-n</text>
<path d="M 410 233 L 470 233" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="470" y="185" width="420" height="95" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="482" y="208" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Effect</text>
<text x="482" y="231" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a 'policy + filter' behavior policy; biased toward the</text>
<text x="482" y="246" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">filter's taste</text>
<rect x="30" y="300" width="380" height="95" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="324" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Token level</text>
<text x="42" y="348" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">masking extreme ratios, high-entropy tokens only</text>
<path d="M 410 348 L 470 348" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="470" y="300" width="420" height="95" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="482" y="323" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Effect</text>
<text x="482" y="346" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">which tokens carry gradient; masked tokens are wasted compute</text>
<rect x="920" y="70" width="350" height="325" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="940" y="96" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Drop rate by task type over training</text>
<path d="M 940 322 L 956 321 L 971 320 L 986 318 L 1002 317 L 1018 316 L 1033 315 L 1048 314 L 1064 312 L 1080 311 L 1095 310 L 1110 309 L 1126 308 L 1142 306 L 1157 305 L 1172 304 L 1188 303 L 1204 302 L 1219 300 L 1234 299 L 1250 298" fill="none" stroke="#2563eb" stroke-width="3"/>
<text x="1260" y="292.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563eb">algebra</text>
<path d="M 940 310 L 956 311 L 971 312 L 986 313 L 1002 313 L 1018 314 L 1033 315 L 1048 316 L 1064 317 L 1080 318 L 1095 318 L 1110 319 L 1126 320 L 1142 321 L 1157 322 L 1172 323 L 1188 323 L 1204 324 L 1219 325 L 1234 326 L 1250 327" fill="none" stroke="#059669" stroke-width="3"/>
<text x="1260" y="320.8" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#059669">geometry</text>
<path d="M 940 298 L 956 298 L 971 297 L 986 295 L 1002 293 L 1018 290 L 1033 286 L 1048 282 L 1064 277 L 1080 271 L 1095 265 L 1110 258 L 1126 250 L 1142 242 L 1157 233 L 1172 224 L 1188 214 L 1204 203 L 1219 191 L 1234 179 L 1250 166" fill="none" stroke="#dc2626" stroke-width="3"/>
<text x="1260" y="159.99999999999997" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#dc2626">proofs</text>
<text x="940" y="388.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c">rising drop rate = a task type silently leaving training</text>
<rect x="30" y="430" width="1240" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="453" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Controls</text>
<text x="42" y="476" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">report filter rates per task type · cap what any filter can remove · evaluate on unfiltered held-out sets · treat rising filter rates as a signal</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1340px" height="620px" viewBox="0 0 1340 620" style="background:#ffffff"><title>Reward-quality platform</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1340" height="620" fill="#ffffff"/><text x="670" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">The reward-quality platform</text>
<rect x="30" y="80" width="300" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="103" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Training run</text>
<text x="42" y="126" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pins verifier versions by digest; rewards</text>
<text x="42" y="141" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">tagged</text>
<rect x="400" y="70" width="420" height="160" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="412" y="94" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">Verifier service</text>
<rect x="420" y="110" width="120" height="100" rx="8" fill="#ffffff" stroke="#047857"/>
<text x="480" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">rules</text>
<text x="480" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">CPU Deployments</text>
<rect x="552" y="110" width="120" height="100" rx="8" fill="#ffffff" stroke="#047857"/>
<text x="612" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">code</text>
<text x="612" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">sandbox pool</text>
<rect x="684" y="110" width="120" height="100" rx="8" fill="#ffffff" stroke="#047857"/>
<text x="744" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">judges</text>
<text x="744" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">GPU pool, vLLM</text>
<path d="M 330 145 L 400 145" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)" marker-start="url(#a-flow-s)"/>
<rect x="890" y="80" width="420" height="130" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="902" y="103" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Verifier registry</text>
<text x="902" y="126" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">contracts, versions, test suites, quality per slice; gates</text>
<text x="902" y="141" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">before pinning</text>
<path d="M 820 145 L 890 145" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-muted)"/>
<rect x="30" y="290" width="380" height="130" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="42" y="313" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Reward-quality monitor</text>
<text x="42" y="336" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">audit verifier, perturbation tests, shortcut detectors</text>
<text x="42" y="351" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">on each step's sample</text>
<path d="M 180 210 L 180 290" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="480" y="290" width="380" height="130" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="492" y="313" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Fuzz + red-team jobs</text>
<text x="492" y="336" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">CI on every change; nightly CronJob against fresh policy</text>
<text x="492" y="351" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">outputs</text>
<path d="M 670 290 L 670 230" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="930" y="290" width="380" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="942" y="313" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Review service</text>
<text x="942" y="336" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">human queue, gold labels, agreement metrics</text>
<path d="M 1120 290 L 1120 210" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="480" width="580" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="503" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Re-scoring jobs</text>
<text x="42" y="526" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">new verifier version → re-score replay buffers and rollout-built datasets</text>
<rect x="680" y="480" width="630" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="692" y="503" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Evaluation verifiers</text>
<text x="692" y="526" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">same registry, different entries and owners; never pinned by training</text>
<path d="M 410 355 L 480 355" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-muted)"/>
<path d="M 930 355 L 860 355" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-muted)"/></svg>

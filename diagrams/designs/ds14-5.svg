<text x="50" y="486" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">1/64 of rollouts were nonsense for two hours. Canary + peer comparison catches it in minutes.</text></svg>

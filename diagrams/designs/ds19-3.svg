<svg xmlns="http://www.w3.org/2000/svg" width="1340px" height="600px" viewBox="0 0 1340 600" style="background:#ffffff"><title>Layer architecture</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1340" height="600" fill="#ffffff"/><text x="670" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">The scheduling layer as code and controllers</text>
<rect x="30" y="80" width="240" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="103" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Policy source (Git)</text>
<text x="42" y="126" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">allocations, weights, priorities,</text>
<text x="42" y="141" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pools</text>
<rect x="330" y="80" width="260" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="342" y="103" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Policy controller</text>
<text x="342" y="126" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">generates Kueue objects, applies,</text>
<text x="342" y="141" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reports drift</text>
<path d="M 270 135 L 330 135" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="650" y="60" width="660" height="200" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="664" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">IN THE CLUSTER</text>
<rect x="670" y="100" width="200" height="130" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="682" y="122.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Kueue</text>
<text x="682" y="145.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">gangs, TAS, cohorts, fair</text>
<text x="682" y="159.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">share</text>
<rect x="890" y="100" width="200" height="130" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="902" y="122.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">kube-scheduler</text>
<text x="902" y="145.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">gpu-binpack profile</text>
<rect x="1110" y="100" width="180" height="130" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="1122" y="122.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Reclaimers</text>
<text x="1122" y="145.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">idle + compaction</text>
<text x="1122" y="159.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">controllers</text>
<path d="M 590 135 L 670 160" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="300" width="300" height="110" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="42" y="323" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Simulator</text>
<text x="42" y="346" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">replays recorded jobs against candidate</text>
<text x="42" y="361" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">policies</text>
<rect x="380" y="300" width="300" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="392" y="323" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Change log</text>
<text x="392" y="346" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">every policy version + time applied</text>
<rect x="730" y="300" width="300" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="742" y="323" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Measurement</text>
<text x="742" y="346" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">metric tree, guardrails, scorecards</text>
<path d="M 180 300 L 180 190" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="194.68" y="236" width="90.64000000000001" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="240" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">tested first</text>
<path d="M 460 190 L 530 300" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-muted)"/>
<path d="M 980 260 L 880 300" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 730 355 L 680 355" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-muted)"/>
<rect x="30" y="450" width="1280" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="50" y="482.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Kubernetes-native: configuration plus small controllers, no custom scheduler fork; upgrades stay routine.</text>
<text x="50" y="510" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Before: ClusterQueues edited by hand, scheduler flags changed in place; nobody knew which configuration was live when.</text></svg>

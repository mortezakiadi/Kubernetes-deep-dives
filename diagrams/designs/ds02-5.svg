<svg xmlns="http://www.w3.org/2000/svg" width="1240px" height="640px" viewBox="0 0 1240 640" style="background:#ffffff"><title>Autoscaling with Karpenter NodePools</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1240" height="640" fill="#ffffff"/><text x="620" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Kueue flavors decide which pools a queue may use; Karpenter weights decide the order</text>
<rect x="720" y="70" width="480" height="92" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="732" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">NodePool gpu-reserved</text>
<text x="732" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">weight 100 · capacity-type: reserved</text>
<text x="732" y="131" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Capacity Blocks and ODCRs. Fill first.</text>
<rect x="720" y="178" width="480" height="92" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="732" y="201" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">NodePool gpu-ondemand</text>
<text x="732" y="224" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">weight 50 · on-demand</text>
<text x="732" y="239" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Limits cap per cluster. Only queues that list this flavor.</text>
<rect x="720" y="286" width="480" height="92" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="732" y="309" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">NodePool gpu-spot</text>
<text x="732" y="332" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">weight 10 · spot</text>
<text x="732" y="347" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Interruptible. Checkpointing work only.</text>
<rect x="720" y="394" width="480" height="92" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="732" y="417" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">NodePool cpu-ondemand</text>
<text x="732" y="440" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">on-demand · consolidation on</text>
<text x="732" y="455" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Floor for services</text>
<rect x="720" y="502" width="480" height="92" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="732" y="525" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">NodePool cpu-spot</text>
<text x="732" y="548" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">spot · consolidation on</text>
<text x="732" y="563" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Batch, CI, data pipelines</text>
<rect x="40" y="70" width="330" height="74" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="52" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Scheduled training</text>
<text x="52" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">priority standard, do-not-disrupt</text>
<rect x="40" y="160" width="330" height="74" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="52" y="183" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Inference baseline</text>
<text x="52" y="206" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">priority production</text>
<rect x="40" y="250" width="330" height="74" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="52" y="273" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Inference burst</text>
<text x="52" y="296" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">HPA / KEDA on queue depth, KV cache</text>
<rect x="40" y="340" width="330" height="74" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="52" y="363" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Experiments, evaluation</text>
<text x="52" y="386" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">priority opportunistic</text>
<rect x="40" y="430" width="330" height="74" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="52" y="453" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Services</text>
<text x="52" y="476" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Deployments, HPA</text>
<rect x="40" y="520" width="330" height="74" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="52" y="543" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Batch, CI, data</text>
<text x="52" y="566" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Jobs via Kueue</text>
<path d="M 370 107 L 720 116" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#a-ok)"/>
<path d="M 370 117 L 560 214 L 720 214" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-flow)"/>
<rect x="511.79999999999995" y="180" width="256.40000000000003" height="20" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="640" y="193" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">if reserved is full and the queue allows</text>
<path d="M 370 197 L 720 128" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#a-ok)"/>
<path d="M 370 287 L 720 236" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 370 377 L 720 332" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 370 467 L 720 440" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 370 557 L 720 548" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<text x="620" y="625" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">Never Spot for latency-critical inference. Capacity Block nodes drain 10 minutes before the block ends, so jobs on them checkpoint.</text></svg>

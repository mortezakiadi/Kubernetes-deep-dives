<rect x="680" y="210" width="590" height="76" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="692" y="232" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Failure classes</text>
<text x="692" y="254" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">provisioning, service, scenario, verifier = environment; excluded from reward</text>

<text x="438.5" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">training band 5–80%: 30% of tasks</text>
<text x="114.6" y="126" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">never solved</text>

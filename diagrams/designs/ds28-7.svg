<text x="962" y="210" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">near an edge: more attempts</text>
<rect x="950" y="252" width="320" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="962" y="274" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">too-hard-solvable</text>
<text x="962" y="296" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">a stronger policy solves it: keep for later</text>
<rect x="950" y="338" width="320" height="74" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="962" y="360" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">too-easy / too-hard</text>
<text x="962" y="382" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">set aside; re-calibrate later</text>
<rect x="30" y="480" width="1240" height="90" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="512.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: the first run used every validated task: 40% always solved, 30% never solved, no learning signal,</text>
<text x="50" y="538" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">and together they took 70% of rollout compute. Milestones can bring hard tasks into range.</text></svg>

<text x="818" y="335.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">named changes</text>
<rect x="1058" y="290" width="236" height="110" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="1070" y="312.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Attribution</text>
<text x="1070" y="335.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">candidates + slice ablations</text>
<path d="M 1180 190 L 1180 250" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="460" width="620" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="483" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Ablation registry</text>
<text x="42" y="506" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">hypotheses, decision rules, outcomes, negative results</text>
<rect x="690" y="460" width="620" height="110" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="702" y="483" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Rule</text>
<text x="702" y="506" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">store per-question results, never only averages; analysis code versioned</text></svg>

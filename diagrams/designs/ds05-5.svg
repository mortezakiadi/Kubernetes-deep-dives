<text x="650" y="625.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#475569" font-style="italic">Readiness means 'can serve'. Deregistration delay shorter than the pod's termination grace period.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>Health model</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">What can fail, how we see it, and which domains link nodes</text>
<rect x="30" y="70" width="760" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Software</text>
<text x="42" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">driver · fabric manager · runtime · kubelet · CNI · device plugin / DRA · mounts</text>
<rect x="30" y="170" width="760" height="86" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="42" y="193" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Network</text>
<text x="42" y="216" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">links · counters · fabric routing · congestion / PFC · paths to storage and API</text>
<rect x="30" y="270" width="760" height="86" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="42" y="293" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Hardware</text>
<text x="42" y="316" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">GPU compute + memory · PCIe · NVLink / NVSwitch · power + thermals · NIC / HCA · optics</text>
<rect x="820" y="70" width="210" height="286" rx="10" fill="#ecfdf5" stroke="#059669"/>
<text x="925" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857">Passive</text>
<text x="840" y="128.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">• Xid events</text>
<text x="840" y="162.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">• DCGM fields</text>
<text x="840" y="196.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">• kernel logs</text>
<text x="840" y="230.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">• link counters</text>
<text x="840" y="264.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">• node conditions</text>
<text x="840" y="298.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">• cheap, continuous</text>
<rect x="1050" y="70" width="220" height="286" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="1160" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">Active</text>
<text x="1070" y="128.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">• preflight</text>
<text x="1070" y="162.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">• dcgmi diag</text>
<text x="1070" y="196.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">• bandwidth tests</text>
<text x="1070" y="230.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">• NCCL collectives</text>
<text x="1070" y="264.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">• file I/O</text>
<text x="1070" y="298.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">• conclusive, need idle</text>
<text x="30" y="400" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Failure domains: one cause, many nodes</text>
<rect x="30" y="418" width="166" height="46" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8"/>
<text x="113" y="447" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">rack</text>
<rect x="208" y="418" width="166" height="46" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8"/>
<text x="291" y="447" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">ToR switch</text>
<rect x="386" y="418" width="166" height="46" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8"/>
<text x="469" y="447" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">spine group</text>
<rect x="564" y="418" width="166" height="46" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8"/>
<text x="647" y="447" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">PDU</text>
<rect x="742" y="418" width="166" height="46" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8"/>
<text x="825" y="447" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">cooling loop</text>
<rect x="920" y="418" width="166" height="46" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8"/>
<text x="1003" y="447" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">driver cohort</text>
<rect x="1098" y="418" width="166" height="46" rx="8" fill="#ffffff" fill-opacity="1" stroke="#94a3b8"/>
<text x="1181" y="447" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">firmware cohort</text>
<rect x="30" y="490" width="1240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="520.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: each team checked its own layer; a driver crash left the device plugin advertising 7 of 8 GPUs,</text>
<text x="50" y="546" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">and faults between layers went unnoticed until jobs failed.</text></svg>

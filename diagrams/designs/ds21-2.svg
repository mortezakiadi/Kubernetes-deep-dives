<text x="50" y="348" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Goodput per node at chat SLO (relative, illustrative)</text>
<text x="170" y="394" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">TP=8 × 1</text>

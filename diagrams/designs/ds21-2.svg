<text x="832" y="342.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Rule of thumb</text>
<text x="832" y="365.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">smallest TP that fits weights + KV for the target batch; then add</text>
<text x="832" y="379.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">replicas; raise TP only if ITL misses</text>
<rect x="820" y="440" width="450" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="832" y="462.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">PP only when it doesn't fit</text>
<text x="832" y="485.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">pipeline stages across nodes add latency and need concurrency to stay</text>

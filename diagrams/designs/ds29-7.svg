<text x="252" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Clean</text>
<text x="252" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">zero reward in buffers still</text>
<text x="252" y="118" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">used</text>

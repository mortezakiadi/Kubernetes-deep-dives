<rect x="120" y="466" width="60" height="4" rx="2" fill="#94a3b8" fill-opacity="0.85" stroke="none"/>
<text x="150" y="488" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">ckpt 0</text>

tica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Responding: contain, clean, find the onset, roll back, fix</text>
<rect x="30" y="60" width="196" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="42" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Contain</text>
<text x="42" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">quarantine tasks; block by</text>
<text x="42" y="118" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">rule</text>

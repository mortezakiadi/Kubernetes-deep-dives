<text x="650" y="488" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">ckpt 5</text>
<rect x="720" y="364" width="60" height="106" rx="2" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="750" y="488" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">ckpt 6</text>

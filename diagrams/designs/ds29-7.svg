<text x="850" y="488" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">ckpt 7</text>
<line x1="450" y1="210" x2="450" y2="470" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="456" y="228" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">estimated onset</text>
<line x1="750" y1="210" x2="750" y2="470" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="756" y="228" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">alarm</text>
<text x="350" y="254" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#047857">← roll back to ckpt 2</text>
<text x="500.0" y="504" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">DATA-002 monitor event rate per checkpoint</text>
<rect x="950" y="210" width="320" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="962" y="232.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Zeroing reward isn't enough</text>
<text x="962" y="255.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">a behavior reinforced for days stays after</text>
<text x="962" y="269.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">reward stops</text>
<rect x="950" y="350" width="320" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="962" y="372.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Keep checkpoints</text>
<text x="962" y="395.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">periodic ones for the whole run, so rollback is</text>
<text x="962" y="409.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">possible</text>
<rect x="30" y="520" width="1240" height="66" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="558" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Before: rewards zeroed from discovery on; the habit of looking for reference files stayed for the rest of the run.</text></svg>

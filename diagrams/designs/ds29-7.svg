<rect x="870" y="60" width="196" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="882" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">Fix + test</text>
<text x="882" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">patch; exploit test;</text>
<text x="882" y="118" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">re-validate</text>

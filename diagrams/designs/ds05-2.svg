<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="620px" viewBox="0 0 1300 620" style="background:#ffffff"><title>Address plan</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="620" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Three kinds of addresses, three sets of rules</text>
<rect x="30" y="60" width="400" height="130" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="84" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Routable IPv4</text>
<text x="42" y="108" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Scarce. Unique across AWS, the other cloud and</text>
<text x="42" y="124" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">on-premises. From VPC IPAM pools per region and</text>
<text x="42" y="140" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">environment. Nodes, load balancers, gateways.</text>
<rect x="450" y="60" width="400" height="130" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="462" y="84" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">Pod IPv4: 100.64.0.0/10</text>
<text x="462" y="108" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Plentiful. The same range reused in every VPC because</text>
<text x="462" y="124" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">it's never routed outside it. Traffic leaving the VPC</text>
<text x="462" y="140" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">takes the node's address.</text>
<rect x="870" y="60" width="400" height="130" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="882" y="84" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">IPv6</text>
<text x="882" y="108" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Plentiful and routable. Every pod gets a unique address</text>
<text x="882" y="124" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">from the VPC's range. For new clusters whose</text>
<text x="882" y="140" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">dependencies all support it.</text>
<rect x="60" y="240" width="540" height="300" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="74" y="264" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#0f172a">VPC TRAIN-USE1  ·  10.20.0.0/16</text>
<rect x="90" y="290" width="220" height="100" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="102" y="313" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Node</text>
<text x="102" y="336" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">10.x address (routable)</text>
<rect x="350" y="290" width="220" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="362" y="313" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Pods</text>
<text x="362" y="336" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">100.64.x.x (same range in both</text>
<text x="362" y="351" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">VPCs)</text>
<path d="M 350 340 L 310 340" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="90" y="420" width="480" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="102" y="442" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Leaving the VPC</text>
<text x="102" y="464" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">Pod traffic is translated to the node's 10.x address; services are reached</text>
<text x="102" y="478" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">through load balancers or Lattice, not pod IPs</text>
<rect x="700" y="240" width="540" height="300" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="714" y="264" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#0f172a">VPC INFER-EUW1  ·  10.40.0.0/16</text>
<rect x="730" y="290" width="220" height="100" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="742" y="313" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Node</text>
<text x="742" y="336" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">10.x address (routable)</text>
<rect x="990" y="290" width="220" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="1002" y="313" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Pods</text>
<text x="1002" y="336" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">100.64.x.x (same range in both</text>
<text x="1002" y="351" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">VPCs)</text>
<path d="M 990 340 L 950 340" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="730" y="420" width="480" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="742" y="442" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Leaving the VPC</text>
<text x="742" y="464" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">Pod traffic is translated to the node's 10.x address; services are reached</text>
<text x="742" y="478" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">through load balancers or Lattice, not pod IPs</text>
<path d="M 600 340 L 700 340" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 5"/>
<circle cx="700" cy="340" r="10" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M 695 335 L 705 345 M 705 335 L 695 345" stroke="#dc2626" stroke-width="2.4"/>
<rect x="587.88" y="366" width="124.24000000000001" height="36" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="650" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">pod-to-pod by IP:</text>
<text x="650" y="395" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">not routed</text>
<text x="650" y="585.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#475569" font-style="italic">Hybrid nodes are the exception: their pod ranges are planned in IPAM and advertised over BGP so the control plane can reach them.</text></svg>

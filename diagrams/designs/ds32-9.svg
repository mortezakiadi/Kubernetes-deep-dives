<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>Uncertainty</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Every difference with an honest interval (v8 − v7, points)</text>
<rect x="30" y="60" width="880" height="380" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="50" y="88" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Paired, family-clustered bootstrap · 95% intervals</text>
<line x1="520" y1="90" x2="520" y2="400" stroke="#0f172a" stroke-width="1.5"/>
<line x1="360" y1="90" x2="360" y2="400" stroke="#e2e8f0"/>
<text x="360" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">-8</text>
<line x1="440" y1="90" x2="440" y2="400" stroke="#e2e8f0"/>
<text x="440" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">-4</text>
<line x1="600" y1="90" x2="600" y2="400" stroke="#e2e8f0"/>
<text x="600" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">+4</text>
<line x1="680" y1="90" x2="680" y2="400" stroke="#e2e8f0"/>
<text x="680" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">+8</text>
<line x1="760" y1="90" x2="760" y2="400" stroke="#e2e8f0"/>
<text x="760" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">+12</text>
<text x="50" y="125" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">full suite · 1,200 tasks / 140 fam.</text>
<line x1="546" y1="120" x2="590" y2="120" stroke="#047857" stroke-width="4"/>
<circle cx="568" cy="120" r="7" fill="#047857"/>
<text x="600.0" y="125" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">MDD 2</text>
<text x="50" y="183" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">&lt; 15m slice</text>
<line x1="684" y1="178" x2="796" y2="178" stroke="#047857" stroke-width="4"/>
<circle cx="740" cy="178" r="7" fill="#047857"/>
<text x="806.0" y="183" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">MDD 3</text>
<text x="50" y="241" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">long-horizon slice · 90 / 11 fam.</text>
<line x1="516" y1="236" x2="666" y2="236" stroke="#64748b" stroke-width="4"/>
<circle cx="592" cy="236" r="7" fill="#64748b"/>
<text x="676.0" y="241" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">MDD 5</text>
<text x="50" y="299" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">&gt; 4h slice</text>
<line x1="342" y1="294" x2="578" y2="294" stroke="#64748b" stroke-width="4"/>
<circle cx="460" cy="294" r="7" fill="#64748b"/>
<text x="588.0" y="299" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">MDD 7</text>
<text x="50" y="357" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">interaction slice</text>
<line x1="468" y1="352" x2="620" y2="352" stroke="#64748b" stroke-width="4"/>
<circle cx="544" cy="352" r="7" fill="#64748b"/>
<text x="630.0" y="357" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569">MDD 4</text>
<rect x="950" y="60" width="320" height="115" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="962" y="82.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Resample whole families</text>
<text x="962" y="105.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">related tasks fail together</text>
<rect x="950" y="190" width="320" height="115" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="962" y="212.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Below MDD</text>
<text x="962" y="235.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">reported as “no detectable change”</text>
<rect x="950" y="320" width="320" height="120" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="962" y="342.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Single-slice moves</text>
<text x="962" y="365.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">hypotheses: confirm with more tasks or seeds</text>
<rect x="30" y="470" width="1240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="502.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: a review celebrated +3 points on a 90-task long-horizon slice from 11 families;</text>
<text x="50" y="528" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">a rerun with new seeds showed −1.</text></svg>

<text x="50" y="446.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">append: restated rows added on top → month overstated by $180,000</text>
<text x="50" y="468.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">replace: the restated days overwrite their partitions → correct</text>
<rect x="820" y="210" width="450" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="832" y="232.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Open months reload daily</text>
<text x="832" y="255.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">billing keeps changing for weeks; statements are final after the</text>
<text x="832" y="269.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">invoice closes</text>
<rect x="820" y="350" width="450" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="832" y="372.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Keep billed and effective cost</text>
<text x="832" y="395.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">billed = invoice; effective = commitments spread over term;</text>
<text x="832" y="409.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">attribution uses effective</text>
<rect x="30" y="506" width="1240" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="529" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Lineage: every mart row traces back to staging partitions and landing files</text></svg>

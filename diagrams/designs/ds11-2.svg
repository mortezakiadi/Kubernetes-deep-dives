<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="560px" viewBox="0 0 1300 560" style="background:#ffffff"><title>Specialization vs generality</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="560" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Four ways to cover many domains, from specialized to general</text>
<defs><linearGradient id="g11" x1="0" x2="1"><stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#d1fae5"/></linearGradient></defs>
<rect x="30" y="56" width="1240" height="30" rx="15" fill="url(#g11)" stroke="#cbd5e1"/>
<text x="46" y="76.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6d28d9">specialized</text>
<text x="1254" y="76.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">general</text>
<rect x="30" y="100" width="300" height="300" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="124" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Specialists + router</text>
<rect x="60" y="150" width="70" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
<text x="95" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">math</text>
<rect x="145" y="150" width="70" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
<text x="180" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">code</text>
<rect x="230" y="150" width="70" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
<text x="265" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">chat</text>
<rect x="120" y="230" width="120" height="36" rx="18" fill="#ffffff" stroke="#7c3aed"/>
<text x="180" y="253.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6d28d9">router</text>
<path d="M 180 230 L 95 190" fill="none" stroke="#7c3aed" stroke-width="2"/>
<path d="M 180 230 L 180 190" fill="none" stroke="#7c3aed" stroke-width="2"/>
<path d="M 180 230 L 265 190" fill="none" stroke="#7c3aed" stroke-width="2"/>
<text x="50" y="345.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">+ best per-domain</text>
<text x="50" y="368.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">− many models, misroutes</text>
<rect x="345" y="100" width="300" height="300" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="357" y="124" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Merge specialists</text>
<rect x="375" y="150" width="70" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<path d="M 410 190 L 495 240" fill="none" stroke="#2563eb" stroke-width="2"/>
<rect x="460" y="150" width="70" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<path d="M 495 190 L 495 240" fill="none" stroke="#2563eb" stroke-width="2"/>
<rect x="545" y="150" width="70" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<path d="M 580 190 L 495 240" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="495" cy="255" r="22" fill="#2563eb"/>
<text x="495" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">+</text>
<text x="495" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">task vectors added to base</text>
<text x="365" y="345.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">+ cheap, no joint run</text>
<text x="365" y="368.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">− interference unpredictable</text>
<rect x="660" y="100" width="300" height="300" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="672" y="124" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">Distill specialists</text>
<rect x="690" y="150" width="70" height="40" rx="6" fill="#fef3c7" stroke="#d97706"/>
<path d="M 725 190 L 810 235" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="775" y="150" width="70" height="40" rx="6" fill="#fef3c7" stroke="#d97706"/>
<path d="M 810 190 L 810 235" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="860" y="150" width="70" height="40" rx="6" fill="#fef3c7" stroke="#d97706"/>
<path d="M 895 190 L 810 235" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="760" y="235" width="100" height="44" rx="8" fill="#fde68a" stroke="#d97706"/>
<text x="810" y="262.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">student</text>
<text x="810" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400e">teachers grade the student</text>
<text x="680" y="345.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">+ one served model</text>
<text x="680" y="368.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">− distillation run, quirks</text>
<rect x="975" y="100" width="300" height="300" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="987" y="124" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">Mixture generalist</text>
<rect x="1015" y="155" width="60" height="30" rx="4" fill="#2563eb" fill-opacity=".8"/>
<path d="M 1045 185 L 1125 235" fill="none" stroke="#047857" stroke-width="2"/>
<rect x="1090" y="155" width="60" height="30" rx="4" fill="#059669" fill-opacity=".8"/>
<path d="M 1120 185 L 1125 235" fill="none" stroke="#047857" stroke-width="2"/>
<rect x="1165" y="155" width="60" height="30" rx="4" fill="#d97706" fill-opacity=".8"/>
<path d="M 1195 185 L 1125 235" fill="none" stroke="#047857" stroke-width="2"/>
<rect x="1075" y="235" width="100" height="44" rx="8" fill="#d1fae5" stroke="#047857"/>
<text x="1125" y="262.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">one model</text>
<text x="1125" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#047857">one mixed training stream</text>
<text x="995" y="345.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">+ transfer, one release</text>
<text x="995" y="368.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">− interference, slow loop</text>
<rect x="30" y="430" width="1240" height="100" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="453.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Scale changes the answer</text>
<text x="42" y="477.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">One 2026 code-model study: data mixture better at ~2B parameters, merging specialists better at 7B. Hybrids are common: a generalist plus a few specialists, distilled back</text>
<text x="42" y="492.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">periodically.</text></svg>

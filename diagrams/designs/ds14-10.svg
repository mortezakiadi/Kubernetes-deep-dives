<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="560px" viewBox="0 0 1300 560" style="background:#ffffff"><title>SLOs and fault injection</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="560" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Measure reliability, then test it on purpose</text>
<rect x="30" y="70" width="236" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="93.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#065f46">Goodput</text>
<text x="42" y="117.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">target ≥ 90%</text>
<rect x="282" y="70" width="236" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="294" y="93.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1e40af">Time to detect</text>
<text x="294" y="117.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">target ≤ 2 min</text>
<rect x="534" y="70" width="236" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="546" y="93.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1e40af">Time to recover</text>
<text x="546" y="117.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">target ≤ 10 min</text>
<rect x="786" y="70" width="236" height="90" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="798" y="93.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#92400e">Work lost / failure</text>
<text x="798" y="117.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">target ≤ 10 min</text>
<rect x="1038" y="70" width="236" height="90" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="1050" y="93.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">No-reward rate</text>
<text x="1050" y="117.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">target ≤ 0.5%</text>
<rect x="30" y="190" width="610" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="50" y="218.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Believed vs measured recovery (minutes)</text>
<rect x="200" y="240" width="72" height="28" rx="4" fill="#dc2626" fill-opacity=".8"/>
<text x="190" y="260.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">incident 1</text>
<text x="280" y="260.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">9</text>
<rect x="200" y="284" width="248" height="28" rx="4" fill="#dc2626" fill-opacity=".8"/>
<text x="190" y="304.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">incident 2</text>
<text x="456" y="304.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">31</text>
<rect x="200" y="328" width="376" height="28" rx="4" fill="#dc2626" fill-opacity=".8"/>
<text x="190" y="348.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">incident 3</text>
<text x="584" y="348.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">47</text>
<line x1="240" y1="232" x2="240" y2="372" stroke="#047857" stroke-width="2" stroke-dasharray="5 4"/>
<text x="246" y="384" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#047857">believed: “about 5”</text>
<text x="680" y="218.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Fault injection in rehearsal runs (Chaos Mesh)</text>
<rect x="680" y="235" width="285" height="68" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="692" y="257.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Kill trainer pod</text>
<text x="692" y="280.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">restart path</text>
<rect x="980" y="235" width="285" height="68" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="992" y="257.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Crash rollout engine</text>
<text x="992" y="280.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">retry + replace</text>
<rect x="680" y="315" width="285" height="68" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="692" y="337.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Delay verifier 2 s</text>
<text x="692" y="360.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">back-pressure</text>
<rect x="980" y="315" width="285" height="68" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="992" y="337.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Corrupt a checkpoint</text>
<text x="992" y="360.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">verification + fallback</text>
<rect x="30" y="420" width="610" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="443" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Failure ledger</text>
<text x="42" y="466" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">every interruption: class, component, node, detect + recover time, root cause; reviewed</text>
<text x="42" y="481" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">weekly</text>
<rect x="660" y="420" width="610" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="672" y="443" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Game day before big runs</text>
<text x="672" y="466" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">on-call handles injected failures on a rehearsal run; untested paths assumed broken</text></svg>

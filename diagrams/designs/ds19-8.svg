<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="560px" viewBox="0 0 1300 560" style="background:#ffffff"><title>Idle reclamation</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="560" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Idle reclamation: detect, warn, checkpoint, stop</text>
<rect x="30" y="60" width="760" height="230" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="50" y="86.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">One notebook's GPU activity (illustrative)</text>
<path d="M 60 164 L 65 132 L 70 154 L 75 153 L 80 160 L 85 164 L 90 160 L 95 170 L 100 180 L 105 183 L 110 187 L 115 165 L 120 160 L 125 144 L 130 161 L 135 164 L 140 158 L 145 169 L 150 197 L 155 152 L 160 175 L 165 165 L 170 172 L 175 124 L 180 151 L 185 162 L 190 186 L 195 155 L 200 182 L 205 150 L 210 192 L 215 170 L 220 154 L 225 181 L 230 167 L 235 166 L 240 154 L 245 176 L 250 157 L 255 136 L 260 257 L 265 257 L 270 256 L 275 259 L 280 258 L 285 256 L 290 259 L 295 257 L 300 260 L 305 257 L 310 257 L 315 256 L 320 256 L 325 258 L 330 259 L 335 259 L 340 258 L 345 258 L 350 260 L 355 256 L 360 258 L 365 257 L 370 259 L 375 259 L 380 260 L 385 258 L 390 259 L 395 258 L 400 258 L 405 256 L 410 256 L 415 259 L 420 258 L 425 259 L 430 257 L 435 256 L 440 259 L 445 257 L 450 259 L 455 260 L 460 257 L 465 258 L 470 259 L 475 258 L 480 259 L 485 258 L 490 258 L 495 258 L 500 257 L 505 259 L 510 260 L 515 260 L 520 260 L 525 258 L 530 258 L 535 256 L 540 258 L 545 257 L 550 256 L 555 260 L 560 260 L 565 259 L 570 258 L 575 257 L 580 257 L 585 258 L 590 256 L 595 260 L 600 256 L 605 259 L 610 256 L 615 260 L 620 256 L 625 257 L 630 256 L 635 257 L 640 259 L 645 256 L 650 258 L 655 260 L 660 257 L 665 258 L 670 258 L 675 259 L 680 259 L 685 257 L 690 258 L 695 259 L 700 258 L 705 257 L 710 257 L 715 258 L 720 258 L 725 258 L 730 259 L 735 259 L 740 258 L 745 260 L 750 257 L 755 257" fill="none" stroke="#2563eb" stroke-width="2"/>
<line x1="60" y1="252.5" x2="760" y2="252.5" stroke="#dc2626" stroke-dasharray="4 4"/>
<text x="762" y="256.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">5%</text>
<line x1="560" y1="100" x2="560" y2="262" stroke="#d97706" stroke-width="2"/>
<text x="555" y="104.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#d97706">60 min idle → notify</text>
<line x1="635" y1="100" x2="635" y2="262" stroke="#7c3aed" stroke-width="2"/>
<text x="630" y="122.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7c3aed">checkpoint</text>
<line x1="660" y1="100" x2="660" y2="262" stroke="#dc2626" stroke-width="2"/>
<text x="665" y="140.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#dc2626">stop</text>
<rect x="830" y="60" width="440" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="842" y="81.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">Notebooks</text>
<text x="842" y="103.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">warn → checkpoint → stop; restart from saved state</text>
<rect x="830" y="118" width="440" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="842" y="139.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">Batch jobs</text>
<text x="842" y="161.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">notify the owner; never killed automatically</text>
<rect x="830" y="176" width="440" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="842" y="197.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e40af">Services</text>
<text x="842" y="219.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">right-size via autoscaling</text>
<rect x="830" y="234" width="440" height="50" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="842" y="255.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Small workloads</text>
<text x="842" y="277.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">recommend MIG / time-sliced slices</text>
<rect x="30" y="320" width="1240" height="100" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="352.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Baseline: 12% of capacity allocated but idle: 96 notebook GPUs at 8% activity,</text>
<text x="50" y="378" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">inference replicas sized for a weekly peak, and training jobs stalled on data loaders.</text>
<rect x="30" y="440" width="610" height="100" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="463" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Exemptions expire</text>
<text x="42" y="486" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">an annotation with a date, at most 3 days; listed on the team scorecard</text>
<rect x="660" y="440" width="610" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="672" y="463" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Announce first</text>
<text x="672" y="486" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">show each team its own idle numbers, give a grace period; surprises create exemptions, not</text>
<text x="672" y="501" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">savings</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="620px" viewBox="0 0 1300 620" style="background:#ffffff"><title>Behavior catalog</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="620" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">One behavior, one definition, measured in production and in probes</text>
<rect x="30" y="60" width="380" height="130" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="42" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Behavior: asks a clarifying question</text>
<text x="42" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">definition + examples · detector agrees with humans on 94%</text>
<text x="42" y="118" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">of 1,000 labels</text>
<rect x="460" y="60" width="380" height="130" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="472" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">Production rate</text>
<text x="472" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">sampled, aggregated per version + category; conversations</text>
<text x="472" y="118" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">stay in serving</text>
<rect x="890" y="60" width="380" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="902" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Probe suite</text>
<text x="902" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">600 realistic, mildly ambiguous coding requests</text>
<path d="M 410 125 L 460 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 840 125 L 890 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="220" width="600" height="230" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="50" y="248" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Rate on ambiguous requests</text>
<text x="50" y="282.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">production</text>
<rect x="140" y="270" width="372" height="24" rx="4" fill="#64748b" fill-opacity="0.85" stroke="none"/>
<text x="518" y="287" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">v6 31%</text>
<rect x="140" y="300" width="144" height="24" rx="4" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="290" y="317" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">v7 12%</text>
<text x="50" y="367.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">probe</text>
<rect x="140" y="355" width="408" height="24" rx="4" fill="#64748b" fill-opacity="0.85" stroke="none"/>
<text x="554" y="372" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">v6 34%</text>
<rect x="140" y="385" width="168" height="24" rx="4" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="314" y="402" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">v7 14%</text>
<rect x="670" y="220" width="600" height="230" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="690" y="248" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Probe validity: 9 past versions, probe vs production</text>
<line x1="720" y1="430" x2="1240" y2="430" stroke="#94a3b8"/><line x1="720" y1="430" x2="720" y2="265" stroke="#94a3b8"/>
<circle cx="788" cy="408" r="6" fill="#2563eb" fill-opacity=".8"/>
<circle cx="890" cy="380" r="6" fill="#2563eb" fill-opacity=".8"/>
<circle cx="958" cy="353" r="6" fill="#2563eb" fill-opacity=".8"/>
<circle cx="1009" cy="331" r="6" fill="#2563eb" fill-opacity=".8"/>
<circle cx="1043" cy="336" r="6" fill="#2563eb" fill-opacity=".8"/>
<circle cx="1077" cy="309" r="6" fill="#2563eb" fill-opacity=".8"/>
<circle cx="1128" cy="304" r="6" fill="#2563eb" fill-opacity=".8"/>
<circle cx="1162" cy="292" r="6" fill="#2563eb" fill-opacity=".8"/>
<circle cx="1196" cy="270" r="6" fill="#2563eb" fill-opacity=".8"/>
<text x="1230" y="300" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">r = 0.91</text>
<text x="1230" y="448" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">probe rate →</text>
<rect x="30" y="470" width="1240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="502.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: the first probe used clean, obviously ambiguous prompts. v6 and v7 both asked 90% of the time,</text>
<text x="50" y="528" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">which didn't match production at all.</text>
<rect x="30" y="565" width="1240" height="44" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="587.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">A probe is trusted only while it tracks production; refreshed when correlation drops</text></svg>

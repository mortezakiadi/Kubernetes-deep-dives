<text x="882" y="365.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">chat: TTFT p95 &lt; 1 s, ITL p95 &lt; 50 ms · coding: TTFT p95 &lt; 3</text>
<text x="882" y="379.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">s</text>
<rect x="30" y="460" width="1240" height="110" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="492.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: tuned with 512-token prompts and 128-token answers. Production chat: 3,000 in, 600 out.</text>
<text x="50" y="518" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">Now: gateway logs with token counts and prefix hashes → a replay dataset per product, versioned.</text>
<text x="50" y="544" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Goodput = tokens/s/GPU from requests that met both TTFT and ITL targets.</text></svg>

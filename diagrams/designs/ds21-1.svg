<text x="462" y="365.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">2 × 80 layers × 8 KV heads × 128 × 2 B = 320 KiB (BF16), 160</text>
<text x="462" y="379.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">KiB (FP8)</text>

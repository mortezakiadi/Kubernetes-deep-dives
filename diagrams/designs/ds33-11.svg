<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="493px" viewBox="0 0 1300 493" style="background:#ffffff"><title>Behavior monitoring: sample → describe → cluster → compare versions → triage → promote</title><defs><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker></defs><rect width="1300" height="493" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Behavior monitoring: sample → describe → cluster → compare versions → triage → promote</text><rect x="30" y="70" width="192" height="120" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/><text x="42" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Sample</text><text x="42" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">production (redacted),</text><text x="42" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">canary traffic,</text><text x="42" y="142" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">tier transcripts</text><rect x="240" y="70" width="192" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="252" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Describe</text><text x="252" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">length, tool calls,</text><text x="252" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">refusals, questions,</text><text x="252" y="142" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">completion claims</text><path d="M 222 130 L 240 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/><rect x="449" y="70" width="192" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="461" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Cluster</text><text x="461" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">embeddings vs the</text><text x="461" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">reference model&#x27;s</text><text x="461" y="142" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">clusters</text><path d="M 431 130 L 449 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/><rect x="659" y="70" width="192" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="671" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Compare</text><text x="671" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">same traffic mix,</text><text x="671" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">per model version,</text><text x="671" y="142" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">every canary step</text><path d="M 641 130 L 659 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/><rect x="869" y="70" width="192" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="881" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Triage</text><text x="881" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">Design 34 names it</text><text x="881" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">and counts it;</text><text x="881" y="142" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">a person decides</text><path d="M 851 130 L 869 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/><rect x="1078" y="70" width="192" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="1090" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">Promote</text><text x="1090" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">detector, fast-tier</text><text x="1090" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">slice, Design 31</text><text x="1090" y="142" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">tracking</text><path d="M 1060 130 L 1078 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/><rect x="30" y="220" width="605" height="162" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="50" y="248" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">v8, rerun on archived samples</text><text x="50" y="274" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c">asks to confirm before continuing: 0.40% → 5.90%</text><text x="50" y="300" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b91c1c">lift 14.6× → flagged</text><text x="50" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">switches language mid-answer: new, 0.30% → digest</text><text x="50" y="352" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#047857">flagged at the 10% canary step, 2 days after launch</text><rect x="665" y="220" width="605" height="162" rx="10" fill="#ffffff" stroke="#cbd5e1"/><text x="685" y="248" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Not a behavior change</text><text x="685" y="274" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">a new customer or feature shifts the clusters</text><text x="685" y="300" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1d4ed8">compare on the same traffic: canary split or replay</text><text x="685" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">a shift that also appears under the reference</text><text x="685" y="352" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">model is traffic, not behavior</text><rect x="30" y="407" width="1240" height="56" rx="10" fill="#fef2f2" stroke="#dc2626"/><text x="50" y="441" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: all gated slices graded final answers and passed; abandoned sessions revealed the change three weeks later.</text></svg>
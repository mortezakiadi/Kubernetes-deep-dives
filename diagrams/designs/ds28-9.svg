<text x="42" y="507.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Spend expert time where automation fails: multi-system tasks, verifier audits, hard demonstrations</text></svg>

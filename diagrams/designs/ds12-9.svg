<text x="680" y="102.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">probe accuracy (representation)</text>
<rect x="660" y="120" width="14" height="14" fill="#dc2626"/>
<text x="680" y="132.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">refusal rate on borderline prompts (behavior)</text>
<rect x="660" y="160" width="610" height="200" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="672" y="183.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#065f46">Reading</text>
<text x="672" y="207.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">The model still separates harmful from harmless requests just as well (flat blue), but</text>
<text x="672" y="222.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">refuses more borderline ones (rising red): the threshold for acting moved, not the</text>
<text x="672" y="238.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">representation.</text>
<rect x="30" y="400" width="296" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="423" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Linear probes</text>
<text x="42" y="446" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">classifier on hidden states, one layer</text>
<rect x="342" y="400" width="296" height="110" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="354" y="423" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Directions</text>
<text x="354" y="446" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">mean difference of two groups; projections</text>
<rect x="654" y="400" width="296" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="666" y="423" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Across checkpoints</text>
<text x="666" y="446" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">same probe applied to each checkpoint</text>
<rect x="966" y="400" width="296" height="110" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="978" y="423" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Limits</text>
<text x="978" y="446" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">form hypotheses; decide with behavior evals</text></svg>

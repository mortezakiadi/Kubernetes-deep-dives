<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>Cost per GPU-hour</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">All-in cost per healthy GPU-hour, by pool (illustrative)</text>
<rect x="30" y="60" width="780" height="380" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="50" y="102.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">On-prem H100 (1,024)</text>
<rect x="50" y="110" width="79" height="32" rx="2" fill="#7c3aed" fill-opacity="0.88" stroke="none"/>
<text x="89.6" y="131" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">depreciation</text>
<rect x="129" y="110" width="11" height="32" rx="2" fill="#d97706" fill-opacity="0.88" stroke="none"/>
<rect x="140" y="110" width="14" height="32" rx="2" fill="#94a3b8" fill-opacity="0.88" stroke="none"/>
<rect x="154" y="110" width="8" height="32" rx="2" fill="#64748b" fill-opacity="0.88" stroke="none"/>
<rect x="162" y="110" width="7" height="32" rx="2" fill="#334155" fill-opacity="0.88" stroke="none"/>
<text x="176.79999999999998" y="132" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">$1.65</text>
<text x="50" y="186.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Hyperscaler committed H100 (512)</text>
<rect x="50" y="194" width="180" height="32" rx="2" fill="#2563eb" fill-opacity="0.88" stroke="none"/>
<text x="140.0" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">effective commitment</text>
<text x="238.0" y="216" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">$2.50</text>
<text x="50" y="270.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Neocloud B200 (256)</text>
<rect x="50" y="278" width="256" height="32" rx="2" fill="#059669" fill-opacity="0.88" stroke="none"/>
<text x="177.8" y="299" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">contract</text>
<rect x="306" y="278" width="18" height="32" rx="2" fill="#94a3b8" fill-opacity="0.88" stroke="none"/>
<text x="331.6" y="300" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">$3.80</text>
<text x="50" y="354.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Hyperscaler on-demand H100 (≤ 256)</text>
<rect x="50" y="362" width="497" height="32" rx="2" fill="#dc2626" fill-opacity="0.88" stroke="none"/>
<text x="298.4" y="383" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">on-demand</text>
<text x="554.8" y="384" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">$6.90</text>
<text x="50" y="425.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">on-prem “$0.15” was the power bill alone; all-in it's $1.65</text>
<rect x="840" y="60" width="430" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="852" y="82.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Healthy hours in the denominator</text>
<text x="852" y="105.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">repair time is part of the rate, not a separate charge</text>
<rect x="840" y="190" width="430" height="110" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="852" y="212.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Life assumption dominates</text>
<text x="852" y="235.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">36 vs 60 months moves the on-prem rate by 40%+; record it per</text>
<text x="852" y="249.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">pool</text>
<rect x="840" y="320" width="430" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="852" y="342.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Compare work, not just hours</text>
<text x="852" y="365.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">B200 vs H100: normalize by throughput for planning</text>
<rect x="30" y="470" width="1240" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="50" y="500" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Monthly: on-prem $1.23M · committed $0.93M · on-demand $0.60M · neocloud $0.71M · storage, network, platform $0.60M</text>
<text x="50" y="530" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">= $4.08M, the total attribution must reconcile to</text></svg>

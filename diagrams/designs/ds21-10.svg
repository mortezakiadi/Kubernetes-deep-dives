<text x="50" y="546" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Before: HPA on GPU utilization never scaled down overnight; morning replicas took 9 minutes to become ready.</text></svg>

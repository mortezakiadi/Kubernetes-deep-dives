<svg xmlns="http://www.w3.org/2000/svg" width="1240px" height="480px" viewBox="0 0 1240 480" style="background:#ffffff"><title>Multi-tenant isolation and GPU sharing</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1240" height="480" fill="#ffffff"/><text x="620" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Three tenant classes, three ways to share a GPU</text>
<rect x="40" y="60" width="370" height="130" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="52" y="84" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">Shared (default)</text>
<text x="52" y="108" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Namespace per team per cluster, RBAC, LocalQueue</text>
<text x="52" y="124" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">and quotas, default-deny NetworkPolicy, restricted</text>
<text x="52" y="140" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Pod Security, Pod Identity per team</text>
<text x="52" y="160" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">Shared: nodes, control plane</text>
<rect x="435" y="60" width="370" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="447" y="84" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Dedicated nodes</text>
<text x="447" y="108" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Everything in Shared, plus the tenant's own</text>
<text x="447" y="124" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">tainted NodePools and its own ClusterQueue and</text>
<text x="447" y="140" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">flavor</text>
<text x="447" y="160" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">Shared: control plane only</text>
<rect x="830" y="60" width="370" height="130" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="842" y="84" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">Dedicated cluster</text>
<text x="842" y="108" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">A separate worker cluster, still joined to the hub</text>
<text x="842" y="124" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">through MultiKueue and to the fleet through GitOps</text>
<text x="842" y="144" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">Shared: nothing but the platform tooling</text>
<path d="M 60 215 L 1180 215" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#a-ok)"/>
<text x="620" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">stronger isolation, higher cost</text>
<text x="620" y="295" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">GPU sharing</text>
<rect x="40" y="315" width="370" height="100" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="52" y="339" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Whole GPU</text>
<text x="52" y="363" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">One pod owns the GPU. Training and large models.</text>
<text x="52" y="383" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#047857">Across tenants: yes</text>
<rect x="435" y="315" width="370" height="100" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="447" y="339" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">MIG slice (via DRA)</text>
<text x="447" y="363" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Hardware partition with its own memory and</text>
<text x="447" y="379" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">compute. Small models, development.</text>
<text x="447" y="399" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#047857">Across tenants: yes</text>
<rect x="830" y="315" width="370" height="100" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="842" y="339" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Time-slicing</text>
<text x="842" y="363" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Pods take turns on one GPU. No memory isolation.</text>
<text x="842" y="379" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Notebooks, development.</text>
<text x="842" y="399" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#b91c1c">Across tenants: never. One team only.</text>
<text x="620" y="455" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#475569" font-style="italic">Side door closed: a policy rejects any GPU pod without a Kueue queue label, and GPU nodes are tainted.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="520px" viewBox="0 0 1300 520" style="background:#ffffff"><title>SFT mixture, masking and packing</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="520" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">An SFT run: a weighted mixture, filtered, masked and packed</text>
<rect x="40" y="80" width="224" height="60" fill="#94a3b8" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<text x="48" y="108.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">General chat</text>
<text x="48" y="126" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">40%</text>
<rect x="264" y="80" width="140" height="60" fill="#2563eb" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<text x="272.0" y="108.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Domain</text>
<text x="272.0" y="126" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">25%</text>
<rect x="404" y="80" width="112" height="60" fill="#d97706" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<text x="412.0" y="108.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Reasoning</text>
<text x="412.0" y="126" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">20%</text>
<rect x="516" y="80" width="56" height="60" fill="#059669" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<rect x="572" y="80" width="28" height="60" fill="#dc2626" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<text x="40" y="165" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Code 10% · Safety 5% · weights, not raw counts, decide what the model sees</text>
<text x="40" y="185.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">Raising 'Reasoning' improves math and changes style everywhere</text>
<rect x="660" y="70" width="600" height="120" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="672" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Quality filters per source</text>
<text x="672" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">dedupe; decontaminate against eval sets; length and format checks; quality score from a</text>
<text x="672" y="131" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">classifier or judge</text>
<text x="40" y="240" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Loss masking: learn the assistant's turns only</text>
<rect x="40" y="255" width="154" height="50" rx="6" fill="#e2e8f0" fill-opacity="1"/>
<text x="50" y="285.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#475569">system · masked</text>
<rect x="200" y="255" width="254" height="50" rx="6" fill="#e2e8f0" fill-opacity="1"/>
<text x="210" y="285.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#475569">user · masked</text>
<rect x="460" y="255" width="334" height="50" rx="6" fill="#059669" fill-opacity="0.85"/>
<text x="470" y="285.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">assistant · loss</text>
<rect x="800" y="255" width="154" height="50" rx="6" fill="#e2e8f0" fill-opacity="1"/>
<text x="810" y="285.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#475569">user · masked</text>
<rect x="960" y="255" width="294" height="50" rx="6" fill="#059669" fill-opacity="0.85"/>
<text x="970" y="285.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">assistant · loss</text>
<text x="40" y="350" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Packing: several short conversations per sequence, attention kept within each</text>
<rect x="40" y="365" width="294" height="44" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
<text x="50" y="392" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">conversation 1</text>
<rect x="340" y="365" width="214" height="44" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
<text x="350" y="392" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">conversation 2</text>
<rect x="560" y="365" width="374" height="44" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
<text x="570" y="392" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">conversation 3</text>
<rect x="940" y="365" width="254" height="44" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
<text x="950" y="392" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">conversation 4</text>
<text x="40" y="445.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Chat template in training must equal the one used at serving time.</text>
<text x="40" y="470" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">Rejection sampling (generate, keep verified-correct, train) is a cheap step between SFT and RL.</text></svg>

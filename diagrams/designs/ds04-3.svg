<rect x="250" y="370" width="690" height="34" rx="6" fill="#eff6ff" stroke="#2563eb"/>
<text x="595" y="392" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Replay of steps 1–4: no model calls, no tool calls, no cost, in milliseconds</text>
<rect x="40" y="440" width="600" height="96" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="52" y="463" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Workflow code: decides</text>
<text x="52" y="486" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">The agent loop. Must make the same decisions given the same recorded results: no direct</text>
<text x="52" y="501" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">model calls, clocks, random numbers or file reads.</text>
<rect x="660" y="440" width="600" height="96" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="672" y="463" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Activities: do</text>
<text x="672" y="486" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Model calls, tool calls, sandbox commands, snapshots. Inputs and results recorded; retried</text>
<text x="672" y="501" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">with backoff; long ones heartbeat.</text></svg>

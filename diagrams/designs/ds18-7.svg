<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="560px" viewBox="0 0 1300 560" style="background:#ffffff"><title>Portable environment</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="560" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Layers that make a job behave the same on every site</text>
<rect x="30" y="70" width="760" height="56" rx="8" fill="#bfdbfe" stroke="#2563eb"/>
<text x="50" y="94.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#2563eb">Researcher code</text>
<text x="50" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">same everywhere</text>
<rect x="30" y="136" width="760" height="56" rx="8" fill="#d1fae5" stroke="#047857"/>
<text x="50" y="160.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#047857">Blessed base image</text>
<text x="50" y="180" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">CUDA + NCCL + PyTorch, tested against every site's driver</text>
<rect x="30" y="202" width="760" height="56" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text x="50" y="226.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#d97706">Fabric layer (per site)</text>
<text x="50" y="246" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">NCCL net plugin + settings: EFA / IB / RoCE / GPUDirect</text>
<rect x="30" y="268" width="760" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
<text x="50" y="292.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#7c3aed">Container runtime</text>
<text x="50" y="312" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">containerd (K8s) or Enroot + Pyxis (Slurm): same OCI image</text>
<rect x="30" y="334" width="760" height="56" rx="8" fill="#f1f5f9" stroke="#64748b"/>
<text x="50" y="358.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#64748b">Node: driver + devices</text>
<text x="50" y="378" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">driver version in the compatibility matrix</text>
<rect x="830" y="70" width="440" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="842" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Registry mirrors</text>
<text x="842" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">push once; replicated / pull-through cache at each site; lazy</text>
<text x="842" y="131" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">loading for very large images</text>
<rect x="830" y="240" width="440" height="156" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="842" y="263" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Startup check (seconds)</text>
<text x="842" y="286" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">GPUs, driver, mounts, NCCL transport + a short all-reduce: fail</text>
<text x="842" y="301" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">fast with a clear message, exit 42</text>
<rect x="30" y="430" width="1240" height="100" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="462.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: a CUDA driver mismatch crashed one site; on another, NCCL silently fell back to TCP and ran 40% slower.</text>
<text x="50" y="488" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Placement rejects sites whose driver is too old for the image; the startup check catches transport fallback.</text></svg>

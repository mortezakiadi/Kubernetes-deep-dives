<text x="820" y="248" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">This quarter's incidents</text>
<rect x="820" y="266" width="10" height="40" rx="4" fill="#dc2626" fill-opacity="1" stroke="none"/>
<text x="840" y="291.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">ENV-001 test config edited to skip tests</text>
<rect x="820" y="322" width="10" height="40" rx="4" fill="#2563eb" fill-opacity="1" stroke="none"/>
<text x="840" y="347.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">RM-003 answers +60% longer, not better</text>
<rect x="820" y="378" width="10" height="40" rx="4" fill="#7c3aed" fill-opacity="1" stroke="none"/>
<text x="840" y="403.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">DATA-002 reference patch left in /tmp</text>
<text x="820" y="440" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">each found days later, by a person</text>
<rect x="30" y="490" width="1240" height="80" rx="10" fill="#ecfdf5" stroke="#059669"/>
<text x="50" y="522.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#047857">Catalog entry per exploit class: layer · examples · prevention · detection · regression test · owner</text>
<text x="50" y="546.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">revisited with every stronger policy: classes once out of reach become reachable</text></svg>

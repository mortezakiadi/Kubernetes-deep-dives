<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="560px" viewBox="0 0 1300 560" style="background:#ffffff"><title>Domain contract</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="560" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">A task family joins the mixture through one contract</text>
<rect x="30" y="70" width="430" height="85" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="93.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1e40af">Data</text>
<text x="42" y="117.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">versioned, deduped, decontaminated against every family's</text>
<text x="42" y="132.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">evals</text>
<path d="M 460 112 L 540 260" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="170" width="430" height="85" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="193.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#065f46">Verifier / judge</text>
<text x="42" y="217.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">registered, measured precision (Design 10)</text>
<path d="M 460 212 L 540 260" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="270" width="430" height="85" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="42" y="293.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#92400e">Eval suite + margin</text>
<text x="42" y="317.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">what better and no-worse mean</text>
<path d="M 460 312 L 540 260" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="370" width="430" height="85" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="393.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Owner + on-call</text>
<text x="42" y="417.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">who answers for regressions and exploits</text>
<path d="M 460 412 L 540 260" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="540" y="190" width="300" height="140" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="552" y="212.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Admission test</text>
<text x="552" y="235.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">proxy run at a small weight; measure the new</text>
<text x="552" y="249.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">row and column of the transfer matrix; gate</text>
<text x="552" y="264.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">must pass for all families</text>
<path d="M 840 260 L 900 260" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="900" y="170" width="370" height="180" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="912" y="193" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Joins the mixture</text>
<text x="912" y="216" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">floor weight to start; the mixture team owns weights,</text>
<text x="912" y="231" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">order and the gate; domain team owns its family</text>
<rect x="30" y="480" width="1240" height="60" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="503" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Small domains can share a group (e.g. professional domains) with shared evals and a group floor</text></svg>

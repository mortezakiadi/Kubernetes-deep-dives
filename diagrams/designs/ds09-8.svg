<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="560px" viewBox="0 0 1300 560" style="background:#ffffff"><title>Off-policy controller</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="560" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">A controller with graduated responses</text>
<rect x="30" y="90" width="260" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="113" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Off-policy metrics</text>
<text x="42" y="136" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ratio tail, ESS, behavior KL,</text>
<text x="42" y="151" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">clip/mask, entropy slope</text>
<rect x="360" y="90" width="220" height="120" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="372" y="114" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Controller</text>
<text x="372" y="138" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">rules with windows and</text>
<text x="372" y="154" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">hysteresis</text>
<path d="M 290 150 L 360 150" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="680" y="60" width="590" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="692" y="83.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#065f46">Level 1 · tighten</text>
<text x="692" y="107.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">lower staleness limit; less replay/external; reload engines sooner</text>
<path d="M 580 150 L 680 110" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="680" y="180" width="590" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="692" y="203.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#92400e">Level 2 · protect the update</text>
<text x="692" y="227.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">skip outlier batch; halve LR for 50 steps</text>
<path d="M 580 150 L 680 230" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="680" y="300" width="590" height="100" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="692" y="323.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#991b1b">Level 3 · recover</text>
<text x="692" y="347.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">roll back to last healthy checkpoint, keep tighter settings, page on-call</text>
<path d="M 580 150 L 680 350" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="280" width="550" height="100" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="303" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Relax slowly</text>
<text x="42" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">loosen one notch only after 200 healthy steps, so the controller doesn't oscillate</text>
<rect x="30" y="410" width="1240" height="100" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="433" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Every action is an event on the run timeline</text>
<text x="42" y="456" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">with the triggering metric values; the run's effective configuration at any step can be reconstructed. Healthy checkpoints are tagged automatically.</text></svg>

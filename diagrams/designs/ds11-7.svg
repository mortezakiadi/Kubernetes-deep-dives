<text x="312" y="222.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Trim + sign</text>
<text x="312" y="245.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">keep top 20%;</text>
<text x="312" y="259.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">agreeing signs</text>
<rect x="480" y="200" width="130" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="492" y="223" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Merged</text>
<text x="492" y="246" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">base + Σ w·Δ</text>
<path d="M 450 260 L 480 260" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<text x="60" y="400" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">fast · needs shared base + tokenizer · tune w on the multi-family gate</text>
<rect x="670" y="60" width="600" height="360" rx="14" fill="#fffbeb" fill-opacity=".55" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="684" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#92400e">MULTI-TEACHER ON-POLICY DISTILLATION</text>

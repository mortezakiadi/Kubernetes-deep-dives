<rect x="60" y="260" width="180" height="44" rx="6" fill="#0891b2" fill-opacity=".2" stroke="#0891b2"/>
<text x="150" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0891b2">agents Δ = spec − base</text>

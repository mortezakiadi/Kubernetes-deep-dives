<rect x="1000" y="180" width="240" height="64" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="1012" y="202.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">agents teacher</text>
<text x="1012" y="225.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">per-token reverse KL</text>
<path d="M 920 155 L 1000 212" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="1000" y="260" width="240" height="64" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="1012" y="282.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">math teacher</text>
<text x="1012" y="305.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">per-token reverse KL</text>
<path d="M 920 155 L 1000 292" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="700" y="260" width="220" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="712" y="282.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Update</text>
<text x="712" y="305.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">dense signal per token</text>
<path d="M 810 200 L 810 260" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<text x="700" y="400" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">teachers can diverge · student can be smaller · shared tokenizer</text>
<rect x="30" y="450" width="1240" height="100" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="473.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Choose by evidence</text>
<text x="42" y="497.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">Merge first (cheap); distill when specialists diverged, the student is smaller, or merging shows interference. Merging several generalist checkpoints also reduces trade-offs.</text></svg>

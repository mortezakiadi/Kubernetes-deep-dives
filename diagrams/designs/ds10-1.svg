<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="560px" viewBox="0 0 1300 560" style="background:#ffffff"><title>Reward failure modes</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="560" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Seven ways a reward can make RL look better than it is</text>
<rect x="30" y="60" width="400" height="400" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="44" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#0f172a">THE VERIFIER IS WRONG</text>
<rect x="50" y="100" width="360" height="95" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="62" y="123.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#991b1b">False positives</text>
<text x="62" y="147.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">accepts wrong answers; RL seeks these out</text>
<rect x="50" y="215" width="360" height="95" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="62" y="238.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#92400e">False negatives</text>
<text x="62" y="262.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">rejects equivalent forms; slows learning</text>
<rect x="50" y="330" width="360" height="95" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="62" y="353.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#92400e">Brittle verifiers</text>
<text x="62" y="377.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">0.5 vs 1/2, whitespace, key order</text>
<rect x="450" y="60" width="400" height="400" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="464" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#0f172a">THE POLICY GAMES IT</text>
<rect x="470" y="100" width="360" height="95" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="482" y="123.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#991b1b">Reward shortcuts</text>
<text x="482" y="147.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">satisfies the check, skips the task</text>
<rect x="470" y="215" width="360" height="95" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="482" y="238.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#991b1b">Judge exploits</text>
<text x="482" y="262.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">openers, confident tone, injected text</text>
<rect x="470" y="330" width="360" height="95" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="482" y="353.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#991b1b">Environment exploits</text>
<text x="482" y="377.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">edit tests, crash the harness, read answers</text>
<rect x="870" y="60" width="400" height="400" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="884" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#0f172a">THE MEASUREMENT LEAKS</text>
<rect x="890" y="100" width="360" height="95" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="902" y="123.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1e40af">Shared or contaminated evals</text>
<text x="902" y="147.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">eval uses the training verifier or data</text>
<rect x="30" y="480" width="1240" height="56" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="514.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Precision on the policy's own outputs is what matters: the optimizer finds what you didn't test, and hacking grows with compute.</text></svg>

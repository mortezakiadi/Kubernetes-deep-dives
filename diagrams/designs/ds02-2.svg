<svg xmlns="http://www.w3.org/2000/svg" width="1240px" height="560px" viewBox="0 0 1240 560" style="background:#ffffff"><title>Four layers of scheduling decisions</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1240" height="560" fill="#ffffff"/><text x="620" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Every batch job passes four decisions, each with one owner</text>
<rect x="40" y="70" width="250" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="52" y="94" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Which cluster?</text>
<text x="52" y="118" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">MultiKueue (hub)</text>
<circle cx="40" cy="70" r="12" fill="#334155"/>
<text x="40" y="74.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">1</text>
<rect x="310" y="70" width="520" height="96" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="322" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Decides</text>
<text x="322" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Team quota in the fleet-wide ClusterQueue; offer the job to worker clusters</text>
<rect x="850" y="70" width="350" height="96" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="862" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Pending here means</text>
<text x="862" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the team is over its fleet share, or no worker has</text>
<text x="862" y="131" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">room</text>
<path d="M 165 166 L 165 188" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="40" y="188" width="250" height="96" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="52" y="212" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">Whether, and where in the</text>
<text x="52" y="230" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">cluster?</text>
<text x="52" y="254" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Kueue (worker)</text>
<circle cx="40" cy="188" r="12" fill="#334155"/>
<text x="40" y="192.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">2</text>
<rect x="310" y="188" width="520" height="96" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="322" y="211" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Decides</text>
<text x="322" y="234" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Local quota, borrowing from the cohort, topology block. Whole job admitted at</text>
<text x="322" y="249" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">once, or not at all</text>
<rect x="850" y="188" width="350" height="96" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="862" y="211" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Pending here means</text>
<text x="862" y="234" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">no local quota, or no block of nodes close enough</text>
<path d="M 165 284 L 165 306" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="40" y="306" width="250" height="96" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="52" y="330" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Which node and which GPU?</text>
<text x="52" y="354" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">kube-scheduler + DRA</text>
<circle cx="40" cy="306" r="12" fill="#334155"/>
<text x="40" y="310.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">3</text>
<rect x="310" y="306" width="520" height="96" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="322" y="329" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Decides</text>
<text x="322" y="352" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Place each pod; ResourceClaims for whole GPUs or MIG slices; follow Kueue's</text>
<text x="322" y="367" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">topology assignment</text>
<rect x="850" y="306" width="350" height="96" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="862" y="329" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Pending here means</text>
<text x="862" y="352" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">taints, affinity or device attributes don't match</text>
<path d="M 165 402 L 165 424" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="40" y="424" width="250" height="96" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="52" y="448" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">Buy the node?</text>
<text x="52" y="472" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Karpenter</text>
<circle cx="40" cy="424" r="12" fill="#334155"/>
<text x="40" y="428.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">4</text>
<rect x="310" y="424" width="520" height="96" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="322" y="447" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Decides</text>
<text x="322" y="470" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Launch a node from the best NodePool: reserved, then on-demand, then Spot</text>
<rect x="850" y="424" width="350" height="96" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="862" y="447" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Pending here means</text>
<text x="862" y="470" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">NodePool limits reached, or no capacity of that</text>
<text x="862" y="485" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">type</text>
<text x="620" y="545" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#475569" font-style="italic">The Workload object records layers 1 and 2, including the chosen cluster, so 'why is it pending?' has one answer.</text></svg>

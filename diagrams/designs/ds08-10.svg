<text x="692" y="468" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">agreement with expensive MC estimates</text>
<rect x="30" y="440" width="620" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="463" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Private long-horizon eval set</text>
<text x="42" y="486" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">fresh-environment verification, human-checked; never trained on. Report cost per solved task.</text></svg>

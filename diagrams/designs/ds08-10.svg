<text x="692" y="357" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Pathologies</text>
<text x="692" y="380" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">early stop, loops, false success claims, length</text>

<text x="692" y="269" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Recovery rate</text>
<text x="692" y="292" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">success after an intermediate check fails</text>

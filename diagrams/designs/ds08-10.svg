<text x="692" y="181" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Partial progress</text>
<text x="692" y="204" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">milestones reached on failed episodes</text>

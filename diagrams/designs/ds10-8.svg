<text x="832" y="188" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Perturbation tests</text>
<text x="832" y="211" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">equivalent rewrites; shortcuts break, skills don't</text>

<text x="832" y="283" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Shortcut detectors</text>
<text x="832" y="306" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">multi-answer, hedging, length, openers, test-file access</text>

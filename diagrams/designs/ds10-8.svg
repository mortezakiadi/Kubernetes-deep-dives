<text x="832" y="378" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Human review</text>
<text x="832" y="401" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">fixed daily sample; confirmed exploit → stop promotion</text>
<rect x="80" y="470" width="1190" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="92" y="493" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Sustained gap → pause promotion; past a threshold → pause the run (same controller pattern as Design 09)</text></svg>

<text x="962" y="362" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Budgets as a setting</text>
<text x="962" y="384" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">fixed token budget: does it stop gracefully? also</text>
<text x="962" y="398" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">plotted vs wall time</text>
<rect x="30" y="505" width="1240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="537.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: nobody looked at cost. v8 was better and unprofitable on long tasks for a fixed-price product;</text>

<text x="1164.4" y="137.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">66%</text>
<text x="1000" y="162" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">verifier passes null</text>
<rect x="1000" y="168" width="60" height="16" rx="4" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="1066.0" y="181.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">25%</text>
<text x="1000" y="206" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">flaky</text>
<rect x="1000" y="212" width="14" height="16" rx="4" fill="#d97706" fill-opacity="0.85" stroke="none"/>
<text x="1020.4" y="225.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">6%</text>
<text x="1000" y="250" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">gold fails</text>
<rect x="1000" y="256" width="7" height="16" rx="4" fill="#64748b" fill-opacity="0.85" stroke="none"/>
<text x="1013.2" y="269.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">3%</text>
<rect x="30" y="320" width="1240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="352.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: a quarter of verifiers passed on the unchanged repository; agents were rewarded for doing nothing.</text>
<text x="50" y="378" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Another 6% failed randomly (network, timing).</text>
<rect x="30" y="430" width="400" height="100" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="42" y="452.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Adversarial cheap attempts</text>
<text x="42" y="475.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">delete failing tests, hard-code outputs: must fail</text>
<rect x="448" y="430" width="400" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="460" y="452.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Repair queue for flaky</text>
<text x="460" y="475.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">seed randomness, mock time, vendor deps</text>
<rect x="866" y="430" width="400" height="100" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="878" y="452.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Cost recorded</text>
<text x="878" y="475.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">build + validation seconds per task</text></svg>

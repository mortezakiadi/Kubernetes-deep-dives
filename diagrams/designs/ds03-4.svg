<svg xmlns="http://www.w3.org/2000/svg" width="1180px" height="620px" viewBox="0 0 1180 620" style="background:#ffffff"><title>Training storage tiers</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1180" height="620" fill="#ffffff"/><text x="590" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Keep the GPUs fed: each tier is faster and smaller than the one below</text>
<rect x="425.0" y="70" width="330" height="96" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="590.0" y="112.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">GPU memory</text>
<text x="590.0" y="136.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Model, optimizer state, current batch</text>
<rect x="365.0" y="190" width="450" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="590.0" y="232.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Local NVMe (per node)</text>
<text x="590.0" y="256.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Data loader cache, checkpoint shards first, image layers</text>
<rect x="305.0" y="310" width="570" height="96" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="590.0" y="352.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">FSx for Lustre (shared)</text>
<text x="590.0" y="376.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Linked to S3: datasets loaded lazily, checkpoints exported in the background</text>
<rect x="245.0" y="430" width="690" height="96" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="590.0" y="472.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">S3 (durable, regional)</text>
<text x="590.0" y="496.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Datasets, final checkpoints, model artifacts. Source of truth.</text>
<path d="M 130 480 L 130 120" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#a-ok)"/>
<text x="30" y="80" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">data read path</text>
<text x="30" y="96" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#047857">S3 → FSx → cache → GPU</text>
<path d="M 1050 120 L 1050 480" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#a-blue)"/>
<text x="1150" y="80" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">checkpoint path</text>
<text x="1150" y="96" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1d4ed8">GPU → NVMe in seconds, then FSx and S3</text>
<rect x="860" y="540" width="300" height="66" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="872" y="562" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Simple path: Mountpoint for S3</text>
<text x="872" y="584" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">For large sequential files, mount S3 directly</text>
<text x="40" y="578.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#475569">Pack small files into large shards. Keep data in the same region as the GPUs.</text></svg>

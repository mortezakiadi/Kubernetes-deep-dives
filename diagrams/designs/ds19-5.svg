<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="580px" viewBox="0 0 1300 580" style="background:#ffffff"><title>Simulation</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="580" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Replay last month's jobs against each candidate policy (illustrative)</text>
<text x="288" y="108" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">baseline (calibration)</text>
<rect x="300" y="88" width="325" height="30" rx="4" fill="#2563eb" fill-opacity=".85"/>
<rect x="614" y="98" width="22" height="10" fill="#0f172a" fill-opacity=".35"/>
<text x="648.8" y="108.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">58%  · p90 wait 256-GPU: 70 h</text>
<line x1="619" y1="82" x2="619" y2="124" stroke="#047857" stroke-width="3"/>
<text x="288" y="172" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">+ gang admission</text>
<rect x="300" y="152" width="342" height="30" rx="4" fill="#2563eb" fill-opacity=".85"/>
<rect x="630" y="162" width="22" height="10" fill="#0f172a" fill-opacity=".35"/>
<text x="665.5999999999999" y="172.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">61%  · p90 wait 256-GPU: 64 h</text>
<text x="288" y="236" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">+ idle reclaim</text>
<rect x="300" y="216" width="370" height="30" rx="4" fill="#2563eb" fill-opacity=".85"/>
<rect x="658" y="226" width="22" height="10" fill="#0f172a" fill-opacity=".35"/>
<text x="693.6" y="236.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">66%  · p90 wait 256-GPU: 60 h</text>
<text x="288" y="300" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">+ bin-packing</text>
<rect x="300" y="280" width="398" height="30" rx="4" fill="#2563eb" fill-opacity=".85"/>
<rect x="686" y="290" width="22" height="10" fill="#0f172a" fill-opacity=".35"/>
<text x="721.5999999999999" y="300.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">71%  · p90 wait 256-GPU: 30 h</text>
<text x="288" y="364" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">+ fair-share cohorts</text>
<rect x="300" y="344" width="414" height="30" rx="4" fill="#2563eb" fill-opacity=".85"/>
<rect x="703" y="354" width="22" height="10" fill="#0f172a" fill-opacity=".35"/>
<text x="738.4" y="364.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">74%  · p90 wait 256-GPU: 28 h</text>
<text x="300" y="420" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">blue = simulated active utilization (dark band = range from perturbed runtimes) · green tick = measured baseline</text>
<rect x="30" y="450" width="400" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="472.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Calibrate first</text>
<text x="42" y="495.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">simulated baseline 58% vs measured 57%: within a few points,</text>
<text x="42" y="509.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">so predictions are usable</text>
<rect x="450" y="450" width="400" height="110" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="462" y="472.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Simulate guardrails too</text>
<text x="462" y="495.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">a gain that triples large-job waits isn't a gain</text>
<rect x="870" y="450" width="400" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="882" y="472.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Ranges, not promises</text>
<text x="882" y="495.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">network, image pulls and failures aren't modeled; confirm in</text>
<text x="882" y="509.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">the cluster</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>Rollout scheduling</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Three ways to schedule rollout and training</text>
<text x="30" y="92" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Synchronous</text>
<text x="30" y="112" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569">on-policy; GPUs alternate</text>
<rect x="330" y="70" width="260" height="28" rx="4" fill="#d97706" fill-opacity=".85"/>
<text x="336" y="89.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">generate 1 (waits for slowest)</text>
<rect x="590" y="70" width="120" height="28" rx="4" fill="#2563eb" fill-opacity=".85"/>
<text x="596" y="89.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">train 1</text>
<rect x="710" y="70" width="260" height="28" rx="4" fill="#d97706" fill-opacity=".85"/>
<text x="716" y="89.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">generate 2</text>
<rect x="970" y="70" width="120" height="28" rx="4" fill="#2563eb" fill-opacity=".85"/>
<text x="976" y="89.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">train 2</text>
<text x="30" y="202" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">One-step off-policy</text>
<text x="30" y="222" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569">next batch generates while this one trains</text>
<rect x="330" y="180" width="260" height="28" rx="4" fill="#d97706" fill-opacity=".85"/>
<text x="336" y="199.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">generate 1</text>
<rect x="590" y="180" width="260" height="28" rx="4" fill="#d97706" fill-opacity=".85"/>
<text x="596" y="199.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">generate 2</text>
<rect x="850" y="180" width="260" height="28" rx="4" fill="#d97706" fill-opacity=".85"/>
<text x="856" y="199.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">generate 3</text>
<rect x="590" y="214" width="120" height="28" rx="4" fill="#2563eb" fill-opacity=".85"/>
<text x="596" y="233.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">train 1</text>
<rect x="850" y="214" width="120" height="28" rx="4" fill="#2563eb" fill-opacity=".85"/>
<text x="856" y="233.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">train 2</text>
<rect x="1110" y="214" width="120" height="28" rx="4" fill="#2563eb" fill-opacity=".85"/>
<text x="1116" y="233.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">train 3</text>
<text x="30" y="332" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Fully asynchronous</text>
<text x="30" y="352" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569">streaming buffer; weights pushed periodically</text>
<rect x="330" y="310" width="880" height="28" rx="4" fill="#d97706" fill-opacity=".85"/>
<text x="336" y="329.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">rollout pool: continuous generation, partial rollouts, staleness ≤ k</text>
<rect x="400" y="344" width="810" height="28" rx="4" fill="#2563eb" fill-opacity=".85"/>
<text x="406" y="363.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">training pool: consumes the buffer continuously</text>
<rect x="30" y="430" width="600" height="140" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="42" y="453" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Staleness</text>
<text x="42" y="476" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Async samples come from older policy versions. Use importance-sampling corrections and a</text>
<text x="42" y="491" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">staleness limit; compare the reward curve with a synchronous run before trusting the</text>
<text x="42" y="506" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">speed-up.</text>
<rect x="670" y="430" width="600" height="140" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="682" y="453" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Train–inference mismatch</text>
<text x="682" y="476" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">vLLM/SGLang and FSDP/Megatron compute slightly different probabilities for the same</text>
<text x="682" y="491" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">tokens. Fixes: truncated or masked IS, matching numerics, rollout routing replay for MoE.</text></svg>

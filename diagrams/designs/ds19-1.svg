<text x="152" y="212.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Unhealthy (reported)</text>
<text x="152" y="235.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">nodes in repair: 3% · not in the denominator</text>

<text x="512" y="516" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">0.76 × 0.76 · the headline the scheduler is</text>
<text x="512" y="531" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">judged on</text>
<rect x="860" y="470" width="300" height="100" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>

<text x="902" y="271" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">≈ √(2 × checkpoint cost × job MTBF) (Young–Daly)</text>
<rect x="890" y="350" width="380" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="902" y="372.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Restart time dominates</text>

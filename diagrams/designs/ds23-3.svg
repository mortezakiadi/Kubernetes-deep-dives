Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Active checks by cost and by when the node can spare the time</text>
<rect x="30" y="70" width="530" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="92.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Preflight — seconds · at job start</text>
<text x="42" y="115.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">GPUs visible, healthy, unused; small collective with neighbours</text>
<rect x="50" y="170" width="630" height="86" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="62" y="192.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Between jobs — minutes · idle node</text>
<text x="62" y="215.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">dcgmi diag -r 1/2 · nvbandwidth · compare to fleet distribution</text>

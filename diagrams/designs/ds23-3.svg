<text x="50" y="420.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: one GPU at 60% NVLink bandwidth passed every passive check; every 512-GPU job</text>
<text x="50" y="446" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">that included it ran at the speed of its slowest rank.</text>
<rect x="30" y="490" width="610" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="512" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">Performance outliers are faults</text>
<text x="42" y="534" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">robust z-score &lt; −4 or 15% below median → flagged</text>
<rect x="660" y="490" width="610" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="620px" viewBox="0 0 1300 620" style="background:#ffffff"><title>Quantization gate</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="620" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Quantization options and the accuracy gate (illustrative numbers)</text>
<rect x="30" y="60" width="620" height="270" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="50" y="88" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">70B weight memory and relative decode throughput</text>
<text x="150" y="138" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">BF16</text>
<rect x="160" y="118" width="200" height="24" rx="4" fill="#94a3b8" fill-opacity="1" stroke="none"/>
<text x="366.0" y="136" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">140 GB</text>
<rect x="430" y="118" width="70" height="24" rx="4" fill="#94a3b8" fill-opacity="0.6" stroke="none"/>
<text x="505.5652173913044" y="136" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">1.0×</text>
<text x="150" y="208" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">FP8 W8A8</text>
<rect x="160" y="188" width="100" height="24" rx="4" fill="#2563eb" fill-opacity="1" stroke="none"/>
<text x="266.0" y="206" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">70 GB</text>
<rect x="430" y="188" width="111" height="24" rx="4" fill="#2563eb" fill-opacity="0.6" stroke="none"/>
<text x="547.304347826087" y="206" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">1.6×</text>
<text x="150" y="278" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">NVFP4 W4A4</text>
<rect x="160" y="258" width="54" height="24" rx="4" fill="#7c3aed" fill-opacity="1" stroke="none"/>
<text x="220.28571428571428" y="276" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">38 GB</text>
<rect x="430" y="258" width="160" height="24" rx="4" fill="#7c3aed" fill-opacity="0.6" stroke="none"/>
<text x="596.0" y="276" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">2.3×</text>
<text x="160" y="320.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#475569">weights</text>
<text x="430" y="320.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#475569">throughput (Blackwell)</text>
<rect x="670" y="60" width="290" height="125" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="682" y="82.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">FP8 (Hopper + Blackwell)</text>
<text x="682" y="105.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">near-lossless for large models; FP8 tensor</text>
<text x="682" y="119.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">cores</text>
<rect x="980" y="60" width="290" height="125" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="992" y="82.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">NVFP4 (Blackwell)</text>
<text x="992" y="105.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">block-scaled 4-bit; biggest gains; check</text>
<text x="992" y="119.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">per task, keep sensitive layers higher</text>
<rect x="670" y="205" width="290" height="125" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="682" y="227.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">FP8 KV cache</text>
<text x="682" y="250.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">2× tokens in memory; tested separately</text>
<rect x="980" y="205" width="290" height="125" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="992" y="227.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Calibrate on your traffic</text>
<text x="992" y="250.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">ModelOpt / LLM Compressor with</text>
<text x="992" y="264.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">production-like prompts</text>
<rect x="30" y="360" width="1240" height="170" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="50" y="388" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Gate: worst-case delta vs BF16 reference, per task family (NVFP4 candidate)</text>
<rect x="50" y="405" width="228" height="100" rx="8" fill="#ecfdf5" fill-opacity="1" stroke="#059669"/>
<text x="64" y="430.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">chat quality</text>
<text x="64" y="458.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">-0.2 pts (limit -0.5)</text>
<text x="64" y="484" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#047857">pass</text>
<rect x="294" y="405" width="228" height="100" rx="8" fill="#ecfdf5" fill-opacity="1" stroke="#059669"/>
<text x="308" y="430.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">math</text>
<text x="308" y="458.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">-0.6 pts (limit -1.0)</text>
<text x="308" y="484" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#047857">pass</text>
<rect x="538" y="405" width="228" height="100" rx="8" fill="#fef2f2" fill-opacity="1" stroke="#dc2626"/>
<text x="552" y="430.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">code pass@1</text>
<text x="552" y="458.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">-2.4 pts (limit -1.0)</text>
<text x="552" y="484" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">fail: stays FP8 for coding</text>
<rect x="782" y="405" width="228" height="100" rx="8" fill="#ecfdf5" fill-opacity="1" stroke="#059669"/>
<text x="796" y="430.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">long-context recall</text>
<text x="796" y="458.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">-0.9 pts (limit -1.5)</text>
<text x="796" y="484" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#047857">pass</text>
<rect x="1026" y="405" width="228" height="100" rx="8" fill="#ecfdf5" fill-opacity="1" stroke="#059669"/>
<text x="1040" y="430.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">tool use</text>
<text x="1040" y="458.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">-0.4 pts (limit -1.0)</text>
<text x="1040" y="484" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#047857">pass</text>
<rect x="30" y="550" width="1240" height="50" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="581" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Before: FP4 shipped after a throughput benchmark; a week later the coding team found more failing unit tests.</text></svg>

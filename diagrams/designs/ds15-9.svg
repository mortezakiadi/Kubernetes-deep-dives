<text x="1012" y="361" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">lineage diff</text>
<path d="M 940 230 L 1000 150" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<path d="M 940 270 L 1000 355" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a-bad)"/>
<rect x="30" y="450" width="1240" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="50" y="480" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Slow drifts (−1% a week) are caught by change-point detection on the nightly series, not by single comparisons.</text>
<text x="50" y="505" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Each benchmark has its own measured noise: some are stable to 0.5%, others vary 5% run to run.</text></svg>

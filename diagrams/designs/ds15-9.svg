<rect x="380" y="190" width="250" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="392" y="213" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Run benchmark</text>
<text x="392" y="236" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pinned harness + config</text>
<rect x="690" y="190" width="250" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>

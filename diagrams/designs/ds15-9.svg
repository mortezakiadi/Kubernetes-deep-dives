<rect x="30" y="162" width="280" height="78" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="185" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Serving / training image</text>
<text x="42" y="208" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">performance benchmarks</text>
<path d="M 310 201 L 380 250" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="254" width="280" height="78" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="277" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">New hardware pool</text>
<text x="42" y="300" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">both</text>
<path d="M 310 293 L 380 250" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="346" width="280" height="78" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="369" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Nightly</text>
<text x="42" y="392" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">all, on reference hardware</text>

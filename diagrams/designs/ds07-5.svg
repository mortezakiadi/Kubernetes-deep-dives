<text x="354" y="461" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">samples</text>
<rect x="654" y="400" width="296" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>

<text x="978" y="446" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">context parallelism; packing; batch by</text>
<text x="978" y="461" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">token count</text>
<text x="650" y="560.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Partial answers mix policy versions: record the version per token span for the correction.</text></svg>

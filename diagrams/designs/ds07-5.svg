<text x="666" y="446" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">route long requests to free engines;</text>
<text x="666" y="461" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">speculative decoding</text>
<rect x="966" y="400" width="296" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>

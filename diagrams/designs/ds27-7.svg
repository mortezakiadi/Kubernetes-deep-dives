<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="580px" viewBox="0 0 1300 580" style="background:#ffffff"><title>Quotas</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="580" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Limits on every shared resource, not just CPU and GPUs</text>
<text x="50" y="88" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">CPU / memory / storage</text>
<text x="50" y="108.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569">ResourceQuota, LimitRange</text>
<rect x="420" y="80" width="500" height="26" rx="3" fill="#e2e8f0" fill-opacity="1" stroke="none"/>
<rect x="420" y="80" width="310" height="26" rx="3" fill="#059669" fill-opacity="0.85" stroke="none"/>
<text x="930" y="99.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#059669">62%</text>
<text x="50" y="150" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Object counts</text>
<text x="50" y="170.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569">pods 2,000 · configmaps 500 · secrets 300</text>
<rect x="420" y="142" width="500" height="26" rx="3" fill="#e2e8f0" fill-opacity="1" stroke="none"/>
<rect x="420" y="142" width="420" height="26" rx="3" fill="#d97706" fill-opacity="0.85" stroke="none"/>
<text x="930" y="161.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#d97706">84%  ⚠ warning at 80%</text>
<text x="50" y="212" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">GPUs</text>
<text x="50" y="232.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Kueue queues, cohorts, fair share</text>
<rect x="420" y="204" width="500" height="26" rx="3" fill="#e2e8f0" fill-opacity="1" stroke="none"/>
<rect x="420" y="204" width="355" height="26" rx="3" fill="#059669" fill-opacity="0.85" stroke="none"/>
<text x="930" y="223.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#059669">71%</text>
<text x="50" y="274" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">API server</text>
<text x="50" y="294.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569">API Priority and Fairness per tenant</text>
<rect x="420" y="266" width="500" height="26" rx="3" fill="#e2e8f0" fill-opacity="1" stroke="none"/>
<rect x="420" y="266" width="150" height="26" rx="3" fill="#059669" fill-opacity="0.85" stroke="none"/>
<text x="930" y="285.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#059669">30%</text>
<text x="50" y="336" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Ingress requests</text>
<text x="50" y="356.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569">500 req/s per route (gateway policy)</text>
<rect x="420" y="328" width="500" height="26" rx="3" fill="#e2e8f0" fill-opacity="1" stroke="none"/>
<rect x="420" y="328" width="275" height="26" rx="3" fill="#059669" fill-opacity="0.85" stroke="none"/>
<text x="930" y="347.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#059669">55%</text>
<text x="50" y="398" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Telemetry</text>
<text x="50" y="418.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569">series, logs/day, query cost</text>
<rect x="420" y="390" width="500" height="26" rx="3" fill="#e2e8f0" fill-opacity="1" stroke="none"/>
<rect x="420" y="390" width="455" height="26" rx="3" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="930" y="409.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#dc2626">91%  ⚠ warning at 80%</text>
<text x="420" y="456" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">search-ranking usage against its quotas (illustrative)</text>
<rect x="30" y="480" width="1240" height="80" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="512.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: a batch job created 40,000 pods and 9,000 ConfigMaps; the API server slowed for everyone</text>
<text x="50" y="538" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">and etcd hit its storage limit. The tenant had a CPU quota, but no object or API limits.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 486" width="920" height="486" role="img" aria-label="In-cluster isolation"><title>In-cluster isolation</title><defs><marker id="ah-1f3a5f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="254.5" y="8" width="411.0" height="56" rx="8" fill="#dcebfb" stroke="#4a86c5" stroke-width="1.6"/><text x="460" y="33" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="800" fill="#14213d" text-anchor="middle">Layers between tenants on shared nodes</text><text x="460" y="54" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#2b3a4f" text-anchor="middle">a privileged debug pod saw everyone's traffic</text><rect x="14" y="82" width="592" height="390" rx="8" fill="#eaf1fb" stroke="#2f4f75" stroke-width="1.6"/><text x="28" y="105" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#14213d" text-anchor="start">Shared services</text><text x="171" y="105" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2b3a4f" text-anchor="start">check tenant identity per request</text><rect x="36" y="140" width="548" height="310" rx="8" fill="#f1f4f8" stroke="#7b8ba1" stroke-width="1.6"/><text x="50" y="163" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#14213d" text-anchor="start">Nodes</text><text x="107" y="163" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2b3a4f" text-anchor="start">tainted pools, sandboxes</text><rect x
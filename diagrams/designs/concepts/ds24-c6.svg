<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 406" width="920" height="406" role="img" aria-label="Rule hierarchy"><title>Rule hierarchy</title><defs><marker id="ah-1f3a5f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="292.5" y="8" width="335.0" height="56" rx="8" fill="#dcebfb" stroke="#4a86c5" stroke-width="1.6"/><text x="460" y="33" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="800" fill="#14213d" text-anchor="middle">One rule set, read by everyone</text><text x="460" y="54" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#2b3a4f" text-anchor="middle">five fleet numbers, 20 points apart</text><rect x="14" y="82" width="592" height="310" rx="8" fill="#eaf1fb" stroke="#2f4f75" stroke-width="1.6"/><text x="28" y="105" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#14213d" text-anchor="start">fleet:</text><text x="94" y="105" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2b3a4f" text-anchor="start">headline utilization</text><rect x="36" y="140" width="548" height="230" rx="8" fill="#fdf3d0" stroke="#c9a227" stroke-width="1.6"/><text x="50" y="163" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#14213d" text-anchor="start">pool: / team:</text><text x="176" y="163" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2b3a4f" text-anchor="start">sums with counts</text><rect x="58" y="198" width="504" height="150" rx="8" fill="#
t">Prometheus naming</text><rect x="622" y="244.0" width="284" height="148.0" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="622" y="244.0" width="284" height="32" rx="6" fill="#ece6fb" stroke="#7a5cc4" stroke-width="1.3"/><text x="764" y="266" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">Sums, not averages</text><line x1="656" y1="314.0" x2="656" y2="350.0" stroke="#2f4f75" stroke-width="2.2"/><line x1="636" y1="322.0" x2="676" y2="322.0" stroke="#2f4f75" stroke-width="2.2"/><path d="M 632.0 336.0 a 9.0 6.0 0 0 0 18.0 0 Z M 662.0 336.0 a 9.0 6.0 0 0 0 18.0 0 Z" fill="#fdf3d0" stroke="#2f4f75" stroke-width="1.8"/><path d="M 636 322.0 L 641.0 336.0 M 676 322.0 L 671.0 336.0" stroke="#2f4f75" stroke-width="1.4"/><line x1="646.0" y1="350.0" x2="666.0" y2="350.0" stroke="#2f4f75" stroke-width="2.2"/><line x1="686" y1="288.0" x2="686" y2="380.0" stroke="#9fb0c6" stroke-width="1.2"/><text x="698" y="338" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#14213d" text-anchor="start">ratios of totals</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 452" width="920" height="452" role="img" aria-label="Gang scheduling"><title>Gang scheduling</title><defs><marker id="ah-1f3a5f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="268.75" y="8" width="382.5" height="56" rx="8" fill="#dcebfb" stroke="#4a86c5" stroke-width="1.6"/><text x="460" y="33" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="800" fill="#14213d" text-anchor="middle">Half-started jobs hold GPUs forever</text><text x="460" y="54" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#2b3a4f" text-anchor="middle">two 64-GPU jobs, 80 GPUs free</text><rect x="14" y="82" width="340" height="132" rx="8" fill="#fde2e1" stroke="#c8504b" stroke-width="1.6"/><text x="28" y="105" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Per-pod</text><rect x="30" y="118" width="308" height="80" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="44.0" y="152.4" width="22.0" height="11.200000000000001" rx="5.6000000000000005" fill="none" stroke="#2b3a4f" stroke-width="2.6" transform="rotate(-35 55.0 158)"/><rect x="66.0" y="152.4" width="22.0" height="11.200000000000001" rx="5.6000000000000005" fill="none" stroke="#2b3a4f" stroke-width="2.6" transform="rotate(-35 77.0 158)"/><path d="M 63 144.0 l -3 -6 M 60 149.0 l -6 -2" stroke="#e5484d" stroke-width="2.2" stroke-linecap="round"/><path d="M 69 144.0 l 3 -6 M 72 149.0 l 6 -2" stroke="#e5484d" stroke-width="2.2" stroke-linecap="round"/><line x1="100" y1="128" x2="100" y2="188" stroke="#9fb0c6" stroke-width="1.2"/><text x="114" y="154" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">40 + 40 pods start; both wait 6</text><text x="114" y="170" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">hours</text><rect x="566" y="82" width="340" height="132" rx="8" fill="#e3f5e3" stroke="#3d8b4f" stroke-width="1.6"/><text x="580" y="105" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">All-or-nothing</text><rect x="582" y="118" width="308" height="80" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><circle cx="618" cy="158" r="16.0" fill="#2f9e57"/><path d="M 610.8 158 l 5.12 5.6 l 9.6 -11.2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="652" y1="128" x2="652" y2="188" stroke="#9fb0c6" stroke-width="1.2"/><text x="666" y="154" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">job A runs whole; job B waits</text><text x="666" y="170" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">holding nothing</text><text x="460" y="147" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#14213d" text-anchor="middle">Same jobs, atomic</text><text x="460" y="165" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#14213d" text-anchor="middle">admission</text><line x1="10" y1="232" x2="910" y2="232" stroke="#8aa0bd" stroke-width="1.4" stroke-dasharray="7 6"/><rect x="14" y="248" width="892" height="19
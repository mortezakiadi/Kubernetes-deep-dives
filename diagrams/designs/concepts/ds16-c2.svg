<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 306" width="920" height="306" role="img" aria-label="The feedback loop"><title>The feedback loop</title><defs><marker id="ah-1f3a5f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="221.25" y="8" width="477.5" height="56" rx="8" fill="#dcebfb" stroke="#4a86c5" stroke-width="1.6"/><text x="460" y="33" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="800" fill="#14213d" text-anchor="middle">Human signal → reward model → training → back</text><text x="460" y="54" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#2b3a4f" text-anchor="middle">a two-week cadence</text><rect x="20.0" y="110" width="190.0" height="118" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="20.0" y="110" width="190.0" height="32" rx="6" fill="#dcebfb" stroke="#4a86c5" stroke-width="1.3"/><text x="115" y="132" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">Sample</text><circle cx="50.0" cy="181.0" r="12.0" fill="#ffffff" stroke="#2f4f75" stroke-width="2.4"/><line x1="59.0" y1="190.0" x2="70.0" y2="201.0" stroke="#2f4f75" stroke-width="3" stroke-linecap="round"/><line x1="84.0" y1="154" x2="84.0" y2="216" stroke="#9fb0c6" stroke-width="1.2"/><text x="96" y="181" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">pairs from the</text><text x="96" y="198" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">current policy</text><path d="M 214 185 L 246 185" fill="none" stroke="#1f3a5f" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ah-1f3a5f)"/><rect x="250.0" y="110" width="190.0" height="118" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="250.0" y="110" width="190.0" height="32" rx="6" fill="#fdf3d0" stroke="#c9a227" stroke-width="1.3"/><text x="345" y="132" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">Collect</text><circle cx="284.0" cy="175.65" r="7.65" fill="#ffffff" stroke="#2f4f75" stroke-width="2"/><path d="M 269.55 202.0 Q 269.55 185.85 284.0 185.85 Q 298.45 185.85 298.45 202.0 Z" fill="#ffffff" stroke="#2f4f75" stroke-width="2"/><line x1="314.0" y1="154" x2="314.0" y2="216" stroke="#9fb0c6" stroke-width="1.2"/><text x="326" y="181" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">raters +</text><text x="326" y="198" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">production</text><path d="M 444 185 L 476 185" fill="none" stroke="#1f3a5f" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ah-1f3a5f)"/><rect x="480.0" y="110" width="190.0" height="118" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="480.0" y="110" width="190.0" height="32" rx="6" fill="#e3f5e3" stroke="#3d8b4f" stroke-width="1.3"/><text x="575" y="132" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">Model</text><line x1="514.0" y1="165.0" x2="514.0" y2="201.0" stroke="#2f4f75" stroke-width="2.2"/><line x1="494.0" y1="173.0" x2="534.0" y2="173.0" stroke="#2f4f75" stroke-width="2.2"/><path d="M 490.0 187.0 a 9.0 6.0 0 0 0 18.0 0 Z M 520.0 187.0 a 9.0 6.0 0 0 0 18.0 0 Z" fill="#fdf3d0" stroke="#2f4f75" stroke-width="1.8"/><path d="M 494.0 173.0 L 499.0 187.0 M 534.0 173.0 L 529.0 187.0" stroke="#2f4f75" stroke-width="1.4"/><line x1="504.0" y1="201.0" x2="524.0" y2="201.0" stroke="#2f4f75" stroke-width="2.2"/><line x1="544.0" y1="154" x2="544.0" y2="216" stroke="#9fb0c6" stroke-width="1.2"/><text x="556" y="181" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">train + gate</text><text x="556" y="198" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">reward models</text><path d="M 674 185 L 706 185" fill="none" stroke="#1f3a5f" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ah-1f3a5f)"/><rect x="710.0" y="110" width="190.0" height="118" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="710.0" y="110" width="190.0" height="32" rx="6" fill="#ece6fb" stroke="#7a5cc4" stroke-width="1.3"/><text x="805" y="132" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">Train + deploy</text><rect x="728.0" y="169.0" width="32.0" height="32.0" rx="4" fill="#dcebfb" stroke="#2f4f75" stroke-width="2"/><rect x="736.0" y="177.0" width="16.0" height="16.0" rx="2" fill="#2f4f75"/><line x1="736.8" y1="169.0" x2="736.8" y2="163.0" stroke="#2f4f75" stroke-width="2"/><line x1="736.8" y1="201.0" x2="736.8" y2="207.0" stroke="#2f4f75" stroke-width="2"/><line x1="728.0" y1="177.8" x2="722.0" y2="177.8" stroke="#2f4f75" stroke-width="2"/><line x1="760.0" y1="177.8" x2="766.0" y2="177.8" stroke="#2f4f75" stroke-width="2"/><line x1="744.0" y1="169.0" x2="744.0" y2="163.0" stroke="#2f4f75" stroke-width="2"/><line x1="744.0" y1="201.0" x2="744.0" y2="207.0" stroke="#2f4f75" stroke-width="2"/><line x1="728.0" y1="185.0" x2="722.0" y2="185.0" stroke="#2f4f75" stroke-width="2"/><line x1="760.0" y1="185.0" x2="766.0" y2="185.0" stroke="#2f4f75" stroke-width="2"/><line x1="751.2" y1="169.0" x2="751.2" y2="163.0" stroke="#2f4f75" stroke-width="2"/><line x1="751.2" y1="201.0" x2="751.2" y2="207.0" stroke="#2f4f75" stroke-width="2"/><line x1="728.0" y1="192.2" x2="722.0" y2="192.2" stroke="#2f4f75" stroke-width="2"/><line x1="760.0" y1="192.2" x2="766.0" y2="192.2" stroke="#2f4f75" stroke-width="2"/><line x1="774.0" y1="154" x2="774.0" y2="216" stroke="#9fb0c6" stroke-width="1.2"/><text x="786" y="181" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">RL or DPO,</text><text x="786" y="198" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">then observe</text><path d="M 230 96 L 230 173" fill="none" stroke="#f08a1c" stroke-width="4"/><rect x="146" y="83" width="169" height="26" rx="5" fill="#fde3cc" stroke="#e07b1f" stroke-width="1.4"/><text x="230" y="100" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#14213d" text-anchor="middle">≥ 70% on-policy pairs</text><rect x="20" y="246" width="880" height="44" rx="6" fill="#f1f4f8" stroke="#7b8ba1" stroke-width="1.2"/><text x="460" y="273" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#14213d" text-anchor="middle">The slowest step (usually collection or RM evaluation) sets the loop's pace</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 406" width="920" height="406" role="img" aria-label="Data quality gate"><title>Data quality gate</title><defs><marker id="ah-1f3a5f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="250.0" y="8" width="420.0" height="56" rx="8" fill="#dcebfb" stroke="#4a86c5" stroke-width="1.6"/><text x="460" y="33" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="800" fill="#14213d" text-anchor="middle">No dataset reaches a recipe unchecked</text><text x="460" y="54" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#2b3a4f" text-anchor="middle">a third of a benchmark was hiding in a scraped set</text><rect x="14" y="82" width="592" height="310" rx="8" fill="#eaf1fb" stroke="#2f4f75" stroke-width="1.6"/><text x="28" y="105" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#14213d" text-anchor="start">Snapshot + lineage</text><text x="197" y="105" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2b3a4f" text-anchor="start">immutable, pinned by recipes</text><rect x="36" y="140" width="548" height="230" rx="8" fill="#ffffff" stroke="#5b7799" stroke-width="1.6"/><text x="50" y="163" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#14213d" text-anchor="start">Safety + license</text><text x="202" y="163" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2b3a4f" text-anchor="start">PII, licenses, filters</text><rect x="58" y="198" width="504" height="150" rx="8" fill="#fde2e1" stroke="#c8504b" stroke-width="1.6"/><text x="72" y="221" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#14213d" text-anchor="start">Decontamination</text><text x="215" y="221" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2b3a4f" text-anchor="start">against every eval set, paraphrases too</text><rect x="80" y="256" width="460" height="70" rx="8" fill="#fdf3d0" stroke="#c9a227" stroke-width="1.6"/><text x="94" y="279" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#14213d" text-anchor="start">Schema + dedupe</text><text x="237" y="279" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2b3a4f" text-anchor="start">fields, templates, duplicates</text><rect x="622" y="82.0" width="284" height="148.0" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="622" y="82.0" width="284" height="32" rx="6" fill="#fde2e1" stroke="#c8504b" stroke-width="1.3"/><text x="764" y="104" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">Blocked</text><circle cx="656" cy="172.0" r="16.0" fill="#d14b45"/><path d="M 649.6 165.6 l 12.8 12.8 M 662.4 165.6 l -12.8 12.8" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><line x1="686" y1="126.0" x2="686" y2="218.0" stroke="#9fb0c6" stroke-width="1.2"/><text x="698" y="176" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#14213d" text-anchor="start">contaminated rows &gt; 0</text><rect x="622" y="244.0" width="284" height="148.0" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="622" y="244.0" width="284" height="32" rx="6" fill="#e3f5e3" stroke="#3d8b4f" stroke-width="1.3"/><text x="764" y="266" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">Published</text><circle cx="656" cy="334.0" r="16.0" fill="#2f9e57"/><path d="M 648.8 334.0 l 5.12 5.6 l 9.6 -11.2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="686" y1="288.0" x2="686" y2="380.0" stroke="#9fb0c6" stroke-width="1.2"/><text x="698" y="338" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#14213d" text-anchor="start">all checks pass</text></svg>
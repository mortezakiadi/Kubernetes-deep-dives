<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 406" width="920" height="406" role="img" aria-label="The scheduler as a service"><title>The scheduler as a service</title><defs><marker id="ah-1f3a5f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="249.75" y="8" width="420.5" height="56" rx="8" fill="#dcebfb" stroke="#4a86c5" stroke-width="1.6"/><text x="460" y="33" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="800" fill="#14213d" text-anchor="middle">An owner, objectives, and a tuning loop</text><text x="460" y="54" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#2b3a4f" text-anchor="middle">an unowned upgrade doubled large-job waits</text><rect x="14" y="82" width="592" height="310" rx="8" fill="#eaf1fb" stroke="#2f4f75" stroke-width="1.6"/><text x="28" y="105" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#14213d" text-anchor="start">SLOs</text><text x="76" y="105" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2b3a4f" text-anchor="start">utilization under demand, waits, preemption, fairness</text><rect x="36" y="140" width="548" height="230" rx="8" fill="#ffffff" stroke="#5b7799" stroke-width="1.6"/><text x="50" y="163" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#14213d" text-anchor="start">Alerts</text><text x="116" y="163" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2b3a4f" text-anchor="start">guardrail breaches and sudden jumps</text><rect x="58" y="198" width="504" height="150" rx="8" fill="#fdf3d0" stroke="#c9a227" stroke-width="1.6"/><text x="72" y="221" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#14213d" text-anchor="start">Upgrade testing</text><text x="215" y="221" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2b3a4f" text-anchor="start">replayed and staged like policy</text><rect x="80" y="256" width="460" height="70" rx="8" fill="#e3f5e3" stroke="#3d8b4f" stroke-width="1.6"/><text x="94" y="279" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#14213d" text-anchor="start">Quarterly loop</text><text x="228" y="279" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2b3a4f" text-anchor="start">scorecards → simulate → stage → fleet</text><rect x="622" y="82.0" width="284" height="148.0" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="622" y="82.0" width="284" height="32" rx="6" fill="#fdf3d0" stroke="#c9a227" stroke-width="1.3"/><text x="764" y="104" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">Healthy ceiling</text><line x1="644.0" y1="152.0" x2="644.0" y2="192.0" stroke="#2f4f75" stroke-width="2.4"/><path d="M 644.0 152.0 h 26.0 l -6.0 8.0 l 6.0 8.0 h -26.0" fill="#e3f5e3" stroke="#3d8b4f" stroke-width="2"/><line x1="686" y1="126.0" x2="686" y2="218.0" stroke="#9fb0c6" stroke-width="1.2"/><text x="698" y="176" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#14213d" text-anchor="start">~85–90%: waits grow fast</text><rect x="622" y="244.0" width="284" height="148.0" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="622" y="244.0" width="284" height="32" rx="6" fill="#dcebfb" stroke="#4a86c5" stroke-width="1.3"/><text x="764" y="266" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">Capacity call</text><line x1="656" y1="314.0" x2="656" y2="350.0" stroke="#2f4f75" stroke-width="2.2"/><line x1="636" y1="322.0" x2="676" y2="322.0" stroke="#2f4f75" stroke-width="2.2"/><path d="M 632.0 336.0 a 9.0 6.0 0 0 0 18.0 0 Z M 662.0 336.0 a 9.0 6.0 0 0 0 18.0 0 Z" fill="#fdf3d0" stroke="#2f4f75" stroke-width="1.8"/><path d="M 636 322.0 L 641.0 336.0 M 676 322.0 L 671.0 336.0" stroke="#2f4f75" stroke-width="1.4"/><line x1="646.0" y1="350.0" x2="666.0" y2="350.0" stroke="#2f4f75" stroke-width="2.2"/><line x1="686" y1="288.0" x2="686" y2="380.0" stroke="#9fb0c6" stroke-width="1.2"/><text x="698" y="338" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#14213d" text-anchor="start">high use + long waits = buy</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 452" width="920" height="452" role="img" aria-label="Rollout scheduling"><title>Rollout scheduling</title><defs><marker id="ah-1f3a5f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="297.25" y="8" width="325.5" height="56" rx="8" fill="#dcebfb" stroke="#4a86c5" stroke-width="1.6"/><text x="460" y="33" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="800" fill="#14213d" text-anchor="middle">Trainers idle 70% of the time</text><text x="460" y="54" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#2b3a4f" text-anchor="middle">most answers 2K tokens, a few 16K</text><rect x="14" y="82" width="340" height="132" rx="8" fill="#fde2e1" stroke="#c8504b" stroke-width="1.6"/><text x="28" y="105" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Synchronous</text><rect x="30" y="118" width="308" height="80" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><circle cx="66" cy="158" r="16.0" fill="#ffffff" stroke="#2f4f75" stroke-width="2.2"/><path d="M 66 148.4 L 66 158 L 73.2 162.8" fill="none" stroke="#2f4f75" stroke-width="2.2" stroke-linecap="round"/><line x1="100" y1="128" x2="100" y2="188" stroke="#9fb0c6" stroke-width="1.2"/><text x="114" y="154" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">every step waits for the</text><text x="114" y="170" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">slowest answer</text><rect x="566" y="82" width="340" height="132" rx="8" fill="#e3f5e3" stroke="#3d8b4f" stroke-width="1.6"/><text x="580" y="105" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Asynchronous</text><rect x="582" y="118" width="308" height="80" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><path d="M 621.0 138 L 607.0 161.0 L 617.0 161.0 L 613.0 178 L 629.0 154.0 L 619.0 154.0 Z" fill="#fde3cc" stroke="#e07b1f" stroke-width="2" stroke-linejoin="round"/><line x1="652" y1="128" x2="652" y2="188" stroke="#9fb0c6" stroke-width="1.2"/><text x="666" y="154" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">trainer consumes what's</text><text x="666" y="170" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">finished</text><text x="460" y="147" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#14213d" text-anchor="middle">Same rollouts,</text><text x="460" y="165" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#14213d" text-anchor="middle">different waiting</text><line x1="10" y1="232" x2="910" y2="232" stroke="#8aa0bd" stroke-width="1.4" stroke-dasharray="7 6"/><rect x="14" y="248" width="892" height="190" rx="8" fill="#e3f5e3" stroke="#3d8b4f" stroke-width="1.6"/><text x="28" y="271" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Three ways to schedule</text><rect x="30.0" y="286" width="256.0" height="136" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect
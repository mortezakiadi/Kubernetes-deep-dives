" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Per rater</text><rect x="582" y="118" width="308" height="80" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><circle cx="618" cy="148.65" r="7.65" fill="#ffffff" stroke="#2f4f75" stroke-width="2"/><path d="M 603.55 175.0 Q 603.55 158.85 618 158.85 Q 632.45 158.85 632.45 175.0 Z" fill="#ffffff" stroke="#2f4f75" stroke-width="2"/><line x1="652" y1="128" x2="652" y2="188" stroke="#9fb0c6" stroke-width="1.2"/><text x="666" y="154" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">most ~75%; four agree with</text><text x="666" y="170" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">nobody</text><text x="460" y="156" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#14213d" text-anchor="middle">Same labels, finer view</text><line x1="10" y1="232" x2="910" y2="232" stroke="#8aa0bd" stroke-width="1.4" stroke-dasharray="7 6"/><rect x="14" y="248" width="892" height="190" rx="8" fill="#e3f5e3" stroke="#3d8b4f" stroke-width="1.6"/><text x="28" y="271" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Use quality, don't just measure it</text><rect x="30.0" y="286" width="256.0" height="136" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="30.0" y="286" width="256.0" height="32" rx="6" fill="#e3f5e3" stroke="#3d8b4f" stroke-width="1.3"/><text x="158" y="308" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">Gold questions</text><circle cx="64.0" cy="370.0" r="16.0" fill="#2f9e57"/><path d="M 56.8 370.0 l 5.12 5.6 l 9.6 -11.2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="94.0" y1="330" x2="94.0" y2="410" stroke="#9fb0c6" stroke-width="1.2"/><text x="106" y="375" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">hidden, expert-agreed</text><rect x="332.0" y="286" width="256.0" height="136" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="332.0" y="286" width="256.0" height="32" rx="6" fill="#dcebfb" stroke="#4a86c5" stroke-width="1.3"/><text x="460" y="308" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">Rater weights</text><line x1="366.0" y1="350.0" x2="366.0" y2="386.0" stroke="#2f4f75" stroke-width="2.2"/><line x1="346.0" y1="358.0" x2="386.0" y2="358.0" stroke="#2f4f75" stroke-width="2.2"/><path d="M 342.0 372.0 a 9.0 6.0 0 0 0 18.0 0 Z M 372.0 372.0 a 9.0 6.0 0 0 0 18.0 0 Z" fill="#fdf3d0" stroke="#2f4f75" stroke-width="1.8"/><path d="M 346.0 358.0 L 351.0 372.0 M 386.0 358.0 L 381.0 372.0" stroke="#2f4f75" stroke-width="1.4"/><line x1="356.0" y1="386.0" x2="376.0" y2="386.0" stroke="#2f4f75" stroke-width="2.2"/><line x1="396.0" y1="330" x2="396.0" y2="410" stroke="#9fb0c6" stroke-width="1.2"/><text x="408" y="366" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">on every label, in the</text><text x="408" y="383" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">loss</text><rect x="634.0" y="286" width="256.0" height="136" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="634.0" y="286" width="256.0" height="32" rx="6" fill="#fdf3d0" stroke="#c9a227" stroke-width="1.3"/><text x="762" y="308" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">Relabel / route</text><path d="M 684.0 366.0 a 16.0 16.0 0 1 0 -5.0 15.0" fill="none" stroke="#2f4f75" stroke-width="2.4"/><path d="M 684.0 355.0 v 12.0 h -12.0" fill="none" stroke="#2f4f75" stroke-width="2.4"/><line x1="698.0" y1="330" x2="698.0" y2="410" stroke="#9fb0c6" stroke-width="1.2"/><text x="710" y="375" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">experts for hard slices</text></svg>
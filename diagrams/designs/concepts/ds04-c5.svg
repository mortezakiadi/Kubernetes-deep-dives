,sans-serif" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Outbox pattern</text><rect x="30.0" y="286" width="256.0" height="136" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="30.0" y="286" width="256.0" height="32" rx="6" fill="#dcebfb" stroke="#4a86c5" stroke-width="1.3"/><text x="158" y="308" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">Record intent</text><path d="M 51.4 352.0 h 18.0 l 7.2 7.2 v 28.8 h -25.2 z" fill="#ffffff" stroke="#4a86c5" stroke-width="1.8"/><line x1="55.9" y1="365.5" x2="72.1" y2="365.5" stroke="#4a86c5" stroke-width="1.6"/><line x1="55.9" y1="372.34" x2="72.1" y2="372.34" stroke="#4a86c5" stroke-width="1.6"/><line x1="55.9" y1="379.18" x2="72.1" y2="379.18" stroke="#4a86c5" stroke-width="1.6"/><line x1="94.0" y1="330" x2="94.0" y2="410" stroke="#9fb0c6" stroke-width="1.2"/><text x="106" y="375" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">key = run + step</text><path d="M 290 370 L 328 370" fill="none" stroke="#1f3a5f" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ah-1f3a5f)"/><rect x="332.0" y="286" width="256.0" height="136" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="332.0" y="286" width="256.0" height="32" rx="6" fill="#fdf3d0" stroke="#c9a227" stroke-width="1.3"/><text x="460" y="308" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">Call tool</text><rect x="363.0" y="353.0" width="6" height="8" rx="1.5" fill="#5b7799" transform="rotate(0 366.0 370.0)"/><rect x="363.0" y="353.0" width="6" height="8" rx="1.5" fill="#5b7799" transform="rotate(45 366.0 370.0)"/><rect x="363.0" y="353.0" width="6" height="8" rx="1.5" fill="#5b7799" transfor
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 452" width="920" height="452" role="img" aria-label="Exactly-once side effects"><title>Exactly-once side effects</title><defs><marker id="ah-1f3a5f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="278.25" y="8" width="363.5" height="56" rx="8" fill="#dcebfb" stroke="#4a86c5" stroke-width="1.6"/><text x="460" y="33" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="800" fill="#14213d" text-anchor="middle">Retries must not open a second PR</text><text x="460" y="54" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#2b3a4f" text-anchor="middle">the tool has to know it already acted</text><rect x="14" y="82" width="340" height="132" rx="8" fill="#fde2e1" stroke="#c8504b" stroke-width="1.6"/><text x="28" y="105" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Without a key</text><rect x="30" y="118" width="308" height="80" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="44.0" y="152.4" width="22.0" height="11.200000000000001" rx="5.6000000000000005" fill="none" stroke="#2b3a4f" stroke-width="2.6" transform="rotate(-35 55.0 158)"/><rect x="66.0" y="152.4" width="22.0" height="11.200000000000001" rx="5.6000000000000005" fill="none" stroke="#2b3a4f" stroke-width="2.6" transform="rotate(-35 77.0 158)"/><path d="M 63 144.0 l -3 -6 M 60 149.0 l -6 -2" stroke="#e5484d" stroke-width="2.2" stroke-linecap="round"/><path d="M 69 144.0 l 3 -6 M 72 149.0 l 6 -2" stroke="#e5484d" stroke-width="2.2" stroke-linecap="round"/><line x1="100" y1="128" x2="100" y2="188" stroke="#9fb0c6" stroke-width=
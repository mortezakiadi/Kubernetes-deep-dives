<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 452" width="920" height="452" role="img" aria-label="World clock"><title>World clock</title><defs><marker id="ah-1f3a5f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="249.75" y="8" width="420.5" height="56" rx="8" fill="#dcebfb" stroke="#4a86c5" stroke-width="1.6"/><text x="460" y="33" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="800" fill="#14213d" text-anchor="middle">World time moves with actions, not load</text><text x="460" y="54" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#2b3a4f" text-anchor="middle">escalation after 22 or 67 steps, depending on load</text><rect x="14" y="82" width="340" height="132" rx="8" fill="#fde2e1" stroke="#c8504b" stroke-width="1.6"/><text x="28" y="105" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Wall time</text><rect x="30" y="118" width="308" height="80" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><circle cx="66" cy="158" r="16.0" fill="#ffffff" stroke="#2f4f75" stroke-width="2.2"/><path d="M 66 148.4 L 66 158 L 73.2 162.8" fill="none" stroke="#2f4f75" stroke-width="2.2" stroke-linecap="round"/><line x1="100" y1="128" x2="100" y2="188" stroke="#9fb0c6" stroke-width="1.2"/><text x="114" y="162" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">busy cluster = harder task</text><rect x="566" y="82" width="340" height="132" rx="8" fill="#e3f5e3" stroke="#3d8b4f" stroke-width="1.6"/><text x="580" y="105" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">World time</text><rect x="582" y="118" width="308" height="80" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><path d="M 634.0 154.0 a 16.0 16.0 0 1 0 -5.0 15.0" fill="none" stroke="#2f4f75" stroke-width="2.4"/><path d="M 634.0 143.0 v 12.0 h -12.0" fill="none" stroke="#2f4f75" stroke-width="2.4"/><line x1="652" y1="128" x2="652" y2="188" stroke="#9fb0c6" stroke-width="1.2"/><text x="666" y="154" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">escalation always after 40</text><text x="666" y="170" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">steps</text><text x="460" y="147" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#14213d" text-anchor="middle">Inference time never</text><text x="460" y="165" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#14213d" text-anchor="middle">counts</text><line x1="10" y1="232" x2="910" y2="232" stroke="#8aa0bd" stroke-width="1.4" stroke-dasharray="7 6"/><rect x="14" y="248" width="892" height="190" rx="8" fill="#e3f5e3" stroke="#3d8b4f" stroke-width="1.6"/><text x="28" y="271" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#14213d" text-anchor="start">Also</text><rect x="30.0" y="286" width="256.0" height="136" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="30.0" y="286" width="256.0" height="32" rx="6" fill="#dcebfb" stroke="#4a86c5" stroke-width="1.3"/><text x="158" y="308" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">Service time</text><rect x="61.0" y="353.0" width="6" height="8" rx="1.5" fill="#5b7799" transform="rotate(0 64.0 370.0)"/><rect x="61.0" y="353.0" width="6" height="8" rx="1.5" fill="#5b7799" transform="rotate(45 64.0 370.0)"/><rect x="61.0" y="353.0" width="6" height="8" rx="1.5" fill="#5b7799" transform="rotate(90 64.0 370.0)"/><rect x="61.0" y="353.0" width="6" height="8" rx="1.5" fill="#5b7799" transform="rotate(135 64.0 370.0)"/><rect x="61.0" y="353.0" width="6" height="8" rx="1.5" fill="#5b7799" transform="rotate(180 64.0 370.0)"/><rect x="61.0" y="353.0" width="6" height="8" rx="1.5" fill="#5b7799" transform="rotate(225 64.0 370.0)"/><rect x="61.0" y="353.0" width="6" height="8" rx="1.5" fill="#5b7799" transform="rotate(270 64.0 370.0)"/><rect x="61.0" y="353.0" width="6" height="8" rx="1.5" fill="#5b7799" transform="rotate(315 64.0 370.0)"/><circle cx="64.0" cy="370.0" r="13.0" fill="#5b7799"/><circle cx="64.0" cy="370.0" r="5.46" fill="#ffffff"/><line x1="94.0" y1="330" x2="94.0" y2="410" stroke="#9fb0c6" stroke-width="1.2"/><text x="106" y="375" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#14213d" text-anchor="start">shims read world time</text><rect x="332.0" y="286" width="256.0" height="136" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="332.0" y="286" width="256.0" height="32" rx="6" fill="#fdf3d0" stroke="#c9a227" stroke-width="1.3"/><text x="460" y="308" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">Tool time</text><circle cx="366.0" cy="370.0" r="16.0" fill="#ffffff" stroke="#2f4f75" stroke-width="2.2"/><path d="M 366.0 360.4 L 366.0 370.0 L 373.2 374.8" fill="none" stroke="#2f4f75" stroke-width="2.2" stroke-linecap="round"/><line x1="396.0" y1="33
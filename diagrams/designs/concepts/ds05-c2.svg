ds, nodes</text><rect x="58" y="198" width="504" height="150" rx="8" fill="#e3f5e3" stroke="#3d8b4f" stroke-width="1.6"/><text x="72" y="221" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#14213d" text-anchor="start">Service networking</text><text x="241" y="221" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2b3a4f" text-anchor="start">discovery, load balancing</text><rect x="80" y="256" width="460" height="70" rx="8" fill="#fdf3d0" stroke="#c9a227" stroke-width="1.6"/><text x="94" y="279" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="800" fill="#14213d" text-anchor="start">Policy plane</text><text x="211" y="279" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2b3a4f" text-anchor="start">isolation rules across all layers</text><rect x="622" y="82.0" width="284" height="148.0" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="622" y="82.0" width="284" height="32" rx="6" fill="#dcebfb" stroke="#4a86c5" stroke-width="1.3"/><text x="764" y="104" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">Network team</text><line x1="656" y1="156.0" x2="639.0" y2="183.0" stroke="#2f4f75" stroke-width="2"/><line x1="639.0" y1="183.0" x2="673.0" y2="183.0" stroke="#2f4f75" stroke-width="2"/><line x1="673.0" y1="183.0" x2="656" y2="156.0" stroke="#2f4f75" stroke-width="2"/><circle cx="656" cy="156.0" r="6.0" fill="#dcebfb" stroke="#2f4f75" stroke-width="2"/><circle cx="639.0" cy="183.0" r="6.0" fill="#dcebfb" stroke="#2f4f75" stroke-width="2"/><circle cx="673.0" cy="183.0" r="6.0" fill="#dcebfb" stroke="#2f4f75" stroke-width="2"/><line x1="686" y1="126.0"
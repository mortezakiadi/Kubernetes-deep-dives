<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 344" width="920" height="344" role="img" aria-label="A benchmark that said +12%"><title>A benchmark that said +12%</title><defs><marker id="ah-1f3a5f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="178.5" y="8" width="563.0" height="56" rx="8" fill="#dcebfb" stroke="#4a86c5" stroke-width="1.6"/><text x="460" y="33" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="800" fill="#14213d" text-anchor="middle">Measure correctly, replay real traffic, keep baselines</text><text x="460" y="54" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#2b3a4f" text-anchor="middle">14 configurations, and one upgrade that doubled p99 TTFT</text><rect x="14.0" y="84" width="286.6666666666667" height="112" rx="6" fill="#ffffff" stroke="#5b7799" stroke-width="1.3"/><rect x="14.0" y="84" width="286.6666666666667" height="32" rx="6" fill="#dcebfb" stroke="#4a86c5" stroke-width="1.3"/><text x="157" y="106" font-family="'Noto Sans','Source Sans 3','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">One definition</text><path d="M 35.4 138.0 h 18.0 l 7.2 7.2 v 28.8 h -25.2 z" fill="#ffffff" stroke="#4a86c5" stroke-width="1.8"/><line x1="39.9" y1="151.5" x2="56.099999999999994" y2="151.5" stroke="#4a86c5" stroke-width="1.6"/><line x1="39.9" y1="158.34" x2="56.099999999999994" y2="158.34" stroke="#4a86c5" stroke-width="1.6"/><line x1="39.9" y1="165.18" x2="56.099999999999994" y2="165.18" stroke="#4a86c5" stroke-width="1.6"/><line x1="78.0" y1="128" x2="78.0" y2="184" stroke="#9fb0c6" stroke-width="1.2"/><text x="90" y="161" font-family="'Noto Sans','Source Sans 3','S
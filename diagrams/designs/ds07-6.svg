<text x="542" y="172.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Reshard + broadcast</text>
<text x="542" y="195.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">gather per layer → re-split for</text>
<text x="542" y="209.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">TP/EP → bucketed NCCL broadcast on</text>
<text x="542" y="224.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">the GPU fabric</text>
<path d="M 500 235 L 530 235" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 770 235 L 800 235" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="450" width="400" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="42" y="473" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Size it</text>
<text x="42" y="496" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">235B in BF16 ≈ 470 GB. At ~50 GB/s per engine ≈ 10 s;</text>
<text x="42" y="511" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">through one bottleneck link: minutes.</text>
<rect x="450" y="450" width="400" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="462" y="473" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Make it cheaper</text>
<text x="462" y="496" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">layer-pipelined push, overlap with next rollouts, send</text>
<text x="462" y="511" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">deltas, colocate when sync dominates</text>
<rect x="870" y="450" width="400" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="882" y="473" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Budget it</text>
<text x="882" y="496" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Weight sync is its own stage with a budget (e.g. &lt;5% of</text>
<text x="882" y="511" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">step time); tag every token with policy version.</text></svg>

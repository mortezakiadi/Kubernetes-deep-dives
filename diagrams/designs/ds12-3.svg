<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="560px" viewBox="0 0 1300 560" style="background:#ffffff"><title>Ablation design</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="560" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">An ablation that decides something</text>
<rect x="30" y="70" width="232" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Hypothesis</text>
<text x="42" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">expected effect on a primary</text>
<text x="42" y="131" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">metric</text>
<path d="M 262 125 L 282 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="282" y="70" width="232" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="294" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">One variable</text>
<text x="294" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">launcher rejects other diffs</text>
<path d="M 514 125 L 534 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="534" y="70" width="232" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="546" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Matched compute</text>
<text x="546" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">same tokens or GPU hours per arm</text>
<path d="M 766 125 L 786 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="786" y="70" width="232" height="110" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="798" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Seeds + questions</text>
<text x="798" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">from the power analysis</text>
<path d="M 1018 125 L 1038 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="1038" y="70" width="232" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="1050" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Decision rule</text>
<text x="1050" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">adopt / reject / extend,</text>
<text x="1050" y="131" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">declared first</text>
<rect x="30" y="220" width="600" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="50" y="248.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">2 × 2 factorial: learning rate × batch size (illustrative)</text>
<text x="170" y="330" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">LR 1e-6</text>
<text x="250" y="285" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">batch 256</text>
<rect x="185" y="300" width="130" height="70" rx="8" fill="#d97706" fill-opacity=".85"/>
<text x="250" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">60.1</text>
<text x="430" y="285" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">batch 1024</text>
<rect x="365" y="300" width="130" height="70" rx="8" fill="#d97706" fill-opacity=".85"/>
<text x="430" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">61.4</text>
<text x="170" y="420" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">LR 3e-6</text>
<rect x="185" y="390" width="130" height="70" rx="8" fill="#059669" fill-opacity=".85"/>
<text x="250" y="432" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">62.3</text>
<rect x="365" y="390" width="130" height="70" rx="8" fill="#dc2626" fill-opacity=".85"/>
<text x="430" y="432" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">59.8</text>
<text x="50" y="500.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">interaction: higher LR helps at small batch, hurts at large batch</text>
<rect x="670" y="220" width="600" height="140" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="682" y="243.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#065f46">Proxy, then confirm</text>
<text x="682" y="267.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">run arms at small scale; confirm the winner at the target scale before adopting it</text>
<text x="682" y="282.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">(Design 07)</text>
<rect x="670" y="380" width="600" height="140" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="682" y="403.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Keep negative results</text>
<text x="682" y="427.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">a library of failed ablations stops the same idea being re-tested every quarter;</text>
<text x="682" y="442.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">exploratory runs are labeled as such</text></svg>

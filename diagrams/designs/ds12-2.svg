<text x="42" y="442.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Paired differences</text>
<text x="42" y="465.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">per question, same questions</text>
<rect x="280" y="420" width="236" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="292" y="442.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Clustered SEs</text>
<text x="292" y="465.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">questions grouped by document or</text>
<text x="292" y="479.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">task</text>
<rect x="530" y="420" width="236" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="542" y="442.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Small evals</text>
<text x="542" y="465.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">&lt; few hundred: exact or bootstrap</text>
<text x="542" y="479.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">intervals</text>
<rect x="780" y="420" width="236" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="792" y="442.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Many evals</text>
<text x="792" y="465.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">control false discoveries;</text>
<text x="792" y="479.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">pre-declare primary</text>
<rect x="1030" y="420" width="236" height="120" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="1042" y="442.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Power analysis</text>
<text x="1042" y="465.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">questions, samples and seeds for</text>
<text x="1042" y="479.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">the effect that matters</text></svg>

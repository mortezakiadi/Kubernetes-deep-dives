Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">The token budget per engine step: chunked prefill mixed with decode</text>
<text x="220" y="74" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Without a budget: one 20k-token prefill fills the step; 150 decodes wait</text>
<text x="208" y="114" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">step n</text>
<rect x="220" y="90" width="900" height="36" rx="2" fill="#7c3aed" fill-opacity="0.9" stroke="none"/>
<text x="670.0" y="113.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">prefill 20,000 tokens (one request)</text>
<rect x="1122" y="90" width="100" height="36" rx="2" fill="#94a3b8" fill-opacity="0.9" stroke="none"/>
<text x="208" y="160" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">step n+1</text>

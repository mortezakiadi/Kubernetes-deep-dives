<text x="300.0" y="159.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">150 decode tokens</text>
<rect x="382" y="136" width="840" height="36" rx="2" fill="#e2e8f0" fill-opacity="0.9" stroke="none"/>
<text x="220" y="210" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">max-num-batched-tokens = 4096: prefill chunked across steps, decodes every step</text>
<text x="208" y="250" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">step n+0</text>

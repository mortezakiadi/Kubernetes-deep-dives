<text x="724" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">day 5 review</text>
<rect x="800" y="70" width="128" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<text x="864" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">day 6 review</text>
<rect x="940" y="70" width="128" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<text x="1004" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">day 7 review</text>
<rect x="1080" y="70" width="128" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<text x="1144" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">day 8 review</text>
<text x="30" y="95.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">daily</text>
<rect x="660" y="130" width="128" height="40" rx="6" fill="#fee2e2" stroke="#dc2626"/>
<text x="724" y="155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">incident</text>
<text x="30" y="155.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">events</text>
<rect x="800" y="130" width="160" height="40" rx="6" fill="#fef3c7" stroke="#d97706"/>
<text x="880" y="155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400e">change: LR × 0.5</text>
<rect x="30" y="220" width="232" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="243" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Research owner</text>
<text x="42" y="266" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">is it learning the right thing?</text>
<rect x="282" y="220" width="232" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="294" y="243" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Operations owner</text>
<text x="294" y="266" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">is it running well?</text>
<rect x="534" y="220" width="232" height="110" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="546" y="243" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Incident</text>
<text x="546" y="266" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">owner, evidence, decision</text>
<rect x="786" y="220" width="232" height="110" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="798" y="243" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Change log</text>
<text x="798" y="266" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">every live change, with reason</text>
<rect x="1038" y="220" width="232" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="1050" y="243" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Post-run review</text>
<text x="1050" y="266" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">feeds recipe + runbooks</text>
<rect x="30" y="360" width="1240" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="50" y="390.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: entropy fell on day 5; three people noticed; each assumed someone else had it; collapse on day 7.</text>
<text x="50" y="420" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">After: the alert opens an incident with an owner; the decision (halve LR, tighten staleness) is logged with evidence;</text>
<text x="50" y="442" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">controllers (Design 09) handle known problems automatically; people handle what's new.</text>
<text x="50" y="474" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">A recipe that needed interventions isn't a recipe yet: they become part of it, or get fixed.</text></svg>

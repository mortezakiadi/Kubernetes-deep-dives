<text x="304" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">day 2 review</text>
<rect x="380" y="70" width="128" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<text x="444" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">day 3 review</text>
<rect x="520" y="70" width="128" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
<text x="584" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">day 4 review</text>

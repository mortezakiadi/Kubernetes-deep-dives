<circle cx="403" cy="276" r="6" fill="#dc2626"/>
<text x="413.04951684997053" y="299.55831610668014" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#dc2626">sync, slow restart: every 54 min, 38.2%</text>
<path d="M 96 287 L 102 392 L 108 426 L 113 443 L 119 452 L 125 458 L 131 462 L 137 464 L 142 466 L 148 467 L 154 467 L 160 468 L 166 468 L 172 467 L 178 467 L 183 467 L 189 466 L 195 465 L 201 465 L 207 464 L 212 463 L 218 462 L 224 461 L 230 460 L 236 459 L 242 458 L 248 457 L 253 456 L 259 455 L 265 454 L 271 453 L 277 452 L 282 451 L 288 450 L 294 449 L 300 447 L 306 446 L 312 445 L 318 444 L 323 443 L 329 441 L 335 440 L 341 439 L 347 438 L 352 437 L 358 435 L 364 434 L 370 433 L 376 432 L 382 430 L 388 429 L 393 428 L 399 427 L 405 425 L 411 424 L 417 423 L 422 422 L 428 420 L 434 419 L 440 418 L 446 417 L 452 415 L 458 414 L 463 413 L 469 411 L 475 410 L 481 409 L 487 408 L 492 406 L 498 405 L 504 404 L 510 402 L 516 401 L 522 400 L 528 398 L 533 397 L 539 396 L 545 395 L 551 393 L 557 392 L 562 391 L 568 389 L 574 388 L 580 387 L 586 385 L 592 384 L 598 383 L 603 382 L 609 380 L 615 379 L 621 378 L 627 376 L 632 375 L 638 374 L 644 372 L 650 371 L 656 370 L 662 368 L 668 367 L 673 366 L 679 365 L 685 363 L 691 362 L 697 361 L 702 359 L 708 358 L 714 357 L 720 355 L 726 354 L 732 353 L 738 351 L 743 350 L 749 349 L 755 347 L 761 346 L 767 345 L 772 344 L 778 342 L 784 341 L 790 340" fill="none" stroke="#059669" stroke-width="3"/>
<circle cx="164" cy="468" r="6" fill="#059669"/>
<text x="173.7864787372622" y="491.6023716248706" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#059669">async, fast restart: every 13 min, 8.2%</text>
<text x="90.0" y="538" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">0</text>
<text x="265.0" y="538" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">30</text>
<text x="440.0" y="538" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">60</text>
<text x="615.0" y="538" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">90</text>
<text x="790.0" y="538" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">120</text>
<text x="440.0" y="560" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">checkpoint interval (minutes)</text>
<text x="82" y="524.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">0%</text>
<text x="82" y="460.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">10%</text>
<text x="82" y="396.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">20%</text>
<text x="82" y="332.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">30%</text>
<text x="82" y="268.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">40%</text>
<text x="82" y="204.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#475569">50%</text>
<rect x="840" y="180" width="430" height="150" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="852" y="202.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Young–Daly: interval = √(2 · stall · MTBF)</text>
<text x="852" y="225.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">a shorter stall allows frequent saves, so each failure loses less</text>
<text x="852" y="239.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">work; fast restarts cut the rest</text>
<rect x="840" y="360" width="430" height="150" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="852" y="382.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Alert on trends</text>
<text x="852" y="405.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">stall time grew with model size and host-memory pressure,</text>
<text x="852" y="419.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">unnoticed for three weeks: alert on growth, not just thresholds</text></svg>

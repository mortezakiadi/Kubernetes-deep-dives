<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>Rule hierarchy</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Recording rules by level: every dashboard and alert reads these</text>
<rect x="470.0" y="60" width="360" height="66" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="482.0" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">fleet: fleet:gpu_active_utilization:ratio</text>
<text x="482.0" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">headline numbers (Design 19)</text>
<rect x="370.0" y="140" width="560" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="382.0" y="162" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">pool: pool:gpu_capacity:sum · pool:gpu_active_utilization:ratio</text>
<text x="382.0" y="184" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">per pool, per cluster</text>
<rect x="270.0" y="220" width="760" height="66" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="282.0" y="242" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">team: team:gpu_allocated:sum · team:gpu_active:sum · team:gpu_active:avg1h</text>
<text x="282.0" y="264" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">per team, per pool</text>
<rect x="170.0" y="300" width="960" height="66" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="182.0" y="322" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">gpu: gpu:engine_active:ratio · gpu:allocated:bool · gpu:active:bool</text>
<text x="182.0" y="344" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">joined, one series per GPU</text>
<rect x="70.0" y="380" width="1160" height="66" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="82.0" y="402" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">raw DCGM_FI_* · kube_* (7 days, never queried by dashboards)</text>
<rect x="30" y="480" width="610" height="90" rx="10" fill="#ecfdf5" fill-opacity="1" stroke="#059669"/>
<text x="50" y="508.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#047857">Ratios from sums, never averages of ratios</text>
<text x="50" y="534.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">team activity = Σ active GPUs / Σ allocated GPUs</text>
<text x="50" y="556" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">not mean(per-GPU ratio): GPUs with short lives would count as much as long ones</text>
<rect x="660" y="480" width="610" height="90" rx="10" fill="#fef2f2" fill-opacity="1" stroke="#dc2626"/>
<text x="680" y="508.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: five dashboards, five fleet numbers, up to 20 points apart</text>
<text x="680" y="534.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">naming: level:metric:operations (Prometheus convention)</text>
<text x="680" y="556" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">rules are an API: deprecate names for a release before removing</text></svg>

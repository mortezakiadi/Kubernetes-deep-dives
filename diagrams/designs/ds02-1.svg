<text x="205" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">submit</text>
<path d="M 180 530 L 200 530 L 200 305 L 232 305" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="198.92" y="416" width="30.160000000000004" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="214" y="430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">Git</text>
<path d="M 518 140 L 560 140 L 560 360 L 610 360" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a-blue)"/>
<path d="M 560 200 L 560 165 L 610 165" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-blue)"/>

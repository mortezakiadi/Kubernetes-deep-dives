<text x="565" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">MultiKueue</text>
<text x="565" y="305" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">dispatch</text>
<path d="M 518 330 L 575 330 L 575 735 L 1060 735 L 1060 150 L 1030 150" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-ok)"/>
<path d="M 1060 420 L 1030 420" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<path d="M 1060 680 L 1030 680" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="606.76" y="721" width="406.48" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="810" y="735" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">add-ons, namespaces, LocalQueues and ClusterQueues, by role</text>
<path d="M 1110 615 L 1015 615" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)" marker-start="url(#a-blue-s)"/>
<path d="M 1110 365 L 1015 365" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-flow)"/></svg>

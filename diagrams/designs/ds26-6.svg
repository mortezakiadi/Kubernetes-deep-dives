<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>Rightsizing</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Rightsizing: oversized GPUs and GPUs stranded by CPU requests</text>
<rect x="30" y="60" width="610" height="300" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="50" y="88" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">7B inference on 2 × H100-80GB</text>
<text x="50" y="122.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">memory p99</text>
<rect x="50" y="130" width="500" height="24" rx="3" fill="#e2e8f0" fill-opacity="1" stroke="none"/>
<rect x="50" y="130" width="112" height="24" rx="3" fill="#2563eb" fill-opacity="0.85" stroke="none"/>
<text x="556" y="148" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">18 GB of 80 GB</text>
<text x="50" y="186.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">activity p95</text>
<rect x="50" y="194" width="500" height="24" rx="3" fill="#e2e8f0" fill-opacity="1" stroke="none"/>
<rect x="50" y="194" width="45" height="24" rx="3" fill="#059669" fill-opacity="0.85" stroke="none"/>
<text x="556" y="212" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">9% of 100%</text>
<text x="50" y="260.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">→ move to MIG 3g.40gb slices (or L40S), if the TTFT gate passes</text>
<text x="50" y="286.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">saving ≈ $2,100 / month for this service</text>
<text x="50" y="330" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">evidence travels with the recommendation</text>
<rect x="670" y="60" width="600" height="300" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="690" y="88" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Node: 8 GPUs, 112 CPUs</text>
<rect x="690" y="110" width="58" height="70" rx="6" fill="#2563eb" fill-opacity="0.85" stroke="none"/>
<text x="719" y="150.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">used</text>
<rect x="758" y="110" width="58" height="70" rx="6" fill="#2563eb" fill-opacity="0.85" stroke="none"/>
<text x="787" y="150.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">used</text>
<rect x="826" y="110" width="58" height="70" rx="6" fill="#2563eb" fill-opacity="0.85" stroke="none"/>
<text x="855" y="150.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">used</text>
<rect x="894" y="110" width="58" height="70" rx="6" fill="#2563eb" fill-opacity="0.85" stroke="none"/>
<text x="923" y="150.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">used</text>
<rect x="962" y="110" width="58" height="70" rx="6" fill="#94a3b8" fill-opacity="0.85" stroke="none"/>
<text x="991" y="150.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">1 more</text>
<rect x="1030" y="110" width="58" height="70" rx="6" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="1059" y="150.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">stranded</text>
<rect x="1098" y="110" width="58" height="70" rx="6" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="1127" y="150.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">stranded</text>
<rect x="1166" y="110" width="58" height="70" rx="6" fill="#dc2626" fill-opacity="0.85" stroke="none"/>
<text x="1195" y="150.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">stranded</text>
<rect x="690" y="200" width="560" height="30" rx="3" fill="#e2e8f0" fill-opacity="1" stroke="none"/>
<rect x="690" y="200" width="480" height="30" rx="3" fill="#d97706" fill-opacity="0.85" stroke="none"/>
<text x="700" y="220" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">CPU requested by the 4-GPU job: 96 of 112</text>
<text x="690" y="262.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">3 GPUs nobody can use: 16 CPUs left cover one more GPU (14 per GPU)</text>
<text x="690" y="288.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">→ lower CPU request to ≤ 56; or cap CPU per GPU at admission</text>
<text x="690" y="330" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">stranded GPUs often cost more than oversized ones</text>
<rect x="30" y="390" width="296" height="90" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="412.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">GPU count</text>
<text x="42" y="435.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">mostly idle or low memory → fewer GPUs</text>
<rect x="342" y="390" width="296" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="354" y="412.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">GPU type</text>
<text x="354" y="435.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">small models → smaller GPUs or MIG</text>
<rect x="654" y="390" width="296" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="666" y="412.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Stranding</text>
<text x="666" y="435.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">CPU / memory requests block GPUs</text>
<rect x="966" y="390" width="296" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="978" y="412.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Delivery</text>
<text x="978" y="435.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">tickets + PRs to owners, never silent</text>
<rect x="30" y="500" width="1240" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="42" y="522.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Serving changes go through the benchmark and accuracy gates (Designs 21 and 22)</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>RL health signals</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Health signals every run streams, and the failure each predicts</text>
<rect x="30" y="60" width="400" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="44" y="84.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Reward: train (red) vs held-out (blue)</text>
<path d="M 50 173 L 83 164 L 115 156 L 148 148 L 181 143 L 214 139 L 246 135 L 279 130 L 312 126 L 345 122 L 377 118 L 410 114" fill="none" stroke="#dc2626" stroke-width="3"/>
<text x="44" y="212.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569">held-out flat while train rises → reward hacking</text>
<path d="M 50 173 L 83 166 L 115 161 L 148 159 L 181 158 L 214 158 L 246 159 L 279 159 L 312 159 L 345 160 L 377 161 L 410 162" fill="none" stroke="#2563eb" stroke-width="3"/>
<rect x="450" y="60" width="400" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="464" y="84.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Policy entropy</text>
<path d="M 470 114 L 503 118 L 535 122 L 568 130 L 601 139 L 634 148 L 666 156 L 699 164 L 732 171 L 765 177 L 797 182 L 830 184" fill="none" stroke="#d97706" stroke-width="3"/>
<text x="464" y="212.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569">steady fall to ~0 → exploration collapse</text>
<rect x="870" y="60" width="400" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="884" y="84.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Response length</text>
<path d="M 890 173 L 923 169 L 955 164 L 988 159 L 1021 154 L 1054 148 L 1086 142 L 1119 137 L 1152 130 L 1185 109 L 1217 105 L 1250 105" fill="none" stroke="#2563eb" stroke-width="3"/>
<text x="884" y="212.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569">explosive growth → length bias in loss/reward</text>
<rect x="30" y="250" width="400" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="44" y="274.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">KL to start · clip fraction</text>
<path d="M 50 372 L 83 370 L 115 369 L 148 367 L 181 366 L 214 365 L 246 338 L 279 363 L 312 361 L 345 360 L 377 329 L 410 359" fill="none" stroke="#7c3aed" stroke-width="3"/>
<text x="44" y="402.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569">spikes → updates too large (LR, staleness)</text>
<rect x="450" y="250" width="400" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="464" y="274.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">IS ratio spread (train vs rollout)</text>
<path d="M 470 372 L 503 370 L 535 367 L 568 365 L 601 361 L 634 356 L 666 350 L 699 344 L 732 338 L 765 329 L 797 316 L 830 299" fill="none" stroke="#dc2626" stroke-width="3"/>
<text x="464" y="402.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569">widening → mismatch/staleness; collapse ahead</text>
<rect x="870" y="250" width="400" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="884" y="274.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Gradient norm</text>
<path d="M 890 363 L 923 361 L 955 362 L 988 363 L 1021 360 L 1054 304 L 1086 359 L 1119 361 L 1152 360 L 1185 299 L 1217 358 L 1250 354" fill="none" stroke="#0f172a" stroke-width="3"/>
<text x="884" y="402.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#475569">spikes often precede collapse</text>
<rect x="30" y="440" width="1240" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="463" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Alert on trends, not values</text>
<text x="42" y="486" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Slope alerts on entropy and IS-ratio spread catch problems days before the reward does. Checkpoint every 25–50 RL steps and keep several, so a collapse costs a rollback, not the run.</text></svg>

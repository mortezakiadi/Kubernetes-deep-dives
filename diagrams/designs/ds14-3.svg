<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="540px" viewBox="0 0 1300 540" style="background:#ffffff"><title>Node health lifecycle</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="540" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">A GPU node's health lifecycle</text>
<rect x="40" y="160" width="190" height="80" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="52" y="184" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">New / repaired</text>
<rect x="300" y="160" width="190" height="80" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="312" y="184" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">Burn-in</text>
<rect x="560" y="160" width="190" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="572" y="184" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">Training pool</text>
<rect x="820" y="160" width="190" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="832" y="184" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#991b1b">Drained (tainted)</text>
<rect x="1080" y="160" width="190" height="80" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="1092" y="184" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Repair / retire</text>
<path d="M 230 200 L 300 200" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 490 200 L 560 200" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="506.56" y="178" width="36.88" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="525" y="192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#059669">pass</text>
<path d="M 750 200 L 820 200" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a-bad)"/>
<rect x="743.04" y="178" width="83.92" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="785" y="192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#dc2626">check fails</text>
<path d="M 1010 200 L 1080 200" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 1175 240 L 1175 300 L 135 300 L 135 240" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-muted)"/>
<rect x="564.36" y="278" width="171.28000000000003" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="650" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">repaired → burn-in again</text>
<path d="M 395 160 L 395 120 L 915 120 L 915 160" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a-bad)"/>
<rect x="606.3199999999999" y="98" width="97.36000000000001" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="655" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#dc2626">burn-in fails</text>
<rect x="30" y="350" width="296" height="110" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="372.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Burn-in</text>
<text x="42" y="395.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">DCGM diag, memory test, NVLink + NIC</text>
<text x="42" y="409.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">bandwidth, multi-node collective</text>
<rect x="342" y="350" width="296" height="110" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="354" y="372.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Passive (60 s)</text>
<text x="354" y="395.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">XID errors, ECC / row remaps, thermals, PCIe</text>
<text x="354" y="409.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">+ NIC errors</text>
<rect x="654" y="350" width="296" height="110" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="666" y="372.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Active (idle windows)</text>
<text x="666" y="395.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">short diagnostics between jobs</text>
<rect x="966" y="350" width="296" height="110" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="978" y="372.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Job feedback</text>
<text x="978" y="395.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">node seen in several job failures → drain</text>
<text x="30" y="500" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Seen: a node with intermittent memory errors failed the job twice a day for a week before anyone connected the failures.</text></svg>

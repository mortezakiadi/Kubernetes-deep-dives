<text x="156.39999999999998" y="136" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">job placed 02:30</text>
<circle cx="1220" cy="110" r="7" fill="#b91c1c"/>

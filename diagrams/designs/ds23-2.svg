<text x="42" y="533.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">device plugin, container errors</text>
<path d="M 330 516 L 380 430" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="380" y="380" width="270" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>

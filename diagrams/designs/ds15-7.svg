<rect x="850" y="158" width="420" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="862" y="180" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e40af">Inter-token latency</text>
<text x="862" y="202" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">time per output token</text>
<rect x="850" y="236" width="420" height="66" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="862" y="258" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Load sweep</text>
<text x="862" y="280" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">increasing request rates</text>
<rect x="850" y="314" width="420" height="66" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="862" y="336" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Realistic traffic</text>
<text x="862" y="358" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">production length distributions, shared prefixes</text>
<rect x="850" y="392" width="420" height="66" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="862" y="414" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">One tool, one config</text>
<text x="862" y="436" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">Inference Perf, versioned configs</text>
<rect x="30" y="480" width="1240" height="80" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="503" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Both numbers were right</text>
<text x="42" y="526" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">2,300 at maximum batch with no latency limit; 900 at the product's latency target. Report throughput at the SLO.</text></svg>

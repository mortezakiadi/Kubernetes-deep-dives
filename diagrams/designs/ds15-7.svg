<rect x="90" y="80" width="720" height="360" fill="#ffffff" stroke="#cbd5e1"/>
<path d="M 119 420 L 133 416 L 148 412 L 162 407 L 176 402 L 191 397 L 205 392 L 220 386 L 234 380 L 248 374 L 263 368 L 277 362 L 292 356 L 306 349 L 320 343 L 335 336 L 349 329 L 364 322 L 378 315 L 392 308 L 407 301 L 421 294 L 436 287 L 450 279 L 464 272 L 479 264 L 493 256 L 508 249 L 522 241 L 536 233 L 551 225 L 565 217 L 580 209 L 594 201 L 608 193 L 623 185 L 637 176 L 652 168 L 666 159 L 680 151 L 695 142 L 709 134 L 724 125 L 738 116 L 752 108" fill="none" stroke="#2563eb" stroke-width="3"/>
<line x1="90" y1="329" x2="810" y2="329" stroke="#047857" stroke-width="2" stroke-dasharray="6 4"/>
<text x="98" y="321.2307692307692" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">p95 TTFT target: 2 s</text>
<circle cx="349" cy="329" r="8" fill="#047857"/>
<text x="361.2" y="355.2595317407567" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">throughput at SLO ≈ 900 tok/s/GPU</text>
<circle cx="752" cy="108" r="8" fill="#dc2626"/>
<text x="742.4" y="93.74165433559892" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">max batch: 2,300 tok/s/GPU at ~6 s</text>
<text x="450.0" y="464.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">throughput (tokens/s/GPU) →</text>
<text x="78" y="260.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">p95 latency</text>

<text x="1036" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">e3d2</text>
<rect x="1100" y="138" width="112" height="30" rx="4" fill="#d97706" fill-opacity="0.85" stroke="none"/>
<text x="1156" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">unique</text>
<text x="680" y="212" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">req 2</text>
<rect x="740" y="194" width="112" height="30" rx="4" fill="#7c3aed" fill-opacity="0.85" stroke="none"/>
<text x="796" y="214" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">a91f</text>
<rect x="860" y="194" width="112" height="30" rx="4" fill="#2563eb" fill-opacity="0.85" stroke="none"/>
<text x="916" y="214" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">77c0</text>
<rect x="980" y="194" width="112" height="30" rx="4" fill="#059669" fill-opacity="0.85" stroke="none"/>
<text x="1036" y="214" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">e3d2</text>
<rect x="1100" y="194" width="112" height="30" rx="4" fill="#db2777" fill-opacity="0.85" stroke="none"/>
<text x="1156" y="214" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">unique</text>
<text x="680" y="268" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">req 3</text>
<rect x="740" y="250" width="112" height="30" rx="4" fill="#7c3aed" fill-opacity="0.85" stroke="none"/>
<text x="796" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">a91f</text>
<rect x="860" y="250" width="112" height="30" rx="4" fill="#2563eb" fill-opacity="0.85" stroke="none"/>
<text x="916" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">77c0</text>
<rect x="980" y="250" width="112" height="30" rx="4" fill="#64748b" fill-opacity="0.85" stroke="none"/>
<text x="1036" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">unique</text>
<text x="680" y="320.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">prefix-cache behaviour preserved: requests 1–3 share blocks a91f, 77c0</text>
<text x="680" y="346.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">max_tokens = recorded output length, ignore_eos = true</text>
<text x="680" y="372.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">dataset versioned with its length + sharing statistics</text>
<rect x="30" y="450" width="1240" height="110" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="482.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: copying a day of prompts was (rightly) refused; a public chat dataset was used instead,</text>
<text x="50" y="508" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">and its lengths looked nothing like the coding traffic.</text>
<text x="50" y="538" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Content-dependent effects (speculative acceptance, expert routing) need a separate licensed corpus.</text></svg>

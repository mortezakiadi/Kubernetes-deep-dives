<text x="42" y="135" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">GR_ENGINE_ACTIVE ★</text>
<rect x="30" y="150" width="296" height="28" rx="6" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>

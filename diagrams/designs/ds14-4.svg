<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>Trainer fault tolerance</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Trainer recovery: three levels (illustrative recovery times)</text>
<text x="250" y="106.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Default: full restart</text>
<rect x="270" y="86" width="192" height="32" fill="#94a3b8" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<text x="276" y="107.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">reschedule</text>
<rect x="462" y="86" width="144" height="32" fill="#94a3b8" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<text x="468" y="107.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">image pull</text>
<rect x="606" y="86" width="144" height="32" fill="#94a3b8" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<text x="612" y="107.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">process + NCCL</text>
<rect x="750" y="86" width="360" height="32" fill="#94a3b8" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<text x="756" y="107.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">load 3 TB ckpt</text>
<text x="1120" y="107" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">35 min</text>
<text x="250" y="186.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Fast full restart</text>
<rect x="270" y="166" width="24" height="32" fill="#2563eb" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<rect x="294" y="166" width="12" height="32" fill="#2563eb" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<rect x="306" y="166" width="36" height="32" fill="#2563eb" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<rect x="342" y="166" width="48" height="32" fill="#2563eb" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<text x="400.0" y="187" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">5 min</text>
<text x="250" y="266.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">In-place restart</text>
<rect x="270" y="246" width="24" height="32" fill="#059669" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<rect x="294" y="246" width="36" height="32" fill="#059669" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<rect x="330" y="246" width="24" height="32" fill="#059669" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<text x="364.0" y="267" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">3.5 min</text>
<text x="250" y="346.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Per-step recovery</text>
<rect x="270" y="326" width="7" height="32" fill="#7c3aed" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<text x="287.2" y="347" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">~0 min stop (group rejoins from a peer)</text>
<rect x="30" y="420" width="400" height="140" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="42" y="443" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Hung collectives</text>
<text x="42" y="466" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">NCCL heartbeat / watchdog timeouts turn a 40-minute hang</text>
<text x="42" y="481" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">into an error in minutes</text>
<rect x="450" y="420" width="400" height="140" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="462" y="443" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Per-step recovery needs</text>
<text x="462" y="466" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">replicated DP groups (DDP/HSDP), a coordinator (e.g.</text>
<text x="462" y="481" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">torchft lighthouse), memory headroom</text>
<rect x="870" y="420" width="400" height="140" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="882" y="443" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Measure each phase</text>
<text x="882" y="466" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">detect · schedule · image · start · NCCL · load: fix the</text>
<text x="882" y="481" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">slowest</text></svg>

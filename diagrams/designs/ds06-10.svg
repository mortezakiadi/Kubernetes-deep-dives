<text x="867" y="123" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Trainer</text>
<text x="867" y="146" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">FSDP / Megatron</text>
<rect x="1080" y="100" width="210" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="1092" y="123" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Rollout engines</text>
<text x="1092" y="146" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">vLLM / SGLang</text>
<rect x="855" y="210" width="210" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="867" y="233" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Reference / teacher</text>
<text x="867" y="256" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">when the objective needs it</text>
<rect x="1080" y="210" width="210" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="1092" y="233" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Reward workers</text>
<text x="1092" y="256" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">verifiers, judges</text>
<rect x="855" y="320" width="435" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="867" y="342.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Weight sync and rollout buffer</text>
<text x="867" y="365.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">trainer → rollout engines; rollouts → trainer (staleness ≤ k)</text>
<path d="M 1065 145 L 1080 145" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)" marker-start="url(#a-flow-s)"/>
<path d="M 790 140 L 830 140" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="1080" y="470" width="230" height="110" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="1092" y="492.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Sandbox pool</text>
<text x="1092" y="515.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">runs model-written code for</text>
<text x="1092" y="529.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">rewards (Design 01)</text>
<path d="M 1185 300 L 1185 470" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="570" y="470" width="460" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="582" y="493" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Checkpoints + registry</text>
<text x="582" y="516" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">fast shared storage → S3; chosen checkpoints registered with recipe</text>
<text x="582" y="531" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">and evals</text>
<path d="M 960 440 L 900 470" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="470" width="500" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="493" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Evaluation + tracking</text>
<text x="42" y="516" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">same suites on every checkpoint (batch jobs); metrics, health signals,</text>
<text x="42" y="531" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">samples, cost per experiment in one place</text>
<path d="M 570 525 L 530 525" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="280" width="500" height="110" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="42" y="303" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Health dashboards and alerts</text>
<text x="42" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reward, entropy, length, KL, clip fraction, IS ratios, grad norm per run</text>
<path d="M 830 335 L 530 335" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-flow)"/></svg>

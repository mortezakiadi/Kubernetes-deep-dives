<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>Teaching to hide</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Penalizing a detector teaches evasion (illustrative)</text>
<rect x="90" y="80" width="760" height="280" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<path d="M 90 240 L 166 220 L 242 220 L 318 200 L 394 200 L 470 320 L 546 344 L 622 350 L 698 352 L 774 352 L 850 354" fill="none" stroke="#94a3b8" stroke-width="3"/>
<path d="M 90 200 L 166 180 L 242 180 L 318 160 L 394 160 L 470 160 L 546 160 L 622 140 L 698 160 L 774 160 L 850 140" fill="none" stroke="#dc2626" stroke-width="3"/>
<line x1="432" y1="80" x2="432" y2="360" stroke="#0f172a" stroke-dasharray="5 4"/>
<text x="438.0" y="98" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">judge flags added to the reward as a penalty</text>
<text x="774.0" y="340.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">judge flag rate → ~0</text>
<text x="774.0" y="148.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">audited hack rate: unchanged</text>
<text x="470.0" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">days</text>
<rect x="880" y="60" width="390" height="58" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="892" y="81.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">1 · Fix the environment first</text>
<text x="892" y="103.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">a closed exploit can't be hidden</text>
<rect x="880" y="124" width="390" height="58" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="892" y="145.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">2 · Detectors stay out of the reward</text>
<text x="892" y="167.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">they detect; they don't train</text>
<rect x="880" y="188" width="390" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="892" y="209.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e40af">3 · Filter, don't penalize</text>
<text x="892" y="231.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">zero reward + exclude: no gradient to evade</text>
<rect x="880" y="252" width="390" height="58" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="892" y="273.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">4 · Penalize only what's blocked anyway</text>
<text x="892" y="295.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">environment logs, not imperfect judges</text>
<rect x="880" y="316" width="390" height="58" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="892" y="337.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">5 · Watch reasoning, don't grade it</text>
<text x="892" y="359.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">keep it informative</text>
<rect x="30" y="400" width="1240" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="423" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Only audits tell “the behavior fell” from “the detector stopped seeing it”</text>
<text x="42" y="446" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a falling flag rate is not good news by itself</text>
<rect x="30" y="500" width="1240" height="70" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="540" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Before: flags fell to near zero in a day; the policy edited tests in ways the judge missed and stopped describing it.</text></svg>

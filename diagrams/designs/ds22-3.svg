<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="600px" viewBox="0 0 1300 600" style="background:#ffffff"><title>Open vs closed loop</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="600" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Closed loop hides queueing; open loop shows it (illustrative)</text>
<rect x="30" y="60" width="600" height="330" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="50" y="88" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">Closed loop · 32 clients</text>
<rect x="290" y="130" width="200" height="210" rx="0" fill="#fde68a" fill-opacity="0.45" stroke="none"/>
<text x="390" y="146.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">server slowdown</text>
<path d="M 115 165 L 165 165 L 215 165 L 265 165 L 315 218 L 365 252 L 415 252 L 465 252 L 515 235 L 565 200" fill="none" stroke="#2563eb" stroke-width="3"/>
<path d="M 115 323 L 165 323 L 215 323 L 265 321 L 315 319 L 365 319 L 415 319 L 465 319 L 515 319 L 565 321" fill="none" stroke="#dc2626" stroke-width="3"/>
<text x="94" y="157.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8">requests sent / s</text>
<text x="586" y="343.1" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#dc2626">TTFT p99</text>
<line x1="90" y1="340" x2="590" y2="340" stroke="#94a3b8"/>
<text x="50" y="375.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">server slows → clients send less → TTFT looks fine</text>
<rect x="670" y="60" width="600" height="330" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="690" y="88" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#059669">Open loop · trace schedule</text>
<rect x="930" y="130" width="200" height="210" rx="0" fill="#fde68a" fill-opacity="0.45" stroke="none"/>
<text x="1030" y="146.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">server slowdown</text>
<path d="M 755 165 L 805 165 L 855 165 L 905 165 L 955 165 L 1005 165 L 1055 165 L 1105 165 L 1155 165 L 1205 165" fill="none" stroke="#2563eb" stroke-width="3"/>
<path d="M 755 323 L 805 323 L 855 323 L 905 319 L 955 290 L 1005 243 L 1055 210 L 1105 189 L 1155 197 L 1205 231" fill="none" stroke="#059669" stroke-width="3"/>
<text x="734" y="157.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8">requests sent / s</text>
<text x="1226" y="252.8" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#059669">TTFT p99</text>
<line x1="730" y1="340" x2="1230" y2="340" stroke="#94a3b8"/>
<text x="690" y="375.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">same slowdown → queue builds → TTFT shows it</text>
<rect x="30" y="420" width="296" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="42" y="442.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Send on schedule</text>
<text x="42" y="465.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">trace, Poisson or ramp; never wait for</text>
<text x="42" y="479.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">responses</text>
<rect x="342" y="420" width="296" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="354" y="442.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Track lateness</text>
<text x="354" y="465.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">p99 send lateness &gt; 50 ms → run invalid</text>
<rect x="654" y="420" width="296" height="100" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="666" y="442.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Errors count</text>
<text x="666" y="465.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">a 600 s timeout is a 600 s latency, not a</text>
<text x="666" y="479.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">dropped row</text>
<rect x="966" y="420" width="296" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="978" y="442.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Speed multiples</text>
<text x="978" y="465.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">replay at 1×, 1.5×, 2× keeping bursts</text>
<rect x="30" y="535" width="1240" height="46" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="564" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Before: the upgrade benchmark used fixed concurrency 32 and showed “+12%”; production p99 TTFT doubled.</text></svg>

<text x="842" y="205.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">versioned, worked examples, hard-case rules</text>
<rect x="830" y="260" width="440" height="86" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="842" y="282.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Raters</text>
<text x="842" y="305.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">pool, qualifications, languages</text>
<rect x="830" y="360" width="440" height="86" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>

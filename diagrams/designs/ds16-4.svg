<text x="201" y="383" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#0f172a">A better</text>
<rect x="256" y="362" width="96" height="32" rx="16" fill="#ffffff" stroke="#94a3b8"/>
<text x="304" y="383" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#0f172a">A slightly</text>

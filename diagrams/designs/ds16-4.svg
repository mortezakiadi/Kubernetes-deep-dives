<text x="50" y="352" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Which is better?</text>
<rect x="50" y="362" width="96" height="32" rx="16" fill="#ffffff" stroke="#94a3b8"/>

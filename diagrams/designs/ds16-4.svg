<rect x="415" y="165" width="355" height="160" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="429" y="188.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">Response B (right)</text>

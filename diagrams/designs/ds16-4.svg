<text x="407" y="383" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Tie*</text>
<rect x="462" y="362" width="96" height="32" rx="16" fill="#ffffff" stroke="#94a3b8"/>
<text x="510" y="383" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#0f172a">B slightly</text>
<rect x="565" y="362" width="96" height="32" rx="16" fill="#dbeafe" stroke="#94a3b8"/>
<text x="613" y="383" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#0f172a">B better</text>
<rect x="668" y="362" width="96" height="32" rx="16" fill="#ffffff" stroke="#94a3b8"/>
<text x="716" y="383" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#0f172a">B much better</text>
<text x="50" y="420.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Rubric: correct ☐  follows instructions ☐  safe ☐  concise ☐  tool use appropriate ☐</text>
<rect x="50" y="436" width="720" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="66" y="461" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">Reason (required): B adds the test and caps retries; A retries forever.</text>
<text x="50" y="500" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400e">*Tie only when neither response is better on any rubric item</text>
<text x="50" y="530.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">Before: “tie when both are acceptable” → 71% ties</text>

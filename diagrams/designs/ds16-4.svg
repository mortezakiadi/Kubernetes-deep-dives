="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">What a rater sees, and what the campaign defines</text>
<rect x="30" y="60" width="760" height="500" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
<text x="50" y="88.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#475569">Task 4,812 · coding-agent-prefs-2026-11 · guideline v4</text>
<rect x="50" y="100" width="720" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="66" y="130.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Prompt: “Add retry with exponential backoff to fetch_orders() and a test for it.”</text>
<rect x="50" y="165" width="355" height="160" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="64" y="188.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">Response A (left, randomized)</text>
<rect x="64" y="204" width="300" height="10" rx="3" fill="#e2e8f0"/>
<rect x="64" y="226" width="263" height="10" rx="3" fill="#e2e8f0"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="560px" viewBox="0 0 1300 560" style="background:#ffffff"><title>Metric definitions</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="560" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">One streamed request: what each metric measures</text>
<line x1="80" y1="140" x2="1220" y2="140" stroke="#0f172a" stroke-width="2"/>
<circle cx="80" cy="140" r="7" fill="#0f172a"/>
<text x="80" y="118.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">send</text>
<rect x="80" y="128" width="160" height="24" rx="2" fill="#94a3b8" fill-opacity="0.85" stroke="none"/>
<text x="160.0" y="172.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#94a3b8">network + gateway</text>
<rect x="240" y="128" width="90" height="24" rx="2" fill="#d97706" fill-opacity="0.85" stroke="none"/>
<text x="285.0" y="172.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#d97706">queue</text>
<rect x="330" y="128" width="190" height="24" rx="2" fill="#7c3aed" fill-opacity="0.85" stroke="none"/>
<text x="425.0" y="172.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7c3aed">prefill</text>
<line x1="520" y1="124" x2="520" y2="156" stroke="#059669" stroke-width="3"/>
<line x1="534" y1="124" x2="534" y2="156" stroke="#059669" stroke-width="3"/>
<line x1="549" y1="124" x2="549" y2="156" stroke="#059669" stroke-width="3"/>
<line x1="562" y1="124" x2="562" y2="156" stroke="#059669" stroke-width="3"/>
<line x1="577" y1="124" x2="577" y2="156" stroke="#059669" stroke-width="3"/>
<line x1="592" y1="124" x2="592" y2="156" stroke="#059669" stroke-width="3"/>
<line x1="651" y1="124" x2="651" y2="156" stroke="#059669" stroke-width="3"/>
<line x1="665" y1="124" x2="665" y2="156" stroke="#059669" stroke-width="3"/>
<line x1="679" y1="124" x2="679" y2="156" stroke="#059669" stroke-width="3"/>
<line x1="694" y1="124" x2="694" y2="156" stroke="#059669" stroke-width="3"/>
<line x1="709" y1="124" x2="709" y2="156" stroke="#059669" stroke-width="3"/>
<line x1="723" y1="124" x2="723" y2="156" stroke="#059669" stroke-width="3"/>
<line x1="737" y1="124" x2="737" y2="156" stroke="#059669" stroke-width="3"/>
<line x1="752" y1="124" x2="752" y2="156" stroke="#059669" stroke-width="3"/>
<line x1="767" y1="124" x2="767" y2="156" stroke="#059669" stroke-width="3"/>
<line x1="781" y1="124" x2="781" y2="156" stroke="#059669" stroke-width="3"/>

<line x1="810" y1="124" x2="810" y2="156" stroke="#059669" stroke-width="3"/>
<text x="520" y="118.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">first token</text>
<text x="810.4499999999996" y="118.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#047857">last token</text>
<text x="621.3799999999999" y="196.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c">stall (prefill of another request)</text>
<path d="M 80 222 L 80 230 L 520 230 L 520 222" fill="none" stroke="#1d4ed8" stroke-width="2"/>
<text x="300.0" y="248.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">TTFT</text>
<path d="M 520 262 L 520 270 L 810.4499999999996 270 L 810.4499999999996 262" fill="none" stroke="#059669" stroke-width="2"/>
<text x="665.2249999999998" y="288.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#059669">decode: TPOT = (E2E − TTFT) / (tokens − 1)</text>
<path d="M 80 302 L 80 310 L 810.4499999999996 310 L 810.4499999999996 302" fill="none" stroke="#0f172a" stroke-width="2"/>
<text x="445.2249999999998" y="328.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">end-to-end latency</text>
<rect x="30" y="360" width="296" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="382.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">TTFT</text>
<text x="42" y="405.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">send → first content token; includes</text>
<text x="42" y="419.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">network, gateway, queue, prefill</text>
<rect x="342" y="360" width="296" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="354" y="382.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">TPOT</text>
<text x="354" y="405.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">one value per request: average decode pace</text>
<text x="354" y="419.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">that user saw</text>
<rect x="654" y="360" width="296" height="110" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="666" y="382.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">ITL</text>
<text x="666" y="405.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">every token gap; its p99 shows stalls TPOT</text>
<text x="666" y="419.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">averages away</text>
<rect x="966" y="360" width="296" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="978" y="382.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Token counts</text>
<text x="978" y="405.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">tokenizer or usage field, never chunk counts</text>
<rect x="30" y="490" width="1240" height="50" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="50" y="521" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Before: one dashboard's “TPOT” was total time ÷ tokens, another's was mean gap after the first: 3× apart for long prompts.</text></svg>

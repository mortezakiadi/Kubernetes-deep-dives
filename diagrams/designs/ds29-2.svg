<svg xmlns="http://www.w3.org/2000/svg" width="1300px" height="580px" viewBox="0 0 1300 580" style="background:#ffffff"><title>Hardened environment</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1300" height="580" fill="#ffffff"/><text x="650" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">The verifier runs where the agent never was</text>
<rect x="30" y="60" width="480" height="330" rx="14" fill="#fef2f2" fill-opacity=".55" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="44" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#991b1b">AGENT SANDBOX</text>
<rect x="50" y="100" width="440" height="80" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="62" y="122.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Workspace</text>
<text x="62" y="145.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">repo checkout; agent edits freely</text>
<rect x="50" y="200" width="440" height="70" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="62" y="222" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">No: tests' source of truth, reference, grader, network</text>
<rect x="50" y="290" width="440" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="62" y="312.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Output: artifact only</text>
<text x="62" y="335.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">a patch / final tree / answer</text>
<path d="M 510 330 L 560 330" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="503.12" y="306" width="63.760000000000005" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="535" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1e293b">artifact</text>
<rect x="560" y="60" width="710" height="330" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="574" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">VERIFIER CONTAINER (CLEAN)</text>
<rect x="580" y="95" width="670" height="50" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="592" y="116.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">1 · Protected paths?</text>
<text x="592" y="138.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">patch touching tests/, conftest.py, pytest.ini → reject</text>
<rect x="580" y="153" width="670" height="50" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="592" y="174.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">2 · Apply to clean checkout</text>
<text x="592" y="196.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">base commit from the task, not the sandbox</text>
<rect x="580" y="211" width="670" height="50" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="592" y="232.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">3 · Visible tests</text>
<text x="592" y="254.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">from the task</text>
<rect x="580" y="269" width="670" height="50" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="592" y="290.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">4 · Hidden tests</text>
<text x="592" y="312.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">never in the sandbox</text>
<rect x="580" y="327" width="670" height="50" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="592" y="348.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">5 · Fail closed</text>
<text x="592" y="370.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334155">timeout / crash = failure</text>
<rect x="30" y="410" width="760" height="140" rx="10" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1"/>
<text x="50" y="438" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Results that are signals in themselves</text>
<text x="50" y="468.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">visible pass + hidden fail → overfitting or special-casing</text>
<text x="50" y="494.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">protected-path-modified → exploit attempt (monitor event)</text>
<text x="50" y="520.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#5b21b6">image contains a known reference hash → image rejected before use</text>
<rect x="820" y="410" width="450" height="140" rx="10" fill="#fef2f2" stroke="#dc2626"/>
<text x="840" y="440" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Before: agent could write anywhere,</text>
<text x="840" y="464" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">including tests; the verifier ran in</text>
<text x="840" y="488" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">the same container afterwards.</text>
<text x="840" y="524.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">Editing the test config was a normal edit.</text></svg>

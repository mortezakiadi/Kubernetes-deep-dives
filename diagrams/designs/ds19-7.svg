<text x="42" y="453" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Report intervals and parallel trends</text>
<text x="42" y="476" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">check that pools moved together before the change; daily values are correlated, so use weekly blocks; tell leadership “+5.5 points (3.4 to 7.6)”, not “+10.0”</text></svg>

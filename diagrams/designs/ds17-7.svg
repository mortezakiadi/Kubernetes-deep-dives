<rect x="210" y="96" width="486" height="20" rx="3" fill="#2563eb"/>
<rect x="696" y="96" width="122" height="20" rx="3" fill="#2563eb" fill-opacity=".55" stroke="#2563eb" stroke-dasharray="4 3"/>
<line x1="940" y1="82" x2="940" y2="130" stroke="#2563eb" stroke-width="3"/>
<text x="1250" y="110.0" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2563eb">nominal 512 · using 640</text>
<text x="190" y="190" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">vision-team</text>

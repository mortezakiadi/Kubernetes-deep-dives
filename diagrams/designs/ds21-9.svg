<text x="862" y="346.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Same hardware, repeated</text>
<text x="862" y="369.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">candidate vs production; repeats give noise</text>
<rect x="850" y="436" width="420" height="96" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="862" y="458.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Report the curve</text>
<text x="862" y="481.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">a higher peak that falls off faster is riskier under bursts</text></svg>

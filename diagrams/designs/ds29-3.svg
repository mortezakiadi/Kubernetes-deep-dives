<text x="50" y="540.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: reward rose for two weeks; a pairwise human evaluation found no improvement.</text></svg>

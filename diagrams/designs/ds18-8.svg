<text x="60" y="502.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Before: a job preempted at the neocloud couldn't resume on AWS; its checkpoints were on the neocloud filesystem.</text>
<text x="60" y="528" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">Now: the latest few checkpoints replicate home, so any allowed site can resume; egress cost is part of placement.</text></svg>

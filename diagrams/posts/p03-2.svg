<svg xmlns="http://www.w3.org/2000/svg" width="1260px" height="470px" viewBox="0 0 1260 470" style="background:#ffffff"><title>Quantization and memory</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1260" height="470" fill="#ffffff"/><text x="630" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Same 48 GB GPU, 8B model: quantization turns weight memory into KV cache</text>
<text x="30" y="112" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">BF16 weights</text>
<rect x="220" y="80" width="320" height="50" fill="#d97706" fill-opacity=".8"/>
<text x="230" y="111.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">weights 16 GB</text>
<rect x="540" y="80" width="40" height="50" fill="#94a3b8"/>
<rect x="580" y="80" width="504" height="50" fill="#2563eb" fill-opacity=".75"/>
<text x="590.0" y="111.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">KV cache 25 GB</text>
<text x="220" y="152" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">16-bit: baseline</text>
<text x="30" y="222" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">FP8 / INT8 weights</text>
<rect x="220" y="190" width="160" height="50" fill="#d97706" fill-opacity=".8"/>
<text x="230" y="221.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">weights 8 GB</text>
<rect x="380" y="190" width="40" height="50" fill="#94a3b8"/>
<rect x="420" y="190" width="664" height="50" fill="#2563eb" fill-opacity=".75"/>
<text x="430.0" y="221.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">KV cache 33 GB</text>
<text x="220" y="262" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">~2x throughput on native-FP8 GPUs, ≥99% accuracy (typical)</text>
<text x="30" y="332" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">4-bit weights</text>
<rect x="220" y="300" width="80" height="50" fill="#d97706" fill-opacity=".8"/>
<text x="230" y="331.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">weights 4 GB</text>
<rect x="300" y="300" width="40" height="50" fill="#94a3b8"/>
<rect x="340" y="300" width="744" height="50" fill="#2563eb" fill-opacity=".75"/>
<text x="350.0" y="331.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">KV cache 37 GB</text>
<text x="220" y="372" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">smallest; evaluate carefully</text>
<text x="630" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Two conditions: the server has native kernels for the format, and the quantized model is evaluated again.</text></svg>

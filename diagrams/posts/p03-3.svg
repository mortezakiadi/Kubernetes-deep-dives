<svg xmlns="http://www.w3.org/2000/svg" width="1260px" height="500px" viewBox="0 0 1260 500" style="background:#ffffff"><title>GPU memory budget</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1260" height="500" fill="#ffffff"/><text x="630" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">One replica's GPU memory budget</text>
<rect x="40" y="80" width="330" height="80" fill="#d97706" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<text x="48" y="112" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Weights</text>
<text x="48" y="132" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">16 GB</text>
<text x="44" y="190.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">params × bytes per param</text>
<rect x="370" y="80" width="150" height="80" fill="#94a3b8" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<text x="378" y="112" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Overhead</text>
<text x="378" y="132" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">2 GB</text>
<text x="374" y="190.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">CUDA context, buffers</text>
<text x="374" y="204.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">~1–2 GB</text>
<rect x="520" y="80" width="150" height="80" fill="#64748b" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<text x="528" y="112" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Activations</text>
<text x="528" y="132" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">2 GB</text>
<text x="524" y="190.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">grow with tokens per</text>
<text x="524" y="204.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">step</text>
<rect x="670" y="80" width="400" height="80" fill="#2563eb" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<text x="678" y="112" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">KV cache</text>
<text x="678" y="132" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">23 GB</text>
<text x="674" y="190.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">everything left: decides how many users fit</text>
<rect x="1070" y="80" width="150" height="80" fill="#e2e8f0" fill-opacity=".85" stroke="#fff" stroke-width="2"/>
<text x="1078" y="112" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Headroom</text>
<text x="1078" y="132" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">5 GB</text>
<text x="1074" y="190.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">1 −</text>
<text x="1074" y="204.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">gpu-memory-utilization</text>
<text x="40" y="64.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#475569">48 GB GPU, 8B model at 16 bits (example; widths not to scale)</text>
<rect x="40" y="290" width="1180" height="170" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="60" y="322" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">KV cache per token = 2 × layers × KV heads × head size × bytes per value</text>
<text x="60" y="352" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1e293b">Llama 3.1 8B (grouped-query attention, 8 KV heads): 2 × 32 × 8 × 128 × 2 B ≈ 131 KB per token</text>
<text x="60" y="376" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1e293b">Same size without grouped-query attention (32 KV heads): ≈ 524 KB per token, 4x more</text>
<text x="60" y="410" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857">23 GB ÷ 131 KB ≈ 175,000 tokens ≈ 21 users at 8k context each</text>
<text x="60" y="436.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#475569">vLLM prints this breakdown at startup and preempts requests when the KV cache is full.</text></svg>

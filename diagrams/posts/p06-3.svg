"Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">RAG at query time: retrieve, ground, generate, check</text>
<rect x="30.0" y="90" width="150.85714285714286" height="120" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42.0" y="112.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Question</text>
<text x="42.0" y="135.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">+ user's access</text>
<text x="42.0" y="149.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">groups</text>
<path d="M 180.85714285714286 150.0 L 204.85714285714286 150.0" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="204.85714285714286" y="90" width="150.85714285714286" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="216.85714285714286" y="112.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Embed</text>
<text x="216.85714285714286" y="135.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">same model as</text>
<text x="216.85714285714286" y="149.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">ingestion</text>
<path d="M 355.7142857142857 150.0 L 379.7142857142857 150.0" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="379.7142857142857" y="90" width="150.85714285714286" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="391.7142857142857" y="112.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Search</text>
<text x="391.7142857142857" y="135.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">vector (+ keyword),</text>
<text x="391.7142857142857" y="149.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">filtered by access</text>
<path d="M 530.5714285714286 150.0 L 554.5714285714286 150.0" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="554.5714285714286" y="90" width="150.85714285714286" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="566.5714285714286" y="112.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Rerank</text>
<text x="566.5714285714286" y="135.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">optional, top 20–50</text>
<path d="M 705.4285714285714 150.0 L 729.4285714285714 150.0" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="729.4285714285714" y="90" width="150.85714285714286" height="120" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="741.4285714285714" y="112.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Prompt</text>
<text x="741.4285714285714" y="135.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">versioned template +</text>
<text x="741.4285714285714" y="149.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">sources</text>
<path d="M 880.2857142857143 150.0 L 904.2857142857143 150.0" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="904.2857142857143" y="90" width="150.85714285714286" height="120" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="916.2857142857143" y="112.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Generate</text>
<text x="916.2857142857143" y="135.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">LLM</text>
<path d="M 1055.142857142857 150.0 L 1079.142857142857 150.0" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="1079.142857142857" y="90" width="150.85714285714286" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="1091.142857142857" y="112.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Check</text>
<text x="1091.142857142857" y="135.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">citations, output</text>
<text x="1091.142857142857" y="149.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">guardrails</text>
<rect x="30" y="280" width="590" height="110" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="303" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Measure retrieval separately</text>
<text x="42" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">If the right chunk isn't in the top results, no prompt will fix the answer (context</text>
<text x="42" y="341" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">relevance, faithfulness).</text>
<rect x="640" y="280" width="590" height="110" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="652" y="303" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Ground the answer</text>
<text x="652" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">"Answer only from the sources; cite [n]; say so if they don't contain it" — then verify</text>
<text x="652" y="341" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the citations exist.</text></svg>

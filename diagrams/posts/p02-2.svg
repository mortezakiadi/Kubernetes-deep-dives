<rect x="834.76" y="216" width="70.48" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="870" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">points to</text>
<rect x="420" y="400" width="420" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="432" y="423" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Deployment (GitOps)</text>
<text x="432" y="446" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">serves 'support-assistant@production', resolved to a URI at</text>
<text x="432" y="461" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">deploy time</text>
<path d="M 630 360 L 630 400" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>

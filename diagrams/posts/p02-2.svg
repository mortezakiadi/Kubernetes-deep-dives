<rect x="1014.6" y="316" width="110.80000000000001" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="1070" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#047857">loads the files</text></svg>

<text x="630" y="435" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">On the ordinary pod network, step 2 becomes the bottleneck and the GPUs wait.</text></svg>

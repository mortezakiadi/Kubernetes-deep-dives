<svg xmlns="http://www.w3.org/2000/svg" width="1260px" height="600px" viewBox="0 0 1260 600" style="background:#ffffff"><title>Anatomy of a hand-written model Deployment</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1260" height="600" fill="#ffffff"/><text x="630" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">What one vLLM Deployment needs beyond 'run this image'</text>
<rect x="380" y="70" width="500" height="470" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="394" y="94" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">POD: QWEN-7B</text>
<rect x="410" y="120" width="440" height="120" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="422" y="144" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">vllm container</text>
<text x="422" y="168" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">vllm/vllm-openai, --model Qwen/Qwen2.5-7B-Instruct, port</text>
<text x="422" y="184" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">8000, OpenAI API</text>
<rect x="410" y="270" width="210" height="110" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="422" y="293" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">/cache</text>
<text x="422" y="316" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">model cache on a PVC:</text>
<text x="422" y="331" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">survives restarts</text>
<rect x="640" y="270" width="210" height="110" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="652" y="293" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">/dev/shm</text>
<text x="652" y="316" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">memory-backed emptyDir for</text>
<text x="652" y="331" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">multi-GPU</text>
<rect x="410" y="410" width="440" height="100" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="422" y="433" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Probes</text>
<text x="422" y="456" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">startupProbe with a long budget (weights load for minutes), then</text>
<text x="422" y="471" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">readiness on /health</text>
<rect x="30" y="90" width="300" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="42" y="113" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">GPU limit</text>
<text x="42" y="136" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">nvidia.com/gpu: 1 → GPU node, device plugin</text>
<text x="42" y="151" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">assigns a GPU</text>
<path d="M 330 140 L 410 140" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="250" width="300" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="42" y="273" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Toleration</text>
<text x="42" y="296" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">GPU nodes are tainted; the server tolerates</text>
<text x="42" y="311" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">it</text>
<path d="M 330 300 L 410 300" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="30" y="410" width="300" height="100" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="42" y="433" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Secret: HF_TOKEN</text>
<text x="42" y="456" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">for gated models, read at startup</text>
<path d="M 330 460 L 410 460" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="930" y="275" width="300" height="100" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="942" y="298" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">PVC model-cache</text>
<text x="942" y="321" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">100Gi, ReadWriteOnce; one replica</text>
<rect x="930" y="130" width="300" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="942" y="153" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Service</text>
<text x="942" y="176" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">qwen-7b:8000, the stable name clients call</text>
<path d="M 930 325 L 850 325" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 930 180 L 850 180" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<text x="630" y="580.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#475569" font-style="italic">Multiply by every model, and a controller (KServe, KubeRay) starts to pay for itself.</text></svg>

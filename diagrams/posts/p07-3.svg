<svg xmlns="http://www.w3.org/2000/svg" width="1260px" height="480px" viewBox="0 0 1260 480" style="background:#ffffff"><title>Combined identity and policy</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1260" height="480" fill="#ffffff"/><text x="630" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Production: workload identity + user identity + a policy that requires both</text>
<rect x="30" y="160" width="220" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="42" y="183" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">refund-assistant pod</text>
<text x="42" y="206" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">SPIFFE ID from SPIRE; user</text>
<text x="42" y="221" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">token from the request</text>
<rect x="330" y="60" width="360" height="110" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="342" y="83" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">mTLS (SPIFFE)</text>
<text x="342" y="106" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">proves: this is</text>
<text x="342" y="121" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">spiffe://…/ns/agents/sa/refund-assistant</text>
<rect x="330" y="270" width="360" height="110" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="342" y="293" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Exchanged token or header</text>
<text x="342" y="316" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">carries: user alice, groups [support]</text>
<path d="M 250 200 L 330 115" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 250 240 L 330 325" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="770" y="150" width="230" height="140" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="782" y="173" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">OPA policy</text>
<text x="782" y="196" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">workload == refund-assistant AND</text>
<text x="782" y="211" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">'support' in user.groups AND</text>
<text x="782" y="226" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">tool allowed</text>
<path d="M 690 115 L 770 200" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 690 325 L 770 245" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="1060" y="150" width="170" height="140" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="1072" y="173" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Tool: draft_refund</text>
<text x="1072" y="196" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">runs only if allowed</text>
<path d="M 1000 220 L 1060 220" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="1008.2" y="196" width="43.6" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="1030" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#059669">allow</text>
<text x="630" y="440" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#475569" font-style="italic">Every decision logged with workload, user, tool and outcome.</text></svg>

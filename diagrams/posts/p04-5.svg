<text x="1020" y="205" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">answer</text>
<rect x="380" y="300" width="470" height="90" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="392" y="323" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Inference logger → protected store</text>
<text x="392" y="346" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">every request and response (CloudEvents); explain only disputed cases</text>
<text x="392" y="361" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">later</text>

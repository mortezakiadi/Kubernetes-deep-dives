<text x="392" y="83" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Fairness and drift monitor</text>
<text x="392" y="106" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">metrics on protected attributes (e.g. TrustyAI)</text>
<path d="M 615 150 L 615 130" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-flow)"/></svg>

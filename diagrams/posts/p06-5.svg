<rect x="720" y="70" width="510" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="732" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Agent</text>
<text x="732" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Deployment (or Kagent Agent CR); framework: LangGraph, CrewAI, or a</text>
<text x="732" y="131" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">server-side runtime</text>
<rect x="720" y="170" width="510" height="80" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="732" y="193" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">Tools</text>
<text x="732" y="216" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Services, mostly MCP servers; fewest tools that do the job</text>
<rect x="720" y="270" width="510" height="80" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="732" y="293" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Memory</text>
<text x="732" y="316" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Redis StatefulSet (session), database (long-term)</text>
<rect x="720" y="370" width="510" height="80" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="732" y="393" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Heavy work</text>
<text x="732" y="416" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Jobs; untrusted code in a sandbox (Design 01)</text>
<rect x="720" y="470" width="510" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="732" y="493" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Human approval</text>
<text x="732" y="516" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">before tools that send money, delete data or message customers</text></svg>

<text x="52" y="494" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">4. OCI image volume</text>
<text x="52" y="518" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Model image mounted read-only</text>
<rect x="880" y="470" width="340" height="110" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="892" y="493" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Cost</text>

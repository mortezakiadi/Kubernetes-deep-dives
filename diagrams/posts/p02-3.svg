<text x="620.0" y="519.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Model server pod</text>
<text x="620.0" y="542.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">vLLM reads /models</text>

<text x="892" y="358" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Cost</text>
<text x="892" y="381" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">shareProcessNamespace, startup races</text>

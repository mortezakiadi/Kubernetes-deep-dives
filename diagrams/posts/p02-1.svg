<svg xmlns="http://www.w3.org/2000/svg" width="1260px" height="560px" viewBox="0 0 1260 560" style="background:#ffffff"><title>What's in a model directory</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1260" height="560" fill="#ffffff"/><text x="630" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">A model is a directory, not a file</text>
<rect x="30" y="60" width="560" height="470" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="44" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#0f172a">QWEN2.5-7B-INSTRUCT/</text>
<rect x="55" y="100" width="510" height="58" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="67" y="122.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">model-00001-of-00004.safetensors</text>
<text x="67" y="145.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">3.9 GB · weight shard</text>
<rect x="55" y="170" width="510" height="58" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="67" y="192.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">model-00002…00004-of-00004.safetensors</text>
<text x="67" y="215.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">3 more shards</text>
<rect x="55" y="240" width="510" height="58" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="67" y="262.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">model.safetensors.index.json</text>
<text x="67" y="285.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">which tensor lives in which shard</text>
<rect x="55" y="310" width="510" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="67" y="332.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">config.json</text>
<text x="67" y="355.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">architecture: layers, heads, hidden size</text>
<rect x="55" y="380" width="510" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="67" y="402.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">tokenizer.json, tokenizer_config.json</text>
<text x="67" y="425.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">text ↔ tokens, chat template</text>
<rect x="55" y="450" width="510" height="58" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="67" y="472.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">generation_config.json</text>
<text x="67" y="495.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">default sampling settings</text>
<text x="310" y="525.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">The server needs all of it, not just the weights</text>
<rect x="640" y="70" width="590" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="652" y="94" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">Safetensors</text>
<text x="652" y="118" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Safe (no code execution), memory-mapped, sharded. Needs config + tokenizer</text>
<text x="652" y="134" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">alongside.</text>
<rect x="640" y="188" width="590" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="652" y="212" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">GGUF</text>
<text x="652" y="236" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Quantized weights + tokenizer in one file. llama.cpp; vLLM can load it.</text>
<rect x="640" y="306" width="590" height="100" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="652" y="330" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">ONNX</text>
<text x="652" y="354" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Graph + weights, no tokenizer. Portable runtimes.</text>
<rect x="640" y="424" width="590" height="100" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="652" y="448" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#991b1b">PyTorch .pt / .bin</text>
<text x="652" y="472" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Pickle: can execute code when loaded. Needs the model's code.</text></svg>

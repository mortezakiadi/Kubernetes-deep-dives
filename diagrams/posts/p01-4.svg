<svg xmlns="http://www.w3.org/2000/svg" width="1260px" height="600px" viewBox="0 0 1260 600" style="background:#ffffff"><title>KServe runtime and model separation</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1260" height="600" fill="#ffffff"/><text x="630" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">KServe: the platform owns the runtime, the model team owns the model</text>
<rect x="40" y="70" width="360" height="150" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="52" y="94" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">ClusterServingRuntime</text>
<text x="52" y="118" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Owned by the platform team. Server image,</text>
<text x="52" y="134" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">default args, ports, supported formats. One</text>
<text x="52" y="150" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">change updates every model.</text>
<rect x="40" y="260" width="360" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="52" y="284" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">InferenceService</text>
<text x="52" y="308" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Owned by the model team. storageUri, format,</text>
<text x="52" y="324" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">resources, replicas. Refers to a runtime.</text>
<rect x="40" y="440" width="360" height="130" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="52" y="463" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">LLMInferenceService (newer, alpha)</text>
<text x="52" y="486" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Cache-aware routing, prefill/decode split, tensor /</text>
<text x="52" y="501" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">data / expert parallelism</text>
<rect x="480" y="180" width="260" height="150" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="610.0" y="241.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">KServe controller</text>
<text x="610.0" y="265.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Reconciles both into running</text>
<text x="610.0" y="281.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">resources</text>
<path d="M 400 145 L 480 230" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 400 335 L 480 280" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 400 505 L 520 505 L 520 330" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="820" y="60" width="400" height="88" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="832" y="83" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Storage initializer</text>
<text x="832" y="106" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">downloads the model into the pod</text>
<path d="M 740 255 L 820 104" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="820" y="165" width="400" height="88" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="832" y="188" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Deployment + pods</text>
<text x="832" y="211" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the model server</text>
<path d="M 740 255 L 820 209" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="820" y="270" width="400" height="88" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="832" y="293" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Service + route</text>
<text x="832" y="316" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">stable endpoint, gateway</text>
<path d="M 740 255 L 820 314" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="820" y="375" width="400" height="88" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="832" y="398" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Autoscaling</text>
<text x="832" y="421" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">HPA / KEDA, or Knative to zero</text>
<path d="M 740 255 L 820 419" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="820" y="480" width="400" height="90" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="832" y="502.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Modes</text>
<text x="832" y="525.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Standard (plain Deployments, large LLMs) · Knative (scale to</text>
<text x="832" y="539.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">zero) · ModelMesh (many small models)</text></svg>

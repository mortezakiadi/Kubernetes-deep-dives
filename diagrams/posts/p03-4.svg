<svg xmlns="http://www.w3.org/2000/svg" width="1260px" height="560px" viewBox="0 0 1260 560" style="background:#ffffff"><title>vLLM tuning knobs</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1260" height="560" fill="#ffffff"/><text x="630" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">vLLM settings that matter, and what each trades</text>
<rect x="30" y="60" width="360" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="210.0" y="97.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">--gpu-memory-utilization</text>
<rect x="410" y="60" width="400" height="66" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="422" y="82.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Gain</text>
<text x="422" y="105.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">More of the GPU for KV cache</text>
<rect x="830" y="60" width="400" height="66" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="842" y="82.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Cost</text>
<text x="842" y="105.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Less headroom for anything sharing the GPU</text>
<rect x="30" y="140" width="360" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="210.0" y="177.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">--max-model-len</text>
<rect x="410" y="140" width="400" height="66" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="422" y="162.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Gain</text>
<text x="422" y="185.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Caps context per request → sizes KV claims</text>
<rect x="830" y="140" width="400" height="66" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="842" y="162.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Cost</text>
<text x="842" y="185.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Too low: long RAG prompts fail</text>
<rect x="30" y="220" width="360" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="210.0" y="257.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">--max-num-seqs</text>
<rect x="410" y="220" width="400" height="66" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="422" y="242.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Gain</text>
<text x="422" y="265.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">More requests per batch → throughput</text>
<rect x="830" y="220" width="400" height="66" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="842" y="242.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Cost</text>
<text x="842" y="265.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Too high: memory runs out, preemptions</text>
<rect x="30" y="300" width="360" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="210.0" y="337.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">--tensor/pipeline-parallel-size</text>
<rect x="410" y="300" width="400" height="66" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="422" y="322.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Gain</text>
<text x="422" y="345.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Bigger models; more KV room</text>
<rect x="830" y="300" width="400" height="66" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="842" y="322.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Cost</text>
<text x="842" y="345.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">More GPUs per replica, network sensitive</text>
<rect x="30" y="380" width="360" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="210.0" y="417.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">--cpu-offload-gb</text>
<rect x="410" y="380" width="400" height="66" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="422" y="402.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Gain</text>
<text x="422" y="425.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Bigger model fits</text>
<rect x="830" y="380" width="400" height="66" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="842" y="402.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Cost</text>
<text x="842" y="425.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Too slow for production</text>
<rect x="30" y="460" width="360" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="210.0" y="497.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">prefix caching (on by default)</text>
<rect x="410" y="460" width="400" height="66" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="422" y="482.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Gain</text>
<text x="422" y="505.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Reuses shared prompt prefixes</text>
<rect x="830" y="460" width="400" height="66" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="842" y="482.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Cost</text>
<text x="842" y="505.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">Needs cache-aware routing to pay off</text></svg>

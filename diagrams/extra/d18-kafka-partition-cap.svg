<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" >Consumers against partitions (illustrative)</text>
<text x="24" y="58" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start" >One topic with 6 partitions. In a consumer group, each partition goes to at most one consumer. A consumer box sits under the partitions that it reads.</text>
<text x="24" y="100" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >4 consumers: C0 and C1 read 2 partitions each, C2 and C3 read 1 each</text>

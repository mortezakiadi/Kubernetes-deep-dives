<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" width="1180" height="540" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs>
<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" >If you know storage, you already know the shape of DRA</text>
<rect x="24.0" y="50.0" width="36.6" height="22.0" rx="11" fill="#0f766e" stroke="none" stroke-width="1.6"/>
<text x="42.3" y="65.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >DRA</text>
<text x="72.6" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start" >Kubernetes' docs compare DRA to storage classes and claims. Rows tagged "our comparison" are ours. The colored tag says who creates it.</text>
<text x="24" y="104" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b6675" text-anchor="start" >In storage</text>
<text x="420" y="104" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b6675" text-anchor="start" >In DRA</text>
<text x="760" y="104" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b6675" text-anchor="start" >What it means</text>
<rect x="24.0" y="116.0" width="340.0" height="62.0" rx="10" fill="#f6f8fb" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="175" y="143" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="middle" >PersistentVolume</text>
<text x="175" y="165" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" >the disks that exist</text>
<rect x="255.8" y="154.0" width="100.2" height="16.0" rx="8" fill="#e4e9f0" stroke="none" stroke-width="1.6"/>
<text x="305.9" y="165.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#5b6675" text-anchor="middle" >our comparison</text>
<path d="M372,147 L412,147" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<rect x="420.0" y="116.0" width="330.0" height="62.0" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="436" y="143" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="start" >ResourceSlice</text>
<rect x="436.0" y="152.0" width="55.2" height="18.0" rx="9" fill="#e08a1e" stroke="none" stroke-width="1.6"/>
<text x="463.6" y="165" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" >driver</text>
<text x="764" y="142" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start" >The devices that exist on a node, each with its facts:</text>
<text x="764" y="160" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start" >product, architecture, memory.</text>
<rect x="24.0" y="196.0" width="340.0" height="62.0" rx="10" fill="#f6f8fb" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="175" y="223" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="middle" >StorageClass</text>
<text x="175" y="245" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" >a named kind of disk</text>
<rect x="249.5" y="234.0" width="106.5" height="16.0" rx="8" fill="#d7efe0" stroke="none" stroke-width="1.6"/>
<text x="302.75" y="245.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1f6b3f" text-anchor="middle" >Kubernetes docs</text>
<path d="M372,227 L412,227" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<rect x="420.0" y="196.0" width="330.0" height="62.0" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="436" y="223" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="start" >DeviceClass</text>
<rect x="436.0" y="232.0" width="55.2" height="18.0" rx="9" fill="#e08a1e" stroke="none" stroke-width="1.6"/>
<text x="463.6" y="245" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" >driver</text>
<text x="764" y="222" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start" >A named kind of device to ask for, such as gpu.nvidia.com</text>
<text x="764" y="240" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start" >(an NVIDIA GPU).</text>
<rect x="24.0" y="276.0" width="340.0" height="62.0" rx="10" fill="#ffffff" stroke="#c5ccd6" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="194" y="303" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8a94a1" text-anchor="middle" >no matching row</text>
<text x="194" y="323" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a94a1" text-anchor="middle" >the part that is new</text>
<path d="M372,307 L412,307" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<rect x="420.0" y="276.0" width="330.0" height="62.0" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="436" y="303" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="start" >CEL rule</text>
<rect x="436.0" y="312.0" width="105.6" height="18.0" rx="9" fill="#3b6fd8" stroke="none" stroke-width="1.6"/>
<text x="488.8" y="325" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" >you, optional</text>
<text x="764" y="302" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start" >A true-or-false rule. The class already has one (from the</text>
<text x="764" y="320" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start" >driver or an admin). Your claim may add one. A device must</text>
<text x="764" y="338" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start" >pass both.</text>
<rect x="24.0" y="356.0" width="340.0" height="62.0" rx="10" fill="#f6f8fb" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="175" y="383" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="middle" >volumeClaimTemplates</text>
<text x="175" y="405" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" >in a StatefulSet</text>
<rect x="255.8" y="394.0" width="100.2" height="16.0" rx="8" fill="#e4e9f0" stroke="none" stroke-width="1.6"/>
<text x="305.9" y="405.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#5b6675" text-anchor="middle" >our comparison</text>
<path d="M372,387 L412,387" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<rect x="420.0" y="356.0" width="330.0" height="62.0" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="436" y="383" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="start" >ResourceClaimTemplate</text>
<rect x="436.0" y="392.0" width="33.6" height="18.0" rx="9" fill="#3b6fd8" stroke="none" stroke-width="1.6"/>
<text x="452.8" y="405" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" >you</text>
<text x="764" y="382" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start" >A recipe: class + optional CEL rule + how many. Every pod</text>
<text x="764" y="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start" >gets its own claim made from it.</text>
<rect x="24.0" y="436.0" width="340.0" height="62.0" rx="10" fill="#f6f8fb" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="175" y="463" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="middle" >PersistentVolumeClaim</text>
<text x="175" y="485" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" >one request for a disk</text>
<rect x="249.5" y="474.0" width="106.5" height="16.0" rx="8" fill="#d7efe0" stroke="none" stroke-width="1.6"/>
<text x="302.75" y="485.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1f6b3f" text-anchor="middle" >Kubernetes docs</text>
<path d="M372,467 L412,467" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<rect x="420.0" y="436.0" width="330.0" height="62.0" rx="10" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6"/>
<text x="436" y="463" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="start" >ResourceClaim</text>
<rect x="436.0" y="472.0" width="84.0" height="18.0" rx="9" fill="#2f9e5b" stroke="none" stroke-width="1.6"/>
<text x="478.0" y="485" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" >Kubernetes</text>
<text x="764" y="462" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start" >One real request. The scheduler writes which device it</text>
<text x="764" y="480" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start" >picked into the claim.</text>
<text x="24" y="528" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >Left to right: a similar idea, with a device in place of a disk.</text>
</svg>

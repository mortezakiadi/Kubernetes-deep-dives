<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" width="1180" height="800" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d48a1c"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e5b"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
</defs>
<g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<text x="24" y="36" font-size="21" font-weight="700" fill="#1f2933">The DRA machine again, now with NVLink and a pod's traffic</text>
<rect x="24" y="50" width="62" height="22" rx="11" fill="#0f766e"/><text x="55" y="65.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">PCIe</text>
<rect x="92" y="50" width="70" height="22" rx="11" fill="#2f9e5b"/><text x="127" y="65.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">NVLink</text>
<text x="174" y="66" font-size="13.5" fill="#5b6675">Same CPUs, PCIe roots and pcieRoot tags as "What a PCIe root is" in Deep dive 2. Added: the NVSwitch between the GPUs.</text>

<!-- CPUs -->
<rect x="24" y="92" width="190" height="150" rx="12" fill="#eef3fd" stroke="#4a7bd0" stroke-width="1.6"/>
<text x="119" y="116" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="middle">CPU 0 and its memory</text>
<rect x="44" y="130" width="150" height="40" rx="9" fill="#ffffff" stroke="#4a7bd0"/><text x="119" y="155" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">CPU 0</text>
<rect x="44" y="180" width="150" height="40" rx="9" fill="#ffffff" stroke="#4a7bd0"/><text x="119" y="205" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Memory</text>
<rect x="24" y="326" width="190" height="150" rx="12" fill="#eef3fd" stroke="#4a7bd0" stroke-width="1.6"/>
<text x="119" y="350" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="middle">CPU 1 and its memory</text>
<rect x="44" y="364" width="150" height="40" rx="9" fill="#ffffff" stroke="#4a7bd0"/><text x="119" y="389" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">CPU 1</text>
<rect x="44" y="414" width="150" height="40" rx="9" fill="#ffffff" stroke="#4a7bd0"/><text x="119" y="439" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Memory</text>
<path d="M66,246 L66,322" stroke="#5b6675" stroke-width="2" fill="none" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="76" y="282" font-size="11.5" fill="#5b6675">link between</text><text x="76" y="297" font-size="11.5" fill="#5b6675">the CPUs</text>

<!-- roots -->
<rect x="236" y="117" width="168" height="100" rx="12" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="320" y="144" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">PCIe root</text>
<rect x="256" y="168" width="128" height="24" rx="12" fill="#fde9cc"/><text x="320" y="185" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2933" text-anchor="middle">pci0000:17</text>
<rect x="236" y="351" width="168" height="100" rx="12" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="320" y="378" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">PCIe root</text>
<rect x="256" y="402" width="128" height="24" rx="12" fill="#fde9cc"/><text x="320" y="419" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2933" text-anchor="middle">pci0000:b8</text>
<path d="M214,167 L232,167" stroke="#5b6675" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<path d="M214,401 L232,401" stroke="#5b6675" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<path d="M404,167 L420,167" stroke="#5b6675" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<path d="M404,401 L420,401" stroke="#5b6675" stroke-width="2" fill="none" marker-end="url(#ar)"/>

<!-- device group 17 -->
<rect x="424" y="92" width="560" height="150" rx="12" fill="#f6f8fb" stroke="#7b8794" stroke-width="1.4"/>
<text x="438" y="110" font-size="12" font-weight="700" fill="#7b8794">Under root pci0000:17</text>
<g font-size="12">
<rect x="440" y="120" width="170" height="108" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="454" y="142" font-size="14" font-weight="700" fill="#1f2933">gpu-0</text><text x="454" y="160" fill="#5b6675">GPU</text>
<rect x="452" y="186" width="146" height="28" rx="8" fill="#f3eefc" stroke="#7c4dbe"/><text x="525" y="205" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2933" text-anchor="middle">pcieRoot = pci0000:17</text>
<rect x="624" y="120" width="170" height="108" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="638" y="142" font-size="14" font-weight="700" fill="#1f2933">gpu-1</text><text x="638" y="160" fill="#5b6675">GPU</text>
<rect x="636" y="186" width="146" height="28" rx="8" fill="#f3eefc" stroke="#7c4dbe"/><text x="709" y="205" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2933" text-anchor="middle">pcieRoot = pci0000:17</text>
<rect x="808" y="120" width="170" height="108" rx="10" fill="#ffffff" stroke="#4a7bd0" stroke-width="1.6"/>
<text x="822" y="142" font-size="14" font-weight="700" fill="#1f2933">efa-0</text><text x="822" y="160" fill="#5b6675">EFA card</text>
<rect x="820" y="186" width="146" height="28" rx="8" fill="#f3eefc" stroke="#7c4dbe"/><text x="893" y="205" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2933" text-anchor="middle">pcieRoot = pci0000:17</text>
</g>

<!-- NVSwitch -->
<rect x="424" y="262" width="384" height="44" rx="10" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.8"/>
<text x="670" y="282" font-size="13" font-weight="700" fill="#2f6f4a" text-anchor="middle">NVSwitch</text>
<text x="670" y="298" font-size="11.5" fill="#2f6f4a" text-anchor="middle">joins every GPU to every other over NVLink</text>
<g stroke="#2f9e5b" stroke-width="4"><path d="M709,228 L709,262"/><path d="M709,306 L709,340"/></g>
<text x="830" y="290" font-size="11.5" fill="#5b6675">the EFA cards are not on NVLink</text>

<!-- device group b8 -->
<rect x="424" y="326" width="560" height="150" rx="12" fill="#f6f8fb" stroke="#7b8794" stroke-width="1.4"/>
<text x="438" y="470" font-size="12" font-weight="700" fill="#7b8794">Under root pci0000:b8</text>
<g font-size="12">
<rect x="440" y="340" width="170" height="108" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="454" y="362" font-size="14" font-weight="700" fill="#1f2933">gpu-2</text><text x="454" y="380" fill="#5b6675">GPU</text>
<rect x="452" y="406" width="146" height="28" rx="8" fill="#f3eefc" stroke="#7c4dbe"/><text x="525" y="425" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2933" text-anchor="middle">pcieRoot = pci0000:b8</text>
<rect x="624" y="340" width="170" height="108" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="638" y="362" font-size="14" font-weight="700" fill="#1f2933">gpu-3</text><text x="638" y="380" fill="#5b6675">GPU</text>
<rect x="636" y="406" width="146" height="28" rx="8" fill="#f3eefc" stroke="#7c4dbe"/><text x="709" y="425" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2933" text-anchor="middle">pcieRoot = pci0000:b8</text>
<rect x="808" y="340" width="170" height="108" rx="10" fill="#ffffff" stroke="#4a7bd0" stroke-width="1.6"/>
<text x="822" y="362" font-size="14" font-weight="700" fill="#1f2933">efa-1</text><text x="822" y="380" fill="#5b6675">EFA card</text>
<rect x="820" y="406" width="146" height="28" rx="8" fill="#f3eefc" stroke="#7c4dbe"/><text x="893" y="425" font-size="11" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1f2933" text-anchor="middle">pcieRoot = pci0000:b8</text>
</g>
<!-- gpu-0 and gpu-2 to NVSwitch: path 1 highlighted -->
<path d="M525,228 L525,340" stroke="#2f9e5b" stroke-width="5" fill="none" marker-start="url(#ag)" marker-end="url(#ag)"/>
<circle cx="500" cy="284" r="11" fill="#2f9e5b"/><text x="500" y="288" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

<!-- path 2: gpu-0 -> efa-0 (same root), drawn in the group's top margin -->
<path d="M595,120 L595,100 L893,100 L893,116" stroke="#d48a1c" stroke-width="3" fill="none" marker-end="url(#ao)"/>
<circle cx="726" cy="100" r="10" fill="#d48a1c"/><text x="726" y="104" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<!-- path 3: gpu-2 -> efa-0 (different roots), down, around through the CPUs -->
<path d="M595,448 L595,492 L180,492 L180,480" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="7 4" fill="none" marker-end="url(#arr)"/>
<path d="M180,322 L180,246" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="7 4" fill="none" marker-end="url(#arr)"/>
<path d="M200,92 L200,82 L1000,82 L1000,174 L982,174" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="7 4" fill="none" marker-end="url(#arr)"/>
<circle cx="350" cy="492" r="10" fill="#c0392b"/><text x="350" y="496" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

<!-- pod box -->
<rect x="1004" y="196" width="152" height="280" rx="12" fill="#ffffff" stroke="#3e4c59" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="1080" y="220" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Pod A</text>
<text x="1080" y="238" font-size="11.5" fill="#5b6675" text-anchor="middle">tensor-parallel,</text>
<text x="1080" y="254" font-size="11.5" fill="#5b6675" text-anchor="middle">2 GPUs, 2 cards</text>
<text x="1016" y="284" font-size="12" fill="#1f2933">gets gpu-0, gpu-2</text>
<text x="1016" y="300" font-size="12" fill="#1f2933">and efa-0, efa-1</text>
<text x="1016" y="330" font-size="11.5" fill="#2f6f4a">GPUs talk over</text>
<text x="1016" y="346" font-size="11.5" fill="#2f6f4a">NVLink: path 1</text>
<text x="1016" y="374" font-size="11.5" fill="#b26b00">each GPU sends via</text>
<text x="1016" y="390" font-size="11.5" fill="#b26b00">its own root's card:</text>
<text x="1016" y="406" font-size="11.5" fill="#b26b00">path 2</text>
<text x="1016" y="434" font-size="11.5" fill="#c0392b">never gpu-2 via</text>
<text x="1016" y="450" font-size="11.5" fill="#c0392b">efa-0: path 3</text>

<!-- legend -->
<rect x="24" y="512" width="1132" height="270" rx="14" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6" stroke-dasharray="6 5"/>
<g font-size="12.5" fill="#1f2933">
<circle cx="46" cy="540" r="11" fill="#2f9e5b"/><text x="46" y="544" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="66" y="544"><tspan font-weight="700">GPU to GPU, over NVLink through the NVSwitch.</tspan> gpu-0 and gpu-2 sit under different PCIe roots, and that doesn't matter here:</text>
<text x="66" y="562">their traffic never touches PCIe. This is what topology-aware bin-packing protects: keep the chatty pods' GPUs in one NVLink domain, one node.</text>
<circle cx="46" cy="590" r="11" fill="#d48a1c"/><text x="46" y="594" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="66" y="594"><tspan font-weight="700">GPU to network card, same PCIe root: the DRA rule.</tspan> gpu-0 and efa-0 share pci0000:17, so data goes straight between them.</text>
<text x="66" y="612">A claim with matchAttribute pcieRoot asks for exactly this pairing. About 11.35 GB/s in the dranet test on a p4d.</text>
<circle cx="46" cy="640" r="11" fill="#c0392b"/><text x="46" y="644" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="66" y="644"><tspan font-weight="700">GPU to network card, different roots.</tspan> gpu-2 to efa-0 goes up root b8, through CPU 1, across to CPU 0 and down root 17.</text>
<text x="66" y="662">About 6.04 GB/s in the same test, roughly half. The DRA claim exists to stop this pairing.</text>
<text x="66" y="696" font-weight="700">So the two sections answer different questions about the same machine:</text>
<text x="66" y="716">Topology bin-packing: which GPUs should a job get, so they can talk over NVLink (path 1)?</text>
<text x="66" y="734">DRA pcieRoot: which network card should each GPU get, so its traffic leaving the server stays on one root (path 2, not path 3)?</text>
<text x="66" y="762" fill="#5b6675">Names, roots and the NVSwitch are illustrative, extending the DRA picture. Without an NVSwitch, gpu-0 to gpu-2 would also go through the CPUs, like path 3.</text>
</g>
</g>
</svg>

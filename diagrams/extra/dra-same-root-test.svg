<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e5b"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs>
<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start">The same test on the same root and on different roots</text>
<rect x="24" y="50" width="48" height="22" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/>
<text x="48" y="65.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">PCIe</text>
<text x="84" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">Same GPU, same EFA card count, same test. Only where the card sits changed.</text>
<rect x="24" y="92" width="550" height="380" rx="14" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="44" y="122" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1f2933" text-anchor="start">Run 1: GPU and EFA card on the same root</text>
<rect x="44" y="134" width="300" height="26" rx="13" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.4"/>
<text x="58" y="152" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="start">about 11.35 GB/s  ·  direct path (GDR): yes</text>
<rect x="44" y="176" width="510" height="60" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="299" y="198" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="middle">CPU side of the machine</text>
<rect x="84" y="274" width="430" height="150" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<path d="M299,237 L299,270" stroke="#5b6675" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="109" y="294" width="150" height="74" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="121" y="318" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">gpu-0</text>
<text x="121" y="336" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">GPU</text>
<text x="121" y="354" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#5b6675" text-anchor="start">pci0000:10</text>
<rect x="339" y="294" width="150" height="74" rx="10" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="351" y="318" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">EFA card</text>
<text x="351" y="336" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#5b6675" text-anchor="start">rdmap16s27</text>
<text x="351" y="354" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#5b6675" text-anchor="start">pci0000:10</text>
<path d="M264,331 L334,331" stroke="#2f9e5b" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arg)" marker-start="url(#arg)"/>
<text x="299" y="321" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f9e5b" text-anchor="middle">direct</text>
<text x="299" y="408" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">PCIe root pci0000:10</text>
<text x="299" y="452" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="middle">Data goes straight between the card and the GPU.</text>
<rect x="606" y="92" width="550" height="380" rx="14" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="626" y="122" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1f2933" text-anchor="start">Run 2: GPU and EFA card on different roots</text>
<rect x="626" y="134" width="300" height="26" rx="13" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.4"/>
<text x="640" y="152" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="start">about 6.04 GB/s  ·  direct path (GDR): no</text>
<rect x="626" y="176" width="510" height="60" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="881" y="198" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="middle">CPU side of the machine</text>
<rect x="626" y="274" width="240" height="150" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<rect x="896" y="274" width="240" height="150" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<path d="M676,237 L676,270" stroke="#5b6675" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M1086,237 L1086,270" stroke="#5b6675" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="651" y="294" width="190" height="74" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="663" y="318" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">gpu-0</text>
<text x="663" y="336" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">GPU</text>
<text x="663" y="354" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#5b6675" text-anchor="start">pci0000:10</text>
<rect x="921" y="294" width="190" height="74" rx="10" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="933" y="318" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">EFA card</text>
<text x="933" y="336" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#5b6675" text-anchor="start">rdmap160s27</text>
<text x="933" y="354" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#5b6675" text-anchor="start">pci0000:a0</text>
<text x="746" y="408" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">PCIe root pci0000:10</text>
<text x="1016" y="408" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">PCIe root pci0000:a0</text>
<path d="M796,294 L796,222 L1006,222 L1006,294" stroke="#c2410c" stroke-width="3.2" fill="none" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="901" y="216" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#c2410c" text-anchor="middle">detour</text>
<text x="881" y="452" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="middle">Data detours through the CPU side before it reaches the card.</text>
<text x="24" y="505" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start">In both runs the EFA card sends the data on to the other machine over the network. The test was the NCCL all-reduce test on 2 machines with 1 GPU each.</text>
<text x="24" y="529" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start">Without a shared root, the direct path between the card and the GPU's memory (GDR, GPU Direct RDMA) is off.</text>
<text x="24" y="551" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start">Device names and roots are the ones in the dranet project's EKS example. The speeds come from one test on one machine type, p4d.24xlarge.</text>
<text x="24" y="573" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start">The picture draws the detour as one path through the CPU side. The source says the data crosses the CPU and PCIe switch fabric.</text>
</svg>

<text x="608" y="163" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >memory: 80Gi</text>
<text x="608" y="183" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >architecture: Ampere</text>

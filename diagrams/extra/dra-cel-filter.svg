<text x="44" y="374" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="start" >Rule 2: architecture is Hopper</text>
<text x="44" y="394" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start" >device.attributes["gpu.nvidia.com"].architecture == "Hopper"</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" width="1180" height="650" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs>
<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" >CEL is a filter: one node, three rules</text>
<rect x="24.0" y="50.0" width="36.6" height="22.0" rx="11" fill="#0f766e" stroke="none" stroke-width="1.6"/>
<text x="42.3" y="65.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >CEL</text>
<text x="72.6" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start" >The scheduler runs the rule on every device. Only devices where it is true qualify.</text>
<rect x="24.0" y="86.0" width="1132.0" height="124.0" rx="14" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="38" y="108" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="start" >ResourceSlice for gpu-node-1: one entry per device (a lab server with mixed GPUs, illustrative values)</text>
<rect x="44.0" y="120.0" width="255.0" height="78.0" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="58" y="142" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="start" >T4</text>
<text x="58" y="163" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >memory: 15Gi</text>
<text x="58" y="183" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >architecture: Turing</text>

<text x="24" y="622" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >The values are illustrative. A real device reports a little less than its advertised size (a T4 sold as 16 GB shows about 15),</text>
<text x="24" y="641" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >so read the real numbers from your ResourceSlices before you pick a threshold.</text>

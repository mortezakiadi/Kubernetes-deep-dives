<text x="883" y="142" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="start" >H100 80GB</text>
<text x="883" y="163" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >memory: 80Gi</text>
<text x="883" y="183" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >architecture: Hopper</text>
<text x="44" y="246" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="start" >Rule 1: memory is at least 40Gi</text>
<text x="44" y="266" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start" >device.capacity["gpu.nvidia.com"].memory.compareTo(quantity("40Gi")) &gt;= 0</text>

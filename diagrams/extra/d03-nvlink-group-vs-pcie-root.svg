<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start">An NVLink group and a PCIe root are two different groupings</text>
<rect x="24" y="50" width="60" height="22" rx="11" fill="#2f9e5b" stroke="#2f9e5b" stroke-width="1"/><text x="54.0" y="65.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">NVLink</text>
<rect x="90" y="50" width="44" height="22" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><text x="112.0" y="65.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">PCIe</text>
<text x="170" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">One p4d.24xlarge: 8 GPUs and 4 EFA cards over 4 PCIe roots (dranet docs), all 8 GPUs on one NVSwitch (AWS).</text>
<rect x="24" y="92" width="1132" height="40" rx="10" fill="#eef3fd" stroke="#4a7bd0" stroke-width="1.6"/>
<text x="590" y="117" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="middle">CPUs and memory</text>
<path d="M160.0,132 L160.0,176" stroke="#5b6675" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" width="1180" height="600" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs>
<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start">What a PCIe root is</text>
<rect x="24" y="50" width="48" height="22" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/>
<text x="48" y="65.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">PCIe</text>
<text x="84" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">A PCIe root (formally the Root Complex) connects the CPU and memory to the PCIe devices under it. One machine can have several.</text>
<rect x="24" y="92" width="210" height="380" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="129" y="122" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">CPU and memory</text>
<rect x="44" y="152" width="170" height="56" rx="10" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="129" y="186" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">CPU</text>
<rect x="44" y="226" width="170" height="56" rx="10" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="129" y="260" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Memory</text>
<text x="129" y="330" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle">Both roots start here:</text>
<text x="129" y="348" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle">the CPU side of the machine</text>
<rect x="300" y="120" width="230" height="124" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="415" y="154" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">PCIe root</text>
<text x="415" y="174" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle">(the Root Complex)</text>
<rect x="325" y="190" width="180" height="22" rx="11" fill="#ffe9c7" stroke="#e08a1e" stroke-width="0"/>
<text x="415" y="206" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">its name: pci0000:17</text>
<path d="M236,182 L296,182" stroke="#5b6675" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<path d="M532,182 L574,182" stroke="#5b6675" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<rect x="578" y="92" width="578" height="180" rx="14" fill="#f6f8fb" stroke="#7b8794" stroke-width="1.6"/>
<text x="594" y="116" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7b8794" text-anchor="start">The devices under the root pci0000:17: one PCIe switch hierarchy</text>
<rect x="594" y="132" width="170" height="124" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="606" y="156" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">gpu-0</text>
<text x="606" y="174" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">GPU</text>
<text x="606" y="192" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#5b6675" text-anchor="start">gpu.nvidia.com</text>
<rect x="604" y="206" width="150" height="38" rx="8" fill="#f3eefc" stroke="#7a4fc4" stroke-width="1.4"/>
<text x="679" y="230" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#1f2933" text-anchor="middle">pcieRoot = pci0000:17</text>
<rect x="776" y="132" width="170" height="124" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="788" y="156" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">gpu-1</text>
<text x="788" y="174" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">GPU</text>
<text x="788" y="192" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#5b6675" text-anchor="start">gpu.nvidia.com</text>
<rect x="786" y="206" width="150" height="38" rx="8" fill="#f3eefc" stroke="#7a4fc4" stroke-width="1.4"/>
<text x="861" y="230" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#1f2933" text-anchor="middle">pcieRoot = pci0000:17</text>
<rect x="958" y="132" width="170" height="124" rx="10" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="970" y="156" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">efa-0</text>
<text x="970" y="174" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">EFA card</text>
<text x="970" y="192" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#5b6675" text-anchor="start">efa.networking.k8s.aws</text>
<rect x="968" y="206" width="150" height="38" rx="8" fill="#f3eefc" stroke="#7a4fc4" stroke-width="1.4"/>
<text x="1043" y="230" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#1f2933" text-anchor="middle">pcieRoot = pci0000:17</text>
<rect x="300" y="320" width="230" height="124" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="415" y="354" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">PCIe root</text>
<text x="415" y="374" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle">(the Root Complex)</text>
<rect x="325" y="390" width="180" height="22" rx="11" fill="#ffe9c7" stroke="#e08a1e" stroke-width="0"/>
<text x="415" y="406" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">its name: pci0000:b8</text>
<path d="M236,382 L296,382" stroke="#5b6675" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<path d="M532,382 L574,382" stroke="#5b6675" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<rect x="578" y="292" width="578" height="180" rx="14" fill="#f6f8fb" stroke="#7b8794" stroke-width="1.6"/>
<text x="594" y="316" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7b8794" text-anchor="start">The devices under the root pci0000:b8: one PCIe switch hierarchy</text>
<rect x="594" y="332" width="170" height="124" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="606" y="356" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">gpu-2</text>
<text x="606" y="374" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">GPU</text>
<text x="606" y="392" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#5b6675" text-anchor="start">gpu.nvidia.com</text>
<rect x="604" y="406" width="150" height="38" rx="8" fill="#f3eefc" stroke="#7a4fc4" stroke-width="1.4"/>
<text x="679" y="430" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#1f2933" text-anchor="middle">pcieRoot = pci0000:b8</text>
<rect x="776" y="332" width="170" height="124" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="788" y="356" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">gpu-3</text>
<text x="788" y="374" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">GPU</text>
<text x="788" y="392" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#5b6675" text-anchor="start">gpu.nvidia.com</text>
<rect x="786" y="406" width="150" height="38" rx="8" fill="#f3eefc" stroke="#7a4fc4" stroke-width="1.4"/>
<text x="861" y="430" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#1f2933" text-anchor="middle">pcieRoot = pci0000:b8</text>
<rect x="958" y="332" width="170" height="124" rx="10" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="970" y="356" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">efa-1</text>
<text x="970" y="374" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">EFA card</text>
<text x="970" y="392" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#5b6675" text-anchor="start">efa.networking.k8s.aws</text>
<rect x="968" y="406" width="150" height="38" rx="8" fill="#f3eefc" stroke="#7a4fc4" stroke-width="1.4"/>
<text x="1043" y="430" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#1f2933" text-anchor="middle">pcieRoot = pci0000:b8</text>
<text x="24" y="510" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start">Each orange box is a PCIe root. The purple tags are the pcieRoot attribute: the name of the root a device sits under, in the format pci&lt;domain&gt;:&lt;bus&gt;.</text>
<text x="24" y="534" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start">Devices with the same value share a root: gpu-0, gpu-1 and efa-0 share pci0000:17, and gpu-2, gpu-3 and efa-1 share pci0000:b8.</text>
<text x="24" y="556" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start">A claim with matchAttribute on pcieRoot only accepts devices with the same value. Kubernetes' docs say this gives the lowest-latency communication.</text>
<text x="24" y="578" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start">Names and values are illustrative.</text>
</svg>

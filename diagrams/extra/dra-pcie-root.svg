<text x="24" y="556" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start">Without the constraint, any GPU could be paired with any EFA card on the node, including a pair on different roots.</text>
<text x="24" y="578" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start">Names and values are illustrative. On EKS the network card is an EFA device, offered by the dranet driver.</text>

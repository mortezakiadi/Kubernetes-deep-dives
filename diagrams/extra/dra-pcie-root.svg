<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start">When several devices must fit together</text>
<rect x="24" y="50" width="48" height="22" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/>
<text x="48" y="65.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">DRA</text>
<text x="84" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">The claim asks for a GPU and a network card that share a PCIe root.</text>
<rect x="24" y="86" width="1132" height="190" rx="14" fill="#f6f8fb" stroke="#7b8794" stroke-width="1.6"/>
<text x="38" y="108" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7b8794" text-anchor="start">One node (illustrative): each device publishes the attribute pcieRoot</text>
<rect x="44" y="120" width="520" height="144" rx="12" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="58" y="143" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="start">PCIe root 0</text>
<rect x="58" y="156" width="240" height="92" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="72" y="180" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">gpu-0: a GPU</text>
<text x="72" y="202" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">class: gpu.nvidia.com</text>
<text x="72" y="224" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">pcieRoot: pci0000:17</text>
<rect x="310" y="156" width="240" height="92" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="324" y="180" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">efa-0: an EFA network card</text>
<text x="324" y="202" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">class: efa.networking.k8s.aws</text>
<text x="324" y="224" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">pcieRoot: pci0000:17</text>
<rect x="596" y="120" width="520" height="144" rx="12" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="610" y="143" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="start">PCIe root 1</text>
<rect x="610" y="156" width="240" height="92" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="624" y="180" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">gpu-1: a GPU</text>
<text x="624" y="202" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">class: gpu.nvidia.com</text>
<text x="624" y="224" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">pcieRoot: pci0000:b8</text>
<rect x="862" y="156" width="240" height="92" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="876" y="180" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">efa-1: an EFA network card</text>
<text x="876" y="202" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">class: efa.networking.k8s.aws</text>
<text x="876" y="224" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">pcieRoot: pci0000:b8</text>
<rect x="24" y="296" width="1132" height="70" rx="14" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6"/>
<text x="38" y="320" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2f9e5b" text-anchor="start">The claim</text>
<text x="38" y="342" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">one GPU (request gpu) + one EFA card (request efa), with matchAttribute resource.kubernetes.io/pcieRoot</text>
<text x="24" y="396" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="start">Which pairs does the claim accept?</text>
<rect x="24" y="410" width="271" height="62" rx="10" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6"/>
<circle cx="52" cy="441" r="11" fill="#2f9e5b"/><path d="M47,441 L50.5,445 L57.5,437" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="74" y="436" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f9e5b" text-anchor="start">gpu-0 + efa-0</text>
<text x="74" y="456" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">qualifies: both on PCIe root 0</text>
<rect x="311" y="410" width="271" height="62" rx="10" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6"/>
<circle cx="339" cy="441" r="11" fill="#2f9e5b"/><path d="M334,441 L337.5,445 L344.5,437" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="361" y="436" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f9e5b" text-anchor="start">gpu-1 + efa-1</text>
<text x="361" y="456" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">qualifies: both on PCIe root 1</text>
<rect x="598" y="410" width="271" height="62" rx="10" fill="#f6f8fb" stroke="#c5ccd6" stroke-width="1.4"/>
<circle cx="626" cy="441" r="11" fill="#c5ccd6"/><path d="M622,437 L630,445 M630,437 L622,445" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
<text x="648" y="436" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#7b8794" text-anchor="start">gpu-0 + efa-1</text>
<text x="648" y="456" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#7b8794" text-anchor="start">removed: different roots</text>
<rect x="885" y="410" width="271" height="62" rx="10" fill="#f6f8fb" stroke="#c5ccd6" stroke-width="1.4"/>
<circle cx="913" cy="441" r="11" fill="#c5ccd6"/><path d="M909,437 L917,445 M917,437 L909,445" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
<text x="935" y="436" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#7b8794" text-anchor="start">gpu-1 + efa-0</text>
<text x="935" y="456" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#7b8794" text-anchor="start">removed: different roots</text>
<text x="24" y="502" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start">Without the constraint, any GPU could be paired with any EFA card on the node, including a pair on different roots.</text>
<text x="24" y="524" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start">Names and values are illustrative (a real value looks like pci&lt;domain&gt;:&lt;bus&gt;). On EKS the network card is an EFA device, offered by the dranet driver.</text>
</svg>

<rect x="24" y="180" width="1132" height="340" rx="14" fill="#f6f8fb" stroke="#7b8794" stroke-width="1.6"/>
<text x="38" y="202" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7b8794" text-anchor="start"><tspan x="38" dy="0" font-weight="700" fill="#7b8794">Kubernetes cluster (EKS)</tspan></text>
<rect x="250" y="210" width="370" height="294" rx="14" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="264" y="232" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3b6fd8" text-anchor="start"><tspan x="264" dy="0" font-weight="700" fill="#3b6fd8">Control plane</tspan></text>
<rect x="640" y="210" width="516" height="294" rx="14" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6"/>
<text x="654" y="232" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2f9e5b" text-anchor="start"><tspan x="654" dy="0" font-weight="700" fill="#2f9e5b">Inside the cluster</tspan></text>
<rect x="275" y="244" width="320" height="96" rx="8" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="435.0" y="279.75" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="435.0" dy="0" font-weight="700" fill="#1f2933">API server</tspan><tspan x="435.0" dy="16.75" font-weight="400" fill="#1f2933">pod is Pending:</tspan><tspan x="435.0" dy="16.75" font-weight="400" fill="#1f2933">no node matches</tspan></text>
<rect x="275" y="420" width="320" height="60" rx="8" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="435.0" y="454.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="435.0" dy="0" font-weight="700" fill="#1f2933">kube-scheduler</tspan></text>
<circle cx="128" cy="286" r="11" fill="#ffffff" stroke="#1f2933" stroke-width="1.8"/><path d="M110,324 Q110,301 128,301 Q146,301 146,324" fill="#ffffff" stroke="#1f2933" stroke-width="1.8"/>
<text x="128" y="342" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="128" dy="0" font-weight="700" fill="#1f2933">User / CI</tspan></text>
<rect x="44" y="380" width="190" height="100" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="139.0" y="418.72999999999996" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="139.0" dy="0" font-weight="700" fill="#1f2933">Pod</tspan><tspan x="139.0" dy="15.41" font-weight="400" fill="#1f2933">affinity on karpenter.k8s.aws/</tspan><tspan x="139.0" dy="15.41" font-weight="400" fill="#1f2933">instance-gpu-memory</tspan></text>
<rect x="664" y="244" width="230" height="64" rx="8" fill="#fff3d6" stroke="#d48a1c" stroke-width="1.6"/>
<text x="779.0" y="272.125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="779.0" dy="0" font-weight="700" fill="#1f2933">Karpenter</tspan><tspan x="779.0" dy="16.75" font-weight="400" fill="#1f2933">Deployment</tspan></text>
<rect x="664" y="400" width="466" height="88" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="897.0" y="432.24" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="897.0" dy="0" font-weight="700" fill="#1f2933">New node, labels set at launch</tspan><tspan x="897.0" dy="16.080000000000002" font-weight="400" fill="#1f2933">node.kubernetes.io/instance-type=p4de.24xlarge</tspan><tspan x="897.0" dy="16.080000000000002" font-weight="400" fill="#1f2933">karpenter.k8s.aws/instance-gpu-name=a100 · …/instance-gpu-memory=81920</tspan></text>

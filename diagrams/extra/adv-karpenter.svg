<text x="435.0" y="384.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="435.0" dy="0" font-weight="700" fill="#ffffff">2</tspan></text>
<path d="M595,270 L664,270" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<circle cx="629.5" cy="270.0" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="629.5" y="274.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="629.5" dy="0" font-weight="700" fill="#ffffff">3</tspan></text>
<path d="M720,244 L720,200 L435,200 L435,152" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<circle cx="577.5" cy="200.0" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="577.5" y="204.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="577.5" dy="0" font-weight="700" fill="#ffffff">4</tspan></text>
<path d="M860,244 L860,196 L970,196 L970,152" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

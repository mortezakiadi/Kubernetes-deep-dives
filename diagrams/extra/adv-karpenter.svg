<circle cx="629.5" cy="463.0" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="629.5" y="467.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="629.5" dy="0" font-weight="700" fill="#ffffff">7</tspan></text>
<rect x="24" y="536" width="1132" height="279" rx="12" fill="#fbfbfc" stroke="#d5dbe1" stroke-width="1.6"/>
<text x="40" y="562" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b6675" text-anchor="start"><tspan x="40" dy="0" font-weight="700" fill="#5b6675">Step by step</tspan></text>
<circle cx="52" cy="586" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="52" y="590.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="52" dy="0" font-weight="700" fill="#ffffff">1</tspan></text>
<text x="74" y="590" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="74" dy="0" font-weight="400" fill="#1f2933">A pod asks for a GPU with more than 40 GB of memory.</tspan></text>
<circle cx="52" cy="630" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="52" y="634.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="52" dy="0" font-weight="700" fill="#ffffff">2</tspan></text>
<text x="74" y="634" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="74" dy="0" font-weight="400" fill="#1f2933">The scheduler finds no matching node; the pod stays Pending.</tspan></text>
<circle cx="52" cy="674" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="52" y="678.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="52" dy="0" font-weight="700" fill="#ffffff">3</tspan></text>
<text x="74" y="678" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="74" dy="0" font-weight="400" fill="#1f2933">Karpenter notices the pending pod.</tspan></text>
<circle cx="52" cy="718" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="52" y="722.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="52" dy="0" font-weight="700" fill="#ffffff">4</tspan></text>
<text x="74" y="722" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="74" dy="0" font-weight="400" fill="#1f2933">Karpenter checks which instance types match</tspan><tspan x="74" dy="17" font-weight="400" fill="#1f2933">(it knows each type's GPU model, memory, count).</tspan></text>
<circle cx="612" cy="586" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="612" y="590.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="612" dy="0" font-weight="700" fill="#ffffff">5</tspan></text>
<text x="634" y="590" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="634" dy="0" font-weight="400" fill="#1f2933">Karpenter launches a matching instance.</tspan></text>
<circle cx="612" cy="630" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="612" y="634.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="612" dy="0" font-weight="700" fill="#ffffff">6</tspan></text>
<text x="634" y="634" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="634" dy="0" font-weight="400" fill="#1f2933">The node joins with those labels already set.</tspan></text>
<circle cx="612" cy="674" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="612" y="678.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="612" dy="0" font-weight="700" fill="#ffffff">7</tspan></text>
<text x="634" y="678" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="634" dy="0" font-weight="400" fill="#1f2933">The scheduler places the pod on the new node.</tspan></text>
<text x="40" y="791" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9a5b06" text-anchor="start"><tspan x="40" dy="0" font-weight="700" fill="#9a5b06">GPU Feature Discovery can only label a node once it's running; these labels exist before launch.</tspan></text>
</svg>
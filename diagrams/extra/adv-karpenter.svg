<text x="915.0" y="200.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="915.0" dy="0" font-weight="700" fill="#ffffff">5</tspan></text>
<path d="M1050,152 L1050,400" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<circle cx="1050.0" cy="288.4" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="1050.0" y="292.9" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="1050.0" dy="0" font-weight="700" fill="#ffffff">6</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 835" width="1180" height="835" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs>
<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0" font-weight="700" fill="#1f2933">4. Cloud and Karpenter labels</tspan></text>
<rect x="24" y="50" width="71" height="22" rx="11" fill="#1e4fb8"/>
<text x="59.5" y="65.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="59.5" dy="0" font-weight="700" fill="#ffffff">LABEL</tspan></text>
<text x="107" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start"><tspan x="107" dy="0" font-weight="400" fill="#5b6675">GPU facts come from the instance type, so they are known BEFORE the node exists.</tspan></text>
<rect x="24" y="86" width="1132" height="78" rx="14" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="38" y="108" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="start"><tspan x="38" dy="0" font-weight="700" fill="#e08a1e">AWS cloud</tspan></text>
<rect x="275" y="98" width="320" height="54" rx="8" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="435.0" y="121.28" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="435.0" dy="0" font-weight="700" fill="#1f2933">EC2 instance types</tspan><tspan x="435.0" dy="16.080000000000002" font-weight="400" fill="#1f2933">p5: 8 × H100 80 GB · p4de: 8 × A100 80 GB · g5: A10G 24 GB …</tspan></text>
<rect x="800" y="98" width="340" height="54" rx="8" fill="#fff3d6" stroke="#d48a1c" stroke-width="1.6"/>

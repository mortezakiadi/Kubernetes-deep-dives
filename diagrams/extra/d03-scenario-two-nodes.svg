<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e5b"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd8"/></marker></defs>
<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start">Scenario 3: two pods with one GPU each, on different machines</text>
<rect x="24" y="50" width="44" height="22" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1"/><text x="46.0" y="65.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">PCIe</text>
<rect x="74" y="50" width="68" height="22" rx="11" fill="#5b6675" stroke="#5b6675" stroke-width="1"/><text x="108.0" y="65.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Network</text>
<text x="170" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">NVLink plays no part. The data goes GPU, PCIe, EFA card, network, EFA card, PCIe, GPU.</text>
<rect x="24" y="90" width="330" height="440" rx="14" fill="#f6f8fb" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="44" y="118" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Machine 1</text>
<text x="132" y="118" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">p4d.24xlarge</text>
<rect x="54" y="136" width="270" height="56" rx="12" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.8" stroke-dasharray="7 4"/>
<text x="189" y="160" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3b6fd8" text-anchor="middle">Trainer pod A</text>
<text x="189" y="178" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="middle">1 GPU + 1 EFA card, one claim</text>
<rect x="44" y="226" width="290" height="170" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="189" y="384" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">PCIe root pci0000:10</text>
<rect x="60" y="244" width="110" height="80" rx="8" fill="#ffffff" stroke="#2f9e5b" stroke-width="2"/>
<text x="72" y="270" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">gpu-0</text>
<text x="72" y="290" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="start">pci0000:10</text>
<rect x="208" y="244" width="110" height="80" rx="8" fill="#ffffff" stroke="#3b6fd8" stroke-width="2"/>
<text x="220" y="270" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="start">EFA card</text>
<text x="220" y="290" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="start">pci0000:10</text>
<path d="M170,300 L208,300" stroke="#0f766e" stroke-width="5"/>
<circle cx="189" cy="344" r="11" fill="#0f766e"/><text x="189" y="348" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<rect x="44" y="420" width="290" height="48" rx="10" fill="#f3f4f6" stroke="#9aa5b1" stroke-width="1.8"/>
<text x="189.0" y="440" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5b6675" text-anchor="middle">NVSwitch</text>
<text x="189.0" y="458" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6675" text-anchor="middle">not used for this traffic</text>
<text x="44" y="500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6675" text-anchor="start">Same root as the DRA test's run 1.</text>
<rect x="434" y="90" width="330" height="440" rx="14" fill="#f6f8fb" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="454" y="118" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Machine 2</text>
<text x="542" y="118" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">p4d.24xlarge</text>
<rect x="464" y="136" width="270" height="56" rx="12" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.8" stroke-dasharray="7 4"/>
<text x="599" y="160" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3b6fd8" text-anchor="middle">Trainer pod B</text>
<text x="599" y="178" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="middle">1 GPU + 1 EFA card, one claim</text>
<rect x="454" y="226" width="290" height="170" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="599" y="384" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">PCIe root pci0000:10</text>
<rect x="470" y="244" width="110" height="80" rx="8" fill="#ffffff" stroke="#2f9e5b" stroke-width="2"/>
<text x="482" y="270" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">gpu-0</text>
<text x="482" y="290" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="start">pci0000:10</text>
<rect x="618" y="244" width="110" height="80" rx="8" fill="#ffffff" stroke="#3b6fd8" stroke-width="2"/>
<text x="630" y="270" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="start">EFA card</text>
<text x="630" y="290" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="start">pci0000:10</text>
<path d="M580,300 L618,300" stroke="#0f766e" stroke-width="5"/>
<circle cx="599" cy="344" r="11" fill="#0f766e"/><text x="599" y="348" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<rect x="454" y="420" width="290" height="48" rx="10" fill="#f3f4f6" stroke="#9aa5b1" stroke-width="1.8"/>
<text x="599.0" y="440" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5b6675" text-anchor="middle">NVSwitch</text>
<text x="599.0" y="458" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6675" text-anchor="middle">not used for this traffic</text>
<text x="454" y="500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6675" text-anchor="start">Same root as the DRA test's run 1.</text>
<path d="M328,270 L352,270 L352,210 L414,210 L414,270 L438,270" stroke="#5b6675" stroke-width="0" fill="none"/>
<path d="M318,284 L432,284" stroke="#5b6675" stroke-width="4" fill="none" marker-start="url(#ar)" marker-end="url(#ar)"/>
<circle cx="379" cy="262" r="11" fill="#5b6675"/><text x="379" y="266" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="379" y="308" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#5b6675" text-anchor="middle">EFA network</text>
<rect x="784" y="90" width="372" height="440" rx="14" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="802" y="120" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f766e" text-anchor="start">1  GPU to its EFA card, over PCIe</text>
<text x="802" y="142" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">With GPUDirect RDMA the card and the</text>
<text x="802" y="161" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">GPU's memory talk directly (AWS, NCCL).</text>
<text x="802" y="180" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Same root: about 11.35 GB/s in the DRA</text>
<text x="802" y="199" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">test. Different roots: about 6.04 GB/s.</text>
<text x="802" y="232" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="start">How you get it</text>
<text x="802" y="254" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">A DRA claim with matchAttribute on</text>
<text x="802" y="273" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">resource.kubernetes.io/pcieRoot.</text>
<text x="802" y="306" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5b6675" text-anchor="start">2  Machine to machine, EFA</text>
<text x="802" y="328" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">400 Gbps per p4d machine (AWS).</text>
<text x="802" y="347" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Keep the machines close: Kueue's</text>
<text x="802" y="366" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Topology-Aware Scheduling with a rack</text>
<text x="802" y="385" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">label, or KAI or Volcano.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker>
</defs>
<g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<text x="24" y="36" font-size="21" font-weight="700" fill="#1f2933">Ray's own architecture, seen through one job: RL fine-tuning of a coding model</text>
<text x="24" y="62" font-size="13.5" fill="#5b6675">Each round the model writes answers, unit tests score them, and a trainer improves the model. The numbers are illustrative.</text>

<!-- legend -->
<rect x="24" y="76" width="14" height="14" rx="3" fill="#f3eefc" stroke="#6d3fc0" stroke-width="1.4"/>
<text x="46" y="88" font-size="12.5" fill="#1f2933">once per cluster (head only)</text>
<rect x="250" y="76" width="14" height="14" rx="3" fill="#fff7ec" stroke="#d48a1c" stroke-width="1.4"/>
<text x="272" y="88" font-size="12.5" fill="#1f2933">Ray system parts on every node</text>
<rect x="490" y="76" width="14" height="14" rx="3" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.4"/>
<text x="512" y="88" font-size="12.5" fill="#1f2933">your code</text>

<!-- Head node -->
<rect x="24" y="118" width="440" height="482" rx="14" fill="#f8fafc" stroke="#6d3fc0" stroke-width="1.8"/>
<text x="44" y="144" font-size="14" font-weight="700" fill="#6d3fc0">Head node</text>
<text x="132" y="144" font-size="12" fill="#5b6675">runs the training loop</text>
<rect x="44" y="160" width="400" height="74" rx="9" fill="#f3eefc" stroke="#6d3fc0" stroke-width="1.4"/>
<text x="58" y="182" font-size="13" font-weight="700" fill="#1f2933">Driver: rl_loop.py</text>
<text x="58" y="202" font-size="12" fill="#5b6675">each round: get 1,000 answers, test them,</text>
<text x="58" y="220" font-size="12" fill="#5b6675">train on the scores, send out new weights</text>
<rect x="44" y="246" width="400" height="74" rx="9" fill="#f3eefc" stroke="#6d3fc0" stroke-width="1.4"/>
<text x="58" y="268" font-size="13" font-weight="700" fill="#1f2933">GCS (Global Control Service)</text>
<text x="58" y="288" font-size="12" fill="#5b6675">knows the Generator lives on node 1</text>
<text x="58" y="306" font-size="12" fill="#5b6675">and the Trainer on node 3</text>
<rect x="44" y="332" width="400" height="74" rx="9" fill="#f3eefc" stroke="#6d3fc0" stroke-width="1.4"/>
<text x="58" y="354" font-size="13" font-weight="700" fill="#1f2933">Autoscaler</text>
<text x="58" y="374" font-size="12" fill="#5b6675">sees test tasks waiting for CPUs</text>
<text x="58" y="392" font-size="12" fill="#5b6675">and asks for another CPU node</text>
<rect x="44" y="420" width="192" height="56" rx="9" fill="#fff7ec" stroke="#d48a1c" stroke-width="1.4"/>
<text x="58" y="442" font-size="13" font-weight="700" fill="#1f2933">raylet</text>
<text x="58" y="462" font-size="12" fill="#5b6675">num-cpus 0: no tests here</text>
<rect x="252" y="420" width="192" height="56" rx="9" fill="#fff7ec" stroke="#d48a1c" stroke-width="1.4"/>
<text x="266" y="442" font-size="13" font-weight="700" fill="#1f2933">object store</text>
<text x="266" y="462" font-size="12" fill="#5b6675">small results the driver reads</text>
<text x="44" y="512" font-size="12" fill="#5b6675">The driver never copies answers or scores itself.</text>
<text x="44" y="530" font-size="12" fill="#5b6675">It passes tickets, and Ray moves the data</text>
<text x="44" y="548" font-size="12" fill="#5b6675">straight from one node's store to another's.</text>
<text x="44" y="578" font-size="12" font-weight="600" fill="#6d3fc0">Lose this node and the whole run stops.</text>

<!-- Worker node 1 (GPU): Generator -->
<rect x="500" y="118" width="656" height="150" rx="14" fill="#f8fafc" stroke="#5b6675" stroke-width="1.6"/>
<text x="520" y="144" font-size="14" font-weight="700" fill="#3e4c59">Worker node 1 (GPU)</text>
<text x="670" y="144" font-size="12" fill="#5b6675">writes the answers</text>
<rect x="520" y="158" width="300" height="40" rx="9" fill="#fff7ec" stroke="#d48a1c" stroke-width="1.4"/>
<text x="534" y="183" font-size="12.5" fill="#1f2933"><tspan font-weight="700">raylet:</tspan> gives the GPU to the Generator</text>
<rect x="520" y="208" width="300" height="48" rx="9" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.4"/>
<text x="534" y="228" font-size="12.5" font-weight="700" fill="#1f2933">actor: Generator, model v12</text>
<text x="534" y="246" font-size="12" fill="#5b6675">stays loaded on the GPU between rounds</text>
<rect x="836" y="158" width="300" height="98" rx="9" fill="#fff7ec" stroke="#d48a1c" stroke-width="1.4"/>
<text x="850" y="182" font-size="13" font-weight="700" fill="#1f2933">object store</text>
<text x="850" y="204" font-size="12" fill="#5b6675">holds this round's 1,000 answers</text>
<text x="850" y="222" font-size="12" fill="#5b6675">until a test needs one</text>

<!-- Worker node 2 (CPU): tests -->
<rect x="500" y="284" width="656" height="150" rx="14" fill="#f8fafc" stroke="#5b6675" stroke-width="1.6"/>
<text x="520" y="310" font-size="14" font-weight="700" fill="#3e4c59">Worker node 2 (CPU)</text>
<text x="668" y="310" font-size="12" fill="#5b6675">runs the unit tests, 32 CPUs</text>
<rect x="520" y="324" width="300" height="48" rx="9" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.4"/>
<text x="534" y="344" font-size="12.5" font-weight="700" fill="#1f2933">task: run_tests(answer 17)</text>
<text x="534" y="362" font-size="12" fill="#5b6675">tests pass: score 1.0</text>
<rect x="836" y="324" width="300" height="48" rx="9" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.4"/>
<text x="850" y="344" font-size="12.5" font-weight="700" fill="#1f2933">task: run_tests(answer 18)</text>
<text x="850" y="362" font-size="12" fill="#5b6675">a test fails: score 0.0</text>
<rect x="520" y="384" width="300" height="40" rx="9" fill="#fff7ec" stroke="#d48a1c" stroke-width="1.4"/>
<text x="534" y="409" font-size="12.5" fill="#1f2933"><tspan font-weight="700">object store:</tspan> the 1,000 scores</text>
<rect x="836" y="384" width="300" height="40" rx="9" fill="#fff7ec" stroke="#d48a1c" stroke-width="1.4"/>
<text x="850" y="409" font-size="12.5" fill="#1f2933"><tspan font-weight="700">raylet:</tspan> 1,000 tests queued, 32 at once</text>

<!-- Worker node 3 (GPU): Trainer -->
<rect x="500" y="450" width="656" height="150" rx="14" fill="#f8fafc" stroke="#5b6675" stroke-width="1.6"/>
<text x="520" y="476" font-size="14" font-weight="700" fill="#3e4c59">Worker node 3 (GPU)</text>
<text x="670" y="476" font-size="12" fill="#5b6675">improves the model</text>
<rect x="520" y="490" width="300" height="48" rx="9" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.4"/>
<text x="534" y="510" font-size="12.5" font-weight="700" fill="#1f2933">actor: Trainer</text>
<text x="534" y="528" font-size="12" fill="#5b6675">turns the scored answers into weights v13</text>
<rect x="836" y="490" width="300" height="48" rx="9" fill="#fff7ec" stroke="#d48a1c" stroke-width="1.4"/>
<text x="850" y="510" font-size="12.5" font-weight="700" fill="#1f2933">object store</text>
<text x="850" y="528" font-size="12" fill="#5b6675">the new weights, v13</text>
<rect x="520" y="548" width="616" height="40" rx="9" fill="#fff7ec" stroke="#d48a1c" stroke-width="1.4"/>
<text x="534" y="573" font-size="12.5" fill="#1f2933"><tspan font-weight="700">raylet:</tspan> gives this node's GPU to the Trainer</text>

<!-- arrows -->
<path d="M444,190 L478,190 L478,226 L516,226" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<path d="M986,256 L986,320" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<path d="M800,424 L800,486" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<path d="M520,514 L490,514 L490,244 L516,244" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
<circle cx="478" cy="206" r="11" fill="#3e4c59"/><text x="478" y="210">1</text>
<circle cx="986" cy="290" r="11" fill="#3e4c59"/><text x="986" y="294">2</text>
<circle cx="520" cy="384" r="11" fill="#3e4c59"/><text x="520" y="388">3</text>
<circle cx="800" cy="442" r="11" fill="#3e4c59"/><text x="800" y="446">4</text>
<circle cx="490" cy="380" r="11" fill="#3e4c59"/><text x="490" y="384">5</text>
</g>

<!-- explanation -->
<rect x="24" y="620" width="1132" height="266" rx="14" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="44" y="646" font-size="14" font-weight="700" fill="#3e4c59">One training round, step by step</text>
<g font-size="13" fill="#1f2933">
<text x="72" y="672" fill="#5b6675">At startup the driver creates the two actors. The GCS places each on a node with a free GPU and remembers where it put them.</text>
<circle cx="54" cy="694" r="10" fill="#3e4c59"/><text x="54" y="698" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="72" y="698">The driver asks the Generator for 1,000 answers and gets 1,000 tickets back at once. The answers land in node 1's object store.</text>
<circle cx="54" cy="720" r="10" fill="#3e4c59"/><text x="54" y="724" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="72" y="724">The driver starts run_tests for each ticket. Node 2's raylet queues 1,000 tasks and runs 32 at once, copying each answer over from node 1.</text>
<circle cx="54" cy="746" r="10" fill="#3e4c59"/><text x="54" y="750" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="72" y="750">Each test writes its score into node 2's object store. Seeing tests wait, the autoscaler can add a second CPU node.</text>
<circle cx="54" cy="772" r="10" fill="#3e4c59"/><text x="54" y="776" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="72" y="776">The driver hands the score tickets to the Trainer. The scores move from node 2 to node 3, and the Trainer produces weights v13.</text>
<circle cx="54" cy="798" r="10" fill="#3e4c59"/><text x="54" y="802" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="72" y="802">The driver calls the Generator's load_weights(v13). That is the "reload": Ray carries the weights to node 1, and the model stays in GPU memory.</text>
<text x="72" y="834" fill="#5b6675">Then the next round starts. Ray has no built-in reload; load_weights is a method you write on your own actor.</text>
<text x="72" y="860" fill="#5b6675">The head is separate because the driver, the GCS and the autoscaler must exist exactly once for the whole run.</text>
</g>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" width="1180" height="780" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e4fb8"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e5b"/></marker>
</defs>
<g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<text x="24" y="36" font-size="21" font-weight="700" fill="#1f2933">How a model is split decides where its pods must go</text>
<text x="24" y="62" font-size="13.5" fill="#5b6675">A model with 4 layers (L1 to L4), split three ways. Green = traffic on NVLink inside a node. Blue = traffic over the network between nodes.</text>

<!-- ============ column 1: tensor ============ -->
<text x="24" y="96" font-size="15" font-weight="700" fill="#1f2933">Tensor parallelism</text>
<text x="24" y="116" font-size="12" fill="#5b6675">every layer is cut into pieces, one per GPU</text>
<rect x="24" y="130" width="360" height="400" rx="14" fill="#f8fafc" stroke="#5b6675" stroke-width="1.6"/>
<text x="40" y="152" font-size="13" font-weight="700" fill="#3e4c59">One node</text>
<g font-size="11" fill="#5b6675" text-anchor="middle">
<text x="78" y="176">GPU 0</text><text x="162" y="176">GPU 1</text><text x="246" y="176">GPU 2</text><text x="330" y="176">GPU 3</text>
</g>
<g font-size="11.5" font-weight="600" fill="#1f2933" text-anchor="middle">
<!-- L1 -->
<rect x="44" y="186" width="68" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="78" y="211">L1, ¼</text>
<rect x="128" y="186" width="68" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="162" y="211">L1, ¼</text>
<rect x="212" y="186" width="68" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="246" y="211">L1, ¼</text>
<rect x="296" y="186" width="68" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="330" y="211">L1, ¼</text>
<!-- L2 -->
<rect x="44" y="256" width="68" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="78" y="281">L2, ¼</text>
<rect x="128" y="256" width="68" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="162" y="281">L2, ¼</text>
<rect x="212" y="256" width="68" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="246" y="281">L2, ¼</text>
<rect x="296" y="256" width="68" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="330" y="281">L2, ¼</text>
<!-- L3 -->
<rect x="44" y="326" width="68" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="78" y="351">L3, ¼</text>
<rect x="128" y="326" width="68" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="162" y="351">L3, ¼</text>
<rect x="212" y="326" width="68" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="246" y="351">L3, ¼</text>
<rect x="296" y="326" width="68" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="330" y="351">L3, ¼</text>
<!-- L4 -->
<rect x="44" y="396" width="68" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="78" y="421">L4, ¼</text>
<rect x="128" y="396" width="68" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="162" y="421">L4, ¼</text>
<rect x="212" y="396" width="68" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="246" y="421">L4, ¼</text>
<rect x="296" y="396" width="68" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="330" y="421">L4, ¼</text>
</g>
<!-- exchanges after every layer -->
<g stroke="#2f9e5b" stroke-width="2.6" fill="none">
<path d="M58,241 L350,241" marker-start="url(#ag)" marker-end="url(#ag)"/>
<path d="M58,311 L350,311" marker-start="url(#ag)" marker-end="url(#ag)"/>
<path d="M58,381 L350,381" marker-start="url(#ag)" marker-end="url(#ag)"/>
<path d="M58,451 L350,451" marker-start="url(#ag)" marker-end="url(#ag)"/>
</g>
<rect x="44" y="470" width="320" height="34" rx="8" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.4"/>
<text x="204" y="492" font-size="12" font-weight="700" fill="#2f6f4a" text-anchor="middle">NVLink / NVSwitch carries every exchange</text>
<text x="24" y="552" font-size="12.5" fill="#1f2933">After every layer, all 4 GPUs swap partial results</text>
<text x="24" y="570" font-size="12.5" fill="#1f2933">(green lines), many times per step.</text>
<text x="24" y="592" font-size="12.5" font-weight="700" fill="#2f6f4a">Placement: the whole group on one node.</text>

<!-- ============ column 2: pipeline ============ -->
<text x="410" y="96" font-size="15" font-weight="700" fill="#1f2933">Pipeline parallelism</text>
<text x="410" y="116" font-size="12" fill="#5b6675">the layers are split into stages, one stage per GPU</text>
<rect x="410" y="130" width="360" height="170" rx="14" fill="#f8fafc" stroke="#5b6675" stroke-width="1.6"/>
<text x="426" y="152" font-size="13" font-weight="700" fill="#3e4c59">Node A</text>
<rect x="440" y="168" width="300" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="590" y="193" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">L1 (whole)</text>
<rect x="440" y="218" width="300" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="590" y="243" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">L2 (whole)</text>
<text x="590" y="284" font-size="11.5" fill="#5b6675" text-anchor="middle">stage 1 on GPU 0</text>

<path d="M590,300 L590,356" stroke="#1e4fb8" stroke-width="3" fill="none" marker-end="url(#ab)"/>
<rect x="606" y="312" width="168" height="38" rx="6" fill="#ffffff"/>
<text x="606" y="326" font-size="12" font-weight="700" fill="#1e4fb8">activations, once</text>
<text x="606" y="342" font-size="12" font-weight="700" fill="#1e4fb8">per stage boundary</text>

<rect x="410" y="360" width="360" height="170" rx="14" fill="#f8fafc" stroke="#5b6675" stroke-width="1.6"/>
<text x="426" y="382" font-size="13" font-weight="700" fill="#3e4c59">Node B</text>
<rect x="440" y="398" width="300" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="590" y="423" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">L3 (whole)</text>
<rect x="440" y="448" width="300" height="40" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="590" y="473" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">L4 (whole)</text>
<text x="590" y="514" font-size="11.5" fill="#5b6675" text-anchor="middle">stage 2 on GPU 0</text>
<text x="410" y="552" font-size="12.5" fill="#1f2933">Only the hand-off between stages crosses</text>
<text x="410" y="570" font-size="12.5" fill="#1f2933">the network (blue), far less often.</text>
<text x="410" y="592" font-size="12.5" font-weight="700" fill="#1e4fb8">Placement: stages may sit on different nodes.</text>

<!-- ============ column 3: hybrid ============ -->
<text x="796" y="96" font-size="15" font-weight="700" fill="#1f2933">Hybrid: both together</text>
<text x="796" y="116" font-size="12" fill="#5b6675">tensor inside each node, pipeline between nodes</text>
<rect x="796" y="130" width="360" height="170" rx="14" fill="#f8fafc" stroke="#5b6675" stroke-width="1.6"/>
<text x="812" y="152" font-size="13" font-weight="700" fill="#3e4c59">Node A: stage 1</text>
<g font-size="11" font-weight="600" fill="#1f2933" text-anchor="middle">
<rect x="816" y="168" width="70" height="34" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="851" y="190">L1, ¼</text>
<rect x="896" y="168" width="70" height="34" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="931" y="190">L1, ¼</text>
<rect x="976" y="168" width="70" height="34" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="1011" y="190">L1, ¼</text>
<rect x="1056" y="168" width="70" height="34" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="1091" y="190">L1, ¼</text>
<rect x="816" y="226" width="70" height="34" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="851" y="248">L2, ¼</text>
<rect x="896" y="226" width="70" height="34" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="931" y="248">L2, ¼</text>
<rect x="976" y="226" width="70" height="34" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="1011" y="248">L2, ¼</text>
<rect x="1056" y="226" width="70" height="34" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="1091" y="248">L2, ¼</text>
</g>
<g stroke="#2f9e5b" stroke-width="2.2" fill="none">
<path d="M828,214 L1114,214" marker-start="url(#ag)" marker-end="url(#ag)"/>
<path d="M828,272 L1114,272" marker-start="url(#ag)" marker-end="url(#ag)"/>
</g>
<text x="976" y="292" font-size="11" fill="#5b6675" text-anchor="middle">GPU 0 to GPU 3</text>

<path d="M976,300 L976,356" stroke="#1e4fb8" stroke-width="3" fill="none" marker-end="url(#ab)"/>
<rect x="990" y="316" width="140" height="22" rx="6" fill="#ffffff"/>
<text x="992" y="332" font-size="12" font-weight="700" fill="#1e4fb8">activations, once</text>

<rect x="796" y="360" width="360" height="170" rx="14" fill="#f8fafc" stroke="#5b6675" stroke-width="1.6"/>
<text x="812" y="382" font-size="13" font-weight="700" fill="#3e4c59">Node B: stage 2</text>
<g font-size="11" font-weight="600" fill="#1f2933" text-anchor="middle">
<rect x="816" y="398" width="70" height="34" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="851" y="420">L3, ¼</text>
<rect x="896" y="398" width="70" height="34" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="931" y="420">L3, ¼</text>
<rect x="976" y="398" width="70" height="34" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="1011" y="420">L3, ¼</text>
<rect x="1056" y="398" width="70" height="34" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="1091" y="420">L3, ¼</text>
<rect x="816" y="456" width="70" height="34" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="851" y="478">L4, ¼</text>
<rect x="896" y="456" width="70" height="34" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="931" y="478">L4, ¼</text>
<rect x="976" y="456" width="70" height="34" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="1011" y="478">L4, ¼</text>
<rect x="1056" y="456" width="70" height="34" rx="6" fill="#fff7ec" stroke="#d48a1c"/><text x="1091" y="478">L4, ¼</text>
</g>
<g stroke="#2f9e5b" stroke-width="2.2" fill="none">
<path d="M828,444 L1114,444" marker-start="url(#ag)" marker-end="url(#ag)"/>
<path d="M828,502 L1114,502" marker-start="url(#ag)" marker-end="url(#ag)"/>
</g>
<text x="976" y="522" font-size="11" fill="#5b6675" text-anchor="middle">GPU 0 to GPU 3</text>
<text x="796" y="552" font-size="12.5" fill="#1f2933">The chatty tensor exchanges stay on NVLink;</text>
<text x="796" y="570" font-size="12.5" fill="#1f2933">only the stage hand-off crosses the network.</text>
<text x="796" y="592" font-size="12.5" font-weight="700" fill="#1f2933">Placement: one tensor group per node.</text>

<!-- ============ what the scheduler must do ============ -->
<rect x="24" y="616" width="1132" height="146" rx="14" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="44" y="642" font-size="14" font-weight="700" fill="#3e4c59">What this asks of the scheduler</text>
<g font-size="12.5" fill="#1f2933">
<text x="44" y="668"><tspan font-weight="700" fill="#2f6f4a">Tensor group:</tspan> all its GPUs on one node, so it needs a node with enough free GPUs at once (same hostname, NVLink pairs).</text>
<text x="44" y="692"><tspan font-weight="700" fill="#1e4fb8">Pipeline stages:</tspan> may sit on different nodes. Keeping them in one rack or zone still helps, because every hand-off crosses the network.</text>
<text x="44" y="716"><tspan font-weight="700">Hybrid:</tspan> the job is a gang of nodes, each holding one whole tensor group. Lose one node and the pipeline stops, so all of it starts together.</text>
<text x="44" y="744" fill="#5b6675">Conceptual: 4 layers and 4 GPUs per node keep the picture small. Real models have many more layers, and a node usually has 8 GPUs.</text>
</g>
</g>
</svg>

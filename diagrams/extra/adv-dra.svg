<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 791" width="1180" height="791" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs>
<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0" font-weight="700" fill="#1f2933">5. Dynamic Resource Allocation (DRA)</tspan></text>
<rect x="24" y="50" width="53" height="22" rx="11" fill="#0f766e"/>
<text x="50.5" y="65.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="50.5" dy="0" font-weight="700" fill="#ffffff">DRA</tspan></text>
<text x="89" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start"><tspan x="89" dy="0" font-weight="400" fill="#5b6675">Each GPU is published separately; the scheduler picks a SPECIFIC device.</tspan></text>
<rect x="24" y="86" width="1132" height="78" rx="14" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="38" y="108" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="start"><tspan x="38" dy="0" font-weight="700" fill="#e08a1e">AWS cloud</tspan></text>
<rect x="800" y="98" width="340" height="54" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="970.0" y="121.125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="970.0" dy="0" font-weight="700" fill="#1f2933">EC2 GPU instance (e.g. p4d.24xlarge)</tspan><tspan x="970.0" dy="16.75" font-weight="400" fill="#1f2933">8 × NVIDIA A100 80 GB</tspan></text>
<rect x="24" y="180" width="1132" height="340" rx="14" fill="#f6f8fb" stroke="#7b8794" stroke-width="1.6"/>
<text x="38" y="202" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7b8794" text-anchor="start"><tspan x="38" dy="0" font-weight="700" fill="#7b8794">Kubernetes cluster (EKS)</tspan></text>
<rect x="250" y="210" width="370" height="294" rx="14" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="264" y="232" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3b6fd8" text-anchor="start"><tspan x="264" dy="0" font-weight="700" fill="#3b6fd8">Control plane</tspan></text>
<rect x="640" y="210" width="516" height="294" rx="14" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6"/>
<text x="654" y="232" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2f9e5b" text-anchor="start"><tspan x="654" dy="0" font-weight="700" fill="#2f9e5b">GPU worker node</tspan></text>
<path d="M970,152 L970,210" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<text x="980" y="188" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5b6675" text-anchor="start"><tspan x="980" dy="0" font-weight="600" fill="#5b6675">physical GPUs</tspan></text>
<rect x="275" y="236" width="320" height="112" rx="8" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="435.0" y="264.15999999999997" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="435.0" dy="0" font-weight="700" fill="#1f2933">API server</tspan><tspan x="435.0" dy="16.080000000000002" font-weight="400" fill="#1f2933">ResourceSlice: gpu-0 … gpu-7</tspan><tspan x="435.0" dy="16.080000000000002" font-weight="400" fill="#1f2933">(each: memory 80Gi, architecture …)</tspan><tspan x="435.0" dy="16.080000000000002" font-weight="400" fill="#1f2933">DeviceClass: gpu.nvidia.com</tspan><tspan x="435.0" dy="16.080000000000002" font-weight="400" fill="#1f2933">ResourceClaim → allocated: gpu-3</tspan></text>
<rect x="275" y="420" width="320" height="60" rx="8" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="435.0" y="446.125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="435.0" dy="0" font-weight="700" fill="#1f2933">kube-scheduler</tspan><tspan x="435.0" dy="16.75" font-weight="400" fill="#1f2933">DynamicResources plugin</tspan></text>
<circle cx="128" cy="286" r="11" fill="#ffffff" stroke="#1f2933" stroke-width="1.8"/><path d="M110,324 Q110,301 128,301 Q146,301 146,324" fill="#ffffff" stroke="#1f2933" stroke-width="1.8"/>
<text x="128" y="342" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="128" dy="0" font-weight="700" fill="#1f2933">User / CI</tspan></text>
<rect x="44" y="380" width="190" height="100" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="139.0" y="418.24" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="139.0" dy="0" font-weight="700" fill="#1f2933">Pod</tspan><tspan x="139.0" dy="16.080000000000002" font-weight="400" fill="#1f2933">+ ResourceClaimTemplate</tspan><tspan x="139.0" dy="16.080000000000002" font-weight="400" fill="#1f2933">"one GPU, ≥ 40Gi"</tspan></text>
<rect x="664" y="244" width="230" height="64" rx="8" fill="#fff3d6" stroke="#d48a1c" stroke-width="1.6"/>
<text x="779.0" y="272.125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="779.0" dy="0" font-weight="700" fill="#1f2933">NVIDIA DRA driver</tspan><tspan x="779.0" dy="16.75" font-weight="400" fill="#1f2933">kubelet plugin (DaemonSet)</tspan></text>
<rect x="664" y="420" width="230" height="60" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="779.0" y="454.68" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="779.0" dy="0" font-weight="700" fill="#1f2933">kubelet</tspan></text>
<rect x="930" y="410" width="200" height="80" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="1030.0" y="446.125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="1030.0" dy="0" font-weight="700" fill="#1f2933">Application pod</tspan><tspan x="1030.0" dy="16.75" font-weight="400" fill="#1f2933">gets gpu-3</tspan></text>
<path d="M664,276 L595,276" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<circle cx="629.5" cy="276.0" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="629.5" y="280.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="629.5" dy="0" font-weight="700" fill="#ffffff">1</tspan></text>
<path d="M234,400 L275,330" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<circle cx="252.45" cy="368.5" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="252.45" y="373.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="252.45" dy="0" font-weight="700" fill="#ffffff">2</tspan></text>
<path d="M410,420 L410,348" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<circle cx="410.0" cy="384.0" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="410.0" y="388.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="410.0" dy="0" font-weight="700" fill="#ffffff">3</tspan></text>
<path d="M470,348 L470,420" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<circle cx="470.0" cy="384.0" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="470.0" y="388.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="470.0" dy="0" font-weight="700" fill="#ffffff">4</tspan></text>
<path d="M820,420 L820,308" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<circle cx="820.0" cy="364.0" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="820.0" y="368.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="820.0" dy="0" font-weight="700" fill="#ffffff">5</tspan></text>
<path d="M894,450 L930,450" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<circle cx="912.0" cy="450.0" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="912.0" y="454.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="912.0" dy="0" font-weight="700" fill="#ffffff">6</tspan></text>
<rect x="24" y="536" width="1132" height="235" rx="12" fill="#fbfbfc" stroke="#d5dbe1" stroke-width="1.6"/>
<text x="40" y="562" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b6675" text-anchor="start"><tspan x="40" dy="0" font-weight="700" fill="#5b6675">Step by step</tspan></text>
<circle cx="52" cy="586" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="52" y="590.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="52" dy="0" font-weight="700" fill="#ffffff">1</tspan></text>
<text x="74" y="590" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="74" dy="0" font-weight="400" fill="#1f2933">The DRA driver publishes every GPU as its own entry, with its attributes.</tspan></text>
<circle cx="52" cy="647" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="52" y="651.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="52" dy="0" font-weight="700" fill="#ffffff">2</tspan></text>
<text x="74" y="651" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="74" dy="0" font-weight="400" fill="#1f2933">A pod arrives with a claim: "one NVIDIA GPU with at least 40Gi".</tspan></text>
<circle cx="52" cy="691" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="52" y="695.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="52" dy="0" font-weight="700" fill="#ffffff">3</tspan></text>
<text x="74" y="695" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="74" dy="0" font-weight="400" fill="#1f2933">The scheduler reads the devices and finds GPUs that match.</tspan></text>
<circle cx="612" cy="586" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="612" y="590.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="612" dy="0" font-weight="700" fill="#ffffff">4</tspan></text>
<text x="634" y="590" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="634" dy="0" font-weight="400" fill="#1f2933">It writes the chosen GPU (gpu-3) into the claim</tspan><tspan x="634" dy="17" font-weight="400" fill="#1f2933">and binds the pod to that node.</tspan></text>
<circle cx="612" cy="647" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="612" y="651.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="612" dy="0" font-weight="700" fill="#ffffff">5</tspan></text>
<text x="634" y="651" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="634" dy="0" font-weight="400" fill="#1f2933">The kubelet asks the DRA driver to prepare gpu-3.</tspan></text>
<circle cx="612" cy="691" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="612" y="695.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="612" dy="0" font-weight="700" fill="#ffffff">6</tspan></text>
<text x="634" y="695" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="634" dy="0" font-weight="400" fill="#1f2933">The driver exposes exactly that GPU to the container.</tspan></text>
<text x="40" y="747" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9a5b06" text-anchor="start"><tspan x="40" dy="0" font-weight="700" fill="#9a5b06">Unlike the device plugin, the scheduler decided which device the pod gets.</tspan></text>
</svg>
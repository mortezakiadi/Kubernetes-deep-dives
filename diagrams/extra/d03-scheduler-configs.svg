<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker>
</defs>
<g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<text x="24" y="36" font-size="21" font-weight="700" fill="#1f2933">Each scheduler program reads its own KubeSchedulerConfiguration</text>
<text x="24" y="62" font-size="13.5" fill="#5b6675">It is a file handed to one scheduler when it starts (--config), not an object you kubectl apply. One cluster can run several of them.</text>

<!-- column headers: programs -->
<g font-size="12.5">
<!-- col 1 -->
<rect x="24" y="86" width="364" height="96" rx="12" fill="#eef3fd" stroke="#1e4fb8" stroke-width="1.6"/>
<text x="42" y="110" font-size="14" font-weight="700" fill="#1e4fb8">Program 1: the default scheduler</text>
<text x="42" y="132" fill="#1f2933">kube-scheduler on the EKS control plane</text>
<text x="42" y="150" fill="#5b6675">run by AWS; you change one scoring setting</text>
<text x="42" y="168" fill="#5b6675">through EKS, nothing else</text>
<!-- col 2 -->
<rect x="408" y="86" width="364" height="96" rx="12" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.8"/>
<text x="426" y="110" font-size="14" font-weight="700" fill="#2f6f4a">Program 2: scheduler-plugins</text>
<text x="426" y="132" fill="#1f2933">a Deployment on your nodes, from the</text>
<text x="426" y="150" fill="#1f2933">scheduler-plugins image (this section)</text>
<text x="426" y="168" fill="#5b6675">installed by its Helm chart</text>
<!-- col 3 -->
<rect x="792" y="86" width="364" height="96" rx="12" fill="#fff7ec" stroke="#d48a1c" stroke-width="1.6"/>
<text x="810" y="110" font-size="14" font-weight="700" fill="#b26b00">Program 3: your own kube-scheduler</text>
<text x="810" y="132" fill="#1f2933">a Deployment of the official image,</text>
<text x="810" y="150" fill="#1f2933">as in the second-scheduler appendix</text>
<text x="810" y="168" fill="#5b6675">you write its file yourself</text>
</g>

<!-- reads arrows -->
<path d="M206,202 L206,186" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<path d="M590,202 L590,186" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<path d="M974,202 L974,186" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<text x="214" y="198" font-size="11.5" fill="#5b6675">reads at startup</text>
<text x="598" y="198" font-size="11.5" fill="#5b6675">reads at startup</text>
<text x="982" y="198" font-size="11.5" fill="#5b6675">reads at startup</text>

<!-- files -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
<rect x="24" y="206" width="364" height="250" rx="12" fill="#ffffff" stroke="#1e4fb8" stroke-width="1.4"/>
<text x="42" y="230" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933">File 1: managed by AWS</text>
<text x="42" y="248" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6675">you can't see or edit it directly</text>
<text x="42" y="276" fill="#3e4c59">kind: KubeSchedulerConfiguration</text>
<text x="42" y="294" fill="#3e4c59">profiles:</text>
<rect x="42" y="306" width="328" height="56" rx="8" fill="#eef3fd" stroke="#1e4fb8" stroke-width="1.2"/>
<text x="54" y="328" fill="#1e4fb8" font-weight="700">- schedulerName: default-scheduler</text>
<text x="54" y="348" fill="#5b6675">  built-in plugins and weights</text>

<rect x="408" y="206" width="364" height="250" rx="12" fill="#ffffff" stroke="#2f9e5b" stroke-width="1.6"/>
<text x="426" y="230" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933">File 2: ConfigMap scheduler-config</text>
<text x="426" y="248" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6675">written by the Helm chart from values.yaml</text>
<text x="426" y="276" fill="#3e4c59">kind: KubeSchedulerConfiguration</text>
<text x="426" y="294" fill="#3e4c59">profiles:</text>
<rect x="426" y="306" width="328" height="76" rx="8" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.4"/>
<text x="438" y="328" fill="#2f6f4a" font-weight="700">- schedulerName:</text>
<text x="438" y="346" fill="#2f6f4a" font-weight="700">    scheduler-plugins-scheduler</text>
<text x="438" y="368" fill="#5b6675">  plugins: Coscheduling on</text>

<rect x="792" y="206" width="364" height="250" rx="12" fill="#ffffff" stroke="#d48a1c" stroke-width="1.4"/>
<text x="810" y="230" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933">File 3: your ConfigMap</text>
<text x="810" y="248" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6675">one file, two profiles = two names</text>
<text x="810" y="276" fill="#3e4c59">kind: KubeSchedulerConfiguration</text>
<text x="810" y="294" fill="#3e4c59">profiles:</text>
<rect x="810" y="306" width="328" height="56" rx="8" fill="#fff7ec" stroke="#d48a1c" stroke-width="1.2"/>
<text x="822" y="328" fill="#b26b00" font-weight="700">- schedulerName: binpack-cpu</text>
<text x="822" y="348" fill="#5b6675">  MostAllocated on cpu, memory</text>
<rect x="810" y="370" width="328" height="56" rx="8" fill="#fff7ec" stroke="#d48a1c" stroke-width="1.2"/>
<text x="822" y="392" fill="#b26b00" font-weight="700">- schedulerName: binpack-gpu</text>
<text x="822" y="412" fill="#5b6675">  MostAllocated on GPUs</text>
</g>

<!-- pods -->
<g font-size="12.5">
<rect x="24" y="506" width="364" height="52" rx="10" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="40" y="528" font-weight="700" fill="#1f2933">web pod</text>
<text x="40" y="546" fill="#5b6675">no schedulerName, so default-scheduler</text>
<rect x="408" y="506" width="364" height="52" rx="10" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="424" y="528" font-weight="700" fill="#1f2933">training worker, in a PodGroup</text>
<text x="424" y="546" fill="#5b6675">schedulerName: scheduler-plugins-scheduler</text>
<rect x="792" y="506" width="364" height="52" rx="10" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.3"/>
<text x="808" y="528" font-weight="700" fill="#1f2933">batch inference pod</text>
<text x="808" y="546" fill="#5b6675">schedulerName: binpack-gpu</text>
</g>
<path d="M206,506 L206,366" stroke="#1e4fb8" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)"/>
<path d="M590,506 L590,386" stroke="#2f9e5b" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)"/>
<path d="M974,506 L974,430" stroke="#d48a1c" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)"/>

<text x="24" y="592" font-size="12.5" fill="#1f2933"><tspan font-weight="700">Pods choose a profile by name, whichever program serves it.</tspan> Each scheduler program has one file. Each profile in it is one name: 3 programs, 3 files, 4 names.</text>
<text x="24" y="614" font-size="12.5" fill="#5b6675">Every name should be used by only one profile in the cluster, or two schedulers would try to place the same pods.</text>
</g>
</svg>

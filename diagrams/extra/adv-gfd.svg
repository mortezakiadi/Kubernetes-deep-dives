<rect x="275" y="244" width="320" height="96" rx="8" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="435.0" y="272.2" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="435.0" dy="0" font-weight="700" fill="#1f2933">API server</tspan><tspan x="435.0" dy="16.080000000000002" font-weight="400" fill="#1f2933">Node labels:</tspan><tspan x="435.0" dy="16.080000000000002" font-weight="400" fill="#1f2933">nvidia.com/gpu.product=…A100…</tspan><tspan x="435.0" dy="16.080000000000002" font-weight="400" fill="#1f2933">nvidia.com/gpu.memory=81920</tspan></text>
<rect x="275" y="420" width="320" height="60" rx="8" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="435.0" y="446.125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="435.0" dy="0" font-weight="700" fill="#1f2933">kube-scheduler</tspan><tspan x="435.0" dy="16.75" font-weight="400" fill="#1f2933">filters on node labels</tspan></text>
<circle cx="128" cy="286" r="11" fill="#ffffff" stroke="#1f2933" stroke-width="1.8"/><path d="M110,324 Q110,301 128,301 Q146,301 146,324" fill="#ffffff" stroke="#1f2933" stroke-width="1.8"/>
<text x="128" y="342" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="128" dy="0" font-weight="700" fill="#1f2933">User / CI</tspan></text>
<rect x="44" y="380" width="190" height="100" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="139.0" y="417.75" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="139.0" dy="0" font-weight="700" fill="#1f2933">Pod</tspan><tspan x="139.0" dy="16.75" font-weight="400" fill="#1f2933">affinity on</tspan><tspan x="139.0" dy="16.75" font-weight="400" fill="#1f2933">nvidia.com/gpu.memory</tspan></text>
<rect x="664" y="244" width="230" height="64" rx="8" fill="#fff3d6" stroke="#d48a1c" stroke-width="1.6"/>
<text x="779.0" y="272.125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="779.0" dy="0" font-weight="700" fill="#1f2933">GPU Feature Discovery</tspan><tspan x="779.0" dy="16.75" font-weight="400" fill="#1f2933">DaemonSet pod</tspan></text>
<rect x="664" y="420" width="230" height="60" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="779.0" y="446.125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="779.0" dy="0" font-weight="700" fill="#1f2933">NFD worker</tspan><tspan x="779.0" dy="16.75" font-weight="400" fill="#1f2933">DaemonSet pod</tspan></text>
<rect x="930" y="420" width="200" height="60" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="1030.0" y="446.125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="1030.0" dy="0" font-weight="700" fill="#1f2933">NFD master</tspan><tspan x="1030.0" dy="16.75" font-weight="400" fill="#1f2933">Deployment</tspan></text>
<path d="M779,308 L779,420" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<circle cx="779.0" cy="364.0" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="779.0" y="368.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="779.0" dy="0" font-weight="700" fill="#ffffff">1</tspan></text>
<path d="M894,450 L930,450" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<circle cx="912.0" cy="450.0" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="912.0" y="454.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="912.0" dy="0" font-weight="700" fill="#ffffff">2</tspan></text>
<path d="M1030,420 L1030,380 L630,380 L630,300 L595,300" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

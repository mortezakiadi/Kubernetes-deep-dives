<text x="254.5" y="444.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="254.5" dy="0" font-weight="700" fill="#ffffff">4</tspan></text>

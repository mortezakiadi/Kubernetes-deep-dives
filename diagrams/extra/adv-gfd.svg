<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0" font-weight="700" fill="#1f2933">2. GPU Feature Discovery</tspan></text>
<rect x="24" y="50" width="71" height="22" rx="11" fill="#1e4fb8"/>
<text x="59.5" y="65.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="59.5" dy="0" font-weight="700" fill="#ffffff">LABEL</tspan></text>
<text x="107" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start"><tspan x="107" dy="0" font-weight="400" fill="#5b6675">GPU details become node labels, used to CHOOSE a node. Nothing is reserved.</tspan></text>
<rect x="24" y="86" width="1132" height="78" rx="14" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="38" y="108" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="start"><tspan x="38" dy="0" font-weight="700" fill="#e08a1e">AWS cloud</tspan></text>
<rect x="800" y="98" width="340" height="54" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="970.0" y="121.125" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="970.0" dy="0" font-weight="700" fill="#1f2933">EC2 GPU instance (e.g. p4de.24xlarge)</tspan><tspan x="970.0" dy="16.75" font-weight="400" fill="#1f2933">8 × NVIDIA A100 80 GB</tspan></text>

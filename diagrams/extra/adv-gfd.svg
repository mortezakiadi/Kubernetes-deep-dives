<text x="435.0" y="384.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="435.0" dy="0" font-weight="700" fill="#ffffff">5</tspan></text>
<rect x="24" y="536" width="1132" height="218" rx="12" fill="#fbfbfc" stroke="#d5dbe1" stroke-width="1.6"/>
<text x="40" y="562" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b6675" text-anchor="start"><tspan x="40" dy="0" font-weight="700" fill="#5b6675">Step by step</tspan></text>
<circle cx="52" cy="586" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="52" y="590.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="52" dy="0" font-weight="700" fill="#ffffff">1</tspan></text>
<text x="74" y="590" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="74" dy="0" font-weight="400" fill="#1f2933">GFD reads the GPUs (model, memory, count) and writes a features file.</tspan></text>
<circle cx="52" cy="630" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="52" y="634.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="52" dy="0" font-weight="700" fill="#ffffff">2</tspan></text>
<text x="74" y="634" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="74" dy="0" font-weight="400" fill="#1f2933">The NFD worker picks the file up and sends it to the NFD master.</tspan></text>
<circle cx="52" cy="674" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="52" y="678.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="52" dy="0" font-weight="700" fill="#ffffff">3</tspan></text>
<text x="74" y="678" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="74" dy="0" font-weight="400" fill="#1f2933">The NFD master writes the labels on the Node object.</tspan></text>
<circle cx="612" cy="586" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="612" y="590.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="612" dy="0" font-weight="700" fill="#ffffff">4</tspan></text>
<text x="634" y="590" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="634" dy="0" font-weight="400" fill="#1f2933">A pod uses a nodeSelector or node affinity on those labels.</tspan></text>
<circle cx="612" cy="630" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="612" y="634.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="612" dy="0" font-weight="700" fill="#ffffff">5</tspan></text>
<text x="634" y="634" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="634" dy="0" font-weight="400" fill="#1f2933">The scheduler filters nodes on the labels and picks one.</tspan></text>
<text x="40" y="730" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9a5b06" text-anchor="start"><tspan x="40" dy="0" font-weight="700" fill="#9a5b06">Labels only choose the node: the pod still needs nvidia.com/gpu: 1, and the device plugin (picture 1) hands out the GPU.</tspan></text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 690" width="1180" height="690" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e5b"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e08a1e"/></marker></defs>
<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start">How RDMA, GDR and EFA fit together</text>
<rect x="24" y="50" width="48" height="22" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/>
<text x="48" y="65.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">EFA</text>
<text x="84" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">Two ways to send data from the GPU of one server to the GPU of another, and what a pod needs to get the second one.</text>
<rect x="14" y="84" width="492" height="250" rx="14" fill="#f6f8fb" stroke="#cbd2d9" stroke-width="1.2"/>
<rect x="670" y="84" width="492" height="250" rx="14" fill="#f6f8fb" stroke="#cbd2d9" stroke-width="1.2"/>
<text x="260" y="106" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5b6675" text-anchor="middle">Server A</text>
<text x="916" y="106" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5b6675" text-anchor="middle">Server B</text>
<text x="588" y="106" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b6675" text-anchor="middle">Network</text>
<text x="24" y="130" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">Without RDMA and GDR (the traditional path)</text>
<rect x="24" y="140" width="136" height="64" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="92.0" y="176.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">GPU memory</text>
<rect x="188" y="140" width="136" height="64" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="256.0" y="168.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">CPU memory</text>
<text x="256.0" y="184.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle">a copy is made here</text>
<rect x="352" y="140" width="136" height="64" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="420.0" y="168.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">OS network stack</text>
<text x="420.0" y="184.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle">and the ENA card</text>
<rect x="516" y="140" width="136" height="64" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="584.0" y="176.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">Network</text>
<rect x="680" y="140" width="136" height="64" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="748.0" y="168.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">ENA card and</text>
<text x="748.0" y="184.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle">OS network stack</text>
<rect x="844" y="140" width="136" height="64" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="912.0" y="168.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">CPU memory</text>
<text x="912.0" y="184.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle">a copy is made here</text>
<rect x="1008" y="140" width="136" height="64" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="1076.0" y="176.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">GPU memory</text>
<path d="M162,172.0 L184,172.0" stroke="#e08a1e" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#aro)"/>
<path d="M326,172.0 L348,172.0" stroke="#e08a1e" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#aro)"/>
<path d="M490,172.0 L512,172.0" stroke="#5b6675" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M654,172.0 L676,172.0" stroke="#5b6675" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M818,172.0 L840,172.0" stroke="#e08a1e" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#aro)"/>
<path d="M982,172.0 L1004,172.0" stroke="#e08a1e" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#aro)"/>
<text x="24" y="236" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">With EFA, RDMA and GDR</text>
<rect x="24" y="246" width="136" height="64" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="92.0" y="282.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">GPU memory</text>
<rect x="352" y="246" width="136" height="64" rx="10" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6"/>
<text x="420.0" y="282.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">EFA card</text>
<rect x="516" y="246" width="136" height="64" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="584.0" y="282.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">Network</text>
<rect x="680" y="246" width="136" height="64" rx="10" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6"/>
<text x="748.0" y="282.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">EFA card</text>
<rect x="1008" y="246" width="136" height="64" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="1076.0" y="282.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">GPU memory</text>
<path d="M162,278.0 L348,278.0" stroke="#2f9e5b" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arg)"/>
<path d="M490,278.0 L512,278.0" stroke="#2f9e5b" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arg)"/>
<path d="M654,278.0 L676,278.0" stroke="#2f9e5b" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arg)"/>
<path d="M818,278.0 L1004,278.0" stroke="#2f9e5b" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#arg)"/>
<text x="258.0" y="252" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f9e5b" text-anchor="middle">GDR: the card reads</text>
<text x="258.0" y="267" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f9e5b" text-anchor="middle">GPU memory directly</text>
<text x="914.0" y="252" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f9e5b" text-anchor="middle">GDR: the card writes</text>
<text x="914.0" y="267" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f9e5b" text-anchor="middle">GPU memory directly</text>
<text x="584.0" y="328" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f9e5b" text-anchor="middle">RDMA: card to card,</text>
<text x="584.0" y="344" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f9e5b" text-anchor="middle">no OS in the middle</text>
<text x="24" y="364" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">Software path inside the pod on one server</text>
<rect x="24" y="386" width="200" height="56" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="124.0" y="419" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Your training code</text>
<path d="M226,414 L246,414" stroke="#5b6675" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="250" y="386" width="200" height="56" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="350.0" y="410" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">NCCL</text>
<text x="350.0" y="429" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6675" text-anchor="middle">moves data between GPUs</text>
<path d="M452,414 L472,414" stroke="#5b6675" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="476" y="386" width="200" height="56" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="576.0" y="410" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">aws-ofi-nccl plugin</text>
<text x="576.0" y="429" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6675" text-anchor="middle">connects NCCL to libfabric</text>
<path d="M678,414 L698,414" stroke="#5b6675" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="702" y="386" width="200" height="56" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="802.0" y="410" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">libfabric</text>
<text x="802.0" y="429" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6675" text-anchor="middle">talks to the card directly</text>
<path d="M904,414 L924,414" stroke="#5b6675" stroke-width="2" fill="none" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="928" y="386" width="200" height="56" rx="10" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6"/>
<text x="1028.0" y="410" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">EFA card</text>
<text x="1028.0" y="429" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6675" text-anchor="middle">skips the OS network stack</text>
<rect x="24" y="470" width="1132" height="150" rx="14" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6"/>
<text x="44" y="498" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="start">What Kubernetes adds</text>
<rect x="44" y="514" width="350" height="92" rx="10" fill="#ffffff" stroke="#2f9e5b" stroke-width="1.3"/>
<text x="58" y="538" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start">The pod asks for an EFA card</text>
<text x="58" y="560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="start">Through the EFA device plugin (a count)</text>
<text x="58" y="576" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="start">or the EFA DRA driver. One card goes</text>
<text x="58" y="592" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="start">to one pod; EFA cards are not shared.</text>
<rect x="414" y="514" width="350" height="92" rx="10" fill="#ffffff" stroke="#2f9e5b" stroke-width="1.3"/>
<text x="428" y="538" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start">The pod asks for hugepages</text>
<text x="428" y="560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="start">EFA needs 2 MiB hugepages, so the pod</text>
<text x="428" y="576" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="start">requests them next to the EFA card.</text>
<rect x="784" y="514" width="350" height="92" rx="10" fill="#ffffff" stroke="#2f9e5b" stroke-width="1.3"/>
<text x="798" y="538" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start">The GPU and the card share a root</text>
<text x="798" y="560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="start">GDR needs both under one PCIe root, so</text>
<text x="798" y="576" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="start">the claim adds the pcieRoot constraint.</text>
<text x="24" y="646" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start">Without GDR, GPU data is copied through CPU memory first. With GDR, the card moves it to and from GPU memory directly.</text>
<text x="24" y="668" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start">Sources: NVIDIA RDMA and GPUDirect RDMA docs, AWS EFA and EKS EFA docs, the aws-ofi-nccl README. Box names are generic, not product screens.</text>
</svg>

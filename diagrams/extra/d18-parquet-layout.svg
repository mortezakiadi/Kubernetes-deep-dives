<text x="34" y="469" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start" >File metadata</text>
<text x="574" y="469" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="end" >locations of all column chunks</text>
<rect x="24" y="488" width="560" height="34" rx="6" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6" />
<text x="34" y="509" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start" >4-byte length of the file metadata</text>
<rect x="24" y="528" width="560" height="34" rx="6" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6" />
<text x="34" y="549" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start" >4-byte magic number PAR1</text>
<text x="624" y="108" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3b6fd8" text-anchor="start" >A reader</text>
<text x="624" y="128" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >1. reads the file metadata at the end,</text>
<text x="624" y="148" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >2. finds the column chunks it needs,</text>
<text x="624" y="168" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >3. reads those chunks one after the other,</text>
<text x="624" y="188" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >4. skips pages and columns it does not need.</text>
<text x="624" y="222" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3b6fd8" text-anchor="start" >Units of parallelization (format page)</text>
<text x="624" y="242" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >MapReduce: file or row group</text>
<text x="624" y="262" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >I/O: column chunk</text>
<text x="624" y="282" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >Encoding and compression: page</text>

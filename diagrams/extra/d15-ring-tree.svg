<text x="24" y="556" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start" >Same data moved either way: 2(n-1) transfers per element (nccl-tests). For n = 4 that is 6 (derived). Count the numbered arrows: 6 in each panel.</text>
<text x="24" y="578" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >Simplified: NCCL splits the data into chunks, this draws one value. Source for the two orders: nccl-tests, PERFORMANCE.md. Same-number arrows in the</text>
<text x="24" y="596" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >tree happen at the same time.</text>

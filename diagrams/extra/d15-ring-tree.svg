<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" >Ring and tree: two orders for the same sum</text>
<text x="24" y="58" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start" >All-reduce of one value over 4 GPUs (ranks 0 to 3). Number on an arrow = order in time. A simplified order, drawn as an example for 4 ranks.</text>

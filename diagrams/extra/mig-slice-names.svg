<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 676" width="1180" height="676" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" >How to read a MIG slice name</text>
<rect x="24.0" y="50" width="48.0" height="22" rx="11" fill="#3b6fd8" stroke="none" stroke-width="1.6"/>
<text x="48" y="65.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >MIG</text>
<text x="84" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start" >MIG cuts one GPU into isolated slices. The name tells you how big each slice is.</text>
<rect x="24.0" y="86" width="1132.0" height="164" rx="14" fill="#f6f8fb" stroke="#7b8794" stroke-width="1.6"/>
<text x="64" y="176" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700" text-anchor="start"><tspan fill="#3b6fd8">3g</tspan><tspan fill="#9aa5b1">.</tspan><tspan fill="#2f9e5b">40gb</tspan></text>
<path d="M64,190 L141,190" stroke="#3b6fd8" stroke-width="3" fill="none"/>
<path d="M179,190 L333,190" stroke="#2f9e5b" stroke-width="3" fill="none"/>
<text x="102.5" y="210" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3b6fd8" text-anchor="middle" >compute</text>
<text x="256" y="210" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f9e5b" text-anchor="middle" >memory</text>
<rect x="400.0" y="108" width="56.0" height="28" rx="14" fill="#3b6fd8" stroke="none" stroke-width="1.6"/>
<text x="428" y="127.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" >3g</text>
<text x="470" y="127.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start" >= 3 of the GPU's 7 compute slices, so 3/7 of its processing power</text>
<rect x="400.0" y="154" width="72.0" height="28" rx="14" fill="#2f9e5b" stroke="none" stroke-width="1.6"/>
<text x="436" y="173.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" >40gb</text>
<text x="486" y="173.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start" >= 40 GB of the GPU's 80 GB of memory (4 of its 8 memory slices)</text>
<text x="400" y="222" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start" >A whole 80 GB H100 has 7 compute slices and 8 memory slices of 10 GB each.</text>
<text x="24" y="286" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1f2933" text-anchor="start" >The layout in this section: one 80 GB H100 cut into four slices</text>
<text x="24" y="306" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >This is the GPU Operator's "balanced" layout. The same color in both bars is the same slice.</text>
<text x="24" y="358" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Compute</text>
<text x="24" y="377" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start" >7 slices</text>
<rect x="131.5" y="332" width="436.7" height="58" rx="8" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="349.85714285714283" y="357" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle" >3g.40gb</text>
<text x="349.85714285714283" y="376" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" >3 of 7 slices</text>
<rect x="571.2" y="332" width="290.1" height="58" rx="8" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6"/>
<text x="716.2857142857142" y="357" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle" >2g.20gb</text>
<text x="716.2857142857142" y="376" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" >2 of 7 slices</text>
<rect x="864.4" y="332" width="143.6" height="58" rx="8" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="936.1428571428571" y="357" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle" >1g.10gb</text>
<text x="936.1428571428571" y="376" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" >1 of 7 slices</text>
<rect x="1010.9" y="332" width="143.6" height="58" rx="8" fill="#f3eefc" stroke="#7a4fc4" stroke-width="1.6"/>
<text x="1082.7142857142856" y="357" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle" >1g.10gb</text>
<text x="1082.7142857142856" y="376" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" >1 of 7 slices</text>
<text x="24" y="438" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Memory</text>
<text x="24" y="457" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start" >80 GB</text>
<rect x="131.5" y="412" width="510.0" height="58" rx="8" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="386.5" y="437" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle" >3g.40gb</text>
<text x="386.5" y="456" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" >40 GB</text>
<rect x="644.5" y="412" width="253.5" height="58" rx="8" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6"/>
<text x="771.25" y="437" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle" >2g.20gb</text>
<text x="771.25" y="456" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" >20 GB</text>
<rect x="901.0" y="412" width="125.2" height="58" rx="8" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="963.625" y="437" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle" >1g.10gb</text>
<text x="963.625" y="456" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" >10 GB</text>
<rect x="1029.2" y="412" width="125.2" height="58" rx="8" fill="#f3eefc" stroke="#7a4fc4" stroke-width="1.6"/>
<text x="1091.875" y="437" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle" >1g.10gb</text>
<text x="1091.875" y="456" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" >10 GB</text>
<text x="130" y="492" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start" font-style="italic">Bars show each slice's share of the GPU, not where it sits on the chip.</text>
<text x="24" y="530" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1f2933" text-anchor="start" >Every slice size an 80 GB H100 offers</text>
<text x="24" y="550" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >Colored sizes are the ones used above. The count is the most of that size one GPU can hold at once.</text>
<rect x="24.0" y="566" width="176.0" height="60" rx="10" fill="#ffffff" stroke="#e08a1e" stroke-width="2"/>
<text x="112.0" y="592" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#e08a1e" text-anchor="middle" >1g.10gb</text>
<text x="112.0" y="612" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" >up to 7</text>
<rect x="215.2" y="566" width="176.0" height="60" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="303.2" y="592" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle" >1g.20gb</text>
<text x="303.2" y="612" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" >up to 4</text>
<rect x="406.4" y="566" width="176.0" height="60" rx="10" fill="#ffffff" stroke="#2f9e5b" stroke-width="2"/>
<text x="494.4" y="592" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#2f9e5b" text-anchor="middle" >2g.20gb</text>
<text x="494.4" y="612" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" >up to 3</text>
<rect x="597.6" y="566" width="176.0" height="60" rx="10" fill="#ffffff" stroke="#3b6fd8" stroke-width="2"/>
<text x="685.5999999999999" y="592" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#3b6fd8" text-anchor="middle" >3g.40gb</text>
<text x="685.5999999999999" y="612" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" >up to 2</text>
<rect x="788.8" y="566" width="176.0" height="60" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="876.8" y="592" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle" >4g.40gb</text>
<text x="876.8" y="612" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" >up to 1</text>
<rect x="980.0" y="566" width="176.0" height="60" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4"/>
<text x="1068.0" y="592" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle" >7g.80gb</text>
<text x="1068.0" y="612" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="middle" >1: the whole GPU</text>
<text x="24" y="652" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >Slices of different sizes can share a GPU, but only in the placements NVIDIA allows, so not every mix fits.</text>
</svg>

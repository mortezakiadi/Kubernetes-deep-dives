<circle cx="656" cy="467" r="11" fill="#2f9e5b"/><text x="656" y="471" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="161" cy="240" r="11" fill="#0f766e"/><text x="161" y="244" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="773" cy="240" r="11" fill="#0f766e"/><text x="773" y="244" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="590" cy="222" r="11" fill="#5b6675"/><text x="590" y="226" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<rect x="24" y="608" width="1132" height="276" rx="14" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="44" y="636" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">Which link carries which traffic, and how you get it in Kubernetes</text>
<circle cx="48" cy="666" r="11" fill="#2f9e5b"/><text x="48" y="670" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="70" y="670" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start">GPU to GPU inside one machine: NVLink through the NVSwitch.</text>
<text x="70" y="690" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Hardware, nothing to switch on. NCCL uses it by itself when the GPUs share a machine.</text>
<text x="70" y="708" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">Your job is to get the GPUs onto one machine: one pod asking for several GPUs, or several pods tied to one</text>
<text x="70" y="726" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">node with podAffinity on the hostname. Check it with nvidia-smi topo -p2p n.</text>
<circle cx="48" cy="764" r="11" fill="#0f766e"/><text x="48" y="768" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="70" y="768" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start">GPU to its network card: PCIe, best under the same root.</text>
<text x="70" y="788" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">A DRA claim with matchAttribute on resource.kubernetes.io/pcieRoot gives the pod the card under gpu-0's root.</text>
<text x="70" y="806" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">The DRA test measured about 11.35 GB/s on the same root and 6.04 GB/s across roots.</text>
<circle cx="48" cy="844" r="11" fill="#5b6675"/><text x="48" y="848" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="70" y="848" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start">Machine to machine: the EFA network.</text>
<text x="70" y="868" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start">400 Gbps per p4d machine (AWS). Keep the machines close: Kueue's Topology-Aware Scheduling with a rack label, or KAI or Volcano.</text>
</svg>
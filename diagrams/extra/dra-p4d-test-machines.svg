<text x="70" y="214" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">GPU</text>
<text x="70" y="238" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2f9e5b" text-anchor="start">used in</text>
<text x="70" y="254" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2f9e5b" text-anchor="start">both runs</text>

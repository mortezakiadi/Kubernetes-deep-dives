<text x="24" y="596" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start">A worker pod on each machine was given gpu-0 and one EFA card. Run 1 gave it the card under the same root as gpu-0. Run 2 gave it the card under the other root.</text>
<text x="24" y="618" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start">The two pods swap data over the network through their EFA cards.</text>
<text x="24" y="640" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start">Only the roots of gpu-0 and of two EFA cards are named in the dranet example, so the other boxes are marked as not named. Machine 2 is drawn with the same layout as Machine 1.</text>

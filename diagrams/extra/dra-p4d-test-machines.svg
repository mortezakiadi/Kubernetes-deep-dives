<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start">The two machines in the test</text>
<rect x="24" y="50" width="48" height="22" rx="11" fill="#0f766e" stroke="#0f766e" stroke-width="1.6"/>
<text x="48" y="65.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">PCIe</text>
<text x="84" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">Each machine is a p4d.24xlarge: 8 GPUs and 4 EFA cards spread over 4 PCIe roots. The test used one GPU on each.</text>
<rect x="24" y="90" width="540" height="390" rx="14" fill="#f6f8fb" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="44" y="118" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Machine 1</text>
<text x="174" y="118" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start">p4d.24xlarge</text>
<rect x="44" y="134" width="240" height="160" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="58" y="158" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start">PCIe root pci0000:10</text>
<rect x="58" y="172" width="104" height="108" rx="8" fill="#ffffff" stroke="#2f9e5b" stroke-width="2"/>

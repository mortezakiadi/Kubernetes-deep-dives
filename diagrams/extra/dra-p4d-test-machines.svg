<text x="24" y="508" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start">Run 1 paired gpu-0 with the EFA card under the same root. Run 2 paired it with the card under a different root.</text>
<text x="24" y="530" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start">Only the roots of gpu-0 and of two EFA cards are named in the dranet example, so the other boxes are marked as not named.</text>
<text x="24" y="550" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start">Device names and roots are the ones in the dranet project's EKS example. Machine 2 is drawn with the same layout as Machine 1.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 704" width="1180" height="704" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs>
<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0" font-weight="700" fill="#1f2933">One KubeSchedulerConfiguration file, box by box</tspan></text>
<text x="24" y="62" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start"><tspan x="24" dy="0" font-weight="400" fill="#5b6675">Each box is one level of indentation in the YAML. This file has ONE profile (one scheduler) whose pluginConfig list holds TWO entries.</tspan></text>
<rect x="24" y="84" width="1132" height="600" rx="16" fill="#f8fafc" stroke="#5b6675" stroke-width="1.8"/>
<text x="44" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#3e4c59"><tspan x="44" dy="0" xml:space="preserve">kind: KubeSchedulerConfiguration</tspan></text>
<text x="331.2" y="112" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2933" text-anchor="start"><tspan x="331.2" dy="0" font-weight="600" fill="#1f2933">one file, given to kube-scheduler with --config</tspan></text>
<rect x="44" y="130" width="1092" height="538" rx="14" fill="#f8fafc" stroke="#5b6675" stroke-width="1.2"/>
<text x="64" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#3e4c59"><tspan x="64" dy="0" xml:space="preserve">profiles:</tspan></text>
<text x="153.39999999999998" y="158" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2933" text-anchor="start"><tspan x="153.39999999999998" dy="0" font-weight="600" fill="#1f2933">a LIST of schedulers</tspan></text>
<rect x="64" y="174" width="1052" height="404" rx="14" fill="#eef3fd" stroke="#1e4fb8" stroke-width="1.6"/>
<text x="84" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1e4fb8"><tspan x="84" dy="0" xml:space="preserve">- schedulerName: default-scheduler</tspan></text>
<text x="388.4" y="202" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2933" text-anchor="start"><tspan x="388.4" dy="0" font-weight="600" fill="#1f2933">profile 1 = one scheduler</tspan></text>
<rect x="84" y="222" width="380" height="336" rx="12" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6"/>
<text x="102" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#2f9e5b"><tspan x="102" dy="0" xml:space="preserve">plugins:</tspan></text>
<text x="102" y="274" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2933" text-anchor="start"><tspan x="102" dy="0" font-weight="600" fill="#1f2933">WHICH plugins run at each stage,</tspan><tspan x="102" dy="18" font-weight="600" fill="#1f2933">and how much each score counts</tspan></text>
<text x="102" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2933"><tspan x="102" dy="0" xml:space="preserve">score:</tspan><tspan x="102" dy="20" xml:space="preserve">  enabled:</tspan></text>
<rect x="118" y="362" width="312" height="64" rx="10" fill="#ffffff" stroke="#2f9e5b" stroke-width="1.6"/>
<text x="134" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1f2933"><tspan x="134" dy="0" xml:space="preserve">- name: BalancedResourceAllocation</tspan><tspan x="134" dy="20" xml:space="preserve">  weight: 2</tspan></text>
<text x="102" y="458" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start"><tspan x="102" dy="0" font-weight="400" fill="#5b6675">This plugin's vote counts double.</tspan><tspan x="102" dy="18" font-weight="400" fill="#5b6675">Every plugin NOT listed keeps its</tspan><tspan x="102" dy="18" font-weight="400" fill="#5b6675">default: still on, default weight.</tspan></text>
<rect x="490" y="222" width="604" height="336" rx="12" fill="#fff7ec" stroke="#d48a1c" stroke-width="1.6"/>
<text x="508" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#b26b00"><tspan x="508" dy="0" xml:space="preserve">pluginConfig:</tspan></text>
<text x="640" y="252" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2933" text-anchor="start"><tspan x="640" dy="0" font-weight="600" fill="#1f2933">HOW each plugin calculates: a LIST, one entry per plugin</tspan></text>
<rect x="508.0" y="270" width="275.0" height="270" rx="10" fill="#ffffff" stroke="#d48a1c" stroke-width="1.6"/>
<rect x="520.0" y="282" width="64" height="20" rx="10" fill="#d48a1c"/>
<text x="552.0" y="296" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="552.0" dy="0" font-weight="700" fill="#ffffff">entry 1</tspan></text>
<text x="522.0" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" font-weight="400" fill="#1f2933"><tspan x="522.0" dy="0" xml:space="preserve">- name: NodeResourcesFit</tspan><tspan x="522.0" dy="19" xml:space="preserve">  args:</tspan><tspan x="522.0" dy="19" xml:space="preserve">    scoringStrategy:</tspan><tspan x="522.0" dy="19" xml:space="preserve">      type: LeastAllocated</tspan><tspan x="522.0" dy="19" xml:space="preserve">      resources:</tspan><tspan x="522.0" dy="19" xml:space="preserve">      - cpu (1)</tspan><tspan x="522.0" dy="19" xml:space="preserve">      - memory (1)</tspan></text>
<text x="522.0" y="484" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#9a5b06" text-anchor="start"><tspan x="522.0" dy="0" font-weight="600" fill="#9a5b06">what counts when judging</tspan><tspan x="522.0" dy="17" font-weight="600" fill="#9a5b06">how full a node is</tspan></text>
<rect x="801.0" y="270" width="275.0" height="270" rx="10" fill="#ffffff" stroke="#d48a1c" stroke-width="1.6"/>
<rect x="813.0" y="282" width="64" height="20" rx="10" fill="#d48a1c"/>
<text x="845.0" y="296" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="845.0" dy="0" font-weight="700" fill="#ffffff">entry 2</tspan></text>
<text x="815.0" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.2" font-weight="400" fill="#1f2933"><tspan x="815.0" dy="0" xml:space="preserve">- name: BalancedResource-</tspan><tspan x="815.0" dy="19" xml:space="preserve">        Allocation</tspan><tspan x="815.0" dy="19" xml:space="preserve">  args:</tspan><tspan x="815.0" dy="19" xml:space="preserve">    resources:</tspan><tspan x="815.0" dy="19" xml:space="preserve">    - cpu (1)</tspan><tspan x="815.0" dy="19" xml:space="preserve">    - memory (1)</tspan><tspan x="815.0" dy="19" xml:space="preserve">    - nvidia.com/gpu (1)</tspan></text>
<text x="815.0" y="484" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#9a5b06" text-anchor="start"><tspan x="815.0" dy="0" font-weight="600" fill="#9a5b06">what it tries to keep</tspan><tspan x="815.0" dy="17" font-weight="600" fill="#9a5b06">even with each other</tspan></text>
<path d="M430,394 L477,394 L477,551 L938.5,551 L938.5,540" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<text x="102" y="526" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2f6f4a" text-anchor="start"><tspan x="102" dy="0" font-weight="700" fill="#2f6f4a">Same plugin as entry 2:</tspan><tspan x="102" dy="17" font-weight="700" fill="#2f6f4a">its weight is set here, its settings there.</tspan></text>
<rect x="64" y="592" width="1052" height="62" rx="12" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="84" y="628" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#7b8794"><tspan x="84" dy="0" xml:space="preserve">- schedulerName: bin-packing-scheduler</tspan></text>
<text x="405.1" y="628" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5b6675" text-anchor="start"><tspan x="405.1" dy="0" font-weight="600" fill="#5b6675">(optional) a SECOND scheduler would be another item here, with its own plugins and pluginConfig</tspan></text>
</svg>
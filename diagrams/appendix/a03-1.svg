<rect x="239.4" y="289" width="45.2" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="262" y="301" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">submit</text>
<rect x="250" y="735" width="540" height="65" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="250" y="735" width="540" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="251" y="753" width="538" height="12" fill="#f8fafc"/>
<text x="262" y="755" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Identity and data</text>
<text x="262" y="783" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one S3 bucket, one prefix per team; Pod Identity role per team, per worker</text>
<circle cx="786" cy="739" r="12" fill="#1e293b"/><text x="786" y="743.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">6</text>
<rect x="810" y="735" width="560" height="65" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="810" y="735" width="560" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="811" y="753" width="558" height="12" fill="#f8fafc"/>
<text x="822" y="755" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Terraform</text>
<text x="822" y="783" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one fleet definition makes all four clusters; one team table makes every queue</text>
<circle cx="1366" cy="739" r="12" fill="#1e293b"/><text x="1366" y="743.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">7</text>
<text x="20" y="520" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">Layers: 1 hub quota and dispatch,</text>
<text x="20" y="538" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">2 worker quota, 3 scheduler, 4 node pool.</text></svg>
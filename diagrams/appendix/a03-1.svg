<text x="1037" y="415" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Kueue worker</text>
<text x="1037" y="443" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">layer 2: quota, borrow, preempt,</text>
<text x="1037" y="460" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">admit the whole job or none</text>
<rect x="1025" y="510" width="330" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="1025" y="510" width="330" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="1026" y="528" width="328" height="12" fill="#eff6ff"/>
<text x="1037" y="530" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Team queues and namespaces</text>
<text x="1037" y="558" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">on-demand before Spot, per queue</text>
<text x="1037" y="575" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">research: Spot only</text>
<rect x="1025" y="605" width="330" height="108" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="1025" y="605" width="330" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="1026" y="623" width="328" height="12" fill="#fef2f2"/>
<text x="1037" y="625" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Node pools (Auto Mode)</text>
<text x="1037" y="653" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">NodePools gpu-ondemand, gpu-spot</text>
<text x="1037" y="670" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one GPU per node: g6, g5, g6e or g4dn</text>
<text x="1037" y="687" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">tainted: only admitted jobs tolerate</text>
<text x="1037" y="704" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">scaled from zero, back to zero</text>

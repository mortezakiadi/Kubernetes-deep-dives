<text x="657" y="443" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">layer 2: quota, borrow, preempt,</text>
<text x="657" y="460" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">admit the whole job or none</text>

<rect x="645" y="510" width="330" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="646" y="528" width="328" height="12" fill="#eff6ff"/>
<text x="657" y="530" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Team queues and namespaces</text>
<text x="657" y="558" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">llm 2, vision 1, research 1 CPU</text>
<text x="657" y="575" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one cohort, borrow and reclaim</text>
<rect x="645" y="605" width="330" height="108" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="645" y="605" width="330" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="646" y="623" width="328" height="12" fill="#f8fafc"/>
<text x="657" y="625" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Node pools (Auto Mode)</text>
<text x="657" y="653" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">NodePool cpu-spot</text>
<text x="657" y="670" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">same shapes, Spot capacity</text>
<text x="657" y="687" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">empty nodes removed after 1 min</text>

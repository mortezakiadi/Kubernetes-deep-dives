<text x="1024" y="384" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#991b1b">GPU  (GPU worker)</text>
<rect x="1025" y="395" width="330" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="1025" y="395" width="330" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>

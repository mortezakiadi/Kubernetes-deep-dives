<text x="644" y="384" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#1e40af">CPU-B  (CPU worker)</text>
<rect x="645" y="395" width="330" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>

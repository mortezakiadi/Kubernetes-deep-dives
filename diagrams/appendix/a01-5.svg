<svg xmlns="http://www.w3.org/2000/svg" width="1260px" height="520px" viewBox="0 0 1260 520" style="background:#ffffff"><title>Autoscaling with a second scheduler</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1260" height="520" fill="#ffffff"/><text x="630" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Karpenter reacts to the Unschedulable condition, whichever scheduler set it</text>
<rect x="30" y="80" width="280" height="140" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="42" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">1. Pod created</text>
<text x="42" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">schedulerName:</text>
<text x="42" y="144" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">affinity-first-scheduler</text>
<path d="M 310 150 L 335 150" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="335" y="80" width="280" height="140" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="347" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">2. Your scheduler tries</text>
<text x="347" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">No node fits: sets</text>
<text x="347" y="144" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">PodScheduled=False, reason</text>
<text x="347" y="160" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Unschedulable</text>
<path d="M 615 150 L 640 150" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="640" y="80" width="280" height="140" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="652" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">3. Karpenter launches</text>
<text x="652" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Matches a NodePool from the pod's</text>
<text x="652" y="144" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">constraints and launches nodes</text>
<path d="M 920 150 L 945 150" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="945" y="80" width="280" height="140" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="957" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">4. Your scheduler binds</text>
<text x="957" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Next attempt finds the new node and</text>
<text x="957" y="144" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">binds the pod</text>
<rect x="200" y="300" width="860" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="212" y="324" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#991b1b">If your scheduler is down</text>
<text x="212" y="348" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">The pod is never marked Unschedulable, so Karpenter never sees it. It stays Pending with no events and no scale-up. The</text>
<text x="212" y="364" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">scheduler's own availability is part of autoscaling.</text>
<path d="M 475 220 L 475 300" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-bad)"/>
<text x="630" y="470.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#475569" font-style="italic">Karpenter respects the pod's constraints but not your scoring: it decides how many nodes; your scheduler decides which pod goes where.</text></svg>

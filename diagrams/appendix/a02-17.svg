<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="560px" viewBox="0 0 1420 560" style="background:#ffffff"><title>A persistent workspace: the pod comes and goes, the disk stays</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="560" fill="#ffffff"/><rect x="30" y="60" width="360" height="190" rx="14" fill="#ecfdf5" fill-opacity=".6" stroke="#059669" stroke-width="1.6"/>
<text x="48" y="90" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">1  Running</text>
<rect x="48" y="108" width="324" height="52" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.3" stroke-dasharray="0"/>
<text x="60" y="130" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Pod (the microVM, its memory)</text>
<text x="60" y="148" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">running processes, open connections</text>
<rect x="48" y="172" width="324" height="52" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
<text x="60" y="194" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Volume (EBS, encrypted)</text>
<text x="60" y="212" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">the files, mounted at /workspace</text>
<rect x="530" y="60" width="360" height="190" rx="14" fill="#fffbeb" fill-opacity=".6" stroke="#d97706" stroke-width="1.6"/>
<text x="548" y="90" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">2  Suspended (operatingMode: Suspended)</text>
<rect x="548" y="108" width="324" height="52" rx="8" fill="#f1f5f9" stroke="#d97706" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="560" y="130" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#64748b">No pod</text>
<text x="560" y="148" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">deleted, nothing is running</text>
<rect x="548" y="172" width="324" height="52" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
<text x="560" y="194" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Volume (EBS, encrypted)</text>
<text x="560" y="212" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">the same files, kept</text>
<rect x="1030" y="60" width="360" height="190" rx="14" fill="#ecfdf5" fill-opacity=".6" stroke="#059669" stroke-width="1.6"/>
<text x="1048" y="90" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">3  Running again (operatingMode: Running)</text>
<rect x="1048" y="108" width="324" height="52" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.3" stroke-dasharray="0"/>
<text x="1060" y="130" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Pod (the microVM, its memory)</text>
<text x="1060" y="148" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">running processes, open connections</text>
<rect x="1048" y="172" width="324" height="52" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
<text x="1060" y="194" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Volume (EBS, encrypted)</text>
<text x="1060" y="212" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">reattached to the new pod</text>
<path d="M390 155 L530 155" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="434.3" y="135" width="51.4" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="460" y="147" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">suspend</text>
<path d="M890 155 L1030 155" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="937.4" y="135" width="45.2" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="960" y="147" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">resume</text>
<rect x="30" y="290" width="520" height="120" rx="12" fill="#eff6ff" fill-opacity=".6" stroke="#2563eb" stroke-width="1.5"/>
<text x="48" y="318" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Checkpoint</text>
<text x="48" y="342" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">A VolumeSnapshot of the volume, named &lt;session&gt;-&lt;label&gt;.</text>
<text x="48" y="362" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">It captures the files, not the memory: Nitro Sandboxes cannot</text>
<text x="48" y="382" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">be snapshotted, restored or moved while running (AWS).</text>
<rect x="590" y="290" width="800" height="120" rx="12" fill="#fef2f2" fill-opacity=".6" stroke="#dc2626" stroke-width="1.5"/>
<text x="608" y="318" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">What ends the disk</text>
<text x="608" y="342" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Deleting the claim deletes the sandbox and, with it, the volume (agent-sandbox documentation).</text>
<text x="608" y="362" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">So a persistent session must not use the claim's delete-at-end-time policy that the deployed Manager sets.</text>
<text x="608" y="382" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">The patch sets Retain for this template. What Retain does to the volume at end time was not checked.</text>
<rect x="30" y="440" width="1360" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="46" y="466" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Resume starts the processes again from the files. It is not a continuation of the memory the sandbox had.</text>
<text x="46" y="488" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Only one pod may use the volume at a time (ReadWriteOncePod), and the volume cannot be resized while the pod runs (AWS).</text>
<text x="46" y="510" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">Restoring a checkpoint into a warm-pool sandbox is not built: Kubernetes cannot attach a volume to a pod that is already running.</text></svg>
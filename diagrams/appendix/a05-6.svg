<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="560px" viewBox="0 0 1420 560" style="background:#ffffff"><title>Working state: snapshot after each file change, restore into a new sandbox</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="560" fill="#ffffff"/><rect x="20" y="60" width="265" height="130" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="20" y="60" width="265" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="21" y="78" width="263" height="12" fill="#ecfdf5"/>
<text x="32" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">1  A step changes files</text>
<text x="32" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the agent writes src/ and tests/</text>
<text x="32" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">in the sandbox pod</text>
<text x="32" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(the container's own disk, lost with the pod)</text>
<path d="M285 125 L300 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="300" y="60" width="265" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="300" y="60" width="265" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="301" y="78" width="263" height="12" fill="#eff6ff"/>
<text x="312" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">2  Snapshot</text>
<text x="312" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">hash every file; upload only</text>
<text x="312" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the hashes S3 lacks; write</text>
<text x="312" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a manifest of path to hash</text>
<path d="M565 125 L580 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="580" y="60" width="265" height="130" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="580" y="60" width="265" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="581" y="78" width="263" height="12" fill="#fef2f2"/>
<text x="592" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">3  The sandbox is lost</text>
<text x="592" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pod deleted while tests run;</text>
<text x="592" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">its disk is gone;</text>
<text x="592" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the tool step fails</text>
<path d="M845 125 L860 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="860" y="60" width="265" height="130" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="860" y="60" width="265" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="861" y="78" width="263" height="12" fill="#fffbeb"/>
<text x="872" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">4  Retry in a new sandbox</text>
<text x="872" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">manager starts a pod,</text>
<text x="872" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">restores the last manifest,</text>
<text x="872" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the step runs again</text>
<path d="M1125 125 L1140 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="1140" y="60" width="265" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1140" y="60" width="265" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1141" y="78" width="263" height="12" fill="#f8fafc"/>
<text x="1152" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">5  Wait for a person</text>
<text x="1152" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">snapshot, then delete</text>
<text x="1152" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the sandbox: no pod, no</text>
<text x="1152" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">worker, nothing held</text>
<rect x="20" y="230" width="1360" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="20" y="230" width="1360" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="21" y="248" width="1358" height="12" fill="#f8fafc"/>
<text x="32" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Content-addressed snapshots</text>
<text x="32" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">snapshots/objects/&lt;sha256 of the file&gt;: each file is stored once, however many snapshots name it.</text>
<text x="32" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">snapshots/manifests/&lt;id&gt;.json: the manifest is the snapshot; its id is a hash of its contents.</text>
<text x="32" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">A snapshot after a step that changed one file uploads one file.</text>
<rect x="20" y="380" width="1360" height="150" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="20" y="380" width="1360" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="21" y="398" width="1358" height="12" fill="#fffbeb"/>
<text x="32" y="400" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Why the order matters</text>
<text x="32" y="428" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">The workflow snapshots only if the sandbox that ran the tool is still there. A fresh empty sandbox's snapshot would be a lie.</text>
<text x="32" y="445" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">If the sandbox vanished between the tool and the snapshot, the tool step is run again, in a restored sandbox.</text>
<text x="32" y="462" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Process memory (a running test) is not saved: the test starts over. Pod-level checkpoint and restore is not built.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="520px" viewBox="0 0 1420 520" style="background:#ffffff"><title>How a request gets a credential without the sandbox holding it</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="520" fill="#ffffff"/><rect x="20" y="30" width="180" height="60" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="20" y="30" width="180" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="21" y="48" width="178" height="12" fill="#fef2f2"/>
<text x="32" y="50" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Sandbox</text>
<line x1="110" y1="90" x2="110" y2="490" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="290" y="30" width="180" height="60" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="290" y="30" width="180" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="291" y="48" width="178" height="12" fill="#eff6ff"/>
<text x="302" y="50" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Egress gateway</text>
<line x1="380" y1="90" x2="380" y2="490" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="560" y="30" width="180" height="60" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="560" y="30" width="180" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="561" y="48" width="178" height="12" fill="#ecfdf5"/>
<text x="572" y="50" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Sandbox Manager</text>
<line x1="650" y1="90" x2="650" y2="490" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="830" y="30" width="180" height="60" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="830" y="30" width="180" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="831" y="48" width="178" height="12" fill="#eff6ff"/>
<text x="842" y="50" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Credential broker</text>
<line x1="920" y1="90" x2="920" y2="490" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="1100" y="30" width="180" height="60" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="1100" y="30" width="180" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="1101" y="48" width="178" height="12" fill="#ecfdf5"/>
<text x="1112" y="50" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Metrics API</text>
<line x1="1190" y1="90" x2="1190" y2="490" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M110 130 L380 130" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="76.69999999999999" y="112" width="336.6" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="245.0" y="124" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669">1  GET /v1/metrics, Authorization: Bearer placeholder</text>
<path d="M380 180 L650 180" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="315.7" y="162" width="398.6" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="515.0" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">2  which session owns this source address? is the host allowed?</text>
<path d="M650 215 L380 215" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="349.79999999999995" y="197" width="330.40000000000003" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="515.0" y="209" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">session, allowlist, credential binding for this host</text>
<path d="M380 270 L920 270" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="478.6" y="252" width="342.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="650.0" y="264" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb">3  mint a credential: session, audience, 900 s at most</text>
<path d="M920 305 L380 305" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="500.29999999999995" y="287" width="299.40000000000003" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="650.0" y="299" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">short-lived credential (ID logged, value never)</text>
<path d="M380 360 L1190 360" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="629.1" y="342" width="311.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="785.0" y="354" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669">4  same request, Authorization replaced, over TLS</text>
<path d="M1190 405 L380 405" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="653.9" y="387" width="262.20000000000005" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="785.0" y="399" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">5  200, and the answer names this session</text>
<path d="M380 450 L110 450" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="48.79999999999998" y="432" width="392.40000000000003" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="245.0" y="444" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">response back to the sandbox. The credential does not go back.</text></svg>
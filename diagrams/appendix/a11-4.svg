<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="400px" viewBox="0 0 1420 400" style="background:#ffffff"><title>A verifier's life: contract to re-score</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs><rect width="1420" height="400" fill="#ffffff"/><rect x="30" y="70" width="155" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="30" y="70" width="155" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="31" y="88" width="153" height="12" fill="#eff6ff"/>
<text x="42" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">1 Contract</text>
<text x="42" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">what counts as correct,</text>
<text x="42" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">equivalences, abstention</text>
<path d="M185 125 L202 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="202" y="70" width="155" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="202" y="70" width="155" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="203" y="88" width="153" height="12" fill="#eff6ff"/>
<text x="214" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">2 Implement</text>
<text x="214" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one interface: verdict,</text>
<text x="214" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">score, reasons, version</text>
<path d="M357 125 L374 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="374" y="70" width="155" height="110" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="374" y="70" width="155" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="375" y="88" width="153" height="12" fill="#fffbeb"/>
<text x="386" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">3 Measure</text>
<text x="386" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">gold sets per slice,</text>
<text x="386" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">precision first (S03)</text>
<path d="M529 125 L546 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="546" y="70" width="155" height="110" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="546" y="70" width="155" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="547" y="88" width="153" height="12" fill="#fffbeb"/>
<text x="558" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">4 Fuzz</text>
<text x="558" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">mutations against a strict</text>
<text x="558" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reference (S04, S10)</text>
<path d="M701 125 L718 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="718" y="70" width="155" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="718" y="70" width="155" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="719" y="88" width="153" height="12" fill="#ecfdf5"/>
<text x="730" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">5 Gate</text>
<text x="730" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">registry entry: approved,</text>
<text x="730" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">rejected, or audit only</text>
<path d="M873 125 L890 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="890" y="70" width="155" height="110" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="890" y="70" width="155" height="30" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="891" y="88" width="153" height="12" fill="#f5f3ff"/>
<text x="902" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5b21b6">6 Serve</text>
<text x="902" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one Deployment per</text>
<text x="902" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">version, pinned by hash</text>
<path d="M1045 125 L1062 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="1062" y="70" width="155" height="110" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="1062" y="70" width="155" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="1063" y="88" width="153" height="12" fill="#fef2f2"/>
<text x="1074" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">7 Monitor</text>
<text x="1074" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">audit gap, reasons,</text>
<text x="1074" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">shortcuts (S07, S08)</text>
<path d="M1217 125 L1234 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="1234" y="70" width="155" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1234" y="70" width="155" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1235" y="88" width="153" height="12" fill="#f8fafc"/>
<text x="1246" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">8 Re-score</text>
<text x="1246" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a new version re-scores</text>
<text x="1246" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">stored rollouts (S09)</text>
<path d="M1290 180 L1290 240 L115 240 L115 180" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="500.7" y="223" width="398.6" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="700" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">a confirmed exploit becomes a regression case and a new version</text>
<rect x="30" y="280" width="1360" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="30" y="280" width="1360" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="31" y="298" width="1358" height="12" fill="#f8fafc"/>
<text x="42" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">What a training run pins</text>
<text x="42" y="328" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">vq.py rl reads registry/&lt;name&gt;/&lt;version&gt;.json: status must be approved, purpose must be training, and the running service's</text>
<text x="42" y="345" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">code hash must equal the approved one. The audit and evaluation verifiers are pinned the same way, for their own purpose.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="470px" viewBox="0 0 1420 470" style="background:#ffffff"><title>What a code reward is allowed to do: compute, and nothing else</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs><rect width="1420" height="470" fill="#ffffff"/><rect x="30" y="30" width="1360" height="420" rx="14" fill="#fef2f2" fill-opacity=".55" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="44" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#991b1b">A VERIFIER POD (runtimeClassName: gvisor, restricted Pod Security, no service-account token, no identity)</text>
<rect x="60" y="80" width="900" height="340" rx="14" fill="#fffbeb" fill-opacity=".55" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="74" y="104" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#92400e">gVisor: the pod's system calls go to a user-space kernel, not the node's</text>
<rect x="90" y="130" width="840" height="270" rx="14" fill="#eff6ff" fill-opacity=".55" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="104" y="154" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#1e40af">A NEW PROCESS PER TEST (python -I, 4 s CPU, 512 MB, 1 MB files, 10 s wall, own session)</text>
<rect x="120" y="180" width="380" height="190" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="120" y="180" width="380" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="121" y="198" width="378" height="12" fill="#eff6ff"/>
<text x="132" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Before it runs</text>
<text x="132" y="228" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">static scan: sys.exit, os._exit, unittest, TestCase,</text>
<text x="132" y="245" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">builtins, __import__, /verify, /tests, subprocess,</text>
<text x="132" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">open(, ctypes, inspect ... means FAIL</text>
<text x="132" y="279" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155"></text>
<text x="132" y="296" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">audit hook (cannot be removed): open outside</text>
<text x="132" y="313" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">scratch and stdlib, os.system, Popen, exec,</text>
<text x="132" y="330" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">fork, kill, ctypes means PermissionError</text>
<rect x="530" y="180" width="380" height="190" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="530" y="180" width="380" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="531" y="198" width="378" height="12" fill="#eff6ff"/>
<text x="542" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">How it is judged</text>
<text x="542" y="228" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">hidden tests and edge cases, one per process</text>
<text x="542" y="245" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">exit code 0, no traceback, a complete result</text>
<text x="542" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">behind a nonce the program never sees</text>
<text x="542" y="279" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">50 property runs against the reference</text>
<text x="542" y="296" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">solution on random inputs</text>
<text x="542" y="313" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155"></text>
<text x="542" y="330" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">test strength: mutation score &gt;= 0.85 per task</text>
<rect x="990" y="80" width="370" height="160" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="990" y="80" width="370" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="991" y="98" width="368" height="12" fill="#f8fafc"/>
<text x="1002" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Network</text>
<text x="1002" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">NetworkPolicy rewards-isolation:</text>
<text x="1002" y="145" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">DNS, the store, the judges and the</text>
<text x="1002" y="162" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">rewards namespace; no internet (S05)</text>
<rect x="990" y="260" width="370" height="160" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="990" y="260" width="370" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="991" y="278" width="368" height="12" fill="#f8fafc"/>
<text x="1002" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">What is weaker</text>
<text x="1002" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">gVisor is a user-space kernel, not a</text>
<text x="1002" y="325" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">hardware boundary; the static scan is a</text>
<text x="1002" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">backstop; only Python programs</text></svg>
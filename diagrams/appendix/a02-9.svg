<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="740px" viewBox="0 0 1420 740" style="background:#ffffff"><title>One VPC, one address range, cut into public, platform and sandbox blocks</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="740" fill="#ffffff"/><text x="20" y="28" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">ONE VPC, ONE RANGE: 10.20.0.0/16 (65,536 addresses), cut into blocks. Nothing else is attached to the VPC.</text>
<rect x="20" y="60" width="1380" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="1392" y="84" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">the rest of the /16 is unassigned</text>
<rect x="20.0" y="60" width="5.390625" height="40" fill="#94a3b8" fill-opacity=".55" stroke="#94a3b8" stroke-width="1.2"/>
<rect x="25.390625" y="60" width="5.390625" height="40" fill="#94a3b8" fill-opacity=".55" stroke="#94a3b8" stroke-width="1.2"/>
<rect x="106.25" y="60" width="86.25" height="40" fill="#059669" fill-opacity=".55" stroke="#059669" stroke-width="1.2"/>
<rect x="192.5" y="60" width="86.25" height="40" fill="#059669" fill-opacity=".55" stroke="#059669" stroke-width="1.2"/>
<rect x="365.0" y="60" width="86.25" height="40" fill="#dc2626" fill-opacity=".55" stroke="#dc2626" stroke-width="1.2"/>
<rect x="451.25" y="60" width="86.25" height="40" fill="#dc2626" fill-opacity=".55" stroke="#dc2626" stroke-width="1.2"/>
<text x="20" y="54" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">10.20.0.0</text>
<text x="1400" y="54" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">10.20.255.255</text>
<rect x="20" y="190" width="440" height="112" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="20" y="190" width="440" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="21" y="208" width="438" height="12" fill="#f8fafc"/>
<text x="32" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Public blocks: 2 x /24</text>
<text x="32" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">10.20.0.0/24 and 10.20.1.0/24, one per zone</text>
<text x="32" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">hold the NAT gateway and nothing else</text>
<text x="32" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the only blocks with a route to the internet gateway</text>
<rect x="490" y="190" width="440" height="112" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="490" y="190" width="440" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="491" y="208" width="438" height="12" fill="#ecfdf5"/>
<text x="502" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Platform blocks: 2 x /20 (tag ds01/tier=system)</text>
<text x="502" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">10.20.16.0/20 and 10.20.32.0/20, one per zone</text>
<text x="502" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">about 4,000 addresses each</text>
<text x="502" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Manager, Router, tool gateway, egress gateway,</text>
<text x="502" y="289" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">credential broker, controller, orchestrator</text>
<rect x="960" y="190" width="440" height="112" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="960" y="190" width="440" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="961" y="208" width="438" height="12" fill="#fef2f2"/>
<text x="972" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Sandbox blocks: 2 x /20 (tag ds01/tier=sandbox)</text>
<text x="972" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">10.20.64.0/20 and 10.20.80.0/20, one per zone</text>
<text x="972" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">about 4,000 addresses each</text>
<text x="972" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">sandbox nodes only, and nothing else lands here</text>
<text x="972" y="289" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the untrusted code runs in these</text>
<path d="M22.6953125 100 L22.6953125 170 L240 170 L240 190" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
<path d="M235.625 100 L235.625 150 L710 150 L710 190" fill="none" stroke="#059669" stroke-width="1.6"/>
<path d="M494.375 100 L494.375 130 L1180 130 L1180 190" fill="none" stroke="#dc2626" stroke-width="1.6"/>
<text x="20" y="336" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">What differs between the two kinds of private block</text>
<rect x="220" y="350" width="590" height="34" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="232" y="372" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">Platform blocks</text>
<rect x="810" y="350" width="590" height="34" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="822" y="372" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Sandbox blocks</text>
<rect x="20" y="384" width="200" height="46" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="32" y="412" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">Who lives there</text>
<rect x="220" y="384" width="590" height="46" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="232" y="412" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">platform pods, on EKS Auto Mode's general-purpose nodes</text>
<rect x="810" y="384" width="590" height="46" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="822" y="412" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">sandbox pods only, on the tainted sandbox node pool</text>
<rect x="20" y="430" width="200" height="46" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="32" y="458" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">How nodes get there</text>
<rect x="220" y="430" width="590" height="46" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="232" y="458" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">the cluster's own subnet list names the platform blocks</text>
<rect x="810" y="430" width="590" height="46" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="822" y="458" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">a dedicated node class selects blocks by the sandbox tag</text>
<rect x="20" y="476" width="200" height="46" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="32" y="504" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">Security group</text>
<rect x="220" y="476" width="590" height="46" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="232" y="504" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">the cluster's default node security group</text>
<rect x="810" y="476" width="590" height="46" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="822" y="504" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">its own group, which accepts only the cluster security group</text>
<rect x="20" y="522" width="200" height="46" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="32" y="550" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">Node IAM role</text>
<rect x="220" y="522" width="590" height="46" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="232" y="550" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">the platform node role</text>
<rect x="810" y="522" width="590" height="46" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="822" y="550" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">a separate sandbox node role, with the same two minimal policies</text>
<rect x="20" y="568" width="200" height="46" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="32" y="596" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">Route table</text>
<rect x="220" y="568" width="590" height="46" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="232" y="596" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">one shared private table: all outbound traffic to the NAT gateway</text>
<rect x="810" y="568" width="590" height="46" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="822" y="596" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">the same shared table (the split does not change routing)</text>
<rect x="20" y="638" width="1380" height="80" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="20" y="638" width="1380" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="21" y="656" width="1378" height="12" fill="#fffbeb"/>
<text x="32" y="658" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Why two kinds of block</text>
<text x="32" y="686" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">The split is what lets the sandbox pool have its own placement, security group and role, so the sandbox node class can only place nodes in the sandbox blocks, never among the platform services.</text>
<text x="32" y="703" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">It also gives VPC-level rules a range they can target on its own. This build adds none of those rules yet: both private kinds share one route table.</text></svg>
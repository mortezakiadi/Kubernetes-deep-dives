<text x="432" y="530" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">EBS volumes and snapshots (CSI)</text>
<text x="432" y="558" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">gp3 volumes from the env-gp3 class; snapshots through the env-ebs VolumeSnapshotClass;</text>

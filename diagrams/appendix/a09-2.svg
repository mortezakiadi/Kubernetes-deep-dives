<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="640px" viewBox="0 0 1420 640" style="background:#ffffff"><title>One VPC in us-east-2, three zones, a CPU node group and a GPU node group</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs><rect width="1420" height="640" fill="#ffffff"/><rect x="20" y="20" width="1380" height="600" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="44" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#334155">AWS ACCOUNT, us-east-2, ONE VPC 10.81.0.0/16</text>
<rect x="50" y="70" width="340" height="140" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="50" y="70" width="340" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="51" y="88" width="338" height="12" fill="#eff6ff"/>
<text x="62" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Standard EKS cluster</text>
<text x="62" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ds08-longhorizon, Kubernetes 1.37</text>
<text x="62" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">add-ons: VPC CNI (network policy on), CoreDNS,</text>
<text x="62" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">kube-proxy, Pod Identity, metrics-server,</text>
<text x="62" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">EBS CSI driver, snapshot controller</text>
<rect x="50" y="230" width="340" height="130" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="50" y="230" width="340" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="51" y="248" width="338" height="12" fill="#ecfdf5"/>
<text x="62" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Node group ds08-longhorizon-system</text>
<text x="62" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">2 x m6i.2xlarge (8 vCPU, 32 GiB), on demand</text>
<text x="62" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">environments, store, verifier, credit worker,</text>
<text x="62" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Kueue</text>
<rect x="50" y="380" width="340" height="150" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="50" y="380" width="340" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="51" y="398" width="338" height="12" fill="#fffbeb"/>
<text x="62" y="400" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Node group ds08-longhorizon-gpu</text>
<text x="62" y="428" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">2 nodes, one GPU each, on demand</text>
<text x="62" y="445" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">types in order: g6e.xlarge, g6.2xlarge,</text>
<text x="62" y="462" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">g6e.2xlarge, g5.xlarge, g5.2xlarge, g6.xlarge</text>
<text x="62" y="479" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">AL2023 NVIDIA AMI 1.37.1-20261119 (pinned)</text>
<text x="62" y="496" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one runs vLLM; one runs trainer jobs</text>
<rect x="50" y="550" width="340" height="50" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="50" y="550" width="340" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>

<text x="442" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">nodes; NAT gateway for egress;</text>
<text x="442" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">S3 through a gateway endpoint</text>

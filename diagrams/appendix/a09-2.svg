<text x="442" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">both groups span all three zones;</text>
<text x="442" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a GPU node lands wherever EC2</text>
<text x="442" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">has capacity (S01 lists where</text>
<text x="442" y="289" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">each node of the final run was)</text>

<text x="432" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">tasks/public/  trajectories/  snapshots/  contexts/  logprobs/  credit/  curriculum/</text>
<text x="432" y="465" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">written only by the trajectory store (Pod Identity); the hidden tests are never in it</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="688px" viewBox="0 0 1420 688" style="background:#ffffff"><title>The eight steps of one session and the code behind each</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="688" fill="#ffffff"/><rect x="20" y="20" width="44" height="32" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="30" y="41" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Step</text>
<rect x="64" y="20" width="210" height="32" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="74" y="41" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Who acts</text>
<rect x="274" y="20" width="330" height="32" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="284" y="41" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">What happens</text>
<rect x="604" y="20" width="796" height="32" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="614" y="41" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Code and manifests that make it happen</text>
<rect x="20" y="56" width="44" height="74" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="64" y="56" width="210" height="74" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="274" y="56" width="330" height="74" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="604" y="56" width="796" height="74" fill="#ffffff" stroke="#cbd5e1"/>
<circle cx="42" cy="93.0" r="12" fill="#1e293b"/><text x="42" y="97.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">1</text>
<rect x="64" y="56" width="6" height="74" fill="#059669"/>
<text x="80" y="97.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">Orchestrator</text>
<text x="284" y="86" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">asks the Manager for a session:</text>
<text x="284" y="103" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">user, tenant, agent, template, hosts</text>
<text x="614" y="80" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">platform/ds01/orchestrator.py   main(): command create</text>
<text x="614" y="97" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">platform/ds01/manager.py   route(), _create(): the checks</text>
<rect x="20" y="130" width="44" height="74" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="64" y="130" width="210" height="74" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="274" y="130" width="330" height="74" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="604" y="130" width="796" height="74" fill="#f8fafc" stroke="#cbd5e1"/>
<circle cx="42" cy="167.0" r="12" fill="#1e293b"/><text x="42" y="171.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">2</text>
<rect x="64" y="130" width="6" height="74" fill="#059669"/>
<text x="80" y="171.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">Manager</text>
<text x="284" y="160" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">checks the tenant limit (three), creates</text>
<text x="284" y="177" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">the SandboxClaim with an end time</text>
<text x="614" y="154" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">platform/ds01/manager.py   TEMPLATES, _create(): quota, claim</text>
<text x="614" y="171" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">k8s/40-platform.yaml   the Manager's Role (claims, pods)</text>
<rect x="20" y="204" width="44" height="74" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="64" y="204" width="210" height="74" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="274" y="204" width="330" height="74" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="604" y="204" width="796" height="74" fill="#ffffff" stroke="#cbd5e1"/>
<circle cx="42" cy="241.0" r="12" fill="#1e293b"/><text x="42" y="245.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">3</text>
<rect x="64" y="204" width="6" height="74" fill="#2563eb"/>
<text x="80" y="245.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e40af">Controller, Manager</text>
<text x="284" y="234" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">a booted pod is adopted; the Manager</text>
<text x="284" y="251" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">waits for Ready and mints the token</text>
<text x="614" y="228" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">terraform/20-platform/manifests.tf   the pinned controller</text>
<text x="614" y="245" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">k8s/20-sandboxes.yaml   SandboxWarmPool</text>
<text x="614" y="262" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">platform/ds01/manager.py, common.py   wait loop, mint()</text>
<rect x="20" y="278" width="44" height="74" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="64" y="278" width="210" height="74" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="274" y="278" width="330" height="74" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="604" y="278" width="796" height="74" fill="#f8fafc" stroke="#cbd5e1"/>
<circle cx="42" cy="315.0" r="12" fill="#1e293b"/><text x="42" y="319.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">4</text>
<rect x="64" y="278" width="6" height="74" fill="#059669"/>
<text x="80" y="319.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">Orchestrator, Router</text>
<text x="284" y="308" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">commands and files go through the</text>
<text x="284" y="325" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Router into the sandbox</text>
<text x="614" y="302" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">platform/ds01/router.py   _resolve(), _exec(), _files(), _kube_exec()</text>
<text x="614" y="319" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">k8s/20-sandboxes.yaml   sandboxd command; Tier 3 annotation</text>
<rect x="20" y="352" width="44" height="74" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="64" y="352" width="210" height="74" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="274" y="352" width="330" height="74" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="604" y="352" width="796" height="74" fill="#ffffff" stroke="#cbd5e1"/>
<circle cx="42" cy="389.0" r="12" fill="#1e293b"/><text x="42" y="393.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">5</text>
<rect x="64" y="352" width="6" height="74" fill="#2563eb"/>
<text x="80" y="393.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e40af">Sandbox, egress gateway</text>
<text x="284" y="382" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">the only way out; allowlist; TLS passed</text>
<text x="284" y="399" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">through, or ended and a key injected</text>
<text x="614" y="376" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">k8s/20-sandboxes.yaml   proxy variables and the egress rule</text>
<text x="614" y="393" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">k8s/30-egress.yaml   fixed Service address, mitmdump</text>
<text x="614" y="410" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">platform/ds01/gateway_addon.py, manager.py   session(), by-ip</text>
<rect x="20" y="426" width="44" height="74" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="64" y="426" width="210" height="74" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="274" y="426" width="330" height="74" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="604" y="426" width="796" height="74" fill="#f8fafc" stroke="#cbd5e1"/>
<circle cx="42" cy="463.0" r="12" fill="#1e293b"/><text x="42" y="467.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">6</text>
<rect x="64" y="426" width="6" height="74" fill="#059669"/>
<text x="80" y="467.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">Tool gateway</text>
<text x="284" y="456" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">session token, policy, approvals,</text>
<text x="284" y="473" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">rate limit, then the tool runs</text>
<text x="614" y="450" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">platform/ds01/tool_gateway.py   route(), _rpc(), _run()</text>
<text x="614" y="467" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">platform/ds01/manager.py   the session-active lookup</text>
<text x="614" y="484" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">platform/ds01/broker.py   mint</text>
<rect x="20" y="500" width="44" height="74" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="64" y="500" width="210" height="74" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="274" y="500" width="330" height="74" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="604" y="500" width="796" height="74" fill="#ffffff" stroke="#cbd5e1"/>
<circle cx="42" cy="537.0" r="12" fill="#1e293b"/><text x="42" y="541.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">7</text>
<rect x="64" y="500" width="6" height="74" fill="#94a3b8"/>
<text x="80" y="541.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Every service</text>
<text x="284" y="530" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">one JSON line per event, with the</text>
<text x="284" y="547" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">session ID; one query joins them</text>
<text x="614" y="524" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">platform/ds01/common.py   audit()</text>
<text x="614" y="541" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">scripts/audit-query.py   collect()</text>
<text x="614" y="558" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">the ds01/component label on every Deployment</text>
<rect x="20" y="574" width="44" height="74" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="64" y="574" width="210" height="74" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="274" y="574" width="330" height="74" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="604" y="574" width="796" height="74" fill="#f8fafc" stroke="#cbd5e1"/>
<circle cx="42" cy="611.0" r="12" fill="#1e293b"/><text x="42" y="615.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">8</text>
<rect x="64" y="574" width="6" height="74" fill="#dc2626"/>
<text x="80" y="615.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">Manager, controller</text>
<text x="284" y="604" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">delete, or the end time passes: claim,</text>
<text x="284" y="621" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">pod and workspace go; token is dead</text>
<text x="614" y="598" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">platform/ds01/manager.py   _delete(), _internal(); lifecycle in _create()</text>
<text x="614" y="615" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">the controller enforces shutdownTime with shutdownPolicy Delete</text></svg>
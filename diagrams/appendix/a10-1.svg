<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="560px" viewBox="0 0 1420 560" style="background:#ffffff"><title>Who uses the platform and what a run is made of</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="560" fill="#ffffff"/><rect x="20" y="30" width="270" height="500" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">WHO</text>
<rect x="40" y="70" width="230" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="70" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="88" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Research team</text>
<text x="52" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">picks the recipe, reads the</text>
<text x="52" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">curves, asks the library</text>
<text x="52" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">'can I set staleness to 8?'</text>
<rect x="40" y="200" width="230" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="200" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="218" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Platform team</text>
<text x="52" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">owns the cluster, the GPU</text>
<text x="52" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pool and the research queue</text>
<text x="52" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">and its priorities</text>
<rect x="40" y="330" width="230" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="330" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="348" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">On-call engineer</text>
<text x="52" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reads the controller's timeline</text>
<text x="52" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">when a run was tightened,</text>
<text x="52" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">skipped or rolled back</text>
<rect x="320" y="30" width="1080" height="500" rx="14" fill="#fffbeb" fill-opacity=".55" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="334" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#92400e">WHAT A RUN IS (ONE POD, ONE GPU)</text>
<rect x="340" y="70" width="320" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="340" y="70" width="320" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="341" y="88" width="318" height="12" fill="#eff6ff"/>
<text x="352" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Sampling engine</text>
<text x="352" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">vLLM, in the trainer's process,</text>
<text x="352" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">holds the weights of one version;</text>
<text x="352" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">writes every token's log-probability</text>
<text x="352" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(mu, the behavior policy)</text>
<rect x="700" y="70" width="320" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="700" y="70" width="320" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="701" y="88" width="318" height="12" fill="#eff6ff"/>
<text x="712" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Trainer</text>
<text x="712" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">scores each sample on arrival with</text>
<text x="712" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">its own weights (pi_prox), then</text>
<text x="712" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">updates the policy (pi_theta) with</text>
<text x="712" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the decoupled loss</text>
<rect x="1060" y="70" width="320" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="1060" y="70" width="320" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="1061" y="88" width="318" height="12" fill="#eff6ff"/>
<text x="1072" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Sample pools</text>
<text x="1072" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">fresh, replay and external;</text>
<text x="1072" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">an age limit and a distance limit;</text>
<text x="1072" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a share of each micro-batch</text>
<rect x="340" y="240" width="320" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="340" y="240" width="320" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="341" y="258" width="318" height="12" fill="#f8fafc"/>
<text x="352" y="260" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Metrics</text>
<text x="352" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ratio tail, effective sample size,</text>
<text x="352" y="305" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">behavior KL by age, clipped and</text>
<text x="352" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">masked fractions, version ages</text>
<rect x="700" y="240" width="320" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="700" y="240" width="320" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="701" y="258" width="318" height="12" fill="#f8fafc"/>
<text x="712" y="260" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Controller</text>
<text x="712" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">rules in a file: tighten, skip a</text>
<text x="712" y="305" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">batch, cut the learning rate, roll</text>
<text x="712" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">back to a healthy checkpoint</text>
<rect x="1060" y="240" width="320" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1060" y="240" width="320" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1061" y="258" width="318" height="12" fill="#f8fafc"/>
<text x="1072" y="260" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Reference library</text>
<text x="1072" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the sweep's results: (learning rate,</text>
<text x="1072" y="305" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">correction, staleness) to held-out</text>
<text x="1072" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">score, stored with the recipe</text>
<path d="M270 125 L340 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="282.4" y="108.0" width="45.2" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="305.0" y="120.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">recipe</text>
<path d="M270 255 L340 300" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="285.5" y="260.5" width="39.0" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="305.0" y="272.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">queue</text>
<path d="M270 390 L700 340 L700 340" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="451.2" y="381" width="57.6" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="480" y="393" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">timeline</text>
<text x="340" y="420" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">The question this platform answers: how stale, how filtered or how foreign can the data be before the update stops helping,</text>
<text x="340" y="440" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">and what in the run tells you before the held-out score does?</text>
<text x="340" y="470" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">Scaled down to a 0.6B model on grade-school maths, runs of 48 to 100 steps, one GPU per run. The design's agents, long answers and</text>
<text x="340" y="488" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">thousands of GPUs are not reachable; the three-policy loss, the metrics, the limits and the controller are.</text></svg>
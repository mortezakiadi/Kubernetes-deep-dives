<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="560px" viewBox="0 0 1420 560" style="background:#ffffff"><title>Who uses the platform, what it is made of, and what it talks to</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs><rect width="1420" height="560" fill="#ffffff"/><rect x="20" y="30" width="270" height="500" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">WHO</text>
<rect x="40" y="70" width="230" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="70" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="88" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Researcher</text>
<text x="52" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">writes a recipe file,</text>
<text x="52" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">or an ablation of one;</text>
<text x="52" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">launches, compares runs</text>
<rect x="40" y="210" width="230" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="210" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="228" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Reviewer of recipes</text>
<text x="52" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reviews recipe changes in</text>
<text x="52" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Git like code</text>
<rect x="40" y="340" width="230" height="160" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="340" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="358" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="360" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Release owner</text>
<text x="52" y="388" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reads the evaluation of a</text>
<text x="52" y="405" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">candidate; the gate promotes</text>
<text x="52" y="422" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">it or blocks it with reasons</text>
<rect x="320" y="30" width="760" height="500" rx="14" fill="#fffbeb" fill-opacity=".55" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="334" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#92400e">THE PLATFORM (standard EKS)</text>
<rect x="340" y="70" width="220" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="340" y="70" width="220" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="341" y="88" width="218" height="12" fill="#eff6ff"/>
<text x="352" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Recipes + launcher</text>
<text x="352" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">recipes/*.yaml in Git</text>
<text x="352" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ptl.py: hash, diff, resolve,</text>
<text x="352" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">refuse bad ablations, submit</text>
<rect x="590" y="70" width="470" height="110" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="590" y="70" width="470" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="591" y="88" width="468" height="12" fill="#fffbeb"/>
<text x="602" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Admission: Kueue + JobSet</text>
<text x="602" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">two queues in one cohort: production owns the GPUs,</text>
<text x="602" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ablation borrows them; an RL job (rollout + trainer)</text>
<text x="602" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">is one Workload, admitted all or nothing</text>
<rect x="340" y="200" width="220" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="340" y="200" width="220" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="341" y="218" width="218" height="12" fill="#eff6ff"/>
<text x="352" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Run jobs (GPU)</text>
<text x="352" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">SFT, RL (GRPO), on-policy</text>
<text x="352" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">distillation, filtering,</text>
<text x="352" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">teacher traces, evaluation</text>
<rect x="590" y="200" width="220" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="590" y="200" width="220" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="591" y="218" width="218" height="12" fill="#fef2f2"/>
<text x="602" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Reward verifiers (CPU)</text>
<text x="602" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">math and code checks;</text>
<text x="602" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">runs model-written code in</text>
<text x="602" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a process sandbox; no network</text>
<rect x="840" y="200" width="220" height="120" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="840" y="200" width="220" height="30" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="841" y="218" width="218" height="12" fill="#f5f3ff"/>
<text x="852" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5b21b6">Health monitor</text>
<text x="852" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reads every run's metrics</text>
<text x="852" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">from the tracking store; trend</text>
<text x="852" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">alerts before a collapse</text>
<rect x="340" y="340" width="720" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="340" y="340" width="720" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="341" y="358" width="718" height="12" fill="#f8fafc"/>
<text x="352" y="360" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Stores (one S3 bucket)</text>
<text x="352" y="388" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">datasets/   versioned, with content hashes</text>
<text x="352" y="405" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">runs/   the tracking store: resolved recipe, status, metrics, events, checkpoints</text>
<text x="352" y="422" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">registry/   every stage's model and its entry (recipe hash, base, data, gate verdict)</text>
<text x="352" y="439" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">evals/   the evaluation suites' results, one per model</text>
<rect x="340" y="465" width="720" height="50" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="340" y="465" width="720" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="341" y="483" width="718" height="12" fill="#f8fafc"/>
<text x="352" y="485" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Every run is described by one immutable record before it starts: runs/&lt;run_id&gt;/resolved.json</text>
<rect x="1110" y="30" width="290" height="500" rx="14" fill="#fef2f2" fill-opacity=".55" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="1124" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#991b1b">OUTSIDE THE PLATFORM</text>
<rect x="1130" y="70" width="250" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1130" y="70" width="250" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1131" y="88" width="248" height="12" fill="#f8fafc"/>
<text x="1142" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Hugging Face Hub</text>
<text x="1142" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Qwen2.5-0.5B-Instruct (student)</text>
<text x="1142" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Qwen2.5-3B-Instruct (teacher)</text>
<text x="1142" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pinned to commits</text>
<rect x="1130" y="210" width="250" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1130" y="210" width="250" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1131" y="228" width="248" height="12" fill="#f8fafc"/>
<text x="1142" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Docker Hub, PyPI</text>
<text x="1142" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">vLLM 0.33.0 image (digest),</text>
<text x="1142" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">TRL 1.18.2, datasets 5.2.0</text>
<rect x="1130" y="340" width="250" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1130" y="340" width="250" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1131" y="358" width="248" height="12" fill="#f8fafc"/>
<text x="1142" y="360" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Git</text>
<text x="1142" y="388" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the recipe's commit is</text>
<text x="1142" y="405" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">recorded with every run</text>

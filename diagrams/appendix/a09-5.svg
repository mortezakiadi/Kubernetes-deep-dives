<text x="40" y="300" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">k branches from each snapshot, each verified fresh (green = success); V(t) = mean outcome; V(start) = the task's group mean</text>
<rect x="40" y="330" width="650" height="200" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="40" y="330" width="650" height="30" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="41" y="348" width="648" height="12" fill="#f5f3ff"/>
<text x="52" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5b21b6">Turn-level advantages (Monte Carlo)</text>
<text x="52" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">turns 0-2: V(2) - V(start)</text>
<text x="52" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">turns 3-4: V(4) - V(2) = +0.50  (the good fix is credited)</text>
<text x="52" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">turns 5-6: V(6) - V(4) = -0.75  (the bad edit is blamed)</text>
<text x="52" y="429" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">turn 7:    outcome - V(6)</text>
<text x="52" y="446" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the decisive segment is the largest |change in V|</text>
<rect x="730" y="330" width="650" height="200" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="730" y="330" width="650" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="731" y="348" width="648" height="12" fill="#f8fafc"/>
<text x="742" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Trajectory-level (GRPO-style) advantages</text>
<text x="742" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">every turn: (outcome - group mean) / group std</text>
<text x="742" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the good fix and the bad edit get the same number</text>
<text x="742" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a group whose attempts all fail or all succeed gives zero</text>
<text x="742" y="429" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">to every turn of every attempt</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="520px" viewBox="0 0 1420 520" style="background:#ffffff"><title>Three groups, four golden paths, one platform</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="520" fill="#ffffff"/><rect x="20" y="30" width="250" height="440" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">WHO</text>
<rect x="40" y="70" width="210" height="100" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="70" width="210" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="88" width="208" height="12" fill="#ecfdf5"/>
<text x="52" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Researchers</text>
<text x="52" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">30 people, prototyping</text>
<text x="52" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">want a GPU in minutes,</text>
<text x="52" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">and to stop paying at lunch</text>
<rect x="40" y="190" width="210" height="100" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="190" width="210" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="208" width="208" height="12" fill="#ecfdf5"/>
<text x="52" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Training team</text>
<text x="52" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">fine-tunes, long runs</text>
<text x="52" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">want to submit once and</text>
<text x="52" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">survive failures</text>
<rect x="40" y="310" width="210" height="100" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="310" width="210" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="328" width="208" height="12" fill="#ecfdf5"/>
<text x="52" y="330" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Product teams</text>
<text x="52" y="358" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">serve models to customers</text>
<text x="52" y="375" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">want latency and low cost</text>
<text x="52" y="392" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">per token</text>
<rect x="300" y="30" width="340" height="440" rx="14" fill="#eff6ff" fill-opacity=".55" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="314" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#1e40af">WHAT THEY WRITE (GOLDEN PATHS)</text>
<rect x="320" y="70" width="300" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="320" y="70" width="300" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="321" y="88" width="298" height="12" fill="#eff6ff"/>
<text x="332" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Notebook</text>
<text x="332" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">StatefulSet + GPU + workspace volume</text>
<text x="332" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">queue label: notebooks</text>
<rect x="320" y="165" width="300" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="320" y="165" width="300" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="321" y="183" width="298" height="12" fill="#eff6ff"/>
<text x="332" y="185" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">TrainJob</text>
<text x="332" y="213" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">runtime: torch-gpu-ddp, 2 nodes, args</text>
<text x="332" y="230" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">queue label: training</text>
<rect x="320" y="260" width="300" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="320" y="260" width="300" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="321" y="278" width="298" height="12" fill="#eff6ff"/>
<text x="332" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Model deployment / batch job</text>
<text x="332" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Deployment (or LeaderWorkerSet)</text>
<text x="332" y="325" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">queue labels: serving, batch</text>
<rect x="320" y="355" width="300" height="90" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="320" y="355" width="300" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="321" y="373" width="298" height="12" fill="#eff6ff"/>
<text x="332" y="375" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Registry commands</text>
<text x="332" y="403" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">register, evaluate, promote</text>
<text x="332" y="420" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(a model moves only through the gates)</text>
<rect x="670" y="30" width="730" height="440" rx="14" fill="#fffbeb" fill-opacity=".55" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="684" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#92400e">WHAT THE PLATFORM PROVIDES</text>
<rect x="690" y="70" width="330" height="110" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="690" y="70" width="330" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="691" y="88" width="328" height="12" fill="#fffbeb"/>
<text x="702" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Kueue queues, one cohort</text>
<text x="702" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">notebooks 1 GPU | training 2 GPUs</text>
<text x="702" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">serving 2 GPUs (lends 1) | batch 0</text>
<text x="702" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">priorities: production &gt; training &gt; opportunistic</text>
<rect x="1040" y="70" width="340" height="110" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="1040" y="70" width="340" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="1041" y="88" width="338" height="12" fill="#fffbeb"/>
<text x="1052" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Workload APIs</text>
<text x="1052" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Kubeflow Trainer + JobSet</text>
<text x="1052" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">LeaderWorkerSet, Deployment, Job,</text>
<text x="1052" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">StatefulSet</text>
<rect x="690" y="200" width="330" height="110" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="690" y="200" width="330" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="691" y="218" width="328" height="12" fill="#fef2f2"/>
<text x="702" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">GPU pools, one per family</text>
<text x="702" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">gpu-research, gpu-training, gpu-inference</text>
<text x="702" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">tainted; scaled from zero; any one-GPU</text>
<text x="702" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">g4dn, g5, g6, g6e the zone can give</text>
<rect x="1040" y="200" width="340" height="110" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="1040" y="200" width="340" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="1041" y="218" width="338" height="12" fill="#fffbeb"/>
<text x="1052" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Serving stack</text>
<text x="1052" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Gateway + endpoint picker</text>
<text x="1052" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">vLLM replicas, autoscaled by KEDA</text>
<text x="1052" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">warm buffer, weights from the registry</text>
<rect x="690" y="330" width="330" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="690" y="330" width="330" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="691" y="348" width="328" height="12" fill="#f8fafc"/>
<text x="702" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Data and models (S3)</text>
<text x="702" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">datasets/, runs/ (checkpoints, events)</text>
<text x="702" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">registry/ (versions, pointers, audit)</text>
<text x="702" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">evals/ (results)  |  Pod Identity per family</text>
<rect x="1040" y="330" width="340" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1040" y="330" width="340" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1041" y="348" width="338" height="12" fill="#f8fafc"/>
<text x="1052" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Observability</text>
<text x="1052" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Prometheus: vLLM, training, DCGM,</text>
<text x="1052" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">kube-state-metrics</text>
<text x="1052" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">every series carries namespace = family</text>
<path d="M250 120 L300 120" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M250 240 L300 240" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M250 360 L300 360" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M640 300 L690 300" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/></svg>
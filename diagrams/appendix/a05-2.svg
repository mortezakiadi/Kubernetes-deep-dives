<text x="422" y="528" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">us-east-1a or 1b at any time; a synchronous</text>
<text x="422" y="545" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">standby in the other</text>
<rect x="740" y="480" width="320" height="90" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="740" y="480" width="320" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="741" y="498" width="318" height="12" fill="#fef2f2"/>
<text x="752" y="500" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">RDS standby</text>
<text x="752" y="528" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">takes over on failover (S10 forces it)</text>
<text x="752" y="545" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the endpoint name does not change</text>
<rect x="1070" y="480" width="310" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1070" y="480" width="310" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1071" y="498" width="308" height="12" fill="#f8fafc"/>
<text x="1082" y="500" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">NAT gateway</text>
<text x="1082" y="528" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one; image pulls, public APIs</text>
<text x="410" y="610" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">Why Multi-AZ RDS and not Aurora: the same shape for what the tests need (a synchronous standby in another zone,</text>
<text x="410" y="630" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">one endpoint name that follows the primary), created in about ten minutes. Aurora's cluster storage is not built.</text>
<text x="410" y="660" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Auto Mode nodes are not listed by EC2 to the account; the cluster and its pods are the view that counts.</text></svg>
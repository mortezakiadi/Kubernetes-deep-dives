<text x="62" y="428" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">temporal: the engine (frontend, history,</text>
<text x="62" y="445" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">matching, worker, web)</text>
<text x="62" y="462" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">agent-platform: session API, gateways,</text>
<text x="62" y="479" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">workers, sandbox manager, tester</text>
<text x="62" y="496" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">sandboxes | external (git host) | monitoring | keda</text>
<rect x="50" y="550" width="330" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>

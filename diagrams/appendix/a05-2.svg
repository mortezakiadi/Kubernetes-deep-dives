<text x="62" y="570" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Terraform (two layers, local state)</text>
<text x="62" y="598" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">10-cluster: VPC, NAT, IAM, cluster, RDS, ECR</text>
<text x="62" y="615" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">20-platform: namespaces, S3, identities, Helm</text>
<text x="62" y="632" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">releases, deployments</text>
<text x="62" y="649" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">account guard; down.sh then verify-clean.sh</text>

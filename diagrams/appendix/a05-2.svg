<text x="62" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Managed data services</text>
<text x="62" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">RDS PostgreSQL 16, db.t4g.small, Multi-AZ</text>
<text x="62" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(stands in for Aurora PostgreSQL)</text>
<text x="62" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">S3 bucket: workspace snapshots</text>
<text x="62" y="329" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ECR repository: the one agent image</text>
<rect x="50" y="380" width="330" height="150" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="50" y="380" width="330" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>

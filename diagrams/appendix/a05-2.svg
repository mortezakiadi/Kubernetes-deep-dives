<text x="62" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">EKS Auto Mode cluster</text>
<text x="62" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ds04-agentstate, Kubernetes 1.37</text>
<text x="62" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">API private in the VPC; public only to</text>
<text x="62" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the administrator's /32</text>
<text x="62" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">audit logs 3 days</text>
<rect x="50" y="230" width="330" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="50" y="230" width="330" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>

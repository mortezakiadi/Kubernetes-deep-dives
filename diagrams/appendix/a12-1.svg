<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="560px" viewBox="0 0 1420 560" style="background:#ffffff"><title>Who uses the platform and what it is made of</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="560" fill="#ffffff"/><rect x="20" y="30" width="270" height="500" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">WHO</text>
<rect x="40" y="70" width="230" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="70" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="88" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Domain teams</text>
<text x="52" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">each owns a family: its data,</text>
<text x="52" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">its verifier, its eval suite</text>
<text x="52" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">and its margin</text>
<rect x="40" y="200" width="230" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="200" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="218" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Mixture team</text>
<text x="52" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">owns the weights, the order</text>
<text x="52" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">and the release gate; asks</text>
<text x="52" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the matrix, not the meeting</text>
<rect x="40" y="330" width="230" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="330" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="348" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Platform team</text>
<text x="52" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">owns the cluster, the research</text>
<text x="52" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">queue, and the pipelines that</text>
<text x="52" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">train, merge and evaluate</text>
<rect x="320" y="30" width="1080" height="500" rx="14" fill="#fffbeb" fill-opacity=".55" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="334" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#92400e">WHAT IT IS MADE OF</text>
<rect x="340" y="70" width="320" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="340" y="70" width="320" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="341" y="88" width="318" height="12" fill="#eff6ff"/>
<text x="352" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Domain registry</text>
<text x="352" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">six families (and a seventh to</text>
<text x="352" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">admit): owner, data version,</text>
<text x="352" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">verifier, held-out split, margin;</text>
<text x="352" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">verifier precision is measured</text>
<rect x="700" y="70" width="320" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="700" y="70" width="320" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="701" y="88" width="318" height="12" fill="#eff6ff"/>
<text x="712" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Mixture service</text>
<text x="712" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">weights, floors, token balance,</text>
<text x="712" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">stages and refreshes; proxy runs,</text>
<text x="712" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a response model, a search that</text>
<text x="712" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">maximises the weakest family</text>
<rect x="1060" y="70" width="320" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="1060" y="70" width="320" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="1061" y="88" width="318" height="12" fill="#eff6ff"/>
<text x="1072" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Training runs</text>
<text x="1072" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">GRPO, one GPU per run, vLLM</text>
<text x="1072" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">in the process; per-family reward,</text>
<text x="1072" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">signal and evaluation recorded</text>
<text x="1072" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">for every batch</text>
<rect x="340" y="240" width="320" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="340" y="240" width="320" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="341" y="258" width="318" height="12" fill="#f8fafc"/>
<text x="352" y="260" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Capability matrix</text>
<text x="352" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">boost one family, score all:</text>
<text x="352" y="305" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">transfer and interference, with</text>
<text x="352" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">seed noise; a gradient probe per</text>
<text x="352" y="339" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">module as a second instrument</text>
<rect x="700" y="240" width="320" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="700" y="240" width="320" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="701" y="258" width="318" height="12" fill="#f8fafc"/>
<text x="712" y="260" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Combination</text>
<text x="712" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">specialists trained apart, merged</text>
<text x="712" y="305" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">by task arithmetic with trimming</text>
<text x="712" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">and sign agreement; one workflow</text>
<text x="712" y="339" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">of Kueue-managed jobs</text>
<rect x="1060" y="240" width="320" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1060" y="240" width="320" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1061" y="258" width="318" height="12" fill="#f8fafc"/>
<text x="1072" y="260" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Release gate</text>
<text x="1072" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">no family may fall below the</text>
<text x="1072" y="305" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">current release by more than its</text>
<text x="1072" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">margin plus twice its noise;</text>
<text x="1072" y="339" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">mean, minimum, geometric mean</text>
<path d="M270 125 L340 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="276.2" y="108.0" width="57.6" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="305.0" y="120.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">contract</text>
<path d="M270 255 L700 150" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="474.3" y="179" width="51.4" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="500" y="191" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">weights</text>
<path d="M270 390 L700 330" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="451.2" y="361" width="57.6" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="480" y="373" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">pipeline</text>
<text x="340" y="420" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">The question this platform answers: how do we cover many task families with one assistant, and know that a release is better for all of them,</text>
<text x="340" y="440" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">not only on average?</text>
<text x="340" y="470" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">Scaled down to a 0.6B model, six small families with programmatic verifiers (and a seventh to admit), runs of 40 to 120 steps on one GPU each.</text>
<text x="340" y="488" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">A chat family with a judge, long agentic tasks and distillation are not reachable here; the matrix, the mixture search, the order, the merge and the gate are.</text></svg>
<text x="462" y="268" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">all four clusters' nodes</text>
<text x="462" y="285" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">platform pool: Kueue controllers, add-ons</text>
<text x="462" y="302" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">cpu-a: pool cpu-ondemand</text>
<text x="462" y="319" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">cpu-b: pool cpu-spot (Spot)</text>
<text x="462" y="336" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">hub: no pool for user work</text>
<rect x="450" y="460" width="420" height="240" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="450" y="460" width="420" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="451" y="478" width="418" height="12" fill="#fef2f2"/>
<text x="462" y="480" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">GPU nodes (only while a job needs them)</text>
<text x="462" y="508" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">cluster gpu: pools gpu-ondemand, gpu-spot</text>
<text x="462" y="525" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">xlarge: 4 vCPU, 16 GiB, one GPU</text>
<text x="462" y="542" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">tainted nvidia.com/gpu:NoSchedule</text>
<text x="462" y="559" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">limit: 2 GPUs on-demand, 2 on Spot</text>
<text x="462" y="576" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">removed 2 minutes after the last job</text>

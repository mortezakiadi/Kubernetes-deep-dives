<text x="30" y="752" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">Instance types are chosen by Auto Mode inside each NodePool's limits. Design 02 spans several regions; this build keeps all four clusters in one.</text></svg>
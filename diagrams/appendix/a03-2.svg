<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="760px" viewBox="0 0 1420 760" style="background:#ffffff"><title>Fleet topology and instances</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="760" fill="#ffffff"/><rect x="20" y="20" width="1380" height="720" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="44" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#334155">AWS ACCOUNT, us-east-1, ONE VPC 10.30.0.0/16</text>
<rect x="50" y="70" width="340" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="50" y="70" width="340" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="51" y="88" width="338" height="12" fill="#eff6ff"/>
<text x="62" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Four EKS Auto Mode clusters</text>
<text x="62" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Kubernetes 1.37 on all four</text>
<text x="62" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ds02-fleet-hub, -cpu-a, -cpu-b, -gpu</text>
<text x="62" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">API: private inside the VPC, public only</text>
<text x="62" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">to the administrator's /32</text>
<text x="62" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">audit logs to CloudWatch, 3 days</text>
<rect x="50" y="250" width="340" height="130" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="50" y="250" width="340" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="51" y="268" width="338" height="12" fill="#fffbeb"/>
<text x="62" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">IAM</text>
<text x="62" y="298" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">cluster role: 5 AWS-managed EKS policies</text>
<text x="62" y="315" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one node role: WorkerNodeMinimal + ECR pull</text>
<text x="62" y="332" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">per-team roles for S3 (Pod Identity)</text>
<text x="62" y="349" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">no administrator credential on a cluster</text>
<rect x="50" y="410" width="340" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="50" y="410" width="340" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="51" y="428" width="338" height="12" fill="#f8fafc"/>
<text x="62" y="430" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">S3 bucket, one prefix per team</text>
<text x="62" y="458" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">llm/, vision/, research/</text>
<text x="62" y="475" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">each team's role reads only its prefix</text>
<text x="62" y="492" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">public access blocked</text>
<rect x="50" y="550" width="340" height="160" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="50" y="550" width="340" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="51" y="568" width="338" height="12" fill="#f8fafc"/>
<text x="62" y="570" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Terraform (two layers, local state)</text>
<text x="62" y="598" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">10-fleet: VPC, NAT, IAM, four clusters</text>
<text x="62" y="615" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">20-platform: Kueue x4, queues, node pools,</text>
<text x="62" y="632" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">MultiKueue wiring, identities, policies</text>
<text x="62" y="649" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">account guard; down.sh then verify-clean.sh</text>
<rect x="430" y="60" width="460" height="660" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>

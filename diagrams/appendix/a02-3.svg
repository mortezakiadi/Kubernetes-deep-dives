<rect x="481" y="338" width="328" height="12" fill="#f8fafc"/>
<text x="492" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Kubernetes API server</text>
<text x="830" y="345" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">S05 kubernetes_api</text>
<path d="M390 270 L430 388" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-bad)"/>
<circle cx="448" cy="388" r="9" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M444 384 L452 392 M452 384 L444 392" stroke="#dc2626" stroke-width="2.2"/>
<rect x="480" y="368" width="330" height="40" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="480" y="368" width="330" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="481" y="386" width="328" height="12" fill="#f8fafc"/>
<text x="492" y="388" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Another sandbox (8080, 9090)</text>
<text x="830" y="393" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">S05 other_sandbox</text>
<path d="M390 270 L430 436" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-bad)"/>
<circle cx="448" cy="436" r="9" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M444 432 L452 440 M452 432 L444 440" stroke="#dc2626" stroke-width="2.2"/>
<rect x="480" y="416" width="330" height="40" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="480" y="416" width="330" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="481" y="434" width="328" height="12" fill="#f8fafc"/>
<text x="492" y="436" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">169.254.169.254 credentials</text>
<text x="830" y="441" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">S05 imds</text>
<path d="M390 270 L430 484" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-bad)"/>
<circle cx="448" cy="484" r="9" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M444 480 L452 488 M452 480 L444 488" stroke="#dc2626" stroke-width="2.2"/>
<rect x="480" y="464" width="330" height="40" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="480" y="464" width="330" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="481" y="482" width="328" height="12" fill="#f8fafc"/>
<text x="492" y="484" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Internet by address (1.1.1.1)</text>
<text x="830" y="489" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">S05 direct_internet</text>
<path d="M390 270 L430 532" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-bad)"/>
<circle cx="448" cy="532" r="9" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M444 528 L452 536 M452 528 L444 536" stroke="#dc2626" stroke-width="2.2"/>
<rect x="480" y="512" width="330" height="40" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="480" y="512" width="330" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="481" y="530" width="328" height="12" fill="#f8fafc"/>
<text x="492" y="532" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Internet with the proxy unset</text>
<text x="830" y="537" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">S05 proxy_bypass</text>
<path d="M390 270 L430 580" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-bad)"/>
<circle cx="448" cy="580" r="9" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M444 576 L452 584 M452 576 L444 584" stroke="#dc2626" stroke-width="2.2"/>
<rect x="480" y="560" width="330" height="40" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="480" y="560" width="330" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="481" y="578" width="328" height="12" fill="#f8fafc"/>
<text x="492" y="580" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">DNS lookups and DNS exfiltration</text>
<text x="830" y="585" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">S05 dns_exfiltration</text>
<path d="M390 270 L430 628" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-bad)"/>
<circle cx="448" cy="628" r="9" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M444 624 L452 632 M452 624 L444 632" stroke="#dc2626" stroke-width="2.2"/>
<rect x="480" y="608" width="330" height="40" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="480" y="608" width="330" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="481" y="626" width="328" height="12" fill="#f8fafc"/>
<text x="492" y="628" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Host not on the allowlist</text>
<text x="830" y="633" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">S06 unapproved_host</text>
<rect x="950" y="60" width="430" height="300" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="964" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">WHAT THE GATEWAY MAY REACH</text>
<rect x="975" y="100" width="380" height="70" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="975" y="100" width="380" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="976" y="118" width="378" height="12" fill="#ecfdf5"/>
<text x="987" y="120" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Allowlisted internet</text>
<text x="987" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pypi.org, files.pythonhosted.org (per session)</text>
<rect x="975" y="190" width="380" height="70" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="975" y="190" width="380" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="976" y="208" width="378" height="12" fill="#ecfdf5"/>
<text x="987" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Internal service, credential injected</text>
<text x="987" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">metrics API over TLS the gateway terminates</text>
<rect x="975" y="280" width="380" height="60" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="975" y="280" width="380" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="976" y="298" width="378" height="12" fill="#ecfdf5"/>
<text x="987" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Tool gateway (session token)</text>
<text x="987" y="328" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">called from the sandbox through the gateway</text>
<path d="M775 160 L975 135" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<path d="M775 170 L975 225" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<path d="M775 180 L975 310" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="950" y="400" width="430" height="110" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="950" y="400" width="430" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="951" y="418" width="428" height="12" fill="#fffbeb"/>
<text x="962" y="420" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Ceiling behind the gateway</text>
<text x="962" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">The gateway's own network policy names 3 domains.</text>
<text x="962" y="465" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">A session allowlist that names anything else is</text>
<text x="962" y="482" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">refused by the network, not by the gateway (S06).</text>
<rect x="950" y="540" width="430" height="90" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="950" y="540" width="430" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="951" y="558" width="428" height="12" fill="#fffbeb"/>
<text x="962" y="560" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Ingress into a sandbox</text>
<text x="962" y="588" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Only the router's pods, only ports 8080 and 9090.</text>
<text x="962" y="605" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Not even the trusted orchestrator can connect (S05).</text></svg>
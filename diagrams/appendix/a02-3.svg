<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="700px" viewBox="0 0 1420 700" style="background:#ffffff"><title>Every network path out of a sandbox</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="700" fill="#ffffff"/><rect x="40" y="60" width="380" height="580" rx="14" fill="#fef2f2" fill-opacity=".55" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="54" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#991b1b">UNTRUSTED</text>
<rect x="70" y="100" width="320" height="190" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="70" y="100" width="320" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="71" y="118" width="318" height="12" fill="#fef2f2"/>
<text x="82" y="120" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Code inside a sandbox</text>
<text x="82" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">own kernel (microVM)</text>
<text x="82" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">HTTPS_PROXY = the gateway's fixed address</text>
<text x="82" y="182" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">no DNS, no service-account token</text>
<text x="82" y="199" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">env: METRICS_API_KEY=placeholder</text>
<rect x="500" y="60" width="300" height="210" rx="14" fill="#eff6ff" fill-opacity=".55" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="514" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#1e40af">THE ONE WAY OUT</text>
<rect x="525" y="100" width="250" height="140" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="525" y="100" width="250" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="526" y="118" width="248" height="12" fill="#eff6ff"/>
<text x="537" y="120" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Egress gateway</text>
<text x="537" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">1. who owns this source address?</text>
<text x="537" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">2. is the host on that session's list?</text>
<text x="537" y="182" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">3. rate and byte limits</text>
<text x="537" y="199" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">4. inject credential, or pass through</text>
<path d="M390 170 L525 170" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="413.7" y="149" width="88.60000000000001" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="458" y="161" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669">TCP 3128 only</text>
<text x="60" y="316" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Seven attempts that must fail</text>
<path d="M390 270 L430 340" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-bad)"/>
<circle cx="448" cy="340" r="9" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M444 336 L452 344 M452 336 L444 344" stroke="#dc2626" stroke-width="2.2"/>
<rect x="480" y="320" width="330" height="40" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>

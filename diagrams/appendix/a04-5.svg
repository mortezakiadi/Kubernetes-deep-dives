<text x="690" y="45" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669">best replica -&gt;</text>
<rect x="1150" y="20" width="250" height="160" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1150" y="20" width="250" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1151" y="38" width="248" height="12" fill="#f8fafc"/>
<text x="1162" y="40" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Metrics (Prometheus)</text>
<text x="1162" y="68" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">each replica: requests waiting,</text>
<text x="1162" y="85" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">KV cache, prefix hits, TTFT</text>
<text x="1162" y="102" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">scraped every 10 s</text>
<path d="M1100 55 L1150 55" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="1150" y="260" width="250" height="130" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="1150" y="260" width="250" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="1151" y="278" width="248" height="12" fill="#fffbeb"/>
<text x="1162" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">KEDA</text>
<text x="1162" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">query: sum(requests waiting)</text>
<text x="1162" y="325" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">threshold 4 per replica</text>
<text x="1162" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">min 1, max 2 replicas</text>
<path d="M1275 180 L1275 260" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="1236.9" y="214" width="76.2" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="1275" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">waiting &gt; 4</text>
<path d="M1150 330 L975 330 L975 180" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="1028.1" y="312" width="63.800000000000004" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="1060" y="324" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">scale out</text>
<rect x="20" y="260" width="250" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="20" y="260" width="250" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="21" y="278" width="248" height="12" fill="#f8fafc"/>
<text x="32" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Registry (S3)</text>
<text x="32" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">v1 v2 v3: immutable</text>
<text x="32" y="325" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pointers: production -&gt; v2</text>
<text x="32" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">audit trail of every decision</text>
<rect x="330" y="260" width="250" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="330" y="260" width="250" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="331" y="278" width="248" height="12" fill="#eff6ff"/>
<text x="342" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Init container</text>
<text x="342" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reads the production pointer</text>
<text x="342" y="325" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">copies that version only</text>
<text x="342" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(weights stay off the image)</text>
<path d="M270 320 L330 320" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M580 320 L820 320 L820 160 L850 160" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="674.3" y="302" width="51.4" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="700" y="314" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">weights</text>
<rect x="20" y="430" width="250" height="150" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="20" y="430" width="250" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="21" y="448" width="248" height="12" fill="#fffbeb"/>
<text x="32" y="450" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Evaluation gate</text>
<text x="32" y="478" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">same 30 questions for each version</text>
<text x="32" y="495" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">quality, throughput, checksum</text>
<text x="32" y="512" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">approve or refuse, with reasons</text>
<path d="M145 430 L145 380" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="164.3" y="399" width="51.4" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="190" y="411" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">promote</text>
<rect x="330" y="430" width="1070" height="150" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="330" y="430" width="1070" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="331" y="448" width="1068" height="12" fill="#fef2f2"/>
<text x="342" y="450" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">A new replica: where the time goes (S08 measures each part)</text>
<text x="342" y="478" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">1  a GPU node is bought, if none is free (capacity is not guaranteed)</text>
<text x="342" y="495" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">2  the 10 GB serving image is pulled, the first time on that node</text>
<text x="342" y="512" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">3  the init container fetches the promoted weights from S3</text>
<text x="342" y="529" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">4  vLLM loads the model and becomes ready</text>
<text x="342" y="546" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">A warm buffer node (a low-priority placeholder holding a GPU and the image) removes steps 1 and 2.</text></svg>
<rect x="250" y="60" width="210" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="250" y="60" width="210" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="251" y="78" width="208" height="12" fill="#eff6ff"/>
<text x="262" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Gateway</text>
<text x="262" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">agentgateway, ClusterIP</text>
<text x="262" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">HTTPRoute -&gt; InferencePool</text>
<rect x="520" y="60" width="260" height="80" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="520" y="60" width="260" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="521" y="78" width="258" height="12" fill="#fffbeb"/>
<text x="532" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Endpoint picker (EPP)</text>
<text x="532" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">scores: queue 2, KV cache 2,</text>
<text x="532" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">prefix-cache match 3</text>
<rect x="850" y="20" width="250" height="70" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="850" y="20" width="250" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="851" y="38" width="248" height="12" fill="#fef2f2"/>

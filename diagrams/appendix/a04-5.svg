<text x="862" y="68" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">prefix cache, 1 GPU</text>
<rect x="850" y="110" width="250" height="70" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="850" y="110" width="250" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="851" y="128" width="248" height="12" fill="#fef2f2"/>
<text x="862" y="130" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">vLLM replica B</text>
<text x="862" y="158" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">prefix cache, 1 GPU</text>

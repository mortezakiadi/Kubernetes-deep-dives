<svg xmlns="http://www.w3.org/2000/svg" width="1260px" height="640px" viewBox="0 0 1260 640" style="background:#ffffff"><title>Troubleshooting a Pending pod</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1260" height="640" fill="#ffffff"/><text x="630" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">A pod is Pending: five checks, in order</text>
<rect x="40" y="60" width="330" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="205.0" y="111.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Right schedulerName?</text>
<circle cx="40" cy="60" r="12" fill="#2563eb"/>
<text x="40" y="64.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">1</text>
<rect x="400" y="60" width="470" height="92" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="412" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Check</text>
<text x="412" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">kubectl get pod -o jsonpath='{.spec.schedulerName}'</text>
<rect x="900" y="60" width="320" height="92" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="912" y="82" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">If it fails</text>
<text x="912" y="104" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">Typo → no scheduler will ever pick it up</text>
<path d="M 205 152 L 205 172" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<path d="M 370 106 L 400 106" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 870 106 L 900 106" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="40" y="172" width="330" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="205.0" y="223.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Scheduler running and leading?</text>
<circle cx="40" cy="172" r="12" fill="#2563eb"/>
<text x="40" y="176.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">2</text>
<rect x="400" y="172" width="470" height="92" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="412" y="194" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Check</text>
<text x="412" y="216" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">get pods -l component=my-scheduler; get lease affinity-first-scheduler</text>
<rect x="900" y="172" width="320" height="92" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="912" y="194" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">If it fails</text>
<text x="912" y="216" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">No lease holder → fix the lease Role</text>
<path d="M 205 264 L 205 284" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<path d="M 370 218 L 400 218" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 870 218 L 900 218" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="40" y="284" width="330" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="205.0" y="335.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Any events on the pod?</text>
<circle cx="40" cy="284" r="12" fill="#2563eb"/>
<text x="40" y="288.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">3</text>
<rect x="400" y="284" width="470" height="92" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="412" y="306" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Check</text>
<text x="412" y="328" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">kubectl describe pod</text>
<rect x="900" y="284" width="320" height="92" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="912" y="306" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">If it fails</text>
<text x="912" y="328" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">None → nobody looked at it. FailedScheduling →</text>
<text x="912" y="342" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">read why nothing fit</text>
<path d="M 205 376 L 205 396" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<path d="M 370 330 L 400 330" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 870 330 L 900 330" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="40" y="396" width="330" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="205.0" y="447.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Is autoscaling reacting?</text>
<circle cx="40" cy="396" r="12" fill="#2563eb"/>
<text x="40" y="400.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">4</text>
<rect x="400" y="396" width="470" height="92" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="412" y="418" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Check</text>
<text x="412" y="440" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">Karpenter logs, kubectl get nodeclaims</text>
<rect x="900" y="396" width="320" height="92" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="912" y="418" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">If it fails</text>
<text x="912" y="440" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">No NodeClaim → no NodePool matches the pod's</text>
<text x="912" y="454" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">constraints</text>
<path d="M 205 488 L 205 508" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<path d="M 370 442 L 400 442" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 870 442 L 900 442" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="40" y="508" width="330" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="205.0" y="559.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Placed by the right scheduler?</text>
<circle cx="40" cy="508" r="12" fill="#2563eb"/>
<text x="40" y="512.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">5</text>
<rect x="400" y="508" width="470" height="92" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="412" y="530" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Check</text>
<text x="412" y="552" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">get events --field-selector reason=Scheduled</text>
<rect x="900" y="508" width="320" height="92" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="912" y="530" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">What it tells you</text>
<text x="912" y="552" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155">Shows which scheduler bound each pod</text>
<path d="M 370 554 L 400 554" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M 870 554 L 900 554" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/></svg>

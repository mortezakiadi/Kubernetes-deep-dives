<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="470px" viewBox="0 0 1420 470" style="background:#ffffff"><title>One asynchronous step: what overlaps and what does not</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="470" fill="#ffffff"/><text x="40" y="40" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Rollout worker (inside the trainer pod) streams groups of answers from the fleet into a queue; the trainer takes four groups a step.</text>
<text x="40" y="120" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">rollout fleet (2 GPUs)</text>
<line x1="220" y1="128" x2="1380" y2="128" stroke="#e2e8f0"/>
<text x="40" y="190" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">queue</text>
<line x1="220" y1="198" x2="1380" y2="198" stroke="#e2e8f0"/>
<text x="40" y="260" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">trainer (1 GPU)</text>
<line x1="220" y1="268" x2="1380" y2="268" stroke="#e2e8f0"/>
<text x="40" y="330" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">network</text>
<line x1="220" y1="338" x2="1380" y2="338" stroke="#e2e8f0"/>
<rect x="220.0" y="100" width="285.0" height="26" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="226.0" y="117" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1e40af">generating answers (step n+1, n+2 ...)</text>
<rect x="505.0" y="100" width="300.0" height="26" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="511.0" y="117" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#991b1b">PAUSED for the weight load</text>
<rect x="805.0" y="100" width="495.00000000000006" height="26" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="811.0" y="117" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1e40af">generating (now with the new weights)</text>
<rect x="220.0" y="170" width="1080.0" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<text x="226.0" y="187" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">samples wait here; each is stamped with the policy version that made it</text>
<rect x="220.0" y="240" width="240.0" height="26" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="226.0" y="257" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#065f46">backward (1.5 s)</text>
<rect x="460.0" y="240" width="52.49999999999998" height="26" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="466.0" y="257" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#065f46">log-probs</text>
<rect x="512.5" y="240" width="292.5" height="26" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="518.5" y="257" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#991b1b">send weights (2.0 s)</text>
<rect x="805.0" y="240" width="240.0" height="26" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="811.0" y="257" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#065f46">backward</text>
<rect x="1045.0" y="240" width="52.49999999999994" height="26" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="1051.0" y="257" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#065f46">log-probs</text>
<rect x="512.5" y="310" width="292.5" height="26" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="518.5" y="327" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#92400e">NCCL broadcast, 1.2 GB x2 engines</text>
<text x="40" y="400" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">From S03: the trainer's own timers give about 2.0 s sending weights against 1.5 s of backward and 0.4 s of log-probabilities.</text>
<text x="40" y="420" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">While the weights load, the rollout engines generate nothing: on this network the push is half of every step. A push every fourth step, or a faster network, is the lever.</text>
<text x="40" y="440" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">The cost of pushing less often is that samples are older when the trainer uses them: the staleness bound drops the oldest.</text></svg>
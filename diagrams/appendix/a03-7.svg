<text x="562" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Kueue manager + MultiKueue</text>
<text x="562" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">layer 1: fleet quota</text>
<text x="562" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">offers jobs to workers</text>
<text x="562" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">mirrors status back</text>

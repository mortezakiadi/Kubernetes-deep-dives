<text x="842" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one Secret per worker</text>
<text x="842" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">narrow identity: Jobs, pods,</text>
<text x="842" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Kueue objects only</text>
<rect x="550" y="210" width="250" height="100" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="550" y="210" width="250" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>

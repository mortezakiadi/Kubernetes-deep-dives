<text x="282" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Hub API server + guard</text>
<text x="282" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">admission policy refuses pods</text>
<text x="282" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Kueue holds every Job until</text>
<text x="282" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">its turn</text>

<text x="562" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">llm, vision, research x CPU, GPU</text>
<text x="562" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">each = the sum of that team's</text>
<text x="562" y="292" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">share across the workers</text>
<rect x="830" y="210" width="250" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>

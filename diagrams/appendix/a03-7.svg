<text x="32" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">kubectl against the hub</text>
<text x="32" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a namespace per team in</text>
<text x="32" y="182" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">every cluster</text>
<rect x="250" y="30" width="1130" height="310" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="264" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">HUB CLUSTER (runs no user pods)</text>

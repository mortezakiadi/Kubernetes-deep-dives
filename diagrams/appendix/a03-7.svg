<text x="842" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one table of shares</text>
<text x="842" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">generates every queue on the</text>
<text x="842" y="292" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">hub and on every worker</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="600px" viewBox="0 0 1420 600" style="background:#ffffff"><title>Architecture: from a request to a token, and from a metric to a replica</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="600" fill="#ffffff"/><rect x="20" y="30" width="1380" height="540" rx="14" fill="#eff6ff" fill-opacity=".55" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#1e40af">NAMESPACE serving</text>
<rect x="50" y="80" width="240" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="50" y="80" width="240" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="51" y="98" width="238" height="12" fill="#f8fafc"/>
<text x="62" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Load generator (Job)</text>
<text x="62" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">open loop: sends requests when</text>
<text x="62" y="145" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the trace says, whether or not</text>
<text x="62" y="162" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the server keeps up; records TTFT</text>
<text x="62" y="179" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">and the gap between tokens</text>
<circle cx="286" cy="84" r="12" fill="#1e293b"/><text x="286" y="88.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">1</text>
<rect x="340" y="80" width="240" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="340" y="80" width="240" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="341" y="98" width="238" height="12" fill="#eff6ff"/>
<text x="352" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Router (Deployment)</text>
<text x="352" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">policy: rr | least | prefix | pd</text>
<text x="352" y="145" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(and re-reads a headless Service</text>
<text x="352" y="162" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">so new replicas get traffic)</text>
<circle cx="576" cy="84" r="12" fill="#1e293b"/><text x="576" y="88.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">2</text>
<rect x="660" y="70" width="330" height="140" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="660" y="70" width="330" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="661" y="88" width="328" height="12" fill="#eff6ff"/>
<text x="672" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Servers: one Deployment each</text>
<text x="672" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">vLLM, OpenAI-compatible API, Triton attention</text>
<text x="672" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">TP1, TP2, TP4, or four DP engines with EP</text>
<text x="672" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">prefix cache; optional host KV tier</text>
<text x="672" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">optional NIXL connector for P/D</text>
<circle cx="986" cy="74" r="12" fill="#1e293b"/><text x="986" y="78.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">3</text>
<rect x="1050" y="80" width="320" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1050" y="80" width="320" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1051" y="98" width="318" height="12" fill="#f8fafc"/>
<text x="1062" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">S3 state bucket</text>
<text x="1062" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">each load run writes its per-request</text>
<text x="1062" y="145" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">records; the tests read them back</text>
<text x="1062" y="162" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(nothing is judged from memory)</text>
<circle cx="1366" cy="84" r="12" fill="#1e293b"/><text x="1366" y="88.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">4</text>
<path d="M290 140 L340 140" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="289.3" y="123.0" width="51.4" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="315.0" y="135.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">request</text>
<path d="M580 140 L660 140" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="597.4" y="123.0" width="45.2" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="620.0" y="135.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">stream</text>
<path d="M1050 140 L990 140" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-flow)"/>
<rect x="660" y="260" width="330" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="660" y="260" width="330" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="661" y="278" width="328" height="12" fill="#fffbeb"/>
<text x="672" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Prefill server  -&gt;  Decode server</text>
<text x="672" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the prompt is computed once on one GPU;</text>
<text x="672" y="325" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">its KV cache is copied over PCIe by NIXL</text>
<text x="672" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">and the other GPU produces the tokens</text>
<circle cx="986" cy="264" r="12" fill="#1e293b"/><text x="986" y="268.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">5</text>
<path d="M825 210 L825 260" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-blue)"/>
<rect x="50" y="330" width="330" height="130" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="50" y="330" width="330" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="51" y="348" width="328" height="12" fill="#fffbeb"/>
<text x="62" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Prometheus</text>
<text x="62" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">scrapes every server's /metrics and the</text>
<text x="62" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">GPU exporter every 5 s: requests waiting,</text>
<text x="62" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">running, KV usage, GPU utilisation</text>
<circle cx="376" cy="334" r="12" fill="#1e293b"/><text x="376" y="338.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">6</text>
<rect x="430" y="330" width="180" height="130" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="430" y="330" width="180" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="431" y="348" width="178" height="12" fill="#fffbeb"/>
<text x="442" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">KEDA</text>
<text x="442" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">query / threshold</text>
<text x="442" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">-&gt; replica count</text>
<circle cx="606" cy="334" r="12" fill="#1e293b"/><text x="606" y="338.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">7</text>
<path d="M380 395 L430 395" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="385.5" y="378.0" width="39.0" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="405.0" y="390.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">query</text>
<path d="M520 330 L520 235 L700 235 L700 210" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="552.6" y="224" width="94.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="600" y="236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">scale replicas</text>
<rect x="1050" y="260" width="320" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1050" y="260" width="320" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1051" y="278" width="318" height="12" fill="#f8fafc"/>
<text x="1062" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Probe pod</text>
<text x="1062" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">runs commands inside the engine image:</text>
<text x="1062" y="325" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">flags, defaults, the GPU topology,</text>
<text x="1062" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the accuracy questions' prompts</text>
<circle cx="1366" cy="264" r="12" fill="#1e293b"/><text x="1366" y="268.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">8</text>
<text x="50" y="520" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">Everything is created and removed by Terraform and by the tests; nothing runs outside the cluster except the commands that drive it.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="560px" viewBox="0 0 1420 560" style="background:#ffffff"><title>Who uses the network and what it connects</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="560" fill="#ffffff"/><rect x="20" y="30" width="270" height="500" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">WHO</text>
<rect x="40" y="70" width="230" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="70" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="88" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Network team</text>
<text x="52" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">owns addresses, the core</text>
<text x="52" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">network and the policy that</text>
<text x="52" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">says who may talk to whom</text>
<rect x="40" y="200" width="230" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="200" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="218" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Platform team</text>
<text x="52" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">owns the clusters, the pod</text>
<text x="52" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">network, DNS and the load</text>
<text x="52" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">balancers</text>
<rect x="40" y="330" width="230" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="330" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="348" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Application teams</text>
<text x="52" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">publish a service, name it,</text>
<text x="52" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">say who may call it; never</text>
<text x="52" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">write an IP address</text>
<rect x="320" y="30" width="700" height="500" rx="14" fill="#fffbeb" fill-opacity=".55" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="334" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#92400e">WHAT THE NETWORK CONNECTS (ONE POLICY, TWO REGIONS)</text>
<rect x="340" y="70" width="320" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="340" y="70" width="320" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="341" y="88" width="318" height="12" fill="#eff6ff"/>
<text x="352" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Production clusters</text>
<text x="352" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">EKS in us-east-1 and eu-west-1</text>
<text x="352" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pods on their own range,</text>
<text x="352" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">internal load balancers</text>
<rect x="680" y="70" width="320" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="680" y="70" width="320" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="681" y="88" width="318" height="12" fill="#eff6ff"/>
<text x="692" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Shared services</text>
<text x="692" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">registry and DNS endpoints</text>
<text x="692" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reachable from prod, non-prod</text>
<text x="692" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">and the data center</text>
<rect x="340" y="190" width="320" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="340" y="190" width="320" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="341" y="208" width="318" height="12" fill="#eff6ff"/>
<text x="352" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Non-production</text>
<text x="352" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">development and test VPCs</text>
<text x="352" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">can reach shared services,</text>
<text x="352" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">never production</text>
<rect x="680" y="190" width="320" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="680" y="190" width="320" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="681" y="208" width="318" height="12" fill="#eff6ff"/>
<text x="692" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Data center (stand-in)</text>
<text x="692" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a VPC with its own DNS</text>
<text x="692" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">server: the on-premises racks</text>
<text x="692" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">of the design</text>
<rect x="340" y="310" width="320" height="100" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="340" y="310" width="320" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="341" y="328" width="318" height="12" fill="#fef2f2"/>
<text x="352" y="330" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Sandbox</text>
<text x="352" y="358" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">can reach nothing and be</text>
<text x="352" y="375" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reached by nothing</text>
<rect x="680" y="310" width="320" height="100" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="680" y="310" width="320" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="681" y="328" width="318" height="12" fill="#fef2f2"/>
<text x="692" y="330" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Legacy VPC</text>
<text x="692" y="358" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reuses an address range of</text>
<text x="692" y="375" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">production; not on the core</text>
<text x="692" y="392" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">network at all</text>
<rect x="340" y="430" width="660" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="340" y="430" width="660" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="341" y="448" width="658" height="12" fill="#f8fafc"/>
<text x="352" y="450" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">The core network, IPAM and the policy are code in Git</text>
<text x="352" y="478" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a change is a pull request, a preview and an apply; a rollback is a revert</text>
<rect x="1050" y="30" width="350" height="500" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="1064" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#334155">WHAT IT IS NOT</text>
<rect x="1070" y="70" width="310" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="1070" y="70" width="310" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1071" y="88" width="308" height="12" fill="#f8fafc"/>
<text x="1082" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Not built here</text>
<text x="1082" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a second cloud and its private</text>
<text x="1082" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">interconnect, Direct Connect,</text>
<text x="1082" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">hybrid nodes, a service mesh,</text>
<text x="1082" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">firewall inspection</text>
<rect x="1070" y="230" width="310" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="1070" y="230" width="310" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="1071" y="248" width="308" height="12" fill="#fffbeb"/>
<text x="1082" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Built as stand-ins</text>
<text x="1082" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the data center is a VPC with</text>
<text x="1082" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">an EC2 host that runs a DNS</text>
<text x="1082" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">server</text>
<text x="1082" y="329" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the legacy VPC is a plain VPC</text>
<path d="M270 125 L320 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M270 255 L320 255" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M270 390 L320 390" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="440px" viewBox="0 0 1420 440" style="background:#ffffff"><title>The scaling ladder as built</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="440" fill="#ffffff"/><rect x="40" y="70" width="300" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="40" y="70" width="300" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="41" y="88" width="298" height="12" fill="#eff6ff"/>
<text x="52" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Rung 1: recipe</text>
<text x="52" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">0.6B model, short answers,</text>
<text x="52" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">80 steps, three recipes</text>
<text x="52" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">fit the compute-performance curve</text>
<rect x="380" y="70" width="300" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="380" y="70" width="300" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="381" y="88" width="298" height="12" fill="#eff6ff"/>
<text x="392" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Rung 2: length</text>
<text x="392" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">same model and recipe,</text>
<text x="392" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">answers up to 3072 tokens</text>
<text x="392" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">thinking mode; the tail grows</text>
<rect x="720" y="70" width="300" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="720" y="70" width="300" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="721" y="88" width="298" height="12" fill="#f8fafc"/>
<text x="732" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Rung 3: model size</text>
<text x="732" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">1.7B in the overlay; not trained</text>
<text x="732" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">here (24 GB trainer GPU).</text>
<text x="732" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">S05 measures what it exposes first</text>
<rect x="1060" y="70" width="300" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1060" y="70" width="300" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1061" y="88" width="298" height="12" fill="#f8fafc"/>
<text x="1072" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Production run</text>
<text x="1072" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the design's full budget:</text>
<text x="1072" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">not reachable here; the</text>
<text x="1072" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">forecast comes from rung 4</text>
<path d="M340 130 L380 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="343.6" y="101" width="32.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="360.0" y="113" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">gate</text>
<path d="M680 130 L720 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="683.6" y="101" width="32.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="700.0" y="113" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">gate</text>
<path d="M1020 130 L1060 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="1023.6" y="101" width="32.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="1040.0" y="113" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">gate</text>
<rect x="40" y="230" width="640" height="150" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="40" y="230" width="640" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="41" y="248" width="638" height="12" fill="#fffbeb"/>
<text x="52" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">The gate (ladder.py): three criteria, each from a measurement</text>
<text x="52" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">fitted ceiling known to within 0.03 (S02)</text>
<text x="52" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">unexplained waiting under 10% of the step (S03)</text>
<text x="52" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a restart from a checkpoint has been done (S09)</text>
<text x="52" y="329" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">all three, or the rung is held</text>
<rect x="720" y="230" width="640" height="150" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="720" y="230" width="640" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="721" y="248" width="638" height="12" fill="#f8fafc"/>
<text x="732" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">One axis per rung (overlay files)</text>
<text x="732" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">recipes/ladder/rung2-length.yaml extends rung 1 and may set only</text>
<text x="732" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">MAX_COMPLETION and THINKING. An overlay that also changes the model</text>
<text x="732" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">is refused before anything is scheduled (S10).</text>
<text x="732" y="329" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Each overlay carries its own GPU-hour budget.</text></svg>
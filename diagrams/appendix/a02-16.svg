<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="560px" viewBox="0 0 1420 560" style="background:#ffffff"><title>Audit and boundary monitoring: three sources, one append-only bucket</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="560" fill="#ffffff"/><rect x="20" y="20" width="330" height="400" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="44" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#334155">SOURCES</text>
<rect x="40" y="60" width="290" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="40" y="60" width="290" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="41" y="78" width="288" height="12" fill="#f8fafc"/>
<text x="52" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Platform pod logs</text>
<text x="52" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">JSON lines with session_id:</text>
<text x="52" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Manager, gateways, router</text>
<rect x="40" y="180" width="290" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="40" y="180" width="290" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="41" y="198" width="288" height="12" fill="#f8fafc"/>
<text x="52" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">VPC flow logs</text>
<text x="52" y="228" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">every connection of the</text>
<text x="52" y="245" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">sandbox subnets: who, where,</text>
<text x="52" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">how many bytes, allowed or not</text>
<rect x="40" y="300" width="290" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="40" y="300" width="290" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="41" y="318" width="288" height="12" fill="#f8fafc"/>
<text x="52" y="320" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">DNS query logs</text>
<text x="52" y="348" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">every name a pod in the</text>
<text x="52" y="365" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">VPC asked to resolve</text>
<rect x="400" y="20" width="300" height="400" rx="14" fill="#eff6ff" fill-opacity=".55" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="414" y="44" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#1e40af">CLOUDWATCH LOGS</text>
<rect x="420" y="60" width="260" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="420" y="60" width="260" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="421" y="78" width="258" height="12" fill="#eff6ff"/>
<text x="432" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">platform log group</text>
<text x="432" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">subscription filter:</text>
<text x="432" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">"session_id" only</text>
<path d="M330 110 L420 110" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="420" y="180" width="260" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="420" y="180" width="260" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="421" y="198" width="258" height="12" fill="#eff6ff"/>
<text x="432" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">flow log group</text>
<text x="432" y="228" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">subscription filter:</text>
<text x="432" y="245" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">everything</text>
<path d="M330 230 L420 230" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="420" y="300" width="260" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="420" y="300" width="260" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="421" y="318" width="258" height="12" fill="#eff6ff"/>
<text x="432" y="320" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">resolver log group</text>
<text x="432" y="348" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">subscription filter:</text>
<text x="432" y="365" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">everything</text>
<path d="M330 350 L420 350" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="750" y="150" width="220" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="750" y="150" width="220" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="751" y="168" width="218" height="12" fill="#fffbeb"/>
<text x="762" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Kinesis Firehose</text>
<text x="762" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">batches, then writes</text>
<text x="762" y="215" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">to S3 under a</text>
<text x="762" y="232" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">date prefix</text>
<path d="M680 110 L750 165" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M680 230 L750 190" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M680 350 L750 215" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="1020" y="60" width="380" height="360" rx="14" fill="#fef2f2" fill-opacity=".55" stroke="#dc2626" stroke-width="1.5"/>
<text x="1036" y="84" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">S3 BUCKET, OBJECT LOCK (COMPLIANCE)</text>
<text x="1036" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">versioning on, retention 365 days (a variable)</text>
<text x="1036" y="138" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">nobody, including the account root user, can</text>
<text x="1036" y="160" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">delete or overwrite a version before then</text>
<text x="1036" y="182" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">new versions and delete markers are still allowed,</text>
<text x="1036" y="204" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">but they do not remove the locked version</text>
<text x="1036" y="226" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">encrypted with a customer-managed KMS key</text>
<path d="M970 210 L1020 210" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="20" y="450" width="1380" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="36" y="476" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">What this sees: every connection and every lookup at the boundary of the sandbox subnets, and every line the platform logs about a session.</text>
<text x="36" y="498" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">What it does not see: anything that happens inside the microVM. That limit is the same as in the deployed design (section 6).</text>
<text x="36" y="520" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">Terraform validated; nothing was applied, so no log line has travelled this path.</text></svg>
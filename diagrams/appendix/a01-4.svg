<rect x="593.12" y="201" width="63.760000000000005" height="36" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="625" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">blocked</text>
<text x="625" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">by taint</text>
<rect x="40" y="440" width="560" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="52" y="463" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Karpenter NodePool: services</text>
<text x="52" y="486" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">On-demand, gentle consolidation</text>
<rect x="660" y="440" width="560" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="672" y="463" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Karpenter NodePool: batch</text>
<text x="672" y="486" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Spot + on-demand, consolidateAfter: 2m, label and taint workload-class=batch</text>

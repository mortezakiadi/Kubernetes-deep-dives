<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="560px" viewBox="0 0 1420 560" style="background:#ffffff"><title>One VPC in us-east-2: a system node group, a small real-GPU node group, and a simulated fleet</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs><rect width="1420" height="560" fill="#ffffff"/><rect x="20" y="20" width="1380" height="520" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="44" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#334155">AWS ACCOUNT, us-east-2, ONE VPC 10.86.0.0/16 (three zones, private subnets, one NAT gateway)</text>
<rect x="50" y="70" width="380" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="50" y="70" width="380" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="51" y="88" width="378" height="12" fill="#eff6ff"/>
<text x="62" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Standard EKS cluster ds17-sched</text>
<text x="62" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Kubernetes 1.37, managed node groups</text>
<text x="62" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">add-ons: VPC CNI, kube-proxy, Pod Identity,</text>
<text x="62" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">CoreDNS, metrics-server</text>
<rect x="50" y="210" width="380" height="140" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="50" y="210" width="380" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="51" y="228" width="378" height="12" fill="#ecfdf5"/>
<text x="62" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Node group ds17-sched-system</text>
<text x="62" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">2 x m6i.2xlarge, on demand</text>
<text x="62" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Kueue, the second scheduler, KWOK,</text>
<text x="62" y="292" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the accounting service, CoreDNS</text>
<rect x="50" y="370" width="380" height="140" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="50" y="370" width="380" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="51" y="388" width="378" height="12" fill="#fffbeb"/>
<text x="62" y="390" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Node group ds17-sched-gpu</text>
<text x="62" y="418" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">2 nodes, one GPU each, on demand</text>
<text x="62" y="435" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pinned AL2023 NVIDIA AMI</text>
<text x="62" y="452" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">device plugin, DCGM exporter</text>
<rect x="470" y="70" width="440" height="440" rx="14" fill="#f5f3ff" fill-opacity=".55" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="7 5"/>

<text x="826" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">5 Gold labels</text>
<text x="826" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">agreed or settled only;</text>
<text x="826" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">never guessed</text>
<path d="M992 115 L1010 115" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>

<rect x="227" y="78" width="176" height="12" fill="#ecfdf5"/>
<text x="238" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">2 Two reviewers</text>
<text x="238" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">labels with a checklist</text>
<text x="238" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(assumed inputs, S11)</text>

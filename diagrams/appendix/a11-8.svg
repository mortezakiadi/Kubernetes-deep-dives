<text x="1022" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5b21b6">6 New version</text>
<text x="1022" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">2.1.0 implements the</text>
<text x="1022" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">decision; gate with labels</text>
<path d="M1188 115 L1206 115" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="1206" y="60" width="178" height="110" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>

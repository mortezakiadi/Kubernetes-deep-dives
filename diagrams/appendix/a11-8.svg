<text x="630" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">4 Owner decides</text>
<text x="630" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">accept or exclude a shape</text>
<text x="630" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(assumed input)</text>
<path d="M796 115 L814 115" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>

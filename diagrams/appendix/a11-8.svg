<rect x="423" y="78" width="176" height="12" fill="#eff6ff"/>
<text x="434" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">3 Agreement</text>
<text x="434" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">per answer shape, kappa;</text>
<text x="434" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">&lt; 0.8 = unclear contract</text>
<path d="M600 115 L618 115" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>

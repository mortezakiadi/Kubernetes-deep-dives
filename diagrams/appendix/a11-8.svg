<rect x="1207" y="78" width="176" height="12" fill="#fef2f2"/>
<text x="1218" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">7 Re-score</text>
<text x="1218" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">stored rollouts with 2.1.0:</text>
<text x="1218" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">abstain to pass, never</text>
<text x="1218" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">fail to pass</text>
<path d="M903 170 L903 250 L1110 250 L1110 170" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="890.4" y="233" width="231.20000000000002" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="1006" y="245" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">confirmed exploits: regression cases</text>
<rect x="30" y="290" width="1360" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="30" y="290" width="1360" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="31" y="308" width="1358" height="12" fill="#f8fafc"/>
<text x="42" y="310" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">What is assumed and what is not</text>
<text x="42" y="338" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Assumed: the two reviewers' labels and the owner's decisions (tests/assumed_reviewers.py), written before the run and marked assumed in every file.</text>
<text x="42" y="355" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Not assumed: the queues, the agreement figures, the gold set, the regression cases, the verifiers' verdicts, the gate and the re-scoring.</text></svg>
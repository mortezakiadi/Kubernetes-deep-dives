<rect x="937.4" y="190" width="45.2" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="960" y="202" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">images</text></svg>
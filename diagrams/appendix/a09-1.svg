<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="560px" viewBox="0 0 1420 560" style="background:#ffffff"><title>Who uses the platform, what it is made of, and what it talks to</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs><rect width="1420" height="560" fill="#ffffff"/><rect x="20" y="30" width="270" height="500" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">WHO</text>
<rect x="40" y="70" width="230" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="70" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="88" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Researcher</text>
<text x="52" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">runs rollouts, credit and</text>
<text x="52" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">curricula with lh.py; reads</text>
<text x="52" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">trajectories and metrics</text>
<rect x="40" y="210" width="230" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="210" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="228" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Trainer (a job)</text>
<text x="52" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">recomputes log-probabilities</text>
<text x="52" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">on the stored context; one</text>
<text x="52" y="292" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">policy-gradient step</text>
<rect x="40" y="350" width="230" height="150" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="350" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="368" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="370" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Verifier owner</text>
<text x="52" y="398" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">keeps the hidden tests and</text>
<text x="52" y="415" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the checks; every reward</text>
<text x="52" y="432" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">carries a verifier version</text>
<rect x="320" y="30" width="760" height="500" rx="14" fill="#fffbeb" fill-opacity=".55" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="334" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#92400e">THE PLATFORM (standard EKS)</text>
<rect x="340" y="70" width="220" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="340" y="70" width="220" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="341" y="88" width="218" height="12" fill="#eff6ff"/>
<text x="352" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Environment fleet</text>
<text x="352" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one pod per episode group,</text>
<text x="352" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Kueue-admitted: primary</text>
<text x="352" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">rollouts and branches</text>
<rect x="590" y="70" width="220" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="590" y="70" width="220" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="591" y="88" width="218" height="12" fill="#fffbeb"/>
<text x="602" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Rollout engine</text>
<text x="602" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">vLLM serving the policy,</text>
<text x="602" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">per-token log-probabilities,</text>
<text x="602" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">prefix cache for branches</text>
<rect x="840" y="70" width="220" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="840" y="70" width="220" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="841" y="88" width="218" height="12" fill="#fef2f2"/>
<text x="852" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Verifier</text>
<text x="852" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">fresh environment, hidden</text>
<text x="852" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">tests, layered checks, the</text>
<text x="852" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">progress measure; no network</text>
<rect x="340" y="220" width="220" height="120" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="340" y="220" width="220" height="30" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="341" y="238" width="218" height="12" fill="#f5f3ff"/>
<text x="352" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5b21b6">Credit worker</text>
<text x="352" y="268" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">picks branch points, submits</text>
<text x="352" y="285" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">branch jobs, turns verified</text>
<text x="352" y="302" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">outcomes into values</text>
<rect x="590" y="220" width="470" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="590" y="220" width="470" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="591" y="238" width="468" height="12" fill="#f8fafc"/>
<text x="602" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Trajectory store</text>
<text x="602" y="268" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the only writer to the bucket for environments;</text>
<text x="602" y="285" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">trajectories, snapshots, per-turn contexts and</text>
<text x="602" y="302" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">log-probabilities, credit records, curricula</text>
<rect x="340" y="370" width="720" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="340" y="370" width="720" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="341" y="388" width="718" height="12" fill="#f8fafc"/>
<text x="352" y="390" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Snapshots</text>
<text x="352" y="418" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">tar snapshots of the working copy at branch points (through the store)</text>
<text x="352" y="435" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">and CSI VolumeSnapshots of EBS volumes (the design's YAML, measured in S03)</text>
<rect x="1110" y="30" width="290" height="500" rx="14" fill="#fef2f2" fill-opacity=".55" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="1124" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#991b1b">OUTSIDE THE PLATFORM</text>
<rect x="1130" y="70" width="250" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1130" y="70" width="250" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1131" y="88" width="248" height="12" fill="#f8fafc"/>
<text x="1142" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Hugging Face Hub</text>
<text x="1142" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Qwen2.5-7B-Instruct,</text>
<text x="1142" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pinned to a commit</text>
<rect x="1130" y="220" width="250" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1130" y="220" width="250" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1131" y="238" width="248" height="12" fill="#f8fafc"/>
<text x="1142" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Docker Hub, public ECR</text>
<text x="1142" y="268" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">vLLM 0.33.0 and Python 3.12</text>
<text x="1142" y="285" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">images, pinned by digest</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="640px" viewBox="0 0 1420 640" style="background:#ffffff"><title>One VPC in us-east-2, three zones, a system, a GPU and a gVisor sandbox node group</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs><rect width="1420" height="640" fill="#ffffff"/><rect x="20" y="20" width="1380" height="600" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="44" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#334155">AWS ACCOUNT, us-east-2, ONE VPC 10.82.0.0/16</text>
<rect x="50" y="70" width="340" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="50" y="70" width="340" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="51" y="88" width="338" height="12" fill="#eff6ff"/>
<text x="62" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Standard EKS cluster</text>
<text x="62" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ds10-verify, Kubernetes 1.37</text>
<text x="62" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">add-ons: VPC CNI (network policy on), CoreDNS,</text>
<text x="62" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">kube-proxy, Pod Identity, metrics-server</text>
<rect x="50" y="210" width="340" height="100" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="50" y="210" width="340" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="51" y="228" width="338" height="12" fill="#ecfdf5"/>
<text x="62" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Node group ds10-verify-system</text>
<text x="62" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">2 x m6i.2xlarge (8 vCPU, 32 GiB), on demand</text>
<text x="62" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">store, rule-based verifiers, quality jobs</text>
<rect x="50" y="330" width="340" height="130" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="50" y="330" width="340" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="51" y="348" width="338" height="12" fill="#fffbeb"/>
<text x="62" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Node group ds10-verify-gpu</text>
<text x="62" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">3 nodes, one GPU each, on demand</text>
<text x="62" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">g6e.xlarge, g6.2xlarge, g6e.2xlarge, g5.xlarge,</text>
<text x="62" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">g5.2xlarge or g6.xlarge; AL2023 NVIDIA AMI</text>
<text x="62" y="429" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">two judges and one RL run</text>
<rect x="50" y="480" width="340" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="50" y="480" width="340" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="51" y="498" width="338" height="12" fill="#fef2f2"/>
<text x="62" y="500" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Node group ds10-verify-sandbox</text>
<text x="62" y="528" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">1 x m6i.xlarge, tainted for sandbox pods</text>
<text x="62" y="545" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">launch template adds gVisor 20261116.0</text>
<text x="62" y="562" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(SHA-512 checked) and the runsc runtime</text>

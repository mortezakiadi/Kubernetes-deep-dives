<text x="432" y="428" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">data/  wheels/  registry/  runs/  fuzz/  evals/  rescore/  reviews/</text>
<text x="432" y="445" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">read and written only through the store service (Pod Identity); registry/ only by the operator</text>

<text x="432" y="548" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">rewards: no internet; may reach DNS, the store, the judges and its own namespace; called only from</text>
<text x="432" y="565" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">training, platform and rewards. judges: called only from rewards. API endpoint: the operator's addresses only</text></svg>
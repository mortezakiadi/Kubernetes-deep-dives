<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="470px" viewBox="0 0 1420 470" style="background:#ffffff"><title>Instances</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="470" fill="#ffffff"/><rect x="20" y="20" width="1380" height="430" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="40" y="55" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">instance</text>
<text x="290" y="55" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">count</text>
<text x="380" y="55" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">pool</text>
<text x="520" y="55" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">what runs on it</text>
<text x="920" y="55" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">size</text>
<text x="1210" y="55" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">price</text>
<line x1="30" y1="68" x2="1390" y2="68" stroke="#e2e8f0"/>
<text x="40" y="90" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">m5.xlarge</text>
<text x="290" y="90" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">2</text>
<text x="380" y="90" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">system pool</text>
<text x="520" y="90" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Kueue, Argo Workflows, device plugin, CoreDNS</text>
<text x="920" y="90" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">4 vCPU, 16 GiB</text>
<text x="1210" y="90" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">$0.19 / h each</text>
<line x1="30" y1="118" x2="1390" y2="118" stroke="#e2e8f0"/>
<text x="40" y="140" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">g6e.2xlarge</text>
<text x="290" y="140" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">up to 4</text>
<text x="380" y="140" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">research pool</text>
<text x="520" y="140" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">one run per node, one L40S (48 GB) each</text>
<text x="920" y="140" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">8 vCPU, 64 GiB, 200 GB disk</text>
<text x="1210" y="140" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">$2.24 / h each</text>
<line x1="30" y1="168" x2="1390" y2="168" stroke="#e2e8f0"/>
<text x="40" y="190" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">g6.2xlarge</text>
<text x="290" y="190" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">fallback</text>
<text x="380" y="190" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">research pool</text>
<text x="520" y="190" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">one NVIDIA L4 (24 GB) each; the same pool and taint</text>
<text x="920" y="190" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">8 vCPU, 32 GiB, 200 GB disk</text>
<text x="1210" y="190" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">$0.98 / h each</text>
<line x1="30" y1="218" x2="1390" y2="218" stroke="#e2e8f0"/>
<text x="40" y="240" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">g5.2xlarge, g5.4xlarge</text>
<text x="290" y="240" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">fallback</text>
<text x="380" y="240" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">research pool</text>
<text x="520" y="240" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">one A10G (24 GB); the pool lists all four types</text>
<text x="920" y="240" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">8 to 16 vCPU</text>
<text x="1210" y="240" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">$1.21 to $1.62 / h</text>
<line x1="30" y1="268" x2="1390" y2="268" stroke="#e2e8f0"/>
<text x="40" y="290" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">NAT gateway</text>
<text x="290" y="290" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">1</text>
<text x="380" y="290" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">network</text>
<text x="520" y="290" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">image pulls, model and dataset downloads</text>
<text x="920" y="290" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">one zone</text>
<text x="1210" y="290" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">$0.045 / h + data</text>
<line x1="30" y1="318" x2="1390" y2="318" stroke="#e2e8f0"/>
<text x="40" y="340" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">S3 bucket</text>
<text x="290" y="340" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">1</text>
<text x="380" y="340" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">state</text>
<text x="520" y="340" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">each run's metrics, and the specialists' and merged weights</text>
<text x="920" y="340" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">through the free gateway endpoint</text>
<text x="1210" y="340" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">storage only</text>
<text x="40" y="410" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">GPU capacity on demand is volatile: the pool starts empty and is scaled up, and lists four single-GPU types and three zones so that a node that cannot be launched as one type is launched as another.</text>
<text x="40" y="430" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">Every run lays out its memory the same way whatever the card: the sampling engine gets a fixed 8 GiB. Prices are on-demand list prices in us-east-1.</text></svg>
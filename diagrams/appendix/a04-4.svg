<text x="445.0" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb">2  Workload: 2 GPUs, all or nothing</text>
<text x="344" y="185" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#059669">quota for both? admit, else hold: no pods</text>

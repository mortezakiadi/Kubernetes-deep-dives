<rect x="338.7" y="207" width="212.6" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="445.0" y="219" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">3  admitted: unsuspend the JobSet</text>
<path d="M560 265 L1020 265" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="652.7" y="247" width="274.6" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="790.0" y="259" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">4  create both pods (same zone by affinity)</text>
<path d="M1020 305 L790 305" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="792.5" y="287" width="225.0" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="905.0" y="299" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb">5  pods unplaced: buy two GPU nodes</text>
<path d="M790 345 L1020 345" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="783.2" y="327" width="243.6" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="905.0" y="339" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">6  nodes join; burn-in, then NCCL init</text>
<path d="M1020 385 L1280 385" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="1031.3" y="367" width="237.4" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="1150.0" y="379" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669">7  async shard + marker every N steps</text>
<text x="1034" y="428" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#dc2626">node lost or rank hangs (watchdog) ...</text>
<path d="M1020 468 L560 468" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a-bad)"/>
<rect x="680.6" y="450" width="218.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="790.0" y="462" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#dc2626">8  group fails: JobSet restarts it</text>
<path d="M1020 515 L1280 515" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="1040.6" y="497" width="218.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="1150.0" y="509" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">9  newest complete checkpoint read</text>
<path d="M1020 560 L1280 560" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="1037.5" y="542" width="225.0" height="16" rx="3" fill="#fff" fill-opacity=".92"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="560px" viewBox="0 0 1420 560" style="background:#ffffff"><title>Instances: the cluster, the CPU nodes and the four-GPU node</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="560" fill="#ffffff"/><rect x="20" y="30" width="1380" height="500" rx="14" fill="#eff6ff" fill-opacity=".55" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#1e40af">ONE VPC, THREE ZONES, ONE REGION</text>
<rect x="50" y="80" width="300" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="50" y="80" width="300" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="51" y="98" width="298" height="12" fill="#f8fafc"/>
<text x="62" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">EKS control plane</text>
<text x="62" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Kubernetes 1.37, API endpoint open</text>
<text x="62" y="145" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">to one address; pod identity</text>
<text x="62" y="162" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">gives the tools access to one bucket</text>
<rect x="50" y="240" width="300" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="50" y="240" width="300" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="51" y="258" width="298" height="12" fill="#f8fafc"/>
<text x="62" y="260" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">System nodes: 2 x m5.xlarge</text>
<text x="62" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Prometheus, KEDA, the NVIDIA</text>
<text x="62" y="305" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">device plugin (as a daemon), the</text>
<text x="62" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">controllers</text>
<rect x="50" y="390" width="300" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="50" y="390" width="300" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="51" y="408" width="298" height="12" fill="#f8fafc"/>
<text x="62" y="410" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Load node: c6i.4xlarge</text>
<text x="62" y="438" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the load generators and the</text>
<text x="62" y="455" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">router, kept off the GPU node so</text>
<text x="62" y="472" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">they never compete with servers</text>
<rect x="400" y="70" width="980" height="440" rx="14" fill="#fffbeb" fill-opacity=".55" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="414" y="94" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#92400e">GPU NODE: g4dn.12xlarge  (4 x NVIDIA T4, 16 GB each, 48 vCPU, 192 GB, 800 GB disk)</text>
<rect x="430" y="120" width="215" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="430" y="120" width="215" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="431" y="138" width="213" height="12" fill="#fffbeb"/>
<text x="442" y="140" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">GPU 0: T4</text>
<text x="442" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">16 GB, 320 GB/s, 65 TFLOPS fp16</text>
<text x="442" y="185" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">no FP8, no bf16, no NVLink</text>
<rect x="665" y="120" width="215" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="665" y="120" width="215" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="666" y="138" width="213" height="12" fill="#fffbeb"/>
<text x="677" y="140" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">GPU 1: T4</text>
<text x="677" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">16 GB, 320 GB/s, 65 TFLOPS fp16</text>
<text x="677" y="185" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">no FP8, no bf16, no NVLink</text>
<rect x="900" y="120" width="215" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="900" y="120" width="215" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="901" y="138" width="213" height="12" fill="#fffbeb"/>
<text x="912" y="140" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">GPU 2: T4</text>
<text x="912" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">16 GB, 320 GB/s, 65 TFLOPS fp16</text>
<text x="912" y="185" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">no FP8, no bf16, no NVLink</text>
<rect x="1135" y="120" width="215" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="1135" y="120" width="215" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="1136" y="138" width="213" height="12" fill="#fffbeb"/>
<text x="1147" y="140" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">GPU 3: T4</text>
<text x="1147" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">16 GB, 320 GB/s, 65 TFLOPS fp16</text>
<text x="1147" y="185" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">no FP8, no bf16, no NVLink</text>
<rect x="430" y="290" width="925" height="36" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="892" y="313" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">PCIe host bridge: every GPU-to-GPU transfer goes here</text>
<path d="M537 240 L537 290" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)" marker-start="url(#a-flow)"/>
<path d="M772 240 L772 290" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)" marker-start="url(#a-flow)"/>
<path d="M1007 240 L1007 290" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)" marker-start="url(#a-flow)"/>
<path d="M1242 240 L1242 290" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)" marker-start="url(#a-flow)"/>
<rect x="430" y="360" width="440" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="430" y="360" width="440" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="431" y="378" width="438" height="12" fill="#f8fafc"/>
<text x="442" y="380" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Model cache on the node's disk</text>
<text x="442" y="408" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">/mnt/hf: the weights are downloaded once;</text>
<text x="442" y="425" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">servers that start together read them</text>
<text x="442" y="442" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">from disk, not from the network</text>
<rect x="900" y="360" width="455" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="900" y="360" width="455" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="901" y="378" width="453" height="12" fill="#fef2f2"/>
<text x="912" y="380" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Why this node</text>
<text x="912" y="408" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">g6e (L40S), g6 (L4) and g5 (A10G) four-GPU types</text>
<text x="912" y="425" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">were refused in every zone of three regions;</text>
<text x="912" y="442" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">this was the one four-GPU type EC2 would launch</text></svg>
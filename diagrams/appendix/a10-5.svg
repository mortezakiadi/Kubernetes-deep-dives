<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="470px" viewBox="0 0 1420 470" style="background:#ffffff"><title>The controller: graduated responses and hysteresis</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="470" fill="#ffffff"/><rect x="40" y="70" width="300" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="40" y="70" width="300" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="41" y="88" width="298" height="12" fill="#eff6ff"/>
<text x="52" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Level 1: tighten</text>
<text x="52" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ratio tail above 1% for 3 steps:</text>
<text x="52" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">staleness limit down by two,</text>
<text x="52" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">replay share halved</text>
<rect x="380" y="70" width="300" height="150" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="380" y="70" width="300" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="381" y="88" width="298" height="12" fill="#fffbeb"/>
<text x="392" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Level 2: protect the update</text>
<text x="392" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">effective sample size below 0.5:</text>
<text x="392" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">skip this batch (no weights move),</text>
<text x="392" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">learning rate halved for 20 steps</text>
<rect x="720" y="70" width="300" height="150" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="720" y="70" width="300" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="721" y="88" width="298" height="12" fill="#fef2f2"/>
<text x="732" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Level 3: recover</text>
<text x="732" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ratio tail above 3% and entropy</text>
<text x="732" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">falling: roll back to the last healthy</text>
<text x="732" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">checkpoint, halve the rate, page</text>
<rect x="1060" y="70" width="320" height="150" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="1060" y="70" width="320" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="1061" y="88" width="318" height="12" fill="#ecfdf5"/>
<text x="1072" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Hysteresis</text>
<text x="1072" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">after 30 healthy steps the settings</text>
<text x="1072" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">loosen one notch (limit +1, replay</text>
<text x="1072" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">x1.25) and no further until 30 more</text>
<path d="M340 145 L380 145" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="340.5" y="128.0" width="39.0" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="360.0" y="140.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">worse</text>
<path d="M680 145 L720 145" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="680.5" y="128.0" width="39.0" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="700.0" y="140.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">worse</text>
<path d="M1060 190 L340 190" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="637.1" y="221" width="125.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="700" y="233" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669">healthy for a while</text>
<rect x="40" y="270" width="1340" height="150" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="40" y="270" width="1340" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="41" y="288" width="1338" height="12" fill="#f8fafc"/>
<text x="52" y="290" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Everything is an event</text>
<text x="52" y="318" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">step, rule, action, and the metric values that triggered it, written to the run's own metrics file;</text>
<text x="52" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the settings in force are written with every step, so the configuration at any step can be reconstructed from the file alone.</text>
<text x="52" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">The rules file is versioned with the recipe: the thresholds were set from the healthy runs of S02 and S03 and the failed runs of the sweep.</text></svg>
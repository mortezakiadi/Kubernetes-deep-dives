<svg xmlns="http://www.w3.org/2000/svg" width="1260px" height="600px" viewBox="0 0 1260 600" style="background:#ffffff"><title>How two schedulers share one cluster</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-ok-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-bad-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-flow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-blue-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-muted-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1260" height="600" fill="#ffffff"/><text x="630" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">spec.schedulerName decides which scheduler handles a pod; the kubelet is the referee</text>
<rect x="500" y="70" width="260" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<text x="630.0" y="119.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">API server</text>
<text x="630.0" y="143.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">pods, nodes, Bindings, Leases</text>
<rect x="60" y="70" width="330" height="140" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="72" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">default-scheduler (managed)</text>
<text x="72" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Picks up pods with schedulerName unset or</text>
<text x="72" y="131" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">default-scheduler. Lease: kube-scheduler</text>
<rect x="870" y="70" width="330" height="140" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="882" y="93" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#92400e">affinity-first-scheduler (yours)</text>
<text x="882" y="116" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Deployment, 2 replicas, own ConfigMap. Picks up</text>
<text x="882" y="131" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pods naming it. Lease: affinity-first-scheduler</text>
<path d="M 390 110 L 500 110" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)" marker-start="url(#a-flow-s)"/>
<path d="M 870 110 L 760 110" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)" marker-start="url(#a-flow-s)"/>
<rect x="399.68" y="86" width="90.64000000000001" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="445" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">watch / bind</text>
<rect x="769.68" y="86" width="90.64000000000001" height="21" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="815" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">watch / bind</text>
<rect x="60" y="280" width="330" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="72" y="303" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Pod A</text>
<text x="72" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">schedulerName: (unset → default-scheduler)</text>
<rect x="870" y="280" width="330" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="882" y="303" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Pod B</text>
<text x="882" y="326" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">schedulerName: affinity-first-scheduler</text>
<path d="M 225 280 L 225 210" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<path d="M 1035 280 L 1035 210" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<text x="225" y="395" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">ignored by your scheduler</text>
<text x="1035" y="395" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">ignored by the default scheduler</text>
<rect x="430" y="440" width="400" height="130" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="442" y="463" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">Node: kubelet admission</text>
<text x="442" y="486" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">If both schedulers place pods on the same node at once and</text>
<text x="442" y="501" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">they don't fit together, the kubelet rejects the second one</text>
<text x="442" y="516" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(OutOfcpu / OutOfmemory)</text>
<path d="M 225 420 L 225 505 L 430 505" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-flow)"/>
<path d="M 1035 420 L 1035 505 L 830 505" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-flow)"/>
<rect x="467.08" y="216" width="325.84000000000003" height="36" rx="4" fill="#ffffff" fill-opacity=".92"/>
<text x="630" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">Each scheduler caches the cluster separately</text>
<text x="630" y="245" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">and learns the other's placements a moment late</text></svg>

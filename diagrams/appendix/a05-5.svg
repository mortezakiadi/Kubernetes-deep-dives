<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="640px" viewBox="0 0 1420 640" style="background:#ffffff"><title>Every tool has a class, and the class decides what a retry may do</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="640" fill="#ffffff"/><rect x="20" y="40" width="250" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="20" y="40" width="250" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="21" y="58" width="248" height="12" fill="#eff6ff"/>
<text x="32" y="60" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">A step calls a tool</text>
<text x="32" y="88" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">key = session + step</text>
<text x="32" y="105" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(the same for every retry,</text>
<text x="32" y="122" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">never the attempt)</text>
<rect x="310" y="40" width="270" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="310" y="40" width="270" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="311" y="58" width="268" height="12" fill="#fffbeb"/>
<text x="322" y="60" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Tool gateway</text>
<text x="322" y="88" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">writes the ledger row first:</text>
<text x="322" y="105" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">status 'started', attempts + 1</text>
<text x="322" y="122" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">then acts, then marks 'done'</text>
<path d="M270 100 L310 100" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="620" y="40" width="250" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="620" y="40" width="250" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="621" y="58" width="248" height="12" fill="#fef2f2"/>
<text x="632" y="60" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">External system</text>
<text x="632" y="88" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">acts, then the answer</text>
<text x="632" y="105" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">is lost on the way back</text>
<text x="632" y="122" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(S05 makes this happen)</text>
<path d="M580 100 L620 100" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M750 160 L750 190 L445 190 L445 160" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a-bad)"/>
<rect x="537.1" y="172" width="125.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="600" y="184" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#dc2626">retry: attempts = 2</text>
<rect x="20" y="250" width="265" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="20" y="250" width="265" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="21" y="268" width="263" height="12" fill="#ecfdf5"/>
<text x="32" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">local, read-only</text>
<text x="32" y="298" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">run again, harmless;</text>
<text x="32" y="315" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">local steps also redo if the</text>
<text x="32" y="332" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">sandbox was lost</text>
<rect x="300" y="250" width="265" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="300" y="250" width="265" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="301" y="268" width="263" height="12" fill="#ecfdf5"/>
<text x="312" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">idempotent</text>
<text x="312" y="298" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">send the same Idempotency-Key;</text>
<text x="312" y="315" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the Git host recognises it and</text>
<text x="312" y="332" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">returns the first result</text>
<rect x="580" y="250" width="265" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="580" y="250" width="265" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="581" y="268" width="263" height="12" fill="#eff6ff"/>
<text x="592" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">checkable</text>
<text x="592" y="298" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">on a retry, look first:</text>
<text x="592" y="315" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">'is there already a pull request</text>
<text x="592" y="332" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">from this branch?' Use it if so</text>
<rect x="860" y="250" width="265" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="860" y="250" width="265" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="861" y="268" width="263" height="12" fill="#fef2f2"/>
<text x="872" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">unsafe</text>
<text x="872" y="298" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">cannot be keyed or looked up:</text>
<text x="872" y="315" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the second attempt is refused,</text>
<text x="872" y="332" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the run asks a person</text>
<rect x="1140" y="250" width="265" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="1140" y="250" width="265" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="1141" y="268" width="263" height="12" fill="#fffbeb"/>
<text x="1152" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">naive (control)</text>
<text x="1152" y="298" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">no protection, only in the tests:</text>
<text x="1152" y="315" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the retry acts again and a</text>
<text x="1152" y="332" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">second pull request exists</text>
<rect x="20" y="400" width="1360" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="20" y="400" width="1360" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="21" y="418" width="1358" height="12" fill="#f8fafc"/>
<text x="32" y="420" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">After a failure that cannot be retried: compensation</text>
<text x="32" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Cancel and rewind walk the ledger newest first and undo what can be undone (close the pull request, delete the branch).</text>
<text x="32" y="465" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">A comment cannot be unsent and is left. Every compensated row is marked in the ledger.</text>
<rect x="20" y="510" width="1360" height="100" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="20" y="510" width="1360" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="21" y="528" width="1358" height="12" fill="#fffbeb"/>
<text x="32" y="530" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">What the ledger gives an operator</text>
<text x="32" y="558" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">attempts and deduplicated per tool: a rising 'deduplicated' count means flaky tools or workers.</text>
<text x="32" y="575" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Nothing is repeated silently: a retry that finds the effect already done returns the stored result.</text></svg>
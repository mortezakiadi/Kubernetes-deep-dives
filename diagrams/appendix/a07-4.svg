<text x="560.0" y="389" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">7  metrics row: reward, entropy, length, clip, IS ratios</text>
<path d="M1280 445 L1000 445" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#a-purple)"/>
<rect x="1033.7" y="427" width="212.6" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="1140.0" y="439" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#7c3aed">8  every 15 s: read metrics.jsonl</text>
<path d="M1280 495 L1000 495" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#a-purple)"/>
<rect x="999.6" y="477" width="280.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="1140.0" y="489" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#7c3aed">9  write alerts.json when a trend rule fires</text>
<path d="M120 545 L1000 545" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="407.2" y="527" width="305.6" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="560.0" y="539" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">10 every 20 steps: checkpoint, keep the last two</text>
<path d="M120 600 L1000 600" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="419.6" y="582" width="280.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="560.0" y="594" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669">11 end: register the model; status succeeded</text>

<text x="410.0" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669">5  one score per completion (None if n/a)</text>
<text x="134" y="345" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#334155">6  advantages within each group, DAPO loss, IS correction</text>

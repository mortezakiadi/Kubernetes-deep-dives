<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="520px" viewBox="0 0 1420 520" style="background:#ffffff"><title>Image trust: mirror, sign, verify at admission</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="520" fill="#ffffff"/><rect x="30" y="90" width="250" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="30" y="90" width="250" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="31" y="108" width="248" height="12" fill="#f8fafc"/>
<text x="42" y="110" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Public registries</text>
<text x="42" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">public.ecr.aws</text>
<text x="42" y="155" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">registry.k8s.io</text>
<rect x="340" y="90" width="280" height="100" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="340" y="90" width="280" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="341" y="108" width="278" height="12" fill="#fffbeb"/>
<text x="352" y="110" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">ECR pull-through cache</text>
<text x="352" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a private copy, tags immutable,</text>
<text x="352" y="155" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">created on first pull</text>
<rect x="680" y="90" width="260" height="100" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="680" y="90" width="260" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="681" y="108" width="258" height="12" fill="#fffbeb"/>
<text x="692" y="110" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Signing key (KMS)</text>
<text x="692" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ECC P-256, sign and verify</text>
<text x="692" y="155" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the private half never leaves KMS</text>
<rect x="1000" y="90" width="390" height="100" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="1000" y="90" width="390" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="1001" y="108" width="388" height="12" fill="#eff6ff"/>
<text x="1012" y="110" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Kyverno admission rule</text>
<text x="1012" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">1. every image comes from our registry</text>
<text x="1012" y="155" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">2. every image has a valid signature</text>
<path d="M280 140 L340 140" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="293.6" y="119" width="32.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="310" y="131" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">pull</text>
<path d="M620 140 L680 140" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="633.6" y="119" width="32.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="650" y="131" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">sign</text>
<path d="M940 140 L1000 140" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="956.7" y="119" width="26.6" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="970" y="131" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">key</text>
<rect x="1000" y="280" width="390" height="90" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="1000" y="280" width="390" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="1001" y="298" width="388" height="12" fill="#ecfdf5"/>
<text x="1012" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Pod starts</text>
<text x="1012" y="328" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">only if both rules pass, and the image</text>
<text x="1012" y="345" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">is pinned to its digest</text>
<path d="M1195 190 L1195 280" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="1208.1" y="227" width="63.800000000000004" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="1240" y="239" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669">both pass</text>
<rect x="560" y="280" width="380" height="100" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="560" y="280" width="380" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="561" y="298" width="378" height="12" fill="#fef2f2"/>
<text x="572" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Refused at admission</text>
<text x="572" y="328" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">unsigned image</text>
<text x="572" y="345" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">signed with another key</text>
<text x="572" y="362" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">image from a public registry</text>
<path d="M1100 190 L940 300" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-bad)"/>
<circle cx="1020" cy="245" r="9" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M1016 241 L1024 249 M1024 241 L1016 249" stroke="#dc2626" stroke-width="2.2"/>
<rect x="30" y="420" width="1360" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="46" y="446" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Ran: signing and verification with cosign against a local registry. A signed image verifies, the same image fails against another key,</text>
<text x="46" y="466" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">and an unsigned image fails. Did not run: the Kyverno rule on a cluster, and the ECR rules, which Terraform validated but never applied.</text>
<text x="46" y="486" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">Pinning to the digest is what makes a signature mean something: a tag can be moved to other contents, a digest cannot.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="560px" viewBox="0 0 1420 560" style="background:#ffffff"><title>New agent code: replay first, then new runs on new workers, old runs finish on old ones</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="560" fill="#ffffff"/><rect x="20" y="50" width="300" height="130" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="20" y="50" width="300" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="21" y="68" width="298" height="12" fill="#fffbeb"/>
<text x="32" y="70" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">1  Replay test (CI)</text>
<text x="32" y="98" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">recorded histories go through</text>
<text x="32" y="115" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the new workflow code</text>
<text x="32" y="132" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">no worker, no side effect</text>
<text x="32" y="149" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a break is found before deploy</text>
<rect x="360" y="50" width="300" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="360" y="50" width="300" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="361" y="68" width="298" height="12" fill="#eff6ff"/>
<text x="372" y="70" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">2  Deploy workers v2</text>
<text x="372" y="98" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">new Deployment on queue agent-v2</text>
<text x="372" y="115" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">alongside workers v1</text>
<text x="372" y="132" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the running ones are untouched</text>
<rect x="700" y="50" width="300" height="130" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="700" y="50" width="300" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="701" y="68" width="298" height="12" fill="#ecfdf5"/>
<text x="712" y="70" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">3  Point new runs at v2</text>
<text x="712" y="98" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the session API's current queue</text>
<text x="712" y="115" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">runs started earlier keep the</text>
<text x="712" y="132" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">queue they started on</text>
<rect x="1040" y="50" width="340" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1040" y="50" width="340" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1041" y="68" width="338" height="12" fill="#f8fafc"/>
<text x="1052" y="70" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">4  Retire v1 when its queue is empty</text>
<text x="1052" y="98" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">no running run on agent-v1:</text>
<text x="1052" y="115" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">scale the v1 workers to zero</text>
<text x="1052" y="132" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(or fix and roll back)</text>
<path d="M320 115 L360 115" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M660 115 L700 115" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M1000 115 L1040 115" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="20" y="230" width="660" height="140" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="20" y="230" width="660" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="21" y="248" width="658" height="12" fill="#fef2f2"/>
<text x="32" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">What breaks without a patch marker</text>
<text x="32" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">The recorded history says: snapshot, then run the next tool.</text>
<text x="32" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Version 2 says: snapshot, then lint. The engine cannot match them,</text>
<text x="32" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">and every run that is waiting fails to continue (nondeterminism).</text>
<text x="32" y="329" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">S09 replays a waiting run through the three versions.</text>
<rect x="720" y="230" width="660" height="140" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="720" y="230" width="660" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="721" y="248" width="658" height="12" fill="#ecfdf5"/>
<text x="732" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">What a patch marker does</text>
<text x="732" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">workflow.patched('lint-after-snapshot') returns False for a history</text>
<text x="732" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">recorded before the change and True for a new run.</text>
<text x="732" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Old histories take the old path; new runs take the new one.</text>
<text x="732" y="329" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">The same code can be deployed as one version safely.</text>
<rect x="20" y="400" width="1360" height="130" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="20" y="400" width="1360" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="21" y="418" width="1358" height="12" fill="#fffbeb"/>
<text x="32" y="420" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Worker stops</text>
<text x="32" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">A kill (SIGKILL) leaves the engine to notice a missing heartbeat, and the step runs again on another worker (S03).</text>
<text x="32" y="465" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">A rolling update sends SIGTERM: the worker stops taking tasks, lets its activities finish (up to 50 s) and exits.</text>
<text x="32" y="482" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">The step's attempt count stays at 1 (S09).</text></svg>
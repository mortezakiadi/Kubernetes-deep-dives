<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="440px" viewBox="0 0 1420 440" style="background:#ffffff"><title>The gate: an average that goes up is not enough</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="440" fill="#ffffff"/><text x="40" y="40" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">An illustration (made-up numbers; S09 measures the real ones): a candidate against the current release, family by family.</text>
<line x1="305.0" y1="70" x2="305.0" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
<text x="305.0" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">current release</text>
<text x="40" y="100" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">math</text>
<rect x="305.0" y="85" width="35.0" height="22" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="348.0" y="101" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">+0.05</text>
<text x="40" y="140" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">code</text>
<rect x="305.0" y="125" width="63.0" height="22" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="376.0" y="141" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">+0.09</text>
<text x="40" y="180" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">instr</text>
<rect x="305.0" y="165" width="28.0" height="22" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="341.0" y="181" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">+0.04</text>
<text x="40" y="220" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">tools</text>
<rect x="305.0" y="205" width="21.0" height="22" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="334.0" y="221" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">+0.03</text>
<text x="40" y="260" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">multiling</text>
<rect x="305.0" y="245" width="14.0" height="22" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="327.0" y="261" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">+0.02</text>
<text x="40" y="300" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">safety</text>
<rect x="221.0" y="285" width="84.0" height="22" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="213.0" y="301" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">-0.12</text>
<rect x="277.0" y="320" width="28.0" height="8" fill="#fde68a" stroke="#d97706"/>
<text x="277.0" y="345" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#92400e">tolerance: margin + 2 x noise</text>
<rect x="960" y="70" width="420" height="150" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="960" y="70" width="420" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="961" y="88" width="418" height="12" fill="#fffbeb"/>
<text x="972" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">The average rises by 0.02</text>
<text x="972" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Five families rise and one falls by 0.12.</text>
<text x="972" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Under 'the average must go up' this ships.</text>
<text x="972" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Under the gate it does not: safety fell by</text>
<text x="972" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">four times its tolerance (0.03 here).</text>
<rect x="960" y="250" width="420" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="960" y="250" width="420" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="961" y="268" width="418" height="12" fill="#f8fafc"/>
<text x="972" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Aggregates that resist trade-offs</text>
<text x="972" y="298" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the minimum over families, and the geometric</text>
<text x="972" y="315" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">mean (which punishes a collapse in one family</text>
<text x="972" y="332" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">more than the average does)</text></svg>
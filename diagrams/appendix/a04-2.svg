<text x="34" y="44" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#334155">AWS ACCOUNT, us-east-1, ONE VPC 10.31.0.0/16</text>
<rect x="50" y="70" width="330" height="140" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="50" y="70" width="330" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="51" y="88" width="328" height="12" fill="#eff6ff"/>
<text x="62" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">EKS Auto Mode cluster</text>
<text x="62" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ds03-trainserve, Kubernetes 1.37</text>
<text x="62" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">control plane in zones a, b, c (fixed at creation)</text>
<text x="62" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">API: private in the VPC; public only to</text>
<text x="62" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the administrator's /32; audit logs 3 days</text>
<rect x="50" y="230" width="330" height="150" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="50" y="230" width="330" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="51" y="248" width="328" height="12" fill="#fef2f2"/>
<text x="62" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Node pools (all Auto Mode)</text>
<text x="62" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">general-purpose, system: small c6a nodes</text>
<text x="62" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">gpu-research  limit 1 GPU, idle 2 min</text>
<text x="62" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">gpu-training  limit 2 GPUs, idle 6 min</text>
<text x="62" y="329" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">gpu-inference limit 3 GPUs, idle 3 min</text>
<text x="62" y="346" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one NodeClass 'gpu' spanning 5 zones, 120 GiB disk</text>
<rect x="50" y="400" width="330" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="50" y="400" width="330" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="51" y="418" width="328" height="12" fill="#f8fafc"/>
<text x="62" y="420" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">S3 bucket (one, private)</text>
<text x="62" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">datasets/  runs/  registry/  evals/  batch/</text>
<text x="62" y="465" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">five Pod Identity roles, one per family,</text>
<text x="62" y="482" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">each limited to the prefixes it needs</text>
<rect x="50" y="550" width="330" height="170" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="50" y="550" width="330" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="51" y="568" width="328" height="12" fill="#f8fafc"/>
<text x="62" y="570" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Terraform (two layers, local state)</text>
<text x="62" y="598" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">10-cluster: VPC, NAT, IAM, the cluster</text>
<text x="62" y="615" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">20-platform: S3, identities, Trainer, LWS,</text>
<text x="62" y="632" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Kueue, KEDA, Prometheus, DCGM, gateway,</text>
<text x="62" y="649" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">router, pools, queues, runtime, vLLM</text>
<text x="62" y="666" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">account guard; down.sh then verify-clean.sh</text>

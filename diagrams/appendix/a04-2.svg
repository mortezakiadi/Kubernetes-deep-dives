<text x="422" y="460" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">NAT gateway</text>
<text x="422" y="488" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one, in 1a</text>
<text x="410" y="600" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">Why five zones: GPU capacity is not guaranteed. In this build g4dn, g5, g6 and g6e</text>
<text x="410" y="622" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">all returned InsufficientInstanceCapacity in some zone at some time. Auto Mode picks the cheapest</text>
<text x="410" y="640" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">instance that has capacity, in any zone the NodeClass can see. EKS fixes a cluster's zones at</text>
<text x="410" y="658" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">creation, so two zones were added through the NodeClass, not the cluster.</text></svg>
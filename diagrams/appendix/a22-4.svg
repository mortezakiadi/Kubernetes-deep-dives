<text x="295" y="388" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#065f46">attn + 32 experts</text>
<rect x="365" y="360" width="110" height="46" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="420" y="388" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#065f46">attn + 32 experts</text>
<rect x="490" y="360" width="110" height="46" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="545" y="388" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#065f46">attn + 32 experts</text>
<rect x="615" y="360" width="110" height="46" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="670" y="388" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#065f46">attn + 32 experts</text>
<text x="30" y="468" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">P/D: 2P + 2D</text>
<rect x="240" y="450" width="110" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="295" y="478" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#991b1b">prefill</text>
<rect x="365" y="450" width="110" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="420" y="478" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#991b1b">prefill</text>
<rect x="490" y="450" width="110" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="545" y="478" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e40af">decode</text>
<rect x="615" y="450" width="110" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="670" y="478" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e40af">decode</text>
<text x="760" y="80" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Four copies of the weights; no communication;</text>
<text x="760" y="98" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">the cache is what is left in each GPU.</text>
<text x="760" y="150" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Weights shared by two GPUs; one all-reduce per</text>
<text x="760" y="168" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">layer over PCIe; more room for the cache.</text>
<text x="760" y="220" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Weights shared by four; the most cache; four-way</text>
<text x="760" y="238" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">all-reduce over PCIe for every layer.</text>
<text x="760" y="320" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Experts and attention are both split; all-reduce.</text>
<text x="760" y="390" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Attention is replicated; experts are split;</text>
<text x="760" y="408" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">tokens travel between ranks for the experts (all-to-all).</text>
<text x="760" y="480" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">The prompt is computed on a prefill GPU and the</text>
<text x="760" y="498" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">KV cache is copied to a decode GPU (NIXL, over PCIe).</text></svg>
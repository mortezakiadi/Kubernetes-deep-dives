<circle cx="1150" cy="225" r="12" fill="#1e293b"/><text x="1150" y="229.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">6</text>
<circle cx="380" cy="150" r="12" fill="#1e293b"/><text x="380" y="154.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">2</text>
<circle cx="690" cy="300" r="12" fill="#1e293b"/><text x="690" y="304.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">4</text>
<text x="20" y="360" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">Dashed box: outside what this appendix builds.</text>
<text x="20" y="378" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">Numbers match the steps below the picture.</text>
<text x="20" y="396" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">Blue arrows: the hub offering a job to workers.</text>
<text x="20" y="414" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">A job is offered to the workers that fit its kind (CPU or GPU).</text></svg>
<circle cx="225" cy="255" r="12" fill="#1e293b"/><text x="225" y="259.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">7</text>
<path d="M500 190 L535 190 L535 100 L570 100" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>

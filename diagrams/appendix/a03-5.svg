<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="470px" viewBox="0 0 1420 470" style="background:#ffffff"><title>The path of one job: team, hub, worker, node pool and AWS</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="470" fill="#ffffff"/><rect x="20" y="170" width="170" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="20" y="170" width="170" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="21" y="188" width="168" height="12" fill="#f8fafc"/>
<text x="32" y="190" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Team</text>
<text x="32" y="218" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a researcher on team llm,</text>
<text x="32" y="235" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">vision or research</text>
<text x="32" y="252" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">submits with kubectl</text>
<text x="32" y="269" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(no portal built here)</text>
<rect x="260" y="150" width="240" height="150" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="260" y="150" width="240" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="261" y="168" width="238" height="12" fill="#ecfdf5"/>
<text x="272" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Hub cluster</text>
<text x="272" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the one front door</text>
<text x="272" y="215" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">holds each team's share of the</text>
<text x="272" y="232" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">whole fleet; decides which worker</text>
<text x="272" y="249" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">to offer a job to; runs no</text>
<text x="272" y="266" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">user pods</text>
<rect x="570" y="40" width="240" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="570" y="40" width="240" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="571" y="58" width="238" height="12" fill="#eff6ff"/>
<text x="582" y="60" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Worker: cpu-a</text>
<text x="582" y="88" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">On-Demand CPU capacity</text>
<text x="582" y="105" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">own queues for each team</text>
<text x="582" y="122" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">decides: room for the whole job?</text>
<rect x="570" y="180" width="240" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="570" y="180" width="240" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="571" y="198" width="238" height="12" fill="#eff6ff"/>
<text x="582" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Worker: cpu-b</text>
<text x="582" y="228" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Spot CPU capacity</text>
<text x="582" y="245" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">own queues for each team</text>
<text x="582" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">decides: room for the whole job?</text>
<rect x="570" y="320" width="240" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="570" y="320" width="240" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="571" y="338" width="238" height="12" fill="#fef2f2"/>
<text x="582" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Worker: gpu</text>
<text x="582" y="368" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">GPU capacity, starts empty</text>
<text x="582" y="385" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">own queues for each team</text>
<text x="582" y="402" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">decides: room for the whole job?</text>
<rect x="880" y="150" width="240" height="150" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="880" y="150" width="240" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="881" y="168" width="238" height="12" fill="#f8fafc"/>
<text x="892" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Node pools (Auto Mode)</text>
<text x="892" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">in each worker: buy a node when</text>
<text x="892" y="215" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">an admitted pod has none that fits</text>
<text x="892" y="232" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">remove it when it is empty</text>
<text x="892" y="249" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">GPU nodes only while needed</text>
<rect x="1180" y="150" width="220" height="150" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1180" y="150" width="220" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1181" y="168" width="218" height="12" fill="#f8fafc"/>
<text x="1192" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">AWS</text>
<text x="1192" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">EC2 instances</text>
<text x="1192" y="215" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">S3 bucket, one prefix</text>
<text x="1192" y="232" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">per team, readable only</text>
<text x="1192" y="249" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">by that team's role</text>

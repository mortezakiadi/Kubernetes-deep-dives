<text x="1192" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">free, nothing pending fits it</text>
<rect x="30" y="200" width="680" height="160" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="30" y="200" width="680" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="31" y="218" width="678" height="12" fill="#f8fafc"/>
<text x="42" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Inputs</text>
<text x="42" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Nodes and their allocatable GPUs; pods and the GPUs they hold;</text>
<text x="42" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Kueue Workloads: pending, admitted, evicted; DCGM per-pod</text>
<text x="42" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">GPU utilization for the real GPUs; for simulated GPUs, the</text>
<text x="42" y="299" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">activity each pod declares (they do not exist)</text>
<rect x="740" y="200" width="650" height="160" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="740" y="200" width="650" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="741" y="218" width="648" height="12" fill="#fef2f2"/>
<text x="752" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Plus lost work</text>
<text x="752" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">when Kueue evicts a workload for preemption:</text>
<text x="752" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">GPUs x the time since its last checkpoint,</text>
<text x="752" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">assuming checkpoints every ds17/checkpoint-seconds</text>
<text x="752" y="299" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">from admission</text></svg>
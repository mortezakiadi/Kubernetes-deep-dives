<text x="42" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">allocated and working</text>
<rect x="260" y="60" width="215" height="100" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="260" y="60" width="215" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="261" y="78" width="213" height="12" fill="#fffbeb"/>
<text x="272" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">allocated_idle</text>
<text x="272" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">allocated, &lt; 5% use</text>
<rect x="490" y="60" width="215" height="100" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="490" y="60" width="215" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="491" y="78" width="213" height="12" fill="#fef2f2"/>
<text x="502" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">waiting_for_gang</text>
<text x="502" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">held by a partial gang</text>
<rect x="720" y="60" width="215" height="100" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="720" y="60" width="215" height="30" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="721" y="78" width="213" height="12" fill="#f5f3ff"/>
<text x="732" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5b21b6">fragmented</text>
<text x="732" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">free, no pending pod fits</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="520px" viewBox="0 0 1420 520" style="background:#ffffff"><title>Who uses the platform, what it is made of, and what it talks to</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs><rect width="1420" height="520" fill="#ffffff"/><rect x="20" y="30" width="270" height="460" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">WHO</text>
<rect x="40" y="70" width="230" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="70" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="88" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Teams</text>
<text x="52" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">submit Jobs labelled with</text>
<text x="52" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a LocalQueue; read queue</text>
<text x="52" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">status and their share</text>
<rect x="40" y="200" width="230" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="200" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="218" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Platform owner</text>
<text x="52" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">sets quotas, weights,</text>
<text x="52" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">priorities, topology and</text>
<text x="52" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">scheduler profiles</text>
<rect x="40" y="330" width="230" height="130" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="330" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="348" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Finance and capacity</text>
<text x="52" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">read the GPU-hour</text>
<text x="52" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">breakdown: where every</text>
<text x="52" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">GPU-hour went, and why</text>
<rect x="320" y="30" width="1060" height="460" rx="14" fill="#fffbeb" fill-opacity=".55" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="334" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#92400e">THE PLATFORM (standard EKS)</text>
<rect x="340" y="70" width="320" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="340" y="70" width="320" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="341" y="88" width="318" height="12" fill="#eff6ff"/>
<text x="352" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Admission: Kueue 0.20.8</text>
<text x="352" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ClusterQueues in cohorts, flavors,</text>
<text x="352" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">topology-aware admission,</text>
<text x="352" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">fair sharing, waitForPodsReady</text>
<rect x="690" y="70" width="320" height="120" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="690" y="70" width="320" height="30" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="691" y="88" width="318" height="12" fill="#f5f3ff"/>
<text x="702" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5b21b6">Placement: second kube-scheduler</text>
<text x="702" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">profiles gpu-binpack (MostAllocated)</text>
<text x="702" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">and gpu-spread (LeastAllocated),</text>
<text x="702" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">GPUs weighted 10 to 1</text>
<rect x="1040" y="70" width="320" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="1040" y="70" width="320" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="1041" y="88" width="318" height="12" fill="#fffbeb"/>
<text x="1052" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Accounting service</text>
<text x="1052" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">every 10 s, every GPU in one</text>
<text x="1052" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">category; DCGM for real GPUs;</text>
<text x="1052" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">lost work on preemption</text>
<rect x="340" y="230" width="670" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="340" y="230" width="670" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="341" y="248" width="668" height="12" fill="#f8fafc"/>
<text x="352" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Simulated fleet: 16 KWOK nodes x 8 GPUs = 128</text>
<text x="352" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">2 blocks x 2 racks x 4 hosts, labelled for the topology; Node objects with no machine</text>
<text x="352" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">behind them; KWOK moves bound pods through ready, complete and terminate</text>
<rect x="1040" y="230" width="320" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="1040" y="230" width="320" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="1041" y="248" width="318" height="12" fill="#fef2f2"/>
<text x="1052" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Real GPUs: 2 nodes</text>
<text x="1052" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one GPU each, device plugin,</text>
<text x="1052" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">DCGM exporter; S02 only</text>
<rect x="340" y="380" width="1020" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="340" y="380" width="1020" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="341" y="398" width="1018" height="12" fill="#f8fafc"/>
<text x="352" y="400" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Kubernetes API server (EKS control plane)</text>
<text x="352" y="428" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">every component above reads and writes Jobs, Pods, Nodes and Kueue objects through it</text>
<path d="M270 125 L340 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="288.6" y="107" width="32.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="305" y="119" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">Jobs</text>
<path d="M660 130 L690 130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M850 190 L850 230" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="868.1" y="203" width="63.800000000000004" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="900" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">bind pods</text>
<path d="M1200 230 L1200 190" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<path d="M270 395 L340 395" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/></svg>
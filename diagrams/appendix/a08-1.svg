<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="540px" viewBox="0 0 1420 540" style="background:#ffffff"><title>Who uses the platform and what it runs</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="540" fill="#ffffff"/><rect x="20" y="30" width="270" height="480" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">WHO</text>
<rect x="40" y="70" width="230" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="70" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="88" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Research team</text>
<text x="52" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">chooses the recipe and the</text>
<text x="52" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reward; reads the curves and</text>
<text x="52" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">decides when to climb a rung</text>
<rect x="40" y="200" width="230" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="200" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="218" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Platform team</text>
<text x="52" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">owns the cluster, the GPU</text>
<text x="52" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pools, the queues and the</text>
<text x="52" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">restart policy</text>
<rect x="40" y="330" width="230" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="330" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="348" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">On-call engineer</text>
<text x="52" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">gets the alert when a run</text>
<text x="52" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">drifts or stalls; rolls back</text>
<text x="52" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">to the last healthy checkpoint</text>
<rect x="320" y="30" width="1080" height="480" rx="14" fill="#fffbeb" fill-opacity=".55" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="334" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#92400e">WHAT RUNS (ONE ZONE, ONE CLUSTER)</text>
<rect x="340" y="70" width="320" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="340" y="70" width="320" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="341" y="88" width="318" height="12" fill="#eff6ff"/>
<text x="352" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Trainer</text>
<text x="352" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one GPU, asynchronous GRPO</text>
<text x="352" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reads samples from a queue,</text>
<text x="352" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">updates the policy, pushes weights</text>
<rect x="700" y="70" width="320" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="700" y="70" width="320" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="701" y="88" width="318" height="12" fill="#eff6ff"/>
<text x="712" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Rollout fleet</text>
<text x="712" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">two GPUs on two nodes, one vLLM</text>
<text x="712" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">engine each, behind one address;</text>
<text x="712" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">generates answers, returns log-probs</text>
<rect x="1060" y="70" width="320" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="1060" y="70" width="320" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="1061" y="88" width="318" height="12" fill="#eff6ff"/>
<text x="1072" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Environment tier</text>
<text x="1072" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">sandbox workers on CPU nodes</text>
<text x="1072" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reading calls from a queue;</text>
<text x="1072" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">scaled by the queue's length</text>
<rect x="340" y="230" width="320" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="340" y="230" width="320" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="341" y="248" width="318" height="12" fill="#f8fafc"/>
<text x="352" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">State bucket</text>
<text x="352" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">checkpoints and the run's metrics;</text>
<text x="352" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the copy that survives the node</text>
<rect x="700" y="230" width="320" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="700" y="230" width="320" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="701" y="248" width="318" height="12" fill="#f8fafc"/>
<text x="712" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Restart policy</text>
<text x="712" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">JobSet recreates the trainer,</text>
<text x="712" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a watchdog turns a hang into</text>
<text x="712" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a failure</text>
<rect x="1060" y="230" width="320" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1060" y="230" width="320" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1061" y="248" width="318" height="12" fill="#f8fafc"/>
<text x="1072" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Measurements</text>
<text x="1072" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">step-time stages, mismatch,</text>
<text x="1072" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">queue, staleness, held-out score</text>
<text x="1072" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">- on every run, every step</text>
<path d="M270 125 L340 125" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="282.4" y="108.0" width="45.2" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="305.0" y="120.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">recipe</text>
<path d="M270 255 L340 290" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="279.3" y="255.5" width="51.4" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="305.0" y="267.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">operate</text>
<path d="M270 390 L340 310" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="285.5" y="333.0" width="39.0" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="305.0" y="345.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">alert</text>
<text x="340" y="400" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">The question this platform answers: how do we take a recipe that works at 0.6B parameters and short answers</text>
<text x="340" y="420" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">and find out what breaks, in what order, before it is run at a hundred times the size?</text>
<text x="340" y="450" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">Scaled down here to 3 GPUs and 40 to 80 steps per run. The design's 235B mixture-of-experts model, 64K-token answers and 2,048 GPUs</text>
<text x="340" y="468" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">are not reachable; the architecture and the measurements are.</text></svg>
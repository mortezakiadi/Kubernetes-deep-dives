<text x="1020" y="784" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669">approved sites</text>
<text x="20" y="836" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">Green: platform services. Blue: gateway and broker. Red: untrusted. Grey: not built here, or outside the platform.</text>
<text x="20" y="854" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">Platform pods run on EKS Auto Mode's general-purpose nodes. Sandboxes run only on the tainted sandbox pool.</text></svg>
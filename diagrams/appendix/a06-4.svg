<text x="52" y="420" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Outside the plan, on purpose</text>
<text x="52" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pods: 100.64.0.0/16 in both cluster VPCs (never routed for pods' own traffic)</text>
<text x="52" y="465" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">legacy-main: 10.60.0.0/16 typed by hand, the same range as prod-main</text>
<text x="52" y="482" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">IPAM finds both and reports them as unmanaged and overlapping</text>
<rect x="600" y="400" width="440" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="600" y="400" width="440" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="601" y="418" width="438" height="12" fill="#f8fafc"/>
<text x="612" y="420" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">What the plan refuses</text>
<text x="612" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a request for a range inside a block that a VPC holds</text>
<text x="612" y="465" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(S01), and a VPC whose range would overlap another</text>
<text x="612" y="482" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">routed VPC: it cannot be given one</text>
<text x="40" y="560" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">A pool cannot hand out what its parent did not give it, and an allocation is held until the VPC is deleted.</text></svg>
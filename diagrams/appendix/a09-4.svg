<text x="134" y="110" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#334155">1  build the context (old observations compacted past 7,000 characters)</text>
<path d="M120 160 L400 160" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="60.69999999999999" y="142" width="398.6" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="260.0" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">2  chat completion: one ACTION, token ids and log-probabilities</text>
<path d="M400 205 L120 205" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="104.1" y="187" width="311.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="260.0" y="199" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669">3  reply; generation stops before a second ACTION</text>
<path d="M120 255 L700 255" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="220.0" y="237" width="380.0" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="410.0" y="249" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">4  run the tool (ls, cat, replace, write, run_tests, submit)</text>
<path d="M120 305 L1000 305" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="397.9" y="287" width="324.2" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="560.0" y="299" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">5  progress: Phi on the real files, in a fresh copy</text>
<text x="134" y="355" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7c3aed">6  branch point? uncertain choice, edit, first test run, every third turn</text>
<path d="M120 405 L1280 405" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="587.5" y="387" width="225.0" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="700.0" y="399" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">7  snapshot (tar) at a branch point</text>
<path d="M120 455 L1280 455" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
<rect x="531.7" y="437" width="336.6" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="700.0" y="449" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">8  the context and the log-probabilities of this turn</text>
<path d="M120 520 L1000 520" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="388.6" y="502" width="342.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="560.0" y="514" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">9  after the last turn: fresh-environment verification</text>
<path d="M120 580 L1280 580" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="497.6" y="562" width="404.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="700.0" y="574" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669">10 the trajectory: every turn, the outcome, the verifier version</text></svg>
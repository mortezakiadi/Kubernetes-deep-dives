<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="640px" viewBox="0 0 1420 640" style="background:#ffffff"><title>One turn of an episode, and what is recorded</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs><rect width="1420" height="640" fill="#ffffff"/><rect x="10" y="20" width="220" height="50" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="10" y="20" width="220" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="11" y="38" width="218" height="12" fill="#eff6ff"/>
<text x="22" y="40" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Environment pod</text>
<line x1="120" y1="70" x2="120" y2="620" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="290" y="20" width="220" height="50" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>

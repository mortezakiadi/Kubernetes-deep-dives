<rect x="291" y="38" width="218" height="12" fill="#fffbeb"/>
<text x="302" y="40" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Rollout engine (vLLM)</text>
<line x1="400" y1="70" x2="400" y2="620" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="590" y="20" width="220" height="50" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>

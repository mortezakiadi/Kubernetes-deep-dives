<rect x="591" y="38" width="218" height="12" fill="#ecfdf5"/>
<text x="602" y="40" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Working copy</text>
<line x1="700" y1="70" x2="700" y2="620" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="890" y="20" width="220" height="50" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="890" y="20" width="220" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="891" y="38" width="218" height="12" fill="#fef2f2"/>
<text x="902" y="40" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Verifier</text>
<line x1="1000" y1="70" x2="1000" y2="620" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="1170" y="20" width="220" height="50" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>

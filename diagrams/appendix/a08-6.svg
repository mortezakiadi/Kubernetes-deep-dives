<text x="40" y="390" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">Total while idle: about $5.8 an hour (prices are the on-demand list prices in us-east-1 when this was built).</text></svg>
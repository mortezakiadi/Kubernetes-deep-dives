<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="760px" viewBox="0 0 1420 760" style="background:#ffffff"><title>The cluster and one run</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="760" fill="#ffffff"/><rect x="20" y="30" width="1380" height="710" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#334155">EKS 1.37, ONE VPC, THREE ZONES</text>
<rect x="40" y="70" width="330" height="650" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="54" y="94" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">SYSTEM POOL: 2 x m5.xlarge</text>
<rect x="55" y="105" width="300" height="100" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="55" y="105" width="300" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="56" y="123" width="298" height="12" fill="#ecfdf5"/>
<text x="67" y="125" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Kueue</text>
<text x="67" y="153" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ClusterQueue 'research': 4 GPUs</text>
<text x="67" y="170" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">LocalQueue 'research-small'</text>
<text x="67" y="187" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">priorities: sweep-low, interactive</text>
<rect x="55" y="230" width="300" height="80" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="55" y="230" width="300" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="56" y="248" width="298" height="12" fill="#ecfdf5"/>
<text x="67" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">NVIDIA device plugin</text>
<text x="67" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">advertises nvidia.com/gpu</text>
<rect x="55" y="335" width="300" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="55" y="335" width="300" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="56" y="353" width="298" height="12" fill="#f8fafc"/>
<text x="67" y="355" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Your laptop (kubectl, aws)</text>
<text x="67" y="383" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">applies the Indexed Job; reads</text>
<text x="67" y="400" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">metrics back from the bucket</text>
<rect x="55" y="450" width="300" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="55" y="450" width="300" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="56" y="468" width="298" height="12" fill="#f8fafc"/>
<text x="67" y="470" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">State bucket (S3)</text>
<text x="67" y="498" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">runs/&lt;run&gt;/metrics.jsonl</text>
<text x="67" y="515" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">copied while the run is alive</text>
<rect x="400" y="70" width="980" height="650" rx="14" fill="#eff6ff" fill-opacity=".55" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="414" y="94" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#1e40af">RESEARCH POOL: single-GPU nodes, one run per node (Indexed Job, one pod per cell)</text>
<rect x="420" y="110" width="470" height="260" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="420" y="110" width="470" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="421" y="128" width="468" height="12" fill="#eff6ff"/>
<text x="432" y="130" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">One run (one pod, one GPU)</text>
<text x="432" y="158" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">TRL GRPOTrainer, colocated vLLM engine (8 GiB)</text>
<text x="432" y="175" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">1. generate K steps' worth of samples; record mu per token</text>
<text x="432" y="192" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">2. score each with the trainer's weights: pi_prox on arrival</text>
<text x="432" y="209" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">3. tag version; place in the fresh pool; keep for replay</text>
<text x="432" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">4. each micro-batch: pick a pool, check age and KL limits</text>
<text x="432" y="243" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">5. decoupled loss, metrics, controller, held-out evaluation</text>
<text x="432" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">6. push the new weights into the engine (in-process)</text>
<rect x="920" y="110" width="440" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="920" y="110" width="440" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="921" y="128" width="438" height="12" fill="#eff6ff"/>
<text x="932" y="130" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Sample pools</text>
<text x="932" y="158" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">fresh: this generation's chunks, age 0 to K-1</text>
<text x="932" y="175" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">replay: older chunks, age &lt;= 40, KL &lt;= 0.05</text>
<text x="932" y="192" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">external: human-written solutions, own small loss</text>
<rect x="920" y="260" width="440" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="920" y="260" width="440" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="921" y="278" width="438" height="12" fill="#eff6ff"/>
<text x="932" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Controller</text>
<text x="932" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reads the step's metrics; rules from a file;</text>
<text x="932" y="325" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">acts before the optimizer step (skip) or after</text>
<text x="932" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(tighten, cut LR, roll back); logs every action</text>
<rect x="420" y="400" width="470" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="420" y="400" width="470" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="421" y="418" width="468" height="12" fill="#f8fafc"/>
<text x="432" y="420" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Healthy checkpoints</text>
<text x="432" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">every 10 steps, on the node's disk, tagged healthy</text>
<text x="432" y="465" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">when the last window was inside the limits;</text>
<text x="432" y="482" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the rollback target is the newest healthy one</text>
<rect x="920" y="400" width="440" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="920" y="400" width="440" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="921" y="418" width="438" height="12" fill="#f8fafc"/>
<text x="932" y="420" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Held-out evaluation</text>
<text x="932" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">200 GSM8K test problems, 4 samples each,</text>
<text x="932" y="465" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">through the same engine, every 5 to 10 steps;</text>
<text x="932" y="482" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">by task type (short, medium, long)</text>
<path d="M355 160 L420 160" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="364.9" y="143.0" width="45.2" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="387.5" y="155.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">admits</text>
<path d="M355 500 L420 500" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)" marker-start="url(#a-ok)"/>
<rect x="362.3" y="479" width="51.4" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="388" y="491" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669">metrics</text>
<text x="420" y="570" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">Cells of a sweep run side by side on different nodes and never talk to each other: nothing here needs a fast network between nodes.</text>
<text x="420" y="590" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">That is a property of the experiments, not a shortcut: the design's staleness question can be asked on one GPU, and the sweep is embarrassingly parallel.</text></svg>
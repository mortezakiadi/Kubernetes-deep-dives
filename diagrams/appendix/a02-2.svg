<text x="462" y="120" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Public subnet 10.20.0.0/24</text>
<text x="462" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">NAT gateway (one, in 1a)</text>
<text x="462" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">nothing else lives here</text>
<rect x="450" y="230" width="420" height="220" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="450" y="230" width="420" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="451" y="248" width="418" height="12" fill="#ecfdf5"/>
<text x="462" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Platform subnet 10.20.16.0/20</text>
<text x="462" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">tag ds01/tier=system</text>
<text x="462" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Auto Mode general-purpose nodes (c6a.large)</text>
<text x="462" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Manager, Router, tool gateway, metrics API,</text>
<text x="462" y="329" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">egress gateway x2, credential broker x2,</text>
<text x="462" y="346" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">orchestrator, agent-sandbox controller</text>
<text x="462" y="363" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">default node security group</text>
<rect x="450" y="480" width="420" height="250" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="450" y="480" width="420" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="451" y="498" width="418" height="12" fill="#fef2f2"/>
<text x="462" y="500" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Sandbox subnet 10.20.64.0/20</text>
<text x="462" y="528" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">tag ds01/tier=sandbox</text>
<text x="462" y="545" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">node pool 'sandbox': c7i.xlarge (Nitro Enclaves on)</text>
<text x="462" y="562" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">taint workload=sandbox:NoSchedule</text>
<text x="462" y="579" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">security group ds01-sandboxing-sandbox-nodes</text>
<text x="462" y="596" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">IMDSv2 required, hop limit 1, no public IP</text>
<text x="462" y="613" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">each pod = one Firecracker microVM, own kernel</text>
<text x="462" y="630" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">only empty nodes are consolidated</text>

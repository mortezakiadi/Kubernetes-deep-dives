<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="800px" viewBox="0 0 1420 800" style="background:#ffffff"><title>EKS topology and instances</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="800" fill="#ffffff"/><rect x="20" y="20" width="1380" height="760" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="44" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#334155">AWS ACCOUNT, us-east-1, ONE VPC 10.20.0.0/16</text>
<rect x="50" y="70" width="330" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="50" y="70" width="330" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="51" y="88" width="328" height="12" fill="#eff6ff"/>
<text x="62" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">EKS control plane (managed by AWS)</text>
<text x="62" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Kubernetes 1.37, Auto Mode, API-only access</text>
<text x="62" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">endpoint open only to the admin /32</text>
<text x="62" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">control-plane logs (api, audit, authenticator)</text>
<text x="62" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">to CloudWatch, 7 days</text>
<rect x="50" y="230" width="330" height="150" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="50" y="230" width="330" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="51" y="248" width="328" height="12" fill="#fffbeb"/>
<text x="62" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">IAM roles (Terraform)</text>
<text x="62" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">cluster role: 5 AWS-managed EKS policies</text>
<text x="62" y="295" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">platform node role: WorkerNodeMinimal + ECR pull</text>
<text x="62" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">sandbox node role: the same two, separate role</text>
<text x="62" y="329" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">no S3, no Secrets Manager, no inline policies</text>
<rect x="50" y="410" width="330" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="50" y="410" width="330" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="51" y="428" width="328" height="12" fill="#f8fafc"/>
<text x="62" y="430" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">ECR repository ds01-platform</text>
<text x="62" y="458" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one image for every platform service</text>
<text x="62" y="475" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">built for linux/amd64, tag = hash of the source</text>
<text x="62" y="492" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">scan on push, force-delete on teardown</text>
<rect x="50" y="550" width="330" height="200" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="50" y="550" width="330" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="51" y="568" width="328" height="12" fill="#f8fafc"/>
<text x="62" y="570" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Terraform state (local, git-ignored)</text>
<text x="62" y="598" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">layer 10-cluster: VPC, subnets, NAT, EKS, IAM</text>
<text x="62" y="615" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">layer 20-platform: controller, templates,</text>
<text x="62" y="632" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pools, gateways, services, secrets, image</text>
<text x="62" y="649" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">account ID guard on both providers</text>
<text x="62" y="666" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">teardown: down.sh, then verify-clean.sh</text>
<rect x="430" y="60" width="460" height="700" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="444" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#334155">AVAILABILITY ZONE us-east-1a</text>
<rect x="450" y="100" width="420" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="450" y="100" width="420" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="560px" viewBox="0 0 1420 560" style="background:#ffffff"><title>Who starts, steers and fixes a run, and what the platform talks to</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="560" fill="#ffffff"/><rect x="20" y="30" width="270" height="500" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">WHO</text>
<rect x="40" y="70" width="230" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="70" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="88" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Developer</text>
<text x="52" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">files a ticket;</text>
<text x="52" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">wants a pull request, not</text>
<text x="52" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a half-finished job</text>
<rect x="40" y="200" width="230" height="110" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="200" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="218" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Reviewer</text>
<text x="52" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reads the pull request,</text>
<text x="52" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">comments, approves; may</text>
<text x="52" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">take the whole weekend</text>
<rect x="40" y="330" width="230" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="330" width="230" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="348" width="228" height="12" fill="#ecfdf5"/>
<text x="52" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">On-call engineer</text>
<text x="52" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pauses runs during an</text>
<text x="52" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">incident, rewinds or forks one,</text>
<text x="52" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ships new agent code</text>
<rect x="320" y="30" width="760" height="500" rx="14" fill="#fffbeb" fill-opacity=".55" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="334" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#92400e">THE PLATFORM (EKS)</text>
<rect x="340" y="70" width="220" height="90" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="340" y="70" width="220" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="341" y="88" width="218" height="12" fill="#eff6ff"/>
<text x="352" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Session API</text>
<text x="352" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">start, signal, rewind, fork,</text>
<text x="352" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">timeline, bulk operations</text>
<rect x="590" y="70" width="470" height="90" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="590" y="70" width="470" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="591" y="88" width="468" height="12" fill="#fffbeb"/>
<text x="602" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Durable execution engine (Temporal) + database</text>
<text x="602" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one workflow per run; its event history is the source of truth;</text>
<text x="602" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">timers, retries, signals; no state in any worker</text>
<rect x="340" y="190" width="220" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="340" y="190" width="220" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="341" y="208" width="218" height="12" fill="#eff6ff"/>
<text x="352" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Agent workers</text>
<text x="352" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">stateless; any worker can</text>
<text x="352" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">continue any run; scale on the</text>
<text x="352" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">engine's task backlog</text>
<rect x="590" y="190" width="220" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="590" y="190" width="220" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="591" y="208" width="218" height="12" fill="#eff6ff"/>
<text x="602" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Model gateway</text>
<text x="602" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">retries, fallback, token</text>
<text x="602" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">budget per run, a record of</text>
<text x="602" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">every call</text>
<rect x="840" y="190" width="220" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="840" y="190" width="220" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="841" y="208" width="218" height="12" fill="#eff6ff"/>
<text x="852" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Tool gateway + ledger</text>
<text x="852" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">classes, idempotency keys,</text>
<text x="852" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">look-before-you-leap,</text>
<text x="852" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">undo (compensation)</text>
<rect x="340" y="330" width="220" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="340" y="330" width="220" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="341" y="348" width="218" height="12" fill="#eff6ff"/>
<text x="352" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Sandbox manager</text>
<text x="352" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one sandbox pod per run,</text>
<text x="352" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">started from the last</text>
<text x="352" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">snapshot</text>
<rect x="590" y="330" width="470" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="590" y="330" width="470" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="591" y="348" width="468" height="12" fill="#f8fafc"/>
<text x="602" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">State stores</text>
<text x="602" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">session database: context log, summaries, snapshots index, ledger</text>
<text x="602" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">object storage: workspace snapshots (content-addressed)</text>
<text x="602" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">engine database: histories</text>
<rect x="340" y="460" width="720" height="55" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="340" y="460" width="720" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="341" y="478" width="718" height="12" fill="#f8fafc"/>
<text x="352" y="480" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Every component above is stateless except the three stores</text>
<rect x="1110" y="30" width="290" height="500" rx="14" fill="#fef2f2" fill-opacity=".55" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="1124" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#991b1b">OUTSIDE THE PLATFORM</text>
<rect x="1130" y="70" width="250" height="110" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="1130" y="70" width="250" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="1131" y="88" width="248" height="12" fill="#fef2f2"/>
<text x="1142" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Model provider</text>
<text x="1142" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">primary and fallback;</text>
<text x="1142" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">fails for minutes at a time</text>
<text x="1142" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(stand-in, scripted)</text>
<rect x="1130" y="210" width="250" height="130" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="1130" y="210" width="250" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="1131" y="228" width="248" height="12" fill="#fef2f2"/>
<text x="1142" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Git host</text>
<text x="1142" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">branches, pull requests,</text>
<text x="1142" y="275" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">comments; can lose its</text>
<text x="1142" y="292" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">answer after acting</text>
<text x="1142" y="309" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(stand-in)</text>
<rect x="1130" y="370" width="250" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1130" y="370" width="250" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1131" y="388" width="248" height="12" fill="#f8fafc"/>
<text x="1142" y="390" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Object storage (S3)</text>
<text x="1142" y="418" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">snapshots, one bucket</text>
<path d="M270 125 L340 115" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M270 255 L320 255 L320 175 L340 120" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M270 390 L320 390 L320 130 L340 105" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>

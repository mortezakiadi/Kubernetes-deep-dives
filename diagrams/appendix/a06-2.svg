<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="760px" viewBox="0 0 1420 760" style="background:#ffffff"><title>Two regions, one core network, seven VPCs</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="760" fill="#ffffff"/><rect x="20" y="20" width="1380" height="720" rx="14" fill="#f8fafc" fill-opacity=".55" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="44" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#334155">AWS ACCOUNT</text>
<rect x="560" y="60" width="300" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="560" y="60" width="300" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="561" y="78" width="298" height="12" fill="#fffbeb"/>
<text x="572" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Core network (Cloud WAN)</text>
<text x="572" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">one policy, an edge in each region</text>
<text x="572" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">segments: prod, nonprod, shared,</text>
<text x="572" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">hybrid, sandbox</text>
<rect x="40" y="215" width="650" height="500" rx="14" fill="#eff6ff" fill-opacity=".55" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="54" y="239" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#1e40af">us-east-1 (main)</text>
<rect x="60" y="260" width="300" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="60" y="260" width="300" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="61" y="278" width="298" height="12" fill="#ecfdf5"/>
<text x="72" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">prod-main</text>
<text x="72" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">EKS cluster, 4 nodes in 3 zones</text>
<text x="72" y="325" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">10.60.0.0/16 from IPAM</text>
<text x="72" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">pods on 100.64.0.0/16, NAT</text>
<rect x="380" y="260" width="290" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="380" y="260" width="290" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="381" y="278" width="288" height="12" fill="#ecfdf5"/>
<text x="392" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">shared-main</text>
<text x="392" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">test host, private DNS zone</text>
<text x="392" y="325" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">DNS resolver endpoints</text>
<text x="392" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">10.61.1.0/24 from IPAM</text>
<rect x="60" y="400" width="300" height="100" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="60" y="400" width="300" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="61" y="418" width="298" height="12" fill="#ecfdf5"/>
<text x="72" y="420" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">nonprod-main</text>
<text x="72" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">test host, 10.61.0.0/24</text>
<rect x="380" y="400" width="290" height="100" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="380" y="400" width="290" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="381" y="418" width="288" height="12" fill="#fef2f2"/>
<text x="392" y="420" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">legacy-main</text>
<text x="392" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">test host, 10.60.0.0/16 by hand</text>
<text x="392" y="465" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">not on the core network</text>
<rect x="60" y="520" width="610" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="60" y="520" width="610" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="61" y="538" width="608" height="12" fill="#f8fafc"/>
<text x="72" y="540" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Also in this region</text>
<text x="72" y="568" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">VPC Lattice service network with the Gateway API controller</text>
<text x="72" y="585" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">internal application load balancer, S3 gateway endpoint, NAT gateway</text>
<rect x="730" y="215" width="650" height="500" rx="14" fill="#eff6ff" fill-opacity=".55" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="744" y="239" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#1e40af">eu-west-1 (second)</text>
<rect x="750" y="260" width="300" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="750" y="260" width="300" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="751" y="278" width="298" height="12" fill="#ecfdf5"/>
<text x="762" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">prod-second</text>
<text x="762" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">EKS cluster, 3 nodes in 3 zones</text>
<text x="762" y="325" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">10.62.0.0/16 from IPAM</text>
<text x="762" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Cilium chained behind the VPC CNI</text>
<rect x="1070" y="260" width="290" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="1070" y="260" width="290" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="1071" y="278" width="288" height="12" fill="#ecfdf5"/>
<text x="1082" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">hybrid-second</text>
<text x="1082" y="308" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">stand-in for the data center</text>
<text x="1082" y="325" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a DNS server (dnsmasq)</text>
<text x="1082" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">10.63.0.0/24 from IPAM</text>
<rect x="750" y="400" width="300" height="100" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="750" y="400" width="300" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="751" y="418" width="298" height="12" fill="#ecfdf5"/>
<text x="762" y="420" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">sandbox-second</text>
<text x="762" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">test host, 10.63.1.0/24</text>
<rect x="1070" y="400" width="290" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1070" y="400" width="290" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1071" y="418" width="288" height="12" fill="#f8fafc"/>
<text x="1082" y="420" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Also in this region</text>
<text x="1082" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">internal load balancer,</text>
<text x="1082" y="465" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">outbound DNS resolver endpoint</text>
<path d="M210 260 L590 180" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<path d="M525 260 L680 180" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<path d="M900 260 L790 180" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<path d="M1215 260 L840 180" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<text x="60" y="630" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">nonprod-main and sandbox-second are attached the same way (an attachment tagged with its segment). legacy-main is not attached.</text>
<text x="60" y="650" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Why eu-west-1 and not us-west-2: the account already had eight VPCs in us-west-2 (limit ten); this region had room.</text>
<text x="60" y="672" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">The two cluster VPCs both use 100.64.0.0/16 for pods. The legacy VPC copies production's range on purpose.</text></svg>
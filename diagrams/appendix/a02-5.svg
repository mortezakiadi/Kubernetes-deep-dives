<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="450px" viewBox="0 0 1420 450" style="background:#ffffff"><title>The path of one question: user, agent, platform, sandbox and the outside world</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="450" fill="#ffffff"/><rect x="20" y="190" width="170" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="20" y="190" width="170" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="21" y="208" width="168" height="12" fill="#f8fafc"/>
<text x="32" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">User</text>
<text x="32" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">types in the agent's</text>
<text x="32" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">chat window</text>
<text x="32" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(not built here)</text>
<rect x="260" y="190" width="220" height="120" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="260" y="190" width="220" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="261" y="208" width="218" height="12" fill="#ecfdf5"/>
<text x="272" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Agent (orchestrator)</text>
<text x="272" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">software in an ordinary pod</text>
<text x="272" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">decides what to do next</text>
<text x="272" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">and calls the platform</text>
<rect x="260" y="30" width="220" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="260" y="30" width="220" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="261" y="48" width="218" height="12" fill="#f8fafc"/>
<text x="272" y="50" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Language model</text>
<text x="272" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">asked what to do next</text>
<text x="272" y="95" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">(not in this test)</text>
<rect x="550" y="150" width="300" height="260" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="550" y="150" width="300" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="551" y="168" width="298" height="12" fill="#ecfdf5"/>
<text x="562" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Platform</text>
<text x="562" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">trusted services the company runs</text>
<text x="562" y="215" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Manager: opens and closes sessions</text>
<text x="562" y="232" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Router: carries code in, output back</text>
<text x="562" y="249" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Tool gateway: tools and approvals</text>
<text x="562" y="266" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Egress gateway: the one way out</text>
<text x="562" y="283" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Credential broker: short-lived keys</text>
<text x="562" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Controller: keeps sandboxes ready</text>
<text x="562" y="317" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Audit log: one line per event</text>
<rect x="910" y="190" width="200" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="910" y="190" width="200" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="911" y="208" width="198" height="12" fill="#fef2f2"/>
<text x="922" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Sandbox</text>
<text x="922" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">its own microVM and kernel</text>
<text x="922" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">runs the agent's script</text>
<text x="922" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">no secrets inside</text>
<rect x="1180" y="150" width="220" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1180" y="150" width="220" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1181" y="168" width="218" height="12" fill="#f8fafc"/>
<text x="1192" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Company services</text>
<text x="1192" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">internal APIs; the test</text>
<text x="1192" y="215" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">uses a metrics API</text>
<rect x="1180" y="290" width="220" height="90" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1180" y="290" width="220" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1181" y="308" width="218" height="12" fill="#f8fafc"/>
<text x="1192" y="310" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Internet</text>
<text x="1192" y="338" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">approved sites only</text>

<text x="20" y="360" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">Dashed boxes are outside what this appendix builds.</text>
<text x="20" y="378" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">Green arrows: calls the platform lets through.</text>
<text x="20" y="396" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">Numbers match the steps below the picture.</text></svg>
<circle cx="880" cy="225" r="12" fill="#1e293b"/><text x="880" y="229.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">6</text>
<path d="M850 170 L1180 170" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<circle cx="1015" cy="170" r="12" fill="#1e293b"/><text x="1015" y="174.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">7</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="780px" viewBox="0 0 1420 780" style="background:#ffffff"><title>Nodes in the VPC can talk; what may talk is decided at the pod level</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="780" fill="#ffffff"/><rect x="30" y="20" width="1360" height="58" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="46" y="44" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">VPC level (security groups): wide open between the two groups of nodes</text>
<text x="46" y="64" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Every platform node may connect to every sandbox node, on every port, in both directions.</text>
<rect x="1275" y="34" width="33.8" height="16" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
<text x="1291.9" y="46" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#92400e">AWS</text>
<rect x="1327" y="34" width="40.4" height="16" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="1347.2" y="46" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">Ours</text>
<rect x="30" y="100" width="370" height="520" rx="14" fill="#ecfdf5" fill-opacity=".55" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="44" y="124" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#065f46">PLATFORM NODES (cluster security group)</text>
<rect x="960" y="100" width="430" height="520" rx="14" fill="#fef2f2" fill-opacity=".55" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="974" y="124" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#991b1b">SANDBOX NODES (sandbox security group)</text>
<rect x="60" y="140" width="310" height="54" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="76" y="172" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Orchestrator pod</text>
<rect x="60" y="218" width="310" height="54" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="76" y="250" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Manager pod</text>
<rect x="60" y="296" width="310" height="54" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="76" y="328" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Tool gateway pod</text>
<rect x="60" y="374" width="310" height="54" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2.2"/>
<text x="76" y="406" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">Router pod</text>
<rect x="60" y="452" width="310" height="54" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2.2"/>
<text x="76" y="484" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">Egress gateway pod</text>
<rect x="60" y="530" width="310" height="54" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<text x="76" y="562" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Credential broker pod</text>
<rect x="1000" y="360" width="350" height="130" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2.2"/>
<text x="1016" y="390" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Sandbox A (a pod, its own microVM)</text>
<text x="1016" y="412" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">default deny in both directions;</text>
<text x="1016" y="429" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">one rule in, one rule out</text>
<rect x="1000" y="540" width="350" height="70" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
<text x="1016" y="580" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Sandbox B (another session)</text>
<path d="M370 396 L1000 396" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="526.0" y="377" width="318.0" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="685" y="389" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669">8080 and 9090: only the router's pods are admitted</text>
<path d="M1000 474 L370 474" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="519.8" y="455" width="330.40000000000003" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="685" y="467" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669">3128: a sandbox may reach only the gateway's address</text>
<path d="M370 167 L1000 366" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-bad)"/>
<circle cx="685" cy="266.5" r="9" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M681 262.5 L689 270.5 M689 262.5 L681 270.5" stroke="#dc2626" stroke-width="2.2"/>
<path d="M370 245 L1000 374" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-bad)"/>
<circle cx="685" cy="309.5" r="9" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M681 305.5 L689 313.5 M689 305.5 L681 313.5" stroke="#dc2626" stroke-width="2.2"/>
<path d="M370 323 L1000 382" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-bad)"/>
<circle cx="685" cy="352.5" r="9" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M681 348.5 L689 356.5 M689 348.5 L681 356.5" stroke="#dc2626" stroke-width="2.2"/>
<text x="720" y="190" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">refused by Sandbox A's ingress rule:</text>
<text x="720" y="207" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#991b1b">only the router's pods are named (S05 tries the orchestrator)</text>
<path d="M1175 490 L1175 540" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-bad)"/>
<circle cx="1175" cy="515" r="9" fill="#fff" stroke="#dc2626" stroke-width="2"/><path d="M1171 511 L1179 519 M1179 511 L1171 519" stroke="#dc2626" stroke-width="2.2"/>
<text x="1195" y="519" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">refused: sandbox to sandbox (S05)</text>
<rect x="30" y="640" width="1360" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="46" y="666" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Pod level (network policy): the narrow control</text>
<text x="46" y="688" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">A sandbox admits only the router's pods and may reach only the gateway on port 3128. Every other path drawn here is refused,</text>
<text x="46" y="706" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">even though the security groups would let the nodes carry it. The security group is the coarse outer wall. This is the specific one.</text>
<text x="46" y="730" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">Green: allowed. Red dashed: refused.</text>
<rect x="1223" y="654" width="33.8" height="16" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="1239.9" y="666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af">K8s</text>
<rect x="1275" y="654" width="33.8" height="16" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
<text x="1291.9" y="666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#92400e">AWS</text>
<rect x="1327" y="654" width="40.4" height="16" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
<text x="1347.2" y="666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">Ours</text></svg>
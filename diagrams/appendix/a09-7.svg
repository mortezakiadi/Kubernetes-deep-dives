<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="500px" viewBox="0 0 1420 500" style="background:#ffffff"><title>Primary rollouts own the environment capacity; branches borrow it</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs><rect width="1420" height="500" fill="#ffffff"/><rect x="20" y="30" width="1380" height="200" rx="14" fill="#fffbeb" fill-opacity=".55" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="34" y="54" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#92400e">COHORT rl-envs</text>
<rect x="40" y="70" width="420" height="140" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="40" y="70" width="420" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="41" y="88" width="418" height="12" fill="#ecfdf5"/>
<text x="52" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">ClusterQueue rollouts</text>
<text x="52" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">nominal quota: 6 vCPU, 12 GiB (12 environments)</text>
<text x="52" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reclaimWithinCohort: Any</text>
<text x="52" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">priority class primary = 1000</text>
<rect x="500" y="70" width="420" height="140" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="500" y="70" width="420" height="30" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="501" y="88" width="418" height="12" fill="#f5f3ff"/>
<text x="512" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5b21b6">ClusterQueue branches</text>
<text x="512" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">nominal quota: 0; may borrow all of it</text>
<text x="512" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reclaimWithinCohort: Never</text>
<text x="512" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">priority class branch-low = 100</text>
<text x="512" y="169" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the credit worker submits here</text>
<rect x="960" y="70" width="420" height="140" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="960" y="70" width="420" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="961" y="88" width="418" height="12" fill="#f8fafc"/>
<text x="972" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">ResourceFlavor env-cpu</text>
<text x="972" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">nodeLabels ds08/pool=system</text>
<text x="972" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">environment pods: 500m CPU, 512 MiB,</text>
<text x="972" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">restricted, no token, no identity</text>
<text x="40" y="270" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">What S11 does, in time order</text>
<circle cx="60" cy="301" r="7" fill="#7c3aed"/>
<text x="80" y="305" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7c3aed">t0</text>
<text x="140" y="305" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">12 branch pods are admitted on borrowed capacity</text>
<circle cx="60" cy="341" r="7" fill="#334155"/>
<text x="80" y="345" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">t1</text>
<text x="140" y="345" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">a primary rollout is submitted</text>
<circle cx="60" cy="381" r="7" fill="#dc2626"/>
<text x="80" y="385" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#dc2626">t1+</text>
<text x="140" y="385" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">Kueue preempts the branch job to admit it</text>
<circle cx="60" cy="421" r="7" fill="#059669"/>
<text x="80" y="425" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#059669">t2</text>
<text x="140" y="425" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#334155">the primary rollout finishes; the branches are admitted again</text></svg>
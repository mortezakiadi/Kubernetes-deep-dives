<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="400px" viewBox="0 0 1420 400" style="background:#ffffff"><title>Guarded judging: rules first, two judges, abstain on disagreement</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker></defs><rect width="1420" height="400" fill="#ffffff"/><rect x="30" y="120" width="220" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="30" y="120" width="220" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="31" y="138" width="218" height="12" fill="#f8fafc"/>
<text x="42" y="140" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">An answer</text>
<text x="42" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">only the final text;</text>
<text x="42" y="185" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the judges never see</text>
<text x="42" y="202" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the reasoning</text>
<rect x="300" y="30" width="320" height="120" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="300" y="30" width="320" height="30" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<rect x="301" y="48" width="318" height="12" fill="#fffbeb"/>
<text x="312" y="50" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">Rules first</text>
<text x="312" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">&lt; 20 characters or an opener: FAIL</text>
<text x="312" y="95" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">addresses the grader: ABSTAIN</text>
<text x="312" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">&gt; 250 words: FAIL</text>
<rect x="300" y="200" width="320" height="140" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="300" y="200" width="320" height="30" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="301" y="218" width="318" height="12" fill="#f5f3ff"/>
<text x="312" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5b21b6">Two judges, same rubric</text>
<text x="312" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Qwen2.5-7B and Mistral-7B, each with</text>
<text x="312" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">the reference answer and yes/no</text>
<text x="312" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">criteria; score = share of yes</text>
<rect x="680" y="200" width="320" height="140" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="680" y="200" width="320" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="681" y="218" width="318" height="12" fill="#eff6ff"/>
<text x="692" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Agreement rule</text>
<text x="692" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">|a - b| &gt; 0.3: ABSTAIN (review)</text>
<text x="692" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">min(a, b) &gt;= 0.7: PASS</text>
<text x="692" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">otherwise FAIL</text>
<rect x="1060" y="120" width="330" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect x="1060" y="120" width="330" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="1061" y="138" width="328" height="12" fill="#fef2f2"/>
<text x="1072" y="140" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Compared in S06</text>
<text x="1072" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">judge-single@1.0.0: one judge,</text>
<text x="1072" y="185" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">a bare 0-10 score, no reference</text>
<path d="M250 180 L300 90" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<path d="M460 150 L460 200" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<rect x="486.4" y="167" width="107.2" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="540" y="179" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155">passed the rules</text>
<path d="M620 270 L680 270" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/></svg>
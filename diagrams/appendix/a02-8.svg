<svg xmlns="http://www.w3.org/2000/svg" width="1420px" height="500px" viewBox="0 0 1420 500" style="background:#ffffff"><title>Egress gateway on Envoy: one listener, a pass-through tunnel, and a loopback listener that injects the credential</title><defs><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker><marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="1420" height="500" fill="#ffffff"/><rect x="20" y="200" width="200" height="120" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="20" y="200" width="200" height="30" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<rect x="21" y="218" width="198" height="12" fill="#fef2f2"/>
<text x="32" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#991b1b">Sandbox</text>
<text x="32" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">HTTPS_PROXY = the gateway</text>
<text x="32" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">sends CONNECT host:443</text>
<text x="32" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">holds only a placeholder</text>
<rect x="270" y="60" width="380" height="400" rx="14" fill="#eff6ff" fill-opacity=".55" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="284" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".06em" fill="#1e40af">ENVOY (the gateway pod)</text>
<rect x="290" y="100" width="340" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="290" y="100" width="340" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="291" y="118" width="338" height="12" fill="#eff6ff"/>
<text x="302" y="120" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Listener :3128</text>
<text x="302" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">accepts CONNECT, asks the policy</text>
<text x="302" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">service, then opens a tunnel</text>
<text x="302" y="182" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">no TLS is ended for ordinary hosts</text>
<rect x="290" y="300" width="340" height="130" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="290" y="300" width="340" height="30" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="291" y="318" width="338" height="12" fill="#eff6ff"/>
<text x="302" y="320" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">Loopback listener :8443</text>
<text x="302" y="348" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">only for the host that needs a key</text>
<text x="302" y="365" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ends TLS, adds the Authorization header</text>
<text x="302" y="382" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">reachable from inside the pod only</text>
<text x="302" y="399" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">PROXY protocol keeps the sandbox's address</text>
<rect x="720" y="100" width="260" height="260" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/>
<rect x="720" y="100" width="260" height="30" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<rect x="721" y="118" width="258" height="12" fill="#ecfdf5"/>
<text x="732" y="120" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#065f46">Policy service (gRPC)</text>
<text x="732" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">which session owns this source</text>
<text x="732" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">address? is the host on its list?</text>
<text x="732" y="182" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">over its rate limit?</text>
<text x="732" y="199" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">returns the session ID, always</text>
<text x="732" y="216" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">second check: asks the broker and</text>
<text x="732" y="233" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">returns the Authorization header</text>
<rect x="720" y="405" width="260" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="720" y="405" width="260" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="721" y="423" width="258" height="12" fill="#f8fafc"/>
<text x="732" y="425" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Manager and broker</text>
<text x="732" y="453" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">lab: a table of sessions</text>
<rect x="1050" y="100" width="330" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1050" y="100" width="330" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1051" y="118" width="328" height="12" fill="#f8fafc"/>
<text x="1062" y="120" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Allowlisted site</text>
<text x="1062" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">TLS runs between the sandbox</text>
<text x="1062" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">and the site. Envoy cannot read it.</text>
<rect x="1050" y="300" width="330" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1050" y="300" width="330" height="30" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="1051" y="318" width="328" height="12" fill="#f8fafc"/>
<text x="1062" y="320" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Internal API</text>
<text x="1062" y="348" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">sees the real credential,</text>
<text x="1062" y="365" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">never the placeholder</text>
<text x="1062" y="382" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">refuses a call without one</text>
<path d="M220 255 L255 255 L255 155 L290 155" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a-flow)"/>
<circle cx="255" cy="205" r="12" fill="#1e293b"/><text x="255" y="209.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">1</text>
<path d="M630 155 L720 155" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)" marker-start="url(#a-blue)"/>
<circle cx="675" cy="155" r="12" fill="#1e293b"/><text x="675" y="159.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">2</text>
<path d="M460 100 L460 40 L1215 40 L1215 100" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="777.1" y="32" width="125.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="840" y="44" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669">pass-through tunnel</text>
<circle cx="1100" cy="40" r="12" fill="#1e293b"/><text x="1100" y="44.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">3</text>
<path d="M460 210 L460 300" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>
<rect x="412.6" y="247" width="94.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="460" y="259" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2563eb">PROXY protocol</text>
<circle cx="445" cy="235" r="12" fill="#1e293b"/><text x="445" y="239.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">4</text>
<path d="M630 330 L720 330" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)" marker-start="url(#a-blue)"/>
<circle cx="675" cy="330" r="12" fill="#1e293b"/><text x="675" y="334.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">5</text>
<path d="M630 385 L1050 385" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#a-ok)"/>
<rect x="692.6" y="367" width="94.8" height="16" rx="3" fill="#fff" fill-opacity=".92"/>
<text x="740" y="379" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#059669">real key added</text>
<circle cx="1000" cy="385" r="12" fill="#1e293b"/><text x="1000" y="389.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">6</text>
<path d="M850 360 L850 405" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)" marker-start="url(#a-muted)"/>
<text x="20" y="380" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">Numbers match the text under the picture.</text>
<text x="20" y="398" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b">Blue: the gateway. Green: its policy service.</text></svg>
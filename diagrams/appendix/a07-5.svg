<text x="842" y="400" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Registry and evaluation</text>
<text x="842" y="428" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">registry/assistant-v1/&lt;stage&gt;/&lt;run_id&gt;/: the model and entry.json</text>
<text x="842" y="445" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">entry.json: recipe hash, Git commit, base (reference and what it</text>
<text x="842" y="462" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">resolved to), every dataset's content hash, image digest, code hash</text>
<text x="842" y="479" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">status: candidate -&gt; promoted or blocked (with every check)</text>
<text x="842" y="496" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">evals/by-model/&lt;run_id&gt;.json: math, code, casual, harmful,</text>
<text x="842" y="513" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">safe-scary suites, greedy, the same for every model</text>
<text x="842" y="530" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">registry://assistant-v1/sft@promoted resolves to the newest</text>
<text x="842" y="547" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">promoted SFT entry at launch, and is recorded as such</text></svg>
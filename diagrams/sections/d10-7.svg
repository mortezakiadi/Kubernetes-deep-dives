<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" >Zones: what stays in one zone, what spreads over zones, and what a crossing costs</text>
<text x="24" y="58" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start" >Illustrative: three zones and seven GPU nodes. The zone names are examples. Prices are AWS's, from the pages named in the text.</text>

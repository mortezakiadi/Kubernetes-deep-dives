<text x="842" y="224" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e08a1e" text-anchor="start" >Where the GPUs are</text>
<text x="842" y="246" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >A Capacity Block is bought for one</text>
<text x="842" y="263" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >zone, and its offer names that zone.</text>
<text x="842" y="280" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >Which zone has GPUs is a purchase</text>
<text x="842" y="297" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >question as well as a scheduling one.</text>
<text x="24" y="482" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >Illustrative: the number of zones and nodes, the zone names and which node holds which pod. Sourced: EFA traffic cannot cross zones or VPCs (AWS EFA</text>
<text x="24" y="500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >page); data between zones in one Region is $0.01/GB in each direction and free inside one zone (AWS EC2 pricing page); FSx for Lustre has no data charge</text>
<text x="24" y="518" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >from its preferred zone and $0.01/GB in each direction from another zone (AWS FSx pricing page); the FSx storage class takes one subnet (AWS EKS FSx</text>
<text x="24" y="536" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >page); a topology spread constraint on the zone label keeps serving replicas even (Kubernetes and AWS EKS pages). No latency or bandwidth figure between</text>
<text x="24" y="554" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >zones was found.</text>
</svg>

<text x="48" y="424" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="48" dy="0" font-weight="400" fill="#1f2933">VolumeBinding</tspan><tspan x="48" dy="16.5" font-weight="400" fill="#1f2933">DynamicResources</tspan></text>

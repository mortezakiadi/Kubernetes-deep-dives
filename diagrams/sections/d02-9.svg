<text x="508" y="178" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="508" dy="0" font-weight="400" fill="#1f2933">NodeResourcesFit · NodeName</tspan><tspan x="508" dy="16.5" font-weight="400" fill="#1f2933">NodePorts · NodeUnschedulable</tspan><tspan x="508" dy="16.5" font-weight="400" fill="#1f2933">NodeAffinity · TaintToleration</tspan><tspan x="508" dy="16.5" font-weight="400" fill="#1f2933">PodTopologySpread</tspan><tspan x="508" dy="16.5" font-weight="400" fill="#1f2933">InterPodAffinity</tspan><tspan x="508" dy="16.5" font-weight="400" fill="#1f2933">volume checks</tspan><tspan x="508" dy="16.5" font-weight="400" fill="#1f2933">DynamicResources</tspan></text>

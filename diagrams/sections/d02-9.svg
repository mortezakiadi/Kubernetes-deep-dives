<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0" font-weight="700" fill="#1f2933">Inside kube-scheduler: the stages, and the config that drives them</tspan></text>
<text x="24" y="62" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start"><tspan x="24" dy="0" font-weight="400" fill="#5b6675">Every pod passes through these stages in order. Each stage is filled with plugins; the KubeSchedulerConfiguration decides which ones run and how.</tspan></text>

<text x="302" y="397" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="302" dy="0" font-weight="700" fill="#1f2933">permit</tspan></text>

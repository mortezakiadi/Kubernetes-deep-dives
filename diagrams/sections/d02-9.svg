<rect x="24.0" y="520" width="366.6666666666667" height="128" rx="10" fill="#fff3d6" stroke="#d48a1c" stroke-width="1.6"/>
<text x="40.0" y="546" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a5b06" text-anchor="start"><tspan x="40.0" dy="0" font-weight="700" fill="#9a5b06">profiles[]</tspan></text>
<text x="40.0" y="570" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="40.0" dy="0" font-weight="400" fill="#1f2933">One entry per scheduler name.</tspan><tspan x="40.0" dy="17" font-weight="400" fill="#1f2933">A pod picks one with schedulerName;</tspan><tspan x="40.0" dy="17" font-weight="400" fill="#1f2933">one kube-scheduler can serve several.</tspan></text>
<rect x="406.6666666666667" y="520" width="366.6666666666667" height="128" rx="10" fill="#fff3d6" stroke="#d48a1c" stroke-width="1.6"/>
<text x="422.6666666666667" y="546" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a5b06" text-anchor="start"><tspan x="422.6666666666667" dy="0" font-weight="700" fill="#9a5b06">plugins</tspan></text>
<text x="422.6666666666667" y="570" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="422.6666666666667" dy="0" font-weight="400" fill="#1f2933">Per STAGE: which plugins are</tspan><tspan x="422.6666666666667" dy="17" font-weight="400" fill="#1f2933">enabled or disabled.</tspan><tspan x="422.6666666666667" dy="17" font-weight="400" fill="#1f2933">Under score: weight = how much this</tspan><tspan x="422.6666666666667" dy="17" font-weight="400" fill="#1f2933">plugin counts in the total.</tspan></text>
<rect x="789.3333333333334" y="520" width="366.6666666666667" height="128" rx="10" fill="#fff3d6" stroke="#d48a1c" stroke-width="1.6"/>
<text x="805.3333333333334" y="546" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a5b06" text-anchor="start"><tspan x="805.3333333333334" dy="0" font-weight="700" fill="#9a5b06">pluginConfig</tspan></text>
<text x="805.3333333333334" y="570" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="805.3333333333334" dy="0" font-weight="400" fill="#1f2933">Per PLUGIN: its args, i.e. how it</tspan><tspan x="805.3333333333334" dy="17" font-weight="400" fill="#1f2933">calculates (e.g. scoringStrategy,</tspan><tspan x="805.3333333333334" dy="17" font-weight="400" fill="#1f2933">resources). Only some plugins</tspan><tspan x="805.3333333333334" dy="17" font-weight="400" fill="#1f2933">have args; list only what you change.</tspan></text>
</svg>
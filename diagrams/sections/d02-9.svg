<rect x="24" y="342" width="1132" height="136" rx="14" fill="#f6f8fb" stroke="#7b8794" stroke-width="1.6"/>
<text x="66" y="362" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7b8794" text-anchor="start"><tspan x="66" dy="0" font-weight="700" fill="#7b8794">End of the scheduling cycle (reserve, permit), then the binding cycle (runs in the background so the next pod can start)</tspan></text>

nts: all; white-space: nowrap; ">By default k8s network policies support limited set of rules like<div>IP, port, protocol, podSelector and namespace selector.</div><div>When we use external APIs like OpenAI or Claude, we want more</div><div>advanced settings like DNS based policies and globall </div><div>policy accross all namespaces.</div><div>Cilium and Calico can help on that part</div></div></div></div></foreignObject></switch></g></g></g></g></g></g><switch><g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/><a transform="translate(0,-5)" xlink:href="https://www.drawio.com/doc/faq/svg-export-text-problems" target="_blank"><text text-anchor="middle" font-size="10px" x="50%" y="100%">Text is not SVG - cannot display</text></a></switch></svg>
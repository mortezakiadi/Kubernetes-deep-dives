<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 636" width="1180" height="636" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs>
<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0" font-weight="700" fill="#1f2933">Different GPUs in one server, and MIG</tspan></text>
<rect x="24" y="50" width="53" height="22" rx="11" fill="#0f766e"/>
<text x="50.5" y="65.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="50.5" dy="0" font-weight="700" fill="#ffffff">DRA</tspan></text>
<text x="89" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start"><tspan x="89" dy="0" font-weight="400" fill="#5b6675">Labels and counts describe a node as a whole; DRA describes each GPU or slice.</tspan></text>
<rect x="24" y="86" width="556" height="150" rx="14" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="38" y="108" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="start"><tspan x="38" dy="0" font-weight="700" fill="#e08a1e">Mixed server: 1 × A100 80 GB + 1 × T4 16 GB</tspan></text>
<rect x="600" y="86" width="556" height="150" rx="14" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="614" y="108" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="start"><tspan x="614" dy="0" font-weight="700" fill="#e08a1e">H100 80 GB split with MIG</tspan></text>
<rect x="60" y="124" width="220" height="90" rx="8" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6"/>
<text x="170.0" y="164.66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="170.0" dy="0" font-weight="700" fill="#1f2933">A100</tspan><tspan x="170.0" dy="18.76" font-weight="400" fill="#1f2933">80 GB</tspan></text>
<rect x="310" y="124" width="220" height="90" rx="8" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6"/>
<text x="420.0" y="164.66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="420.0" dy="0" font-weight="700" fill="#1f2933">T4</tspan><tspan x="420.0" dy="18.76" font-weight="400" fill="#1f2933">16 GB</tspan></text>
<rect x="624" y="124" width="216" height="86" rx="8" fill="#fff3d6" stroke="#d48a1c" stroke-width="1.6"/>
<text x="732.0" y="166" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="732.0" dy="0" font-weight="700" fill="#1f2933">3g.40gb</tspan></text>
<text x="732.0" y="188" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="middle"><tspan x="732.0" dy="0" font-weight="400" fill="#5b6675">3/7</tspan></text>
<rect x="846" y="124" width="142" height="86" rx="8" fill="#fff3d6" stroke="#d48a1c" stroke-width="1.6"/>
<text x="917.0" y="166" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="917.0" dy="0" font-weight="700" fill="#1f2933">2g.20gb</tspan></text>
<text x="917.0" y="188" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="middle"><tspan x="917.0" dy="0" font-weight="400" fill="#5b6675">2/7</tspan></text>
<rect x="994" y="124" width="68" height="86" rx="8" fill="#fff3d6" stroke="#d48a1c" stroke-width="1.6"/>
<text x="1028.0" y="166" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="1028.0" dy="0" font-weight="700" fill="#1f2933">1g.10gb</tspan></text>
<text x="1028.0" y="188" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="middle"><tspan x="1028.0" dy="0" font-weight="400" fill="#5b6675">1/7</tspan></text>
<rect x="1068" y="124" width="68" height="86" rx="8" fill="#fff3d6" stroke="#d48a1c" stroke-width="1.6"/>
<text x="1102.0" y="166" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="1102.0" dy="0" font-weight="700" fill="#1f2933">1g.10gb</tspan></text>
<text x="1102.0" y="188" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6675" text-anchor="middle"><tspan x="1102.0" dy="0" font-weight="400" fill="#5b6675">1/7</tspan></text>
<text x="624" y="228" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6675" text-anchor="start"><tspan x="624" dy="0" font-weight="400" fill="#5b6675">Share of the GPU's compute (7 units)</tspan></text>
<rect x="24" y="256" width="556" height="90" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.6"/>
<rect x="38" y="270" width="71" height="22" rx="11" fill="#1e4fb8"/>
<text x="73.5" y="285.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="73.5" dy="0" font-weight="700" fill="#ffffff">LABEL</tspan></text>
<text x="121" y="286" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="121" dy="0" font-weight="700" fill="#1f2933">Node labels (GPU Feature Discovery)</tspan></text>
<text x="40" y="314" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0" font-weight="400" fill="#1f2933">One value per node: gpu.product and</tspan><tspan x="40" dy="17" font-weight="400" fill="#1f2933">gpu.memory can't describe both GPUs.</tspan></text>
<rect x="600" y="256" width="556" height="90" rx="10" fill="#e8f6ee" stroke="#2f9e5b" stroke-width="1.6"/>
<rect x="614" y="270" width="71" height="22" rx="11" fill="#1e4fb8"/>
<text x="649.5" y="285.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="649.5" dy="0" font-weight="700" fill="#ffffff">LABEL</tspan></text>
<text x="697" y="286" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="697" dy="0" font-weight="700" fill="#1f2933">Node labels (GPU Feature Discovery)</tspan></text>
<text x="616" y="314" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="616" dy="0" font-weight="400" fill="#1f2933">Information only: the MIG strategy and</tspan><tspan x="616" dy="17" font-weight="400" fill="#1f2933">how many slices of each size exist.</tspan></text>
<rect x="24" y="358" width="556" height="107" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.6"/>
<rect x="38" y="372" width="71" height="22" rx="11" fill="#c2410c"/>
<text x="73.5" y="387.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="73.5" dy="0" font-weight="700" fill="#ffffff">COUNT</tspan></text>
<text x="121" y="388" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="121" dy="0" font-weight="700" fill="#1f2933">Device plugin count</tspan></text>
<text x="40" y="416" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0" font-weight="400" fill="#1f2933">nvidia.com/gpu: 2. A pod asking for one</tspan><tspan x="40" dy="17" font-weight="400" fill="#1f2933">GPU may get the T4.</tspan></text>
<rect x="600" y="358" width="556" height="107" rx="10" fill="#e8f6ee" stroke="#2f9e5b" stroke-width="1.6"/>
<rect x="614" y="372" width="71" height="22" rx="11" fill="#c2410c"/>
<text x="649.5" y="387.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="649.5" dy="0" font-weight="700" fill="#ffffff">COUNT</tspan></text>
<text x="697" y="388" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="697" dy="0" font-weight="700" fill="#1f2933">Device plugin count</tspan></text>
<text x="616" y="416" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="616" dy="0" font-weight="400" fill="#1f2933">"mixed" strategy: mig-3g.40gb: 1,</tspan><tspan x="616" dy="17" font-weight="400" fill="#1f2933">mig-2g.20gb: 1, mig-1g.10gb: 2.</tspan><tspan x="616" dy="17" font-weight="400" fill="#1f2933">Layout fixed in advance.</tspan></text>
<rect x="24" y="477" width="556" height="107" rx="10" fill="#fff3d6" stroke="#d48a1c" stroke-width="1.6"/>
<rect x="38" y="491" width="53" height="22" rx="11" fill="#0f766e"/>
<text x="64.5" y="506.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="64.5" dy="0" font-weight="700" fill="#ffffff">DRA</tspan></text>
<text x="103" y="507" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="103" dy="0" font-weight="700" fill="#1f2933">DRA driver</tspan></text>
<text x="40" y="535" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0" font-weight="400" fill="#1f2933">gpu-0: A100, 80Gi · gpu-1: T4, 16Gi.</tspan><tspan x="40" dy="17" font-weight="400" fill="#1f2933">A claim for ≥ 40Gi only gets the A100.</tspan></text>
<rect x="600" y="477" width="556" height="107" rx="10" fill="#fff3d6" stroke="#d48a1c" stroke-width="1.6"/>
<rect x="614" y="491" width="53" height="22" rx="11" fill="#0f766e"/>
<text x="640.5" y="506.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="640.5" dy="0" font-weight="700" fill="#ffffff">DRA</tspan></text>
<text x="679" y="507" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="679" dy="0" font-weight="700" fill="#1f2933">DRA driver</tspan></text>
<text x="616" y="535" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="616" dy="0" font-weight="400" fill="#1f2933">4 devices under mig.nvidia.com, each with</tspan><tspan x="616" dy="17" font-weight="400" fill="#1f2933">its profile and memory. Alpha DynamicMIG</tspan><tspan x="616" dy="17" font-weight="400" fill="#1f2933">can create slices on demand.</tspan></text>
<text x="24" y="616" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0" font-weight="600" fill="#5b6675">Red: can't tell the GPUs apart · Green: works, with limits · Gold: describes each GPU or slice</tspan></text>
</svg>
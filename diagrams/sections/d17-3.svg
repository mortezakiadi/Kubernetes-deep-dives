<text x="420" y="843" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >One copy stream stops near 5 Gbps</text>
<text x="1136" y="843" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c0392b" text-anchor="end" >Regions, the WAN and failover</text>

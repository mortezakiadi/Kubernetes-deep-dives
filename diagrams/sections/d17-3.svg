<text x="1136" y="533" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c0392b" text-anchor="end" >Racks and network blocks</text>
<rect x="24" y="564" width="1132" height="82" rx="10" fill="#f6f8fb" stroke="#5b6675" stroke-width="1.4" stroke-dasharray="6 5" />

<rect x="36" y="292" width="28" height="28" rx="14.0" fill="#0f766e" stroke="#0f766e" stroke-width="0" />
<text x="50.0" y="310.9" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="76" y="310" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Server to server: the NIC</text>

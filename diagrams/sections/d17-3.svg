<text x="76" y="178" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >GPU to GPU in one server</text>
<rect x="410" y="154" width="736" height="28" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2" />
<text x="420" y="173" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >Step time rose when the job went from 1 to 4 servers (also rungs 3 to 5)</text>
<text x="1136" y="173" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c0392b" text-anchor="end" >What a training job asks of the cluster</text>
<rect x="24" y="212" width="1132" height="56" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.4" />
<rect x="36" y="226" width="28" height="28" rx="14.0" fill="#e08a1e" stroke="#e08a1e" stroke-width="0" />

<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" >Symptom to rung: where to look first</text>
<text x="24" y="58" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start" >The seven rungs are the distance ladder of Deep dive 15. The red tags are symptoms from the table. A tag is a place to look, not a diagnosis.</text>
<rect x="24" y="80" width="1132" height="56" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.4" />
<rect x="36" y="94" width="28" height="28" rx="14.0" fill="#3b6fd8" stroke="#3b6fd8" stroke-width="0" />
<text x="50.0" y="112.9" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="76" y="112" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Inside the GPU</text>
<text x="420" y="112" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >No symptom in the table for this rung.</text>
<rect x="24" y="146" width="1132" height="56" rx="10" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.4" />
<rect x="36" y="160" width="28" height="28" rx="14.0" fill="#2f9e5b" stroke="#2f9e5b" stroke-width="0" />

<text x="1136" y="683" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c0392b" text-anchor="end" >Regions, the WAN and failover</text>
<rect x="410" y="698" width="736" height="28" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2" />
<text x="420" y="717" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >After a failure the job restarts from old state</text>
<text x="1136" y="717" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c0392b" text-anchor="end" >Regions, the WAN and failover</text>
<rect x="24" y="748" width="1132" height="150" rx="10" fill="#f3eefc" stroke="#7a4fc4" stroke-width="1.4" />
<rect x="36" y="762" width="28" height="28" rx="14.0" fill="#7a4fc4" stroke="#7a4fc4" stroke-width="0" />

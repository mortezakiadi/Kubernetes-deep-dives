<text x="76" y="940" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Not a rung: image pull, weights, load</text>
<rect x="410" y="916" width="736" height="28" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2" />
<text x="420" y="935" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >A replica takes many minutes to become ready</text>
<text x="1136" y="935" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c0392b" text-anchor="end" >Serving and loading heavy models</text>
<text x="24" y="988" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >The bold words at the right end of a tag are the title of the section that explains the fix. The sections are in Deep dives 10, 15 and 16.</text>
<text x="24" y="1006" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >Dashed frame: a rung that Deep dive 15 has no speed figure for. Solid frame: a rung with a figure, or a place that is not a rung.</text>
</svg>

<text x="76" y="780" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Not a rung: the storage path</text>
<rect x="410" y="756" width="736" height="28" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2" />
<text x="420" y="775" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >Training throughput falls and the data loader may be the cause</text>
<text x="1136" y="775" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c0392b" text-anchor="end" >Training data and checkpoints</text>

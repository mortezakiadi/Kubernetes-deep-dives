<text x="420" y="877" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >A new FSx claim stays Pending</text>
<text x="1136" y="877" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c0392b" text-anchor="end" >No section yet: Appendix C</text>
<rect x="24" y="908" width="1132" height="56" rx="10" fill="#f3eefc" stroke="#7a4fc4" stroke-width="1.4" />
<rect x="36" y="922" width="28" height="28" rx="14.0" fill="#7a4fc4" stroke="#7a4fc4" stroke-width="0" />

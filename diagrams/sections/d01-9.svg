<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1246 700" width="1246" height="700" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs>
<text x="20" y="30" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="20" dy="0" font-weight="700" fill="#1f2933">How kube-scheduler's built-in plugins run, and where a second scheduler fits</tspan></text>
<rect x="20" y="52" width="230" height="58" rx="10" fill="#f4f6f8" stroke="#5b6675" stroke-width="1.5"/>
<text x="135" y="76" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="135" dy="0" font-weight="700" fill="#1f2933">Pending pod</tspan><tspan x="135" dy="17.55" font-weight="400" fill="#1f2933">spec.schedulerName decides</tspan></text>
<text x="326.0" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#374151" text-anchor="middle"><tspan x="326.0" dy="0" font-weight="700" fill="#374151">Queue sort</tspan></text>
<text x="499.5" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#374151" text-anchor="middle"><tspan x="499.5" dy="0" font-weight="700" fill="#374151">Filter</tspan></text>
<text x="681.0" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#374151" text-anchor="middle"><tspan x="681.0" dy="0" font-weight="700" fill="#374151">PostFilter</tspan></text>
<text x="857.5" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#374151" text-anchor="middle"><tspan x="857.5" dy="0" font-weight="700" fill="#374151">Score</tspan></text>
<text x="1035.0" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#374151" text-anchor="middle"><tspan x="1035.0" dy="0" font-weight="700" fill="#374151">Reserve / Permit</tspan></text>
<text x="1168.0" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#374151" text-anchor="middle"><tspan x="1168.0" dy="0" font-weight="700" fill="#374151">Bind</tspan></text>
<text x="262" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b7280" text-anchor="end"><tspan x="262" dy="0" font-weight="400" fill="#6b7280">stage →</tspan></text>
<rect x="14" y="152" width="1218" height="198" rx="14" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="26" y="180" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="26" dy="0" font-weight="700" fill="#1e4fb8">default-scheduler</tspan><tspan x="26" dy="17.55" font-weight="400" fill="#1f2933">kube-scheduler on the</tspan><tspan x="26" dy="17.55" font-weight="400" fill="#1f2933">control plane (EKS-managed)</tspan><tspan x="26" dy="17.55" font-weight="400" fill="#4b5563">most pods use this</tspan></text>
<rect x="270" y="164" width="112" height="174" rx="8" fill="#ffffff" stroke="#9fb4e6" stroke-width="1.5"/>
<text x="280" y="186" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="280" dy="0" font-weight="400" fill="#1f2933">PrioritySort</tspan><tspan x="280" dy="18.5" font-weight="400" fill="#1f2933">(higher priority</tspan><tspan x="280" dy="18.5" font-weight="400" fill="#1f2933">goes first)</tspan></text>
<rect x="392" y="164" width="215" height="174" rx="8" fill="#ffffff" stroke="#9fb4e6" stroke-width="1.5"/>
<text x="402" y="186" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="402" dy="0" font-weight="400" fill="#1f2933">NodeResourcesFit</tspan><tspan x="402" dy="18.5" font-weight="400" fill="#1f2933">NodeAffinity · NodeName</tspan><tspan x="402" dy="18.5" font-weight="400" fill="#1f2933">TaintToleration</tspan><tspan x="402" dy="18.5" font-weight="400" fill="#1f2933">NodePorts · NodeUnschedulable</tspan><tspan x="402" dy="18.5" font-weight="400" fill="#1f2933">InterPodAffinity</tspan><tspan x="402" dy="18.5" font-weight="400" fill="#1f2933">PodTopologySpread</tspan><tspan x="402" dy="18.5" font-weight="400" fill="#1f2933">Volume checks (4) · DRA</tspan></text>
<rect x="617" y="164" width="128" height="174" rx="8" fill="#ffffff" stroke="#9fb4e6" stroke-width="1.5"/>
<text x="627" y="186" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="627" dy="0" font-weight="400" fill="#1f2933">DefaultPreemption</tspan><tspan x="627" dy="18.5" font-weight="400" fill="#1f2933">(evict lower-</tspan><tspan x="627" dy="18.5" font-weight="400" fill="#1f2933">priority pods if</tspan><tspan x="627" dy="18.5" font-weight="400" fill="#1f2933">nothing fits)</tspan></text>
<rect x="755" y="164" width="205" height="174" rx="8" fill="#ffffff" stroke="#9fb4e6" stroke-width="1.5"/>
<text x="765" y="186" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="765" dy="0" font-weight="400" fill="#1f2933">NodeResourcesFit ×1 (spread)</tspan><tspan x="765" dy="18.5" font-weight="400" fill="#1f2933">BalancedAllocation ×1</tspan><tspan x="765" dy="18.5" font-weight="400" fill="#1f2933">ImageLocality ×1</tspan><tspan x="765" dy="18.5" font-weight="400" fill="#1f2933">NodeAffinity ×2</tspan><tspan x="765" dy="18.5" font-weight="400" fill="#1f2933">InterPodAffinity ×2</tspan><tspan x="765" dy="18.5" font-weight="400" fill="#1f2933">PodTopologySpread ×2</tspan><tspan x="765" dy="18.5" font-weight="400" fill="#1f2933">TaintToleration ×3</tspan></text>
<rect x="970" y="164" width="130" height="174" rx="8" fill="#ffffff" stroke="#9fb4e6" stroke-width="1.5"/>
<text x="980" y="186" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="980" dy="0" font-weight="400" fill="#1f2933">VolumeBinding</tspan><tspan x="980" dy="18.5" font-weight="400" fill="#1f2933">DynamicResources</tspan><tspan x="980" dy="18.5" font-weight="400" fill="#1f2933">(claim volumes,</tspan><tspan x="980" dy="18.5" font-weight="400" fill="#1f2933">devices)</tspan></text>
<rect x="1110" y="164" width="116" height="174" rx="8" fill="#ffffff" stroke="#9fb4e6" stroke-width="1.5"/>
<text x="1120" y="186" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="1120" dy="0" font-weight="400" fill="#1f2933">DefaultBinder</tspan><tspan x="1120" dy="18.5" font-weight="400" fill="#1f2933">(writes</tspan><tspan x="1120" dy="18.5" font-weight="400" fill="#1f2933">nodeName)</tspan></text>
<rect x="14" y="366" width="1218" height="118" rx="14" fill="#fdf4e5" stroke="#d48a1c" stroke-width="1.5"/>
<text x="26" y="392" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="26" dy="0" font-weight="700" fill="#9a5b06">affinity-first-scheduler</tspan><tspan x="26" dy="17.55" font-weight="400" fill="#1f2933">same kube-scheduler program,</tspan><tspan x="26" dy="17.55" font-weight="400" fill="#1f2933">your own profile, run as a</tspan><tspan x="26" dy="17.55" font-weight="400" fill="#1f2933">Deployment (2nd scheduler)</tspan></text>
<rect x="270" y="378" width="112" height="94" rx="8" fill="#ffffff" stroke="#e3c48f" stroke-width="1.2"/>
<text x="280" y="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="280" dy="0" font-weight="400" fill="#6b7280">same</tspan></text>
<rect x="392" y="378" width="215" height="94" rx="8" fill="#ffffff" stroke="#e3c48f" stroke-width="1.2"/>
<text x="402" y="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="402" dy="0" font-weight="400" fill="#6b7280">same filters</tspan><tspan x="402" dy="18.5" font-weight="400" fill="#6b7280">(can disable some)</tspan></text>
<rect x="617" y="378" width="128" height="94" rx="8" fill="#ffffff" stroke="#e3c48f" stroke-width="1.2"/>
<text x="627" y="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="627" dy="0" font-weight="400" fill="#6b7280">same</tspan></text>
<rect x="755" y="378" width="205" height="94" rx="8" fill="#fff3d6" stroke="#d48a1c" stroke-width="2"/>
<text x="765" y="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="765" dy="0" font-weight="700" fill="#9a5b06">InterPodAffinity ×100</tspan><tspan x="765" dy="18.5" font-weight="700" fill="#9a5b06">ImageLocality ×1</tspan><tspan x="765" dy="18.5" font-weight="700" fill="#9a5b06">NodeResourcesFit:</tspan><tspan x="765" dy="18.5" font-weight="700" fill="#9a5b06">MostAllocated (bin-pack)</tspan></text>
<rect x="970" y="378" width="130" height="94" rx="8" fill="#ffffff" stroke="#e3c48f" stroke-width="1.2"/>
<text x="980" y="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="980" dy="0" font-weight="400" fill="#6b7280">same</tspan></text>
<rect x="1110" y="378" width="116" height="94" rx="8" fill="#ffffff" stroke="#e3c48f" stroke-width="1.2"/>
<text x="1120" y="400" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="1120" dy="0" font-weight="400" fill="#6b7280">same</tspan></text>
<rect x="14" y="500" width="1218" height="118" rx="14" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.5"/>
<text x="26" y="526" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="26" dy="0" font-weight="700" fill="#0f5f58">volcano / KAI / YuniKorn</tspan><tspan x="26" dy="17.55" font-weight="400" fill="#1f2933">a different scheduler with</tspan><tspan x="26" dy="17.55" font-weight="400" fill="#1f2933">its own plugins ("actions")</tspan><tspan x="26" dy="17.55" font-weight="400" fill="#1f2933">run as a Deployment</tspan></text>
<rect x="270" y="512" width="112" height="94" rx="8" fill="#ffffff" stroke="#7cc3b9" stroke-width="1.5"/>
<text x="280" y="534" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="280" dy="0" font-weight="400" fill="#1f2933">Queues +</tspan><tspan x="280" dy="18.5" font-weight="400" fill="#1f2933">PodGroups (gang:</tspan><tspan x="280" dy="18.5" font-weight="400" fill="#1f2933">all or nothing)</tspan></text>
<rect x="392" y="512" width="215" height="94" rx="8" fill="#ffffff" stroke="#7cc3b9" stroke-width="1.5"/>
<text x="402" y="534" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="402" dy="0" font-weight="400" fill="#1f2933">its own predicates</tspan><tspan x="402" dy="18.5" font-weight="400" fill="#1f2933">(re-implements the</tspan><tspan x="402" dy="18.5" font-weight="400" fill="#1f2933">basic fit checks)</tspan></text>
<rect x="617" y="512" width="128" height="94" rx="8" fill="#ffffff" stroke="#7cc3b9" stroke-width="1.5"/>
<text x="627" y="534" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="627" dy="0" font-weight="400" fill="#1f2933">reclaim / preempt</tspan><tspan x="627" dy="18.5" font-weight="400" fill="#1f2933">by queue share</tspan></text>
<rect x="755" y="512" width="205" height="94" rx="8" fill="#ffffff" stroke="#7cc3b9" stroke-width="1.5"/>
<text x="765" y="534" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="765" dy="0" font-weight="400" fill="#1f2933">bin-pack,</tspan><tspan x="765" dy="18.5" font-weight="400" fill="#1f2933">GPU topology (NVLink),</tspan><tspan x="765" dy="18.5" font-weight="400" fill="#1f2933">network topology</tspan></text>
<rect x="970" y="512" width="130" height="94" rx="8" fill="#ffffff" stroke="#7cc3b9" stroke-width="1.5"/>
<text x="980" y="534" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="980" dy="0" font-weight="400" fill="#1f2933">allocate the</tspan><tspan x="980" dy="18.5" font-weight="400" fill="#1f2933">whole gang</tspan></text>
<rect x="1110" y="512" width="116" height="94" rx="8" fill="#ffffff" stroke="#7cc3b9" stroke-width="1.5"/>
<text x="1120" y="534" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="1120" dy="0" font-weight="400" fill="#1f2933">binds all pods</tspan><tspan x="1120" dy="18.5" font-weight="400" fill="#1f2933">of a job</tspan><tspan x="1120" dy="18.5" font-weight="400" fill="#1f2933">together</tspan></text>
<path d="M135,110 L135,148" stroke="#5b6675" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<path d="M8,81 L8,425 L12,425" stroke="#5b6675" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<path d="M20,81 L8,81" stroke="#5b6675" stroke-width="1.6" fill="none"/>
<path d="M8,425 L8,559 L12,559" stroke="#5b6675" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<rect x="14" y="634" width="1218" height="54" rx="12" fill="#f4f6f8" stroke="#5b6675" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="26" y="656" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="26" dy="0" font-weight="700" fill="#1f2933">Shared by all three:</tspan></text>
<text x="26" y="676" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#374151" text-anchor="start"><tspan x="26" dy="0" font-weight="400" fill="#374151">the same nodes and the same API server. The schedulers don't coordinate, so two of them can pick the same free space at once; the kubelet then rejects the loser (OutOfcpu / OutOfmemory).</tspan></text>
<rect x="1010" y="644" width="26" height="16" rx="3" fill="#ffffff" stroke="#5b6675" stroke-width="1.2"/>
<rect x="1044" y="644" width="26" height="16" rx="3" fill="#ffffff" stroke="#5b6675" stroke-width="1.2"/>
<rect x="1078" y="644" width="26" height="16" rx="3" fill="#ffffff" stroke="#5b6675" stroke-width="1.2"/>
<rect x="1112" y="644" width="26" height="16" rx="3" fill="#ffffff" stroke="#5b6675" stroke-width="1.2"/>
<rect x="1146" y="644" width="26" height="16" rx="3" fill="#ffffff" stroke="#5b6675" stroke-width="1.2"/>
<rect x="1180" y="644" width="26" height="16" rx="3" fill="#ffffff" stroke="#5b6675" stroke-width="1.2"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 825" width="1180" height="825" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs>
<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0" font-weight="700" fill="#1f2933">Dynamic Resource Allocation: the objects and who creates them</tspan></text>
<rect x="24" y="50" width="53" height="22" rx="11" fill="#0f766e"/>
<text x="50.5" y="65.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="50.5" dy="0" font-weight="700" fill="#ffffff">DRA</tspan></text>
<text x="89" y="66" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start"><tspan x="89" dy="0" font-weight="400" fill="#5b6675">A claim describes the device; the scheduler picks one specific device and records it in the claim.</tspan></text>
<rect x="24" y="86" width="520" height="196" rx="14" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6"/>
<text x="38" y="108" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="start"><tspan x="38" dy="0" font-weight="700" fill="#e08a1e">From the DRA driver (cluster-wide)</tspan></text>
<rect x="44" y="120" width="220" height="140" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="154.0" y="161.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="154.0" dy="0" font-weight="700" fill="#1f2933">DeviceClass</tspan><tspan x="154.0" dy="16.75" font-weight="400" fill="#1f2933">gpu.nvidia.com</tspan><tspan x="154.0" dy="16.75" font-weight="400" fill="#1f2933">(also mig.nvidia.com)</tspan><tspan x="154.0" dy="16.75" font-weight="400" fill="#1f2933">a named category</tspan><tspan x="154.0" dy="16.75" font-weight="400" fill="#1f2933">of devices</tspan></text>
<rect x="280" y="120" width="244" height="140" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="402.0" y="161.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="402.0" dy="0" font-weight="700" fill="#1f2933">ResourceSlice</tspan><tspan x="402.0" dy="16.75" font-weight="400" fill="#1f2933">node: gpu-node-1</tspan><tspan x="402.0" dy="16.75" font-weight="400" fill="#1f2933">gpu-0: A100, 80Gi, Ampere</tspan><tspan x="402.0" dy="16.75" font-weight="400" fill="#1f2933">gpu-1: A100, 80Gi, Ampere</tspan><tspan x="402.0" dy="16.75" font-weight="400" fill="#1f2933">… gpu-7</tspan></text>
<rect x="24" y="300" width="520" height="220" rx="14" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="38" y="322" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3b6fd8" text-anchor="start"><tspan x="38" dy="0" font-weight="700" fill="#3b6fd8">You write</tspan></text>
<rect x="44" y="334" width="220" height="164" rx="8" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="154.0" y="395.375" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="154.0" dy="0" font-weight="700" fill="#1f2933">ResourceClaimTemplate</tspan><tspan x="154.0" dy="16.75" font-weight="400" fill="#1f2933">gpu-40gb-plus</tspan><tspan x="154.0" dy="16.75" font-weight="400" fill="#1f2933">class: gpu.nvidia.com</tspan><tspan x="154.0" dy="16.75" font-weight="400" fill="#1f2933">CEL: memory ≥ 40Gi</tspan></text>
<rect x="280" y="334" width="244" height="164" rx="8" fill="#ffffff" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="402.0" y="387.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="402.0" dy="0" font-weight="700" fill="#1f2933">Pod</tspan><tspan x="402.0" dy="16.75" font-weight="400" fill="#1f2933">spec.resourceClaims:</tspan><tspan x="402.0" dy="16.75" font-weight="400" fill="#1f2933">  template gpu-40gb-plus</tspan><tspan x="402.0" dy="16.75" font-weight="400" fill="#1f2933">containers[].resources</tspan><tspan x="402.0" dy="16.75" font-weight="400" fill="#1f2933">  .claims: gpu</tspan></text>
<rect x="566" y="86" width="590" height="196" rx="14" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6"/>
<text x="580" y="108" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2f9e5b" text-anchor="start"><tspan x="580" dy="0" font-weight="700" fill="#2f9e5b">Kubernetes control plane</tspan></text>
<rect x="590" y="120" width="250" height="140" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="715.0" y="169.375" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="715.0" dy="0" font-weight="700" fill="#1f2933">kube-scheduler</tspan><tspan x="715.0" dy="16.75" font-weight="400" fill="#1f2933">DynamicResources plugin</tspan><tspan x="715.0" dy="16.75" font-weight="400" fill="#1f2933">matches the claim against</tspan><tspan x="715.0" dy="16.75" font-weight="400" fill="#1f2933">every ResourceSlice entry</tspan></text>
<rect x="870" y="120" width="266" height="140" rx="8" fill="#fff3d6" stroke="#d48a1c" stroke-width="1.6"/>
<text x="1003.0" y="161.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="1003.0" dy="0" font-weight="700" fill="#1f2933">ResourceClaim</tspan><tspan x="1003.0" dy="16.75" font-weight="400" fill="#1f2933">inference-dra-gpu-x7k2p</tspan><tspan x="1003.0" dy="16.75" font-weight="400" fill="#1f2933">one per pod, from the template</tspan><tspan x="1003.0" dy="16.75" font-weight="400" fill="#1f2933">status.allocation:</tspan><tspan x="1003.0" dy="16.75" font-weight="400" fill="#1f2933">gpu-node-1 / gpu-3</tspan></text>
<rect x="566" y="300" width="590" height="220" rx="14" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6"/>
<text x="580" y="322" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2f9e5b" text-anchor="start"><tspan x="580" dy="0" font-weight="700" fill="#2f9e5b">GPU worker node (gpu-node-1)</tspan></text>
<rect x="590" y="334" width="250" height="164" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="715.0" y="395.375" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="715.0" dy="0" font-weight="700" fill="#1f2933">Container</tspan><tspan x="715.0" dy="16.75" font-weight="400" fill="#1f2933">sees one GPU: gpu-3</tspan><tspan x="715.0" dy="16.75" font-weight="400" fill="#1f2933">no nvidia.com/gpu count</tspan><tspan x="715.0" dy="16.75" font-weight="400" fill="#1f2933">anywhere</tspan></text>
<rect x="870" y="334" width="266" height="164" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="1003.0" y="403.75" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="1003.0" dy="0" font-weight="700" fill="#1f2933">kubelet + DRA kubelet plugin</tspan><tspan x="1003.0" dy="16.75" font-weight="400" fill="#1f2933">prepares exactly gpu-3</tspan><tspan x="1003.0" dy="16.75" font-weight="400" fill="#1f2933">(device files via CDI)</tspan></text>
<path d="M524,160 L590,160" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<circle cx="557.0" cy="160.0" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="557.0" y="164.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="557.0" dy="0" font-weight="700" fill="#ffffff">1</tspan></text>
<path d="M402,334 L402,292 L950,292 L950,260" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<circle cx="676.0" cy="292.0" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="676.0" y="296.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="676.0" dy="0" font-weight="700" fill="#ffffff">2</tspan></text>
<path d="M870,175 L840,175" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<circle cx="855.0" cy="175.0" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="855.0" y="179.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="855.0" dy="0" font-weight="700" fill="#ffffff">3</tspan></text>
<path d="M840,225 L870,225" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<circle cx="855.0" cy="225.0" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="855.0" y="229.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="855.0" dy="0" font-weight="700" fill="#ffffff">4</tspan></text>
<path d="M1060,260 L1060,334" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<circle cx="1060.0" cy="297.0" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="1060.0" y="301.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="1060.0" dy="0" font-weight="700" fill="#ffffff">5</tspan></text>
<path d="M870,416 L840,416" stroke="#5b6675" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<circle cx="855.0" cy="416.0" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="855.0" y="420.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="855.0" dy="0" font-weight="700" fill="#ffffff">6</tspan></text>
<rect x="24" y="536" width="1132" height="269" rx="12" fill="#fbfbfc" stroke="#d5dbe1" stroke-width="1.6"/>
<text x="40" y="562" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b6675" text-anchor="start"><tspan x="40" dy="0" font-weight="700" fill="#5b6675">Step by step</tspan></text>
<circle cx="52" cy="586" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="52" y="590.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="52" dy="0" font-weight="700" fill="#ffffff">1</tspan></text>
<text x="74" y="590" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="74" dy="0" font-weight="400" fill="#1f2933">The driver publishes, per node, a ResourceSlice listing each device.</tspan></text>
<circle cx="52" cy="647" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="52" y="651.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="52" dy="0" font-weight="700" fill="#ffffff">2</tspan></text>
<text x="74" y="651" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="74" dy="0" font-weight="400" fill="#1f2933">When the pod is created, Kubernetes makes its own</tspan><tspan x="74" dy="17" font-weight="400" fill="#1f2933">ResourceClaim from the template.</tspan></text>
<circle cx="52" cy="708" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="52" y="712.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="52" dy="0" font-weight="700" fill="#ffffff">3</tspan></text>
<text x="74" y="712" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="74" dy="0" font-weight="400" fill="#1f2933">The scheduler reads the claim's class and CEL selector</tspan><tspan x="74" dy="17" font-weight="400" fill="#1f2933">("memory ≥ 40Gi").</tspan></text>
<circle cx="612" cy="586" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="612" y="590.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="612" dy="0" font-weight="700" fill="#ffffff">4</tspan></text>
<text x="634" y="590" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="634" dy="0" font-weight="400" fill="#1f2933">It finds a free device that matches (gpu-3), writes it into</tspan><tspan x="634" dy="17" font-weight="400" fill="#1f2933">the claim's status and binds the pod to gpu-node-1.</tspan></text>
<circle cx="612" cy="647" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="612" y="651.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="612" dy="0" font-weight="700" fill="#ffffff">5</tspan></text>
<text x="634" y="651" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="634" dy="0" font-weight="400" fill="#1f2933">The kubelet asks the DRA driver's kubelet plugin to prepare gpu-3.</tspan></text>
<circle cx="612" cy="708" r="12" fill="#1e4fb8" stroke="#ffffff" stroke-width="2"/>
<text x="612" y="712.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="612" dy="0" font-weight="700" fill="#ffffff">6</tspan></text>
<text x="634" y="712" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="634" dy="0" font-weight="400" fill="#1f2933">The container starts with exactly that GPU.</tspan></text>
<text x="40" y="781" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9a5b06" text-anchor="start"><tspan x="40" dy="0" font-weight="700" fill="#9a5b06">Delete the pod and its claim goes too, which frees gpu-3 for the next claim.</tspan></text>
</svg>
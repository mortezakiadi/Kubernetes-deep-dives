<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 722" width="1180" height="722" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd8"/></marker><marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4fc4"/></marker><marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e5b"/></marker><marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e08a1e"/></marker></defs>
<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" >Brokers in the cluster, a managed service outside</text>
<text x="24" y="58" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start" >Zone names and counts are illustrative. A rack is a zone here: Kafka calls the zone label a rack.</text>
<rect x="24" y="84" width="236" height="300" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6" stroke-dasharray="7 5" />
<text x="34" y="106" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Amazon MSK (managed</text>
<text x="34" y="124" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Kafka)</text>
<text x="34" y="142" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >You choose how many brokers</text>
<text x="34" y="159" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >MSK creates in each zone, at</text>
<text x="34" y="176" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >least one per zone.</text>
<text x="34" y="193" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >Access: IAM access control.</text>
<text x="34" y="210" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >Other VPCs and accounts:</text>
<text x="34" y="227" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >multi-VPC private</text>
<text x="34" y="244" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >connectivity (PrivateLink).</text>
<rect x="284" y="84" width="872" height="300" rx="14" fill="#f7faff" stroke="#3b6fd8" stroke-width="2.2" />
<text x="300" y="112" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3b6fd8" text-anchor="start" >Your cluster: Kafka brokers (Strimzi) and consumers</text>
<rect x="296" y="128" width="276" height="244" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="6 4" />
<text x="308" y="150" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5b6675" text-anchor="start" >Zone A</text>
<rect x="308" y="162" width="252" height="66" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6" />
<text x="318" y="184" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Kafka broker pod</text>
<text x="318" y="202" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >broker.rack = zone-a</text>
<rect x="308" y="274" width="252" height="66" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6" />
<text x="318" y="296" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Consumer pod</text>
<text x="318" y="314" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >client.rack = zone-a</text>
<path d="M434.0,274 L434.0,228" stroke="#3b6fd8" stroke-width="2.2" fill="none" marker-end="url(#arB)"/>
<text x="444.0" y="256" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3b6fd8" text-anchor="start" >same zone</text>
<rect x="584" y="128" width="276" height="244" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="6 4" />
<text x="596" y="150" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5b6675" text-anchor="start" >Zone B</text>
<rect x="596" y="162" width="252" height="66" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6" />
<text x="606" y="184" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Kafka broker pod</text>
<text x="606" y="202" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >broker.rack = zone-b</text>
<rect x="596" y="274" width="252" height="66" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6" />
<text x="606" y="296" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Consumer pod</text>
<text x="606" y="314" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >client.rack = zone-b</text>
<path d="M722.0,274 L722.0,228" stroke="#3b6fd8" stroke-width="2.2" fill="none" marker-end="url(#arB)"/>
<text x="732.0" y="256" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3b6fd8" text-anchor="start" >same zone</text>
<rect x="872" y="128" width="276" height="244" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="6 4" />
<text x="884" y="150" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#5b6675" text-anchor="start" >Zone C</text>
<rect x="884" y="162" width="252" height="66" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6" />
<text x="894" y="184" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Kafka broker pod</text>
<text x="894" y="202" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >broker.rack = zone-c</text>
<rect x="884" y="274" width="252" height="66" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6" />
<text x="894" y="296" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Consumer pod</text>
<text x="894" y="314" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >client.rack = zone-c</text>
<path d="M1010.0,274 L1010.0,228" stroke="#3b6fd8" stroke-width="2.2" fill="none" marker-end="url(#arB)"/>
<text x="1020.0" y="256" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3b6fd8" text-anchor="start" >same zone</text>
<rect x="24" y="424" width="300" height="214" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6" />
<text x="34" y="446" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Pub/Sub (managed)</text>
<text x="34" y="464" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >Leases single messages to</text>
<text x="34" y="481" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >subscribers, so the number of</text>
<text x="34" y="498" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >consumers is not tied to partitions.</text>
<text x="34" y="515" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >Pull subscription: needs subscriber</text>
<text x="34" y="532" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >pods.</text>
<text x="34" y="549" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >Export subscription: needs no pod.</text>
<rect x="440" y="424" width="380" height="100" rx="12" fill="#f7faff" stroke="#3b6fd8" stroke-width="2" />
<text x="452" y="446" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3b6fd8" text-anchor="start" >Your cluster</text>
<rect x="452" y="454" width="356" height="62" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6" />
<text x="462" y="476" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Subscriber pods</text>
<text x="462" y="494" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >scaled on the backlog with an HPA</text>
<path d="M324,474 L440,474" stroke="#e08a1e" stroke-width="2.2" fill="none" marker-end="url(#arO)"/>
<text x="382.0" y="464" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="middle" >pull</text>
<rect x="440" y="554" width="380" height="40" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.6" />
<text x="450" y="576" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >BigQuery (managed)</text>
<rect x="440" y="602" width="380" height="36" rx="10" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6" />
<text x="450" y="624" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Cloud Storage (object storage)</text>
<path d="M324,574 L440,574" stroke="#e08a1e" stroke-width="2.2" fill="none" marker-end="url(#arO)"/>
<path d="M324,620 L440,620" stroke="#2f9e5b" stroke-width="2.2" fill="none" marker-end="url(#arG)"/>
<text x="382.0" y="601" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle" >export, no pod</text>
<rect x="860" y="424" width="296" height="214" rx="10" fill="#ffffff" stroke="#7b8794" stroke-width="1.6" />
<text x="870" y="446" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Two scaling rules</text>
<text x="870" y="464" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >Kafka: KEDA stops at the number of</text>
<text x="870" y="481" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >partitions unless allowIdleConsumers</text>
<text x="870" y="498" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >is true. Illustrative: 6 partitions</text>
<text x="870" y="515" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >cap a group at 6 busy consumers.</text>
<text x="870" y="532" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >Pub/Sub: no partition cap. KEDA's</text>
<text x="870" y="549" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >gcp-pubsub scaler is marked</text>
<text x="870" y="566" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >deprecated, so the example uses an</text>
<text x="870" y="583" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >external metric in an HPA.</text>
<text x="24" y="664" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >HPA = HorizontalPodAutoscaler, a Kubernetes object that changes the number of pods when a metric changes. KEDA = a Kubernetes add-on that scales</text>
<text x="24" y="682" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >workloads on outside signals.</text>
<text x="24" y="700" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >Sources: Strimzi configuring page, MSK pages, KEDA Kafka and Pub/Sub scaler pages, Pub/Sub overview, subscriber overview and pricing pages.</text>
</svg>

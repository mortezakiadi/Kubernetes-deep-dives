<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 678" width="1180" height="678" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs>
<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0" font-weight="700" fill="#1f2933">Score × weight: how the scheduler picks a node</tspan></text>
<text x="24" y="62" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start"><tspan x="24" dy="0" font-weight="400" fill="#5b6675">Each plugin grades every node from 0 to 100. The grade is multiplied by the plugin's weight, and the node with the highest total wins.</tspan></text>
<rect x="24" y="84" width="1132" height="74" rx="12" fill="#f3f6fb" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="44" y="110" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="44" dy="0" font-weight="700" fill="#1f2933">The pod: web-api</tspan></text>
<text x="44" y="134" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="44" dy="0" font-weight="400" fill="#1f2933">requests 2 CPU · image 1.2 GB · prefers zone us-east-1a (preferred node affinity)</tspan></text>
<text x="700" y="110" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="700" dy="0" font-weight="600" fill="#1f2933">Node A: zone a · 10 CPU · 2 already requested · image NOT cached</tspan></text>
<text x="700" y="134" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="700" dy="0" font-weight="600" fill="#1f2933">Node B: zone b · 10 CPU · 6 already requested · image cached</tspan></text>
<rect x="24" y="180" width="330" height="40" rx="8" fill="#f3f6fb" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="189.0" y="205" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="189.0" dy="0" font-weight="700" fill="#1f2933">Plugin (what it asks)</tspan></text>
<rect x="362" y="180" width="120" height="40" rx="8" fill="#f3f6fb" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="422.0" y="205" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="422.0" dy="0" font-weight="700" fill="#1f2933">Plugin weight</tspan></text>
<rect x="490" y="180" width="150" height="40" rx="8" fill="#f3f6fb" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="565.0" y="205" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="565.0" dy="0" font-weight="700" fill="#1f2933">Node A score</tspan></text>
<rect x="648" y="180" width="150" height="40" rx="8" fill="#f3f6fb" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="723.0" y="205" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="723.0" dy="0" font-weight="700" fill="#1f2933">Node A points</tspan></text>
<rect x="806" y="180" width="150" height="40" rx="8" fill="#f3f6fb" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="881.0" y="205" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="881.0" dy="0" font-weight="700" fill="#1f2933">Node B score</tspan></text>
<rect x="964" y="180" width="150" height="40" rx="8" fill="#f3f6fb" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="1039.0" y="205" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="1039.0" dy="0" font-weight="700" fill="#1f2933">Node B points</tspan></text>
<rect x="24" y="232" width="330" height="74" rx="8" fill="#ffffff" stroke="#d5dbe1" stroke-width="1.6"/>
<text x="40" y="262" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0" font-weight="700" fill="#1f2933">NodeResourcesFit (LeastAllocated)</tspan></text>
<text x="40" y="284" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start"><tspan x="40" dy="0" font-weight="400" fill="#5b6675">How empty would the node be?</tspan></text>
<rect x="362" y="232" width="120" height="74" rx="8" fill="#fff3d6" stroke="#d48a1c" stroke-width="1.6"/>
<text x="422.0" y="277" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a5b06" text-anchor="middle"><tspan x="422.0" dy="0" font-weight="700" fill="#9a5b06">× 1</tspan></text>
<rect x="490" y="232" width="150" height="74" rx="8" fill="#ffffff" stroke="#d5dbe1" stroke-width="1.6"/>
<text x="565" y="266" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="565" dy="0" font-weight="700" fill="#1f2933">60</tspan></text>
<text x="565" y="288" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6675" text-anchor="middle"><tspan x="565" dy="0" font-weight="400" fill="#5b6675">4 of 10 used → 60% free</tspan></text>
<rect x="648" y="232" width="150" height="74" rx="8" fill="#eef3fd" stroke="#1e4fb8" stroke-width="1.6"/>
<text x="723" y="276" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e4fb8" text-anchor="middle"><tspan x="723" dy="0" font-weight="700" fill="#1e4fb8">60 × 1 = 60</tspan></text>
<rect x="806" y="232" width="150" height="74" rx="8" fill="#ffffff" stroke="#d5dbe1" stroke-width="1.6"/>
<text x="881" y="266" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="881" dy="0" font-weight="700" fill="#1f2933">20</tspan></text>
<text x="881" y="288" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6675" text-anchor="middle"><tspan x="881" dy="0" font-weight="400" fill="#5b6675">8 of 10 used → 20% free</tspan></text>
<rect x="964" y="232" width="150" height="74" rx="8" fill="#eef3fd" stroke="#1e4fb8" stroke-width="1.6"/>
<text x="1039" y="276" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e4fb8" text-anchor="middle"><tspan x="1039" dy="0" font-weight="700" fill="#1e4fb8">20 × 1 = 20</tspan></text>
<rect x="24" y="314" width="330" height="74" rx="8" fill="#ffffff" stroke="#d5dbe1" stroke-width="1.6"/>
<text x="40" y="344" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0" font-weight="700" fill="#1f2933">ImageLocality</tspan></text>
<text x="40" y="366" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start"><tspan x="40" dy="0" font-weight="400" fill="#5b6675">Is the image already here?</tspan></text>

<text x="422.0" y="359" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a5b06" text-anchor="middle"><tspan x="422.0" dy="0" font-weight="700" fill="#9a5b06">× 1</tspan></text>
<rect x="490" y="314" width="150" height="74" rx="8" fill="#ffffff" stroke="#d5dbe1" stroke-width="1.6"/>
<text x="565" y="348" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="565" dy="0" font-weight="700" fill="#1f2933">0</tspan></text>
<text x="565" y="370" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6675" text-anchor="middle"><tspan x="565" dy="0" font-weight="400" fill="#5b6675">not cached</tspan></text>
<rect x="648" y="314" width="150" height="74" rx="8" fill="#eef3fd" stroke="#1e4fb8" stroke-width="1.6"/>
<text x="723" y="358" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e4fb8" text-anchor="middle"><tspan x="723" dy="0" font-weight="700" fill="#1e4fb8">0 × 1 = 0</tspan></text>
<rect x="806" y="314" width="150" height="74" rx="8" fill="#ffffff" stroke="#d5dbe1" stroke-width="1.6"/>
<text x="881" y="348" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="881" dy="0" font-weight="700" fill="#1f2933">90</tspan></text>
<text x="881" y="370" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6675" text-anchor="middle"><tspan x="881" dy="0" font-weight="400" fill="#5b6675">1.2 GB cached</tspan></text>
<rect x="964" y="314" width="150" height="74" rx="8" fill="#eef3fd" stroke="#1e4fb8" stroke-width="1.6"/>
<text x="1039" y="358" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e4fb8" text-anchor="middle"><tspan x="1039" dy="0" font-weight="700" fill="#1e4fb8">90 × 1 = 90</tspan></text>
<rect x="24" y="396" width="330" height="74" rx="8" fill="#ffffff" stroke="#d5dbe1" stroke-width="1.6"/>
<text x="40" y="426" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0" font-weight="700" fill="#1f2933">NodeAffinity</tspan></text>
<text x="40" y="448" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6675" text-anchor="start"><tspan x="40" dy="0" font-weight="400" fill="#5b6675">Does it match the pod's preference?</tspan></text>
<rect x="362" y="396" width="120" height="74" rx="8" fill="#fff3d6" stroke="#d48a1c" stroke-width="1.6"/>
<text x="422.0" y="441" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a5b06" text-anchor="middle"><tspan x="422.0" dy="0" font-weight="700" fill="#9a5b06">× 2</tspan></text>
<rect x="490" y="396" width="150" height="74" rx="8" fill="#ffffff" stroke="#d5dbe1" stroke-width="1.6"/>
<text x="565" y="430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="565" dy="0" font-weight="700" fill="#1f2933">100</tspan></text>
<text x="565" y="452" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6675" text-anchor="middle"><tspan x="565" dy="0" font-weight="400" fill="#5b6675">raw 80 → scaled to 100</tspan></text>
<rect x="648" y="396" width="150" height="74" rx="8" fill="#eef3fd" stroke="#1e4fb8" stroke-width="1.6"/>
<text x="723" y="440" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e4fb8" text-anchor="middle"><tspan x="723" dy="0" font-weight="700" fill="#1e4fb8">100 × 2 = 200</tspan></text>
<rect x="806" y="396" width="150" height="74" rx="8" fill="#ffffff" stroke="#d5dbe1" stroke-width="1.6"/>
<text x="881" y="430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="881" dy="0" font-weight="700" fill="#1f2933">0</tspan></text>
<text x="881" y="452" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6675" text-anchor="middle"><tspan x="881" dy="0" font-weight="400" fill="#5b6675">no match (raw 0)</tspan></text>
<rect x="964" y="396" width="150" height="74" rx="8" fill="#eef3fd" stroke="#1e4fb8" stroke-width="1.6"/>
<text x="1039" y="440" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e4fb8" text-anchor="middle"><tspan x="1039" dy="0" font-weight="700" fill="#1e4fb8">0 × 2 = 0</tspan></text>
<rect x="24" y="482" width="458" height="56" rx="8" fill="#f3f6fb" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="40" y="516" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0" font-weight="700" fill="#1f2933">Final score = sum of the points</tspan></text>
<rect x="648" y="482" width="150" height="56" rx="8" fill="#e8f6ee" stroke="#2f9e5b" stroke-width="1.6"/>
<text x="723" y="508" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2f9e5b" text-anchor="middle"><tspan x="723" dy="0" font-weight="700" fill="#2f9e5b">260</tspan></text>
<text x="723" y="528" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f9e5b" text-anchor="middle"><tspan x="723" dy="0" font-weight="700" fill="#2f9e5b">winner</tspan></text>
<rect x="964" y="482" width="150" height="56" rx="8" fill="#fbfbfc" stroke="#d5dbe1" stroke-width="1.6"/>
<text x="1039" y="516" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5b6675" text-anchor="middle"><tspan x="1039" dy="0" font-weight="700" fill="#5b6675">110</tspan></text>
<rect x="24" y="562" width="1132" height="96" rx="12" fill="#fff3d6" stroke="#d48a1c" stroke-width="1.6"/>
<text x="44" y="590" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="44" dy="0" font-weight="700" fill="#9a5b06">What if ImageLocality's weight were 3 instead of 1?</tspan></text>
<text x="44" y="616" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2933" text-anchor="start"><tspan x="44" dy="0" font-weight="600" fill="#1f2933">Node A: 60 + 0×3 + 200 = 260</tspan></text>
<text x="320" y="616" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2933" text-anchor="start"><tspan x="320" dy="0" font-weight="600" fill="#1f2933">Node B: 20 + 90×3 + 0 = 290</tspan></text>
<text x="600" y="616" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="600" dy="0" font-weight="700" fill="#2f9e5b">→ Node B wins</tspan></text>
<text x="44" y="640" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="44" dy="0" font-weight="400" fill="#1f2933">Same grades, different weights, different winner: the weights say whose opinion matters most.</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 618" width="1180" height="618" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker></defs>
<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0" font-weight="700" fill="#1f2933">How GPUs are advertised: labels, a count, or devices</tspan></text>
<text x="24" y="62" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start"><tspan x="24" dy="0" font-weight="400" fill="#5b6675">Three different things a node can tell Kubernetes about its GPUs, and what each one lets the scheduler do.</tspan></text>
<rect x="200" y="86" width="312" height="92" rx="12" fill="#eef3fd" stroke="#1e4fb8" stroke-width="1.6"/>
<rect x="216" y="100" width="71" height="22" rx="11" fill="#1e4fb8"/>
<text x="251.5" y="115.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="251.5" dy="0" font-weight="700" fill="#ffffff">LABEL</tspan></text>
<text x="216" y="144" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start"><tspan x="216" dy="0" font-weight="600" fill="#1f2933">Node Feature Discovery · GPU Feature</tspan><tspan x="216" dy="17" font-weight="600" fill="#1f2933">Discovery · cloud and Karpenter labels</tspan></text>
<rect x="526" y="86" width="312" height="92" rx="12" fill="#fdf0e8" stroke="#c2410c" stroke-width="1.6"/>
<rect x="542" y="100" width="71" height="22" rx="11" fill="#c2410c"/>
<text x="577.5" y="115.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="577.5" dy="0" font-weight="700" fill="#ffffff">COUNT</tspan></text>
<text x="542" y="144" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start"><tspan x="542" dy="0" font-weight="600" fill="#1f2933">NVIDIA device plugin</tspan><tspan x="542" dy="17" font-weight="600" fill="#1f2933">(also AMD, AWS Neuron …)</tspan></text>
<rect x="852" y="86" width="312" height="92" rx="12" fill="#e7f6f4" stroke="#0f766e" stroke-width="1.6"/>
<rect x="868" y="100" width="53" height="22" rx="11" fill="#0f766e"/>
<text x="894.5" y="115.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="894.5" dy="0" font-weight="700" fill="#ffffff">DRA</tspan></text>
<text x="868" y="144" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="start"><tspan x="868" dy="0" font-weight="600" fill="#1f2933">A DRA driver</tspan><tspan x="868" dy="17" font-weight="600" fill="#1f2933">(e.g. NVIDIA's gpu.nvidia.com)</tspan></text>
<text x="24" y="216" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b6675" text-anchor="start"><tspan x="24" dy="0" font-weight="700" fill="#5b6675">What is published</tspan></text>
<rect x="200" y="192" width="312" height="77" rx="8" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="214" y="215" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="214" dy="0" font-weight="400" fill="#1f2933">Facts on the Node object:</tspan><tspan x="214" dy="17" font-weight="400" fill="#1f2933">nvidia.com/gpu.product=…A100…</tspan><tspan x="214" dy="17" font-weight="400" fill="#1f2933">nvidia.com/gpu.memory=81920</tspan></text>
<rect x="526" y="192" width="312" height="77" rx="8" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="540" y="215" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="540" dy="0" font-weight="400" fill="#1f2933">A number in the node's capacity:</tspan><tspan x="540" dy="17" font-weight="400" fill="#1f2933">nvidia.com/gpu: 8</tspan></text>
<rect x="852" y="192" width="312" height="77" rx="8" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="866" y="215" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="866" dy="0" font-weight="400" fill="#1f2933">One entry per device (ResourceSlice):</tspan><tspan x="866" dy="17" font-weight="400" fill="#1f2933">gpu-0 … gpu-7, each with its</tspan><tspan x="866" dy="17" font-weight="400" fill="#1f2933">model, architecture and memory</tspan></text>
<text x="24" y="303" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b6675" text-anchor="start"><tspan x="24" dy="0" font-weight="700" fill="#5b6675">How a pod asks</tspan></text>
<rect x="200" y="279" width="312" height="60" rx="8" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="214" y="302" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="214" dy="0" font-weight="400" fill="#1f2933">nodeSelector or node affinity</tspan><tspan x="214" dy="17" font-weight="400" fill="#1f2933">on those labels</tspan></text>
<rect x="526" y="279" width="312" height="60" rx="8" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="540" y="302" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="540" dy="0" font-weight="400" fill="#1f2933">resources.limits:</tspan><tspan x="540" dy="17" font-weight="400" fill="#1f2933">nvidia.com/gpu: 1</tspan></text>
<rect x="852" y="279" width="312" height="60" rx="8" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="866" y="302" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="866" dy="0" font-weight="400" fill="#1f2933">A ResourceClaim that describes</tspan><tspan x="866" dy="17" font-weight="400" fill="#1f2933">the device (CEL selector)</tspan></text>
<text x="24" y="373" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b6675" text-anchor="start"><tspan x="24" dy="0" font-weight="700" fill="#5b6675">What the scheduler does</tspan></text>
<rect x="200" y="349" width="312" height="60" rx="8" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="214" y="372" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="214" dy="0" font-weight="400" fill="#1f2933">Filters and scores NODES</tspan><tspan x="214" dy="17" font-weight="400" fill="#1f2933">on the labels</tspan></text>
<rect x="526" y="349" width="312" height="60" rx="8" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="540" y="372" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="540" dy="0" font-weight="400" fill="#1f2933">Subtracts from the node's free</tspan><tspan x="540" dy="17" font-weight="400" fill="#1f2933">count, like CPU and memory</tspan></text>
<rect x="852" y="349" width="312" height="60" rx="8" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="866" y="372" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="866" dy="0" font-weight="400" fill="#1f2933">Matches the claim against</tspan><tspan x="866" dy="17" font-weight="400" fill="#1f2933">individual DEVICES</tspan></text>
<text x="24" y="443" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b6675" text-anchor="start"><tspan x="24" dy="0" font-weight="700" fill="#5b6675">Is anything reserved?</tspan></text>
<rect x="200" y="419" width="312" height="43" rx="8" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="214" y="442" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="214" dy="0" font-weight="400" fill="#1f2933">No: labels are information only</tspan></text>
<rect x="526" y="419" width="312" height="43" rx="8" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="540" y="442" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="540" dy="0" font-weight="400" fill="#1f2933">Yes: a number of GPUs on that node</tspan></text>
<rect x="852" y="419" width="312" height="43" rx="8" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="866" y="442" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="866" dy="0" font-weight="400" fill="#1f2933">Yes: one specific device</tspan></text>
<text x="24" y="496" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b6675" text-anchor="start"><tspan x="24" dy="0" font-weight="700" fill="#5b6675">Who picks the exact GPU</tspan></text>
<rect x="200" y="472" width="312" height="60" rx="8" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="214" y="495" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="214" dy="0" font-weight="400" fill="#1f2933">Nobody</tspan></text>
<rect x="526" y="472" width="312" height="60" rx="8" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="540" y="495" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="540" dy="0" font-weight="400" fill="#1f2933">The device plugin, on the node,</tspan><tspan x="540" dy="17" font-weight="400" fill="#1f2933">when the container starts</tspan></text>
<rect x="852" y="472" width="312" height="60" rx="8" fill="#ffffff" stroke="#c9d2dc" stroke-width="1.2"/>
<text x="866" y="495" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="866" dy="0" font-weight="400" fill="#1f2933">The scheduler, recorded in</tspan><tspan x="866" dy="17" font-weight="400" fill="#1f2933">the claim (e.g. gpu-3)</tspan></text>
<rect x="24" y="548" width="1132" height="50" rx="10" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.6"/>
<text x="40" y="578" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0" font-weight="700" fill="#9a5b06">The classic setup uses two of them together: LABELS to choose the node + the COUNT to reserve a GPU on it. DRA replaces both.</tspan></text>
</svg>
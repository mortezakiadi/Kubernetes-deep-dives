<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" >Who the pod is, and which road it takes</text>
<text x="24" y="58" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start" >On each road, the bold text is the identity step and the grey text is the path. The box on the right is the cost, where a number was read.</text>
<rect x="24" y="84" width="226" height="584" rx="14" fill="#f7faff" stroke="#3b6fd8" stroke-width="2.2" />
<text x="40" y="112" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3b6fd8" text-anchor="start" >Your cluster</text>
<rect x="38" y="128" width="198" height="96" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.6" />
<text x="48" y="150" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Training pod</text>
<text x="48" y="168" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >with a Kubernetes</text>
<text x="48" y="185" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >service account</text>

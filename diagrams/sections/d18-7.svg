<text x="260" y="108.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start" >EKS Pod Identity role on the service</text>
<text x="260" y="124.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start" >account</text>
<text x="260" y="156.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >gateway VPC endpoint</text>
<rect x="560" y="106.0" width="210" height="60" rx="10" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.6" />
<text x="570" y="128.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Amazon S3</text>
<rect x="790" y="100.0" width="366" height="72" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" />
<text x="802" y="124.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >No additional charge for the endpoint.</text>

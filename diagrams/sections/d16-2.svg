<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 842" width="1180" height="842" style="color-scheme: light">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6675"/></marker><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd8"/></marker><marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4fc4"/></marker><marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e5b"/></marker><marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e08a1e"/></marker></defs>
<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" >Serving a heavy model: from "pod scheduled" to "ready for traffic"</text>
<text x="24" y="58" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start" >Illustrative example: 70 billion parameters x 2 bytes = 140 GB (derived). The four blocks have equal width and say nothing about time.</text>
<rect x="24" y="84" width="270" height="54" rx="10" fill="#3b6fd8" stroke="#3b6fd8" stroke-width="0" />
<text x="38" y="108" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start" >1  Image pull</text>
<text x="38" y="128" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start" >Where you set it: kubelet and node settings</text>
<path d="M296,111 L309,111" stroke="#5b6675" stroke-width="2.4" fill="none" marker-end="url(#ar)"/>
<rect x="24" y="154" width="270" height="64" rx="8" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.4" />
<text x="36" y="175" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Pull in parallel</text>
<text x="36" y="194" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >kubelet: serializeImagePulls</text>
<text x="36" y="211" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >false, maxParallelImagePulls</text>
<rect x="24" y="228" width="270" height="81" rx="8" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.4" />
<text x="36" y="249" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Smaller image</text>
<text x="36" y="268" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >multi-stage build. AWS example:</text>
<text x="36" y="285" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >runtime image 3.03 GB, devel</text>
<text x="36" y="302" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >image 6.66 GB</text>
<rect x="24" y="319" width="270" height="81" rx="8" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.4" />
<text x="36" y="340" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Pre-pull on the node</text>
<text x="36" y="359" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >DaemonSet, or an EBS snapshot of</text>
<text x="36" y="376" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >cached images. imagePullPolicy</text>
<text x="36" y="393" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >IfNotPresent</text>
<rect x="24" y="410" width="270" height="64" rx="8" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.4" />
<text x="36" y="431" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Faster unpack and disk</text>
<text x="36" y="450" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >SOCI parallel mode. NVMe for</text>
<text x="36" y="467" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >containerd</text>
<rect x="24" y="484" width="270" height="98" rx="8" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.4" />
<text x="36" y="505" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Lazy loading</text>
<text x="36" y="524" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >a snapshotter on the node (SOCI,</text>
<text x="36" y="541" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >eStargz). Whether it helps CUDA</text>
<text x="36" y="558" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >images: not known from the pages</text>
<text x="36" y="575" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >read</text>
<rect x="311" y="84" width="270" height="54" rx="10" fill="#2f9e5b" stroke="#2f9e5b" stroke-width="0" />
<text x="325" y="108" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start" >2  Weight fetch</text>
<text x="325" y="128" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start" >Where you set it: pod spec and volumes</text>
<path d="M583,111 L596,111" stroke="#5b6675" stroke-width="2.4" fill="none" marker-end="url(#ar)"/>
<rect x="311" y="154" width="270" height="81" rx="8" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.4" />
<text x="323" y="175" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Init container</text>
<text x="323" y="194" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >initContainers and an emptyDir</text>
<text x="323" y="211" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >with sizeLimit. Every new pod</text>
<text x="323" y="228" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >pays the download (reading)</text>
<rect x="311" y="245" width="270" height="81" rx="8" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.4" />
<text x="323" y="266" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Shared volume</text>
<text x="323" y="285" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >a claim with ReadOnlyMany or</text>
<text x="323" y="302" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >ReadWriteMany, from S3, FSx or</text>
<text x="323" y="319" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >EFS</text>
<rect x="311" y="336" width="270" height="64" rx="8" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.4" />
<text x="323" y="357" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Image volume</text>
<text x="323" y="376" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >volumes[].image, read-only.</text>
<text x="323" y="393" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >Stable in Kubernetes 1.36</text>
<rect x="311" y="410" width="270" height="64" rx="8" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.4" />
<text x="323" y="431" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Node-local copy</text>
<text x="323" y="450" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >NVMe on the node. Lost when the</text>
<text x="323" y="467" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >instance stops or terminates</text>
<rect x="598" y="84" width="270" height="54" rx="10" fill="#7a4fc4" stroke="#7a4fc4" stroke-width="0" />
<text x="612" y="108" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start" >3  Load into GPU memory</text>
<text x="612" y="128" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start" >Where you set it: server options</text>
<path d="M870,111 L883,111" stroke="#5b6675" stroke-width="2.4" fill="none" marker-end="url(#ar)"/>
<rect x="598" y="154" width="270" height="64" rx="8" fill="#f3eefc" stroke="#7a4fc4" stroke-width="1.4" />
<text x="610" y="175" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Streamer</text>
<text x="610" y="194" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >vLLM --load-format</text>
<text x="610" y="211" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >runai_streamer, with concurrency</text>
<rect x="598" y="228" width="270" height="64" rx="8" fill="#f3eefc" stroke="#7a4fc4" stroke-width="1.4" />
<text x="610" y="249" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Sharded loader</text>
<text x="610" y="268" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >runai_streamer_sharded: each</text>
<text x="610" y="285" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >worker reads its own shard</text>
<rect x="598" y="302" width="270" height="81" rx="8" fill="#f3eefc" stroke="#7a4fc4" stroke-width="1.4" />
<text x="610" y="323" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >GDS from FSx</text>
<text x="610" y="342" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >allowlisted instance types,</text>
<text x="610" y="359" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >nvidia-fs on the host,</text>
<text x="610" y="376" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >privileged pod (AWS sample)</text>
<rect x="598" y="393" width="270" height="98" rx="8" fill="#f3eefc" stroke="#7a4fc4" stroke-width="1.4" />
<text x="610" y="414" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Measured, 892.7 GB, p5en</text>
<text x="610" y="433" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >default loader 1,703 s. S3</text>
<text x="610" y="450" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >streamer 316 s (rank 0 only).</text>
<text x="610" y="467" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >FSx with GDS 35.5 s (one proof</text>
<text x="610" y="484" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >of concept)</text>
<rect x="885" y="84" width="270" height="54" rx="10" fill="#e08a1e" stroke="#e08a1e" stroke-width="0" />
<text x="899" y="108" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start" >4  Ready for traffic</text>
<text x="899" y="128" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start" >Where you set it: probes and rollout</text>
<rect x="885" y="154" width="270" height="64" rx="8" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.4" />
<text x="897" y="175" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Startup probe</text>
<text x="897" y="194" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >failureThreshold x periodSeconds</text>
<text x="897" y="211" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >must cover the worst-case load</text>
<rect x="885" y="228" width="270" height="64" rx="8" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.4" />
<text x="897" y="249" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Readiness probe</text>
<text x="897" y="268" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >a pod that is not ready gets no</text>
<text x="897" y="285" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >traffic from a Service</text>
<rect x="885" y="302" width="270" height="81" rx="8" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.4" />
<text x="897" y="323" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Rolling update</text>
<text x="897" y="342" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >maxUnavailable and maxSurge</text>
<text x="897" y="359" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >default to 25 percent. Old pods</text>
<text x="897" y="376" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >may go before new ones are ready</text>
<rect x="885" y="393" width="270" height="81" rx="8" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.4" />
<text x="897" y="414" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Spread replicas</text>
<text x="897" y="433" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >topology spread constraint over</text>
<text x="897" y="450" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >zones. Keep the weights near</text>
<text x="897" y="467" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >each replica</text>
<rect x="24" y="606" width="1132" height="172" rx="10" fill="#f6f8fb" stroke="#7b8794" stroke-width="1.4" />
<text x="38" y="632" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Fetching 140 GB: two illustrative rates (derived, not measured)</text>
<text x="38" y="652" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >140 GB = 1,120 gigabits. Bar lengths are in proportion to the seconds.</text>
<text x="38" y="680" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start" >5 Gbps: one flow</text>
<rect x="300" y="666" width="750" height="20" rx="4" fill="#e08a1e" stroke="#e08a1e" stroke-width="0" />
<text x="1058" y="681" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start" >224 s</text>
<text x="38" y="706" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start" >100 Gbps: S3 "up to" figure</text>
<rect x="300" y="692" width="37.5" height="20" rx="4" fill="#3b6fd8" stroke="#3b6fd8" stroke-width="0" />
<text x="345.5" y="707" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start" >11.2 s</text>
<text x="38" y="736" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >5 Gbps is AWS's limit for one flow between instances that are not in one cluster placement group. Applying it to a download from storage is this</text>
<text x="38" y="753" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >page's reading. 100 Gbps is S3's "up to" figure for data lake applications on one instance. It is not a cap and not a promise.</text>
<text x="24" y="798" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >Sourced: the settings and the measured numbers come from the pages named in the points. Not known: any time from "pod scheduled" to "ready" for a GPU</text>
<text x="24" y="816" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >model server, and whether lazy loading helps a multi-gigabyte CUDA image.</text>
</svg>

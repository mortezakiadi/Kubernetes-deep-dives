<text x="265.5" y="500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >Pin the job to one</text>
<text x="265.5" y="517" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >layer-3 value that you</text>
<text x="265.5" y="534" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >read from your own nodes.</text>
<text x="265.5" y="551" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >Do not copy a value from</text>
<text x="265.5" y="568" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >another account.</text>
<rect x="483.0" y="454" width="214" height="138" rx="10" fill="#e6f4f2" stroke="#0f766e" stroke-width="1.8" />
<text x="495.0" y="478" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="start" >A queue</text>
<text x="495.0" y="500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >Kueue: a required or</text>
<text x="495.0" y="517" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >preferred topology level.</text>
<text x="495.0" y="534" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >JobSet: one child job for</text>
<text x="495.0" y="551" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >each domain (alpha).</text>
<rect x="712.5" y="454" width="214" height="138" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8" />
<text x="724.5" y="478" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#c0392b" text-anchor="start" >Not this</text>
<text x="724.5" y="500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >Topology spread</text>
<text x="724.5" y="517" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >constraints. They spread</text>
<text x="724.5" y="534" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >pods over groups, the</text>
<text x="724.5" y="551" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >opposite of keeping them</text>
<text x="724.5" y="568" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >together.</text>
<rect x="942.0" y="454" width="214" height="138" rx="10" fill="#fff7ec" stroke="#e08a1e" stroke-width="1.8" />
<text x="954.0" y="478" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e08a1e" text-anchor="start" >A guarantee</text>
<text x="954.0" y="500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >Labels are best effort. A</text>
<text x="954.0" y="517" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >Capacity Block or a</text>
<text x="954.0" y="534" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >cluster placement group</text>
<text x="954.0" y="551" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >is the way to reserve</text>
<text x="954.0" y="568" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >instances together.</text>
<text x="24" y="618" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >Illustrative: the shape of the tree, the number of nodes and the hop counts. Sourced: the label names, the rule that nodes with the same layer-3 value</text>
<text x="24" y="636" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >are physically closest, and the rules in the five boxes (AWS EKS, Kueue and JobSet pages). Hop = one step between two network nodes. No speed or latency</text>
<text x="24" y="654" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >figure was found for any layer. AWS says the labels do not express link capacity.</text>

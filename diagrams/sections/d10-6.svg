<text x="559.0" y="390" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle" >Group A: same layer-3 value. Pod 1 to pod 3 is</text>
<text x="559.0" y="408" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2f9e5b" text-anchor="middle" >2 hops (illustrative count).</text>
<text x="957.0" y="390" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle" >Group B: another layer-3 value. Pod 4 to pod 3 is</text>
<text x="957.0" y="408" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle" >6 hops (illustrative count), the red path.</text>
<text x="24" y="440" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start" >Rules that keep the pods of one job inside one group (details in the text)</text>
<rect x="24.0" y="454" width="214" height="138" rx="10" fill="#effaf3" stroke="#2f9e5b" stroke-width="1.8" />
<text x="36.0" y="478" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f9e5b" text-anchor="start" >Pod affinity</text>
<text x="36.0" y="500" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >The topology key is the</text>
<text x="36.0" y="517" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >layer-3 label. The first</text>
<text x="36.0" y="534" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >pod lands anywhere and</text>
<text x="36.0" y="551" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >the rest follow it. Pods</text>
<text x="36.0" y="568" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >that do not fit stay</text>
<text x="36.0" y="585" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start" >Pending.</text>
<rect x="253.5" y="454" width="214" height="138" rx="10" fill="#eef3fd" stroke="#3b6fd8" stroke-width="1.8" />

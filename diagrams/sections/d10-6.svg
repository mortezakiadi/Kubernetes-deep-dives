<text x="24" y="36" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2933" text-anchor="start" >Racks and network blocks: which servers are close, and which rule keeps a job together</text>
<text x="24" y="58" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start" >Illustrative tree with three layers and eight GPU nodes. The label names are from AWS (EKS). The values are opaque codes.</text>
<text x="24" y="106" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Layer 1: top, the broadest group</text>
<text x="24" y="126" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start" >topology.k8s.aws/network-node-layer-1</text>
<text x="24" y="174" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start" >Layer 2: middle</text>
